events { 
    worker_connections 2048; 
}

http {
    # High-Concurrency Load Balancing Upstream
    upstream api_servers {
        # Sticky session routing by client IP ensures SignalR WebSockets and authentication affinity
        ip_hash;
        server driveandgo_api:8080;
    }

    server {
        listen 80;
        client_max_body_size 50M;

        # WebSocket and Standard REST Proxying
        location / {
            proxy_pass http://api_servers;
            
            # HTTP/1.1 and Upgrade headers for SignalR WebSocket Real-Time Telematics & Chat
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard Forwarded Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for real-time SignalR persistent connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
