name: Centralized API Build & Docker CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Validate .NET Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10.x SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore DriveAndGo_API/DriveAndGo_API.csproj

    - name: Build Central API
      run: dotnet build DriveAndGo_API/DriveAndGo_API.csproj --configuration Release --no-restore

    - name: Build WinForms Admin Client
      run: dotnet build DriveAndGo_Admin/DriveAndGo_Admin.csproj --configuration Release

  docker-build:
    name: Build Docker Container Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image for API
      uses: docker/build-push-action@v5
      with:
        context: ./DriveAndGo_API
        file: ./DriveAndGo_API/Dockerfile
        push: false
        tags: driveandgo/api:latest
