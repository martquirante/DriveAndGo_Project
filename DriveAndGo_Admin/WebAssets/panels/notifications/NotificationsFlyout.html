<!DOCTYPE html>
<html lang="en" data-theme="dark" class="bg-transparent" style="background: transparent !important;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveAndGo Notification Center</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Inter & JetBrains Mono Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            background-color: transparent !important;
            overflow: hidden;
        }

        /* Glassmorphic Backdrop Overlay - Subtle & Clear Glass UI */
        .glass-backdrop-dark {
            background-color: rgba(2, 6, 23, 0.45) !important;
            -webkit-backdrop-filter: blur(4px) saturate(130%);
            backdrop-filter: blur(4px) saturate(130%);
        }
        .glass-backdrop-light {
            background-color: rgba(15, 23, 42, 0.16) !important;
            -webkit-backdrop-filter: blur(4px) saturate(120%);
            backdrop-filter: blur(4px) saturate(120%);
        }

        /* Glassmorphic Centered Card */
        .glass-card-dark {
            background: rgba(15, 23, 42, 0.86) !important;
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08) !important;
        }
        .glass-card-light {
            background: rgba(255, 255, 255, 0.92) !important;
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(203, 213, 225, 0.90) !important;
            box-shadow: 0 24px 60px -10px rgba(15, 23, 42, 0.16), 0 0 0 1px rgba(255, 255, 255, 0.8) !important;
        }

        /* Custom Glassmorphic Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(128, 128, 128, 0.06);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.25);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(249, 115, 22, 0.7);
        }

        @keyframes modalPopIn {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .animate-modal {
            animation: modalPopIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInOverlay {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .animate-overlay {
            animation: fadeInOverlay 0.18s ease-out forwards;
        }
    </style>
</head>

<body class="bg-transparent" style="background: transparent !important;">

    <div id="root" class="bg-transparent w-full h-full flex items-center justify-center" style="background: transparent !important;"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ─── UNIQUE SVG VECTOR ICONS (ZERO EMOJIS) ──────────────────────────────────
        const IconBell = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        );

        const IconCar = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11.2 2 11.6 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        );

        const IconCreditCard = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
        );

        const IconUser = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );

        const IconWrench = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        );

        const IconAlertTriangle = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        );

        const IconCloudRain = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg>
        );

        const IconShieldAlert = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        );

        const IconTrash2 = ({ sz = 16, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );

        const IconCheckCheck = ({ sz = 16, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg>
        );

        const IconCheck = ({ sz = 14, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
        );

        const IconX = ({ sz = 18, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );

        const IconSearch = ({ sz = 16, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        );

        const IconPhone = ({ sz = 13, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        );

        const IconMail = ({ sz = 13, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        );

        const IconMapPin = ({ sz = 13, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
        );

        const IconCalendar = ({ sz = 13, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        );

        const IconArrowRight = ({ sz = 13, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );

        const CustomerAvatar = ({ avatar, name, status, eventType, isDark }) => {
            const initials = (name || 'Customer').split(' ').map(n => n[0]).filter(Boolean).slice(0, 2).join('').toUpperCase() || 'CU';
            let ringColor = isDark ? 'ring-orange-500/40' : 'ring-orange-500/30';
            let dotColor = 'bg-orange-500';

            const s = String(status || eventType || '').toLowerCase();
            if (s.includes('pending') || s.includes('request')) {
                ringColor = isDark ? 'ring-amber-500/50' : 'ring-amber-500/40';
                dotColor = 'bg-amber-500';
            } else if (s.includes('returned') || s.includes('completed')) {
                ringColor = isDark ? 'ring-blue-500/50' : 'ring-blue-500/40';
                dotColor = 'bg-blue-500';
            } else if (s.includes('overdue')) {
                ringColor = isDark ? 'ring-red-500/50' : 'ring-red-500/40';
                dotColor = 'bg-red-500';
            } else if (s.includes('approved') || s.includes('active') || s.includes('ongoing') || s.includes('in-use')) {
                ringColor = isDark ? 'ring-emerald-500/50' : 'ring-emerald-500/40';
                dotColor = 'bg-emerald-500';
            }

            return (
                <div className="relative shrink-0">
                    {avatar ? (
                        <img
                            src={avatar}
                            alt={name || 'Customer'}
                            className={`w-11 h-11 rounded-2xl object-cover ring-2 ${ringColor} shadow-md`}
                            onError={(e) => {
                                e.target.style.display = 'none';
                                if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
                            }}
                        />
                    ) : null}
                    <div 
                        style={{ display: avatar ? 'none' : 'flex' }}
                        className={`w-11 h-11 rounded-2xl items-center justify-center font-black text-xs ring-2 ${ringColor} shadow-md ${
                            isDark 
                              ? 'bg-gradient-to-br from-orange-500/30 to-amber-600/30 text-orange-300 border border-orange-500/30' 
                              : 'bg-gradient-to-br from-orange-100 to-amber-100 text-orange-700 border border-orange-300'
                        }`}
                    >
                        {initials}
                    </div>
                    {/* Status indicator pulse ring */}
                    <span className={`absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 ${isDark ? 'border-slate-900' : 'border-white'} ${dotColor} shadow-sm`} />
                </div>
            );
        };

        const formatTime = (tStr) => {
            if (!tStr) return 'Just now';
            const s = String(tStr);
            if (s === 'Just now' || s.endsWith('m ago') || s.endsWith('h ago') || s.endsWith('d ago')) return s;
            try {
                const d = new Date(s);
                if (isNaN(d.getTime())) return s;
                const mins = Math.floor((Date.now() - d.getTime()) / 60000);
                if (mins < 1) return 'Just now';
                if (mins < 60) return `${mins}m ago`;
                const hrs = Math.floor(mins / 60);
                if (hrs < 24) return `${hrs}h ago`;
                const days = Math.floor(hrs / 24);
                if (days < 7) return `${days}d ago`;
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            } catch(e) {
                return 'Just now';
            }
        };

        const NotificationsApp = () => {
            const [theme, setTheme] = useState(() => {
                return document.documentElement.getAttribute('data-theme') || 'dark';
            });
            const [notifications, setNotifications] = useState([]);
            const [backdropImg, setBackdropImg] = useState(null);
            const [filterTab, setFilterTab] = useState('all'); // 'all' | 'unread' | 'bookings' | 'alerts'
            const [searchQuery, setSearchQuery] = useState('');

            useEffect(() => {
                window.setFlyoutTheme = function(mode) {
                    if (mode === 'light' || mode === 'dark') {
                        document.documentElement.setAttribute('data-theme', mode);
                        setTheme(mode);
                    }
                };

                window.setBackdropSnapshot = function(dataUrl) {
                    if (dataUrl) {
                        setBackdropImg(dataUrl);
                    }
                };

                const obs = new MutationObserver(() => {
                    const currentMode = document.documentElement.getAttribute('data-theme') || 'dark';
                    setTheme(currentMode);
                });
                obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

                // Listen to window calls from C# WinForms host
                window.setNotifications = function(jsonList) {
                    try {
                        const parsed = typeof jsonList === 'string' ? JSON.parse(jsonList) : jsonList;
                        if (Array.isArray(parsed)) {
                            setNotifications(parsed);
                        }
                    } catch(e) {
                        console.warn("Failed to parse notifications list:", e);
                    }
                };

                window.addSingleNotification = function(notifObj) {
                    try {
                        const item = typeof notifObj === 'string' ? JSON.parse(notifObj) : notifObj;
                        setNotifications(prev => [item, ...prev]);
                    } catch(e) { }
                };

                // Notify C# host that React is mounted and ready for data!
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage("flyout_ready");
                }

                // Close on Escape key
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        handleClose();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);

                return () => {
                    obs.disconnect();
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, []);

            const isDark = theme === 'dark';

            const handleClose = () => {
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage("close_flyout");
                }
            };

            const handleItemClick = (notif) => {
                // Optimistically mark as read in local React state
                setNotifications(prev => prev.map(item => {
                    const idMatch = (item.id && item.id === notif.id) || 
                                    (item.title === notif.title && item.body === notif.body);
                    return idMatch ? { ...item, unread: false } : item;
                }));

                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage("notification_clicked:" + JSON.stringify(notif));
                }
            };

            const handleMarkSingleRead = (e, notif) => {
                e.stopPropagation();
                setNotifications(prev => prev.map(item => {
                    const idMatch = (item.id && item.id === notif.id) || 
                                    (item.title === notif.title && item.body === notif.body);
                    return idMatch ? { ...item, unread: false } : item;
                }));

                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage("mark_as_read:" + JSON.stringify(notif));
                }
            };

            const handleMarkAllRead = () => {
                setNotifications(prev => prev.map(item => ({ ...item, unread: false })));
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage("mark_all_read");
                }
            };

            const handleClearAll = () => {
                setNotifications([]);
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage("notifications_cleared");
                }
            };

            const unreadCount = useMemo(() => {
                return notifications.filter(n => n.unread).length;
            }, [notifications]);

            const filteredNotifications = useMemo(() => {
                return notifications.filter(n => {
                    const rawTitle = String(n.title || n.Title || '').toLowerCase();
                    const rawBody = String(n.body || n.Body || '').toLowerCase();
                    const rawType = String(n.type || n.Type || '').toLowerCase();
                    const custName = String(n.customerName || '').toLowerCase();
                    const vehName = String(n.vehicleName || '').toLowerCase();
                    const plate = String(n.vehiclePlate || '').toLowerCase();
                    const code = String(n.rentalCode || '').toLowerCase();
                    const eventType = String(n.eventType || '').toLowerCase();

                    // Tab filter
                    if (filterTab === 'unread' && !n.unread) return false;
                    if (filterTab === 'bookings') {
                        const isBooking = Boolean(n.rentalId) || Boolean(n.rentalCode) || Boolean(n.customerName) ||
                                          eventType.includes('booking') || eventType.includes('rental') || eventType.includes('returned') ||
                                          rawType.includes('booking') || rawType.includes('rental') || rawTitle.includes('booking') || rawTitle.includes('conforme') || rawTitle.includes('schedule') || rawTitle.includes('returned');
                        if (!isBooking) return false;
                    }
                    if (filterTab === 'alerts') {
                        const isAlert = rawType.includes('overdue') || rawType.includes('maintenance') || rawType.includes('weather') || rawType.includes('security') || rawTitle.includes('overdue') || rawTitle.includes('alert') || rawTitle.includes('urgent');
                        if (!isAlert) return false;
                    }

                    // Search Query filter
                    if (searchQuery.trim()) {
                        const q = searchQuery.toLowerCase().trim();
                        return rawTitle.includes(q) || rawBody.includes(q) || rawType.includes(q) || custName.includes(q) || vehName.includes(q) || plate.includes(q) || code.includes(q) || eventType.includes(q);
                    }

                    return true;
                });
            }, [notifications, filterTab, searchQuery]);

            return (
                <div 
                    onClick={handleClose} 
                    className="w-full h-full relative flex items-center justify-center p-4 sm:p-6 animate-overlay cursor-pointer overflow-hidden"
                >
                    {/* Live Frosted Glass Screen Backdrop Snapshot */}
                    {backdropImg && (
                        <img
                            src={backdropImg}
                            alt="Live Backdrop"
                            className={`absolute inset-0 w-full h-full object-cover pointer-events-none transition-all duration-300 ${
                                isDark 
                                  ? 'filter blur-[4px] brightness-[0.55] saturate-[120%] scale-102' 
                                  : 'filter blur-[4px] brightness-[0.96] saturate-[110%] scale-102'
                            }`}
                        />
                    )}

                    {/* Translucent Frosted Glass Tint Overlay (Gentle and Clear) */}
                    <div 
                        className={`absolute inset-0 pointer-events-none transition-colors ${
                            isDark ? 'bg-slate-950/30' : 'bg-slate-900/08'
                        }`} 
                    />

                    {/* CENTERED GLASS DIALOG CONTAINER */}
                    <div 
                        onClick={(e) => e.stopPropagation()} 
                        className={`relative z-10 w-full max-w-2xl max-h-[85vh] rounded-3xl flex flex-col overflow-hidden animate-modal cursor-default transition-all duration-200 ${
                            isDark 
                              ? 'glass-card-dark text-white' 
                              : 'glass-card-light text-slate-900'
                        }`}
                    >
                        
                        {/* ── HEADER ────────────────────────────────────────────────────────── */}
                        <div className={`p-5 pb-4 border-b flex flex-col gap-3.5 shrink-0 ${
                            isDark ? 'border-white/10 bg-white/[0.03]' : 'border-slate-200/80 bg-slate-50/70'
                        }`}>
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className={`p-2.5 rounded-2xl border shadow-sm ${
                                        isDark 
                                          ? 'bg-orange-500/20 text-orange-400 border-orange-500/30' 
                                          : 'bg-orange-500/15 text-orange-600 border-orange-500/25'
                                    }`}>
                                        <IconBell sz={22} />
                                    </div>
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <h2 className={`text-lg font-black tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>
                                                Notification Center
                                            </h2>
                                            {unreadCount > 0 ? (
                                                <span className="px-2.5 py-0.5 rounded-full bg-orange-500 text-white font-black text-xs shadow-sm">
                                                    {unreadCount} Unread
                                                </span>
                                            ) : (
                                                <span className={`px-2 py-0.5 rounded-full text-[11px] font-semibold border ${
                                                    isDark ? 'bg-white/5 border-white/10 text-slate-400' : 'bg-slate-100 border-slate-200 text-slate-500'
                                                }`}>
                                                    All Caught Up
                                                </span>
                                            )}
                                        </div>
                                        <p className={`text-xs mt-0.5 font-medium ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                                            Real-time operational alerts, booking requests, and fleet activity
                                        </p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-1.5">
                                    {unreadCount > 0 && (
                                        <button
                                            onClick={handleMarkAllRead}
                                            title="Mark all notifications as read"
                                            className={`flex items-center gap-1.5 text-xs font-bold py-1.5 px-3 rounded-xl border transition-all ${
                                                isDark 
                                                  ? 'bg-white/5 hover:bg-white/10 border-white/10 text-orange-400 hover:text-orange-300' 
                                                  : 'bg-orange-50 hover:bg-orange-100/70 border-orange-200/80 text-orange-600'
                                            }`}
                                        >
                                            <IconCheckCheck sz={15} />
                                            <span>Mark all read</span>
                                        </button>
                                    )}

                                    <button
                                        onClick={handleClose}
                                        title="Close (Esc)"
                                        className={`p-2 rounded-xl border transition-all ${
                                            isDark 
                                              ? 'bg-white/5 hover:bg-white/15 border-white/10 text-slate-400 hover:text-white' 
                                              : 'bg-slate-100 hover:bg-slate-200 border-slate-200 text-slate-500 hover:text-slate-800'
                                        }`}
                                    >
                                        <IconX sz={18} />
                                    </button>
                                </div>
                            </div>

                            {/* ── FILTER TABS & SEARCH BAR ──────────────────────────────────── */}
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-2.5 pt-1">
                                <div className={`flex items-center p-1 rounded-2xl border gap-1 w-full sm:w-auto ${
                                    isDark ? 'bg-white/[0.04] border-white/10' : 'bg-slate-100 border-slate-200'
                                }`}>
                                    {[
                                        { id: 'all', label: 'All' },
                                        { id: 'unread', label: `Unread (${unreadCount})` },
                                        { id: 'bookings', label: 'Bookings' },
                                        { id: 'alerts', label: 'Alerts' }
                                    ].map((tab) => {
                                        const active = filterTab === tab.id;
                                        return (
                                            <button
                                                key={tab.id}
                                                onClick={() => setFilterTab(tab.id)}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-black transition-all ${
                                                    active
                                                      ? 'bg-orange-500 text-white shadow-md'
                                                      : isDark
                                                        ? 'text-slate-400 hover:text-white hover:bg-white/5'
                                                        : 'text-slate-600 hover:text-slate-900 hover:bg-white'
                                                }`}
                                            >
                                                {tab.label}
                                            </button>
                                        );
                                    })}
                                </div>

                                <div className={`relative flex items-center w-full sm:w-56 px-3 py-1.5 rounded-2xl border ${
                                    isDark ? 'bg-white/5 border-white/10 text-white' : 'bg-slate-100/80 border-slate-200 text-slate-900'
                                }`}>
                                    <IconSearch sz={14} className={isDark ? "text-slate-400 mr-2" : "text-slate-500 mr-2"} />
                                    <input
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Search notifications..."
                                        className="bg-transparent text-xs w-full focus:outline-none placeholder:text-slate-400 font-medium"
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="text-slate-400 hover:text-white">
                                            <IconX sz={13} />
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* ── NOTIFICATION LIST CONTAINER ──────────────────────────────────── */}
                        <div className="flex-1 overflow-y-auto p-4 sm:p-5 flex flex-col gap-2.5 custom-scrollbar min-h-[260px] max-h-[500px]">
                            {filteredNotifications.length === 0 ? (
                                <div className={`py-16 flex flex-col items-center justify-center text-center p-6 ${isDark ? 'text-gray-400' : 'text-slate-400'}`}>
                                    <div className={`w-14 h-14 rounded-3xl border flex items-center justify-center mb-3.5 shadow-sm ${
                                        isDark ? 'bg-white/5 border-white/10 text-gray-400' : 'bg-slate-100 border-slate-200 text-slate-400'
                                    }`}>
                                        <IconCheckCheck sz={26} />
                                    </div>
                                    <h3 className={`text-sm font-black ${isDark ? 'text-white' : 'text-slate-800'}`}>
                                        {searchQuery || filterTab !== 'all' ? 'No matching notifications found' : 'No Active Notifications'}
                                    </h3>
                                    <p className="text-xs opacity-75 mt-1 max-w-sm">
                                        {searchQuery || filterTab !== 'all' 
                                            ? 'Try clearing your search query or selecting a different filter tab.' 
                                            : 'Everything is up to date! New rental approvals, alerts, and system notices will appear here in real time.'}
                                    </p>
                                </div>
                            ) : (
                                filteredNotifications.map((n, idx) => {
                                    const rawTitle = String(n.title || n.Title || n.titleText || 'System Notification');
                                    const rawBody = String(n.body || n.Body || n.bodyText || '');
                                    const rawType = String(n.type || n.Type || '').toLowerCase();
                                    const eventType = String(n.eventType || '').toLowerCase();
                                    const bookingStatus = String(n.bookingStatus || '').toLowerCase();

                                    const displayTitle = rawTitle.trim() || 'System Alert';
                                    const displayBody = rawBody.trim() || 'Details available.';
                                    const tLow = (displayTitle + ' ' + rawType + ' ' + eventType).toLowerCase();
                                    const displayTime = formatTime(n.time || n.Time);
                                    const isUnread = Boolean(n.unread);

                                    const isBooking = Boolean(
                                        n.rentalId || 
                                        n.rentalCode || 
                                        (n.customerName && (n.vehicleName || n.destination || bookingStatus)) ||
                                        eventType.includes('booking') || 
                                        eventType.includes('returned') || 
                                        eventType.includes('overdue') ||
                                        tLow.includes('booking') || 
                                        tLow.includes('conforme') || 
                                        tLow.includes('nasuli') ||
                                        tLow.includes('returned')
                                    );

                                    // Determine specific badge and action text
                                    let icon = <IconBell sz={18} className={isDark ? "text-blue-400" : "text-blue-600"} />;
                                    let badgeBg = isDark ? "bg-blue-500/20 text-blue-400 border-blue-500/30" : "bg-blue-500/15 text-blue-600 border-blue-500/25";
                                    let categoryTag = "System";
                                    let actionBtnText = "View Details →";

                                    if (eventType === 'overdue_alert' || tLow.includes('overdue') || tLow.includes('late')) {
                                        icon = <IconAlertTriangle sz={18} className={isDark ? "text-red-400" : "text-red-600"} />;
                                        badgeBg = isDark ? "bg-red-500/20 text-red-400 border-red-500/30" : "bg-red-500/15 text-red-600 border-red-500/25";
                                        categoryTag = "Vehicle Overdue";
                                        actionBtnText = "Inspect & Track →";
                                    } else if (eventType === 'vehicle_returned' || bookingStatus === 'completed' || tLow.includes('returned') || tLow.includes('nasuli')) {
                                        icon = <IconCar sz={18} className={isDark ? "text-blue-400" : "text-blue-600"} />;
                                        badgeBg = isDark ? "bg-blue-500/20 text-blue-400 border-blue-500/30" : "bg-blue-500/15 text-blue-600 border-blue-500/25";
                                        categoryTag = "Vehicle Returned";
                                        actionBtnText = "View Agreement & Receipt →";
                                    } else if (eventType === 'booking_approved' || (bookingStatus === 'approved' && !eventType.includes('ongoing'))) {
                                        icon = <IconCar sz={18} className={isDark ? "text-emerald-400" : "text-emerald-600"} />;
                                        badgeBg = isDark ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" : "bg-emerald-500/15 text-emerald-600 border-emerald-500/25";
                                        categoryTag = "Booking Approved";
                                        actionBtnText = "View Booking Agreement →";
                                    } else if (eventType === 'rental_ongoing' || bookingStatus === 'active' || bookingStatus === 'in-use' || bookingStatus === 'ongoing') {
                                        icon = <IconCar sz={18} className={isDark ? "text-teal-400" : "text-teal-600"} />;
                                        badgeBg = isDark ? "bg-teal-500/20 text-teal-400 border-teal-500/30" : "bg-teal-500/15 text-teal-600 border-teal-500/25";
                                        categoryTag = "Dispatched / In-Use";
                                        actionBtnText = "Track Active Rental →";
                                    } else if (eventType === 'booking_request' || bookingStatus === 'pending' || tLow.includes('conforme') || tLow.includes('request')) {
                                        icon = <IconCar sz={18} className={isDark ? "text-amber-400" : "text-amber-600"} />;
                                        badgeBg = isDark ? "bg-amber-500/20 text-amber-400 border-amber-500/30" : "bg-amber-500/15 text-amber-600 border-amber-500/25";
                                        categoryTag = "Booking Request (Pending Approval)";
                                        actionBtnText = "Review & Approve →";
                                    } else if (tLow.includes('payment') || tLow.includes('transaction') || tLow.includes('refund') || tLow.includes('paid')) {
                                        icon = <IconCreditCard sz={18} className={isDark ? "text-emerald-400" : "text-emerald-600"} />;
                                        badgeBg = isDark ? "bg-emerald-500/20 text-emerald-400 border-emerald-500/30" : "bg-emerald-500/15 text-emerald-600 border-emerald-500/25";
                                        categoryTag = "Payment";
                                    } else if (tLow.includes('driver')) {
                                        icon = <IconUser sz={18} className={isDark ? "text-purple-400" : "text-purple-600"} />;
                                        badgeBg = isDark ? "bg-purple-500/20 text-purple-400 border-purple-500/30" : "bg-purple-500/15 text-purple-600 border-purple-500/25";
                                        categoryTag = "Driver Update";
                                    } else if (tLow.includes('maintenance') || tLow.includes('repair') || tLow.includes('fleet') || tLow.includes('rfid')) {
                                        icon = <IconWrench sz={18} className={isDark ? "text-amber-400" : "text-amber-600"} />;
                                        badgeBg = isDark ? "bg-amber-500/20 text-amber-400 border-amber-500/30" : "bg-amber-500/15 text-amber-600 border-amber-500/25";
                                        categoryTag = "Maintenance";
                                    } else if (tLow.includes('weather') || tLow.includes('pagasa') || tLow.includes('monsoon')) {
                                        icon = <IconCloudRain sz={18} className={isDark ? "text-sky-400" : "text-sky-600"} />;
                                        badgeBg = isDark ? "bg-sky-500/20 text-sky-400 border-sky-500/30" : "bg-sky-500/15 text-sky-600 border-sky-500/25";
                                        categoryTag = "Weather Radar";
                                        actionBtnText = "Open Radar Telematics →";
                                    } else if (tLow.includes('flood') || tLow.includes('hazard') || tLow.includes('security')) {
                                        icon = <IconShieldAlert sz={18} className={isDark ? "text-cyan-400" : "text-cyan-600"} />;
                                        badgeBg = isDark ? "bg-cyan-500/20 text-cyan-400 border-cyan-500/30" : "bg-cyan-500/15 text-cyan-600 border-cyan-500/25";
                                        categoryTag = "Security";
                                    } else if (tLow.includes('decommission') || tLow.includes('audit')) {
                                        icon = <IconTrash2 sz={18} className={isDark ? "text-red-400" : "text-red-600"} />;
                                        badgeBg = isDark ? "bg-red-500/20 text-red-400 border-red-500/30" : "bg-red-500/15 text-red-600 border-red-500/25";
                                        categoryTag = "Audit Log";
                                    }

                                    // UNREAD CARD STYLING vs READ CARD STYLING
                                    const cardStyle = isDark
                                        ? (isUnread
                                            ? 'bg-gradient-to-r from-orange-500/20 via-white/[0.08] to-white/[0.03] border-l-4 border-l-orange-500 border-white/25 shadow-lg shadow-orange-950/20 hover:border-orange-500/80 hover:bg-white/[0.12]'
                                            : 'bg-white/[0.03] border-white/10 opacity-75 hover:opacity-100 hover:bg-white/[0.07] hover:border-white/20')
                                        : (isUnread
                                            ? 'bg-gradient-to-r from-orange-500/12 via-orange-50/70 to-white border-l-4 border-l-orange-500 border-orange-300 shadow-md shadow-orange-100/70 hover:border-orange-500/80 hover:bg-orange-50/90'
                                            : 'bg-white/80 border-slate-200/90 opacity-80 hover:opacity-100 hover:bg-slate-50 hover:border-slate-300');

                                    // ── RICH BOOKING CARD LAYOUT ──
                                    if (isBooking) {
                                        return (
                                            <div
                                                key={n.id || idx}
                                                onClick={() => handleItemClick(n)}
                                                className={`group p-4 rounded-2xl border transition-all cursor-pointer flex flex-col gap-3 hover:scale-[1.008] active:scale-[0.995] ${cardStyle}`}
                                            >
                                                {/* Header: Avatar, Customer Name, Contact, Status Badge & Time */}
                                                <div className="flex items-start justify-between gap-3">
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <CustomerAvatar
                                                            avatar={n.customerAvatar}
                                                            name={n.customerName || 'Customer'}
                                                            status={bookingStatus}
                                                            eventType={eventType}
                                                            isDark={isDark}
                                                        />
                                                        <div className="min-w-0">
                                                            <div className="flex items-center gap-2">
                                                                <h4 className={`text-sm leading-tight truncate ${
                                                                    isUnread 
                                                                      ? (isDark ? 'text-white font-black' : 'text-slate-900 font-black') 
                                                                      : (isDark ? 'text-slate-100 font-bold' : 'text-slate-800 font-bold')
                                                                }`}>
                                                                    {n.customerName || 'Customer'}
                                                                </h4>
                                                                {isUnread && (
                                                                    <span className="shrink-0 px-2 py-0.2 rounded-full bg-orange-500 text-white font-black text-[9px] uppercase tracking-wider shadow-sm animate-pulse">
                                                                        New
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <div className="flex items-center gap-2.5 mt-0.5 text-[11px] text-slate-400 font-medium truncate">
                                                                {n.customerPhone ? (
                                                                    <span className="flex items-center gap-1">
                                                                        <IconPhone sz={11} className="text-orange-400 shrink-0" />
                                                                        <span className="truncate">{n.customerPhone}</span>
                                                                    </span>
                                                                ) : n.customerEmail ? (
                                                                    <span className="flex items-center gap-1">
                                                                        <IconMail sz={11} className="text-orange-400 shrink-0" />
                                                                        <span className="truncate">{n.customerEmail}</span>
                                                                    </span>
                                                                ) : (
                                                                    <span className="text-slate-400 italic">Customer Profile</span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="flex flex-col items-end shrink-0 gap-1">
                                                        <span className={`text-[10px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full border shadow-sm ${badgeBg}`}>
                                                            {categoryTag}
                                                        </span>
                                                        <span className={`text-[10px] font-semibold ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                                                            {displayTime}
                                                        </span>
                                                    </div>
                                                </div>

                                                {/* Booking Details Matrix (Render only if at least one detail is available) */}
                                                {Boolean(n.vehicleName || n.rentalCode || n.startDate || n.endDate || n.destination || (n.totalAmount != null && Number(n.totalAmount) > 0)) && (
                                                    <div className={`grid grid-cols-1 sm:grid-cols-2 gap-2 p-2.5 rounded-xl border text-[11px] ${
                                                        isDark ? 'bg-black/25 border-white/10' : 'bg-slate-100/70 border-slate-200'
                                                    }`}>
                                                        {n.vehicleName && (
                                                            <div className="flex items-center gap-2 min-w-0">
                                                                <IconCar sz={13} className="text-orange-400 shrink-0" />
                                                                <span className="font-bold truncate text-slate-200">{n.vehicleName}</span>
                                                                {n.vehiclePlate && (
                                                                    <span className="shrink-0 px-1.5 py-0.2 rounded font-mono font-black text-[9px] bg-white/10 text-orange-300 border border-white/15">
                                                                        {n.vehiclePlate}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        )}
                                                        {n.rentalCode && (
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="text-slate-400 font-medium">Ref:</span>
                                                                <span className="font-mono font-bold text-orange-400 tracking-wider">{n.rentalCode}</span>
                                                            </div>
                                                        )}
                                                        {(n.startDate || n.endDate) && (
                                                            <div className="flex items-center gap-1.5 sm:col-span-2 text-slate-300">
                                                                <IconCalendar sz={12} className="text-orange-400 shrink-0" />
                                                                <span className="font-semibold">{n.startDate || 'Scheduled'} {n.endDate ? `→ ${n.endDate}` : ''}</span>
                                                            </div>
                                                        )}
                                                        {n.destination && (
                                                            <div className="flex items-center gap-1.5 text-slate-300 truncate">
                                                                <IconMapPin sz={12} className="text-emerald-400 shrink-0" />
                                                                <span className="truncate">{n.destination}</span>
                                                            </div>
                                                        )}
                                                        {n.totalAmount != null && Number(n.totalAmount) > 0 && (
                                                            <div className="flex items-center gap-1 text-slate-200 justify-self-start sm:justify-self-end">
                                                                <span className="text-slate-400 font-medium">Total:</span>
                                                                <span className="font-black text-emerald-400">₱{Number(n.totalAmount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}

                                                {/* Description Body */}
                                                <p className={`text-xs leading-relaxed break-words ${
                                                    isUnread
                                                      ? (isDark ? 'text-slate-200 font-semibold' : 'text-slate-800 font-semibold')
                                                      : (isDark ? 'text-slate-400 font-medium' : 'text-slate-600 font-medium')
                                                }`}>
                                                    {displayBody}
                                                </p>

                                                {/* Footer Action */}
                                                <div className="flex items-center justify-between pt-1 border-t border-white/10 mt-0.5">
                                                    <div className="flex items-center gap-1.5 text-[11px] font-bold text-orange-400 group-hover:text-orange-300">
                                                        <span>{actionBtnText}</span>
                                                        <IconArrowRight sz={12} className="transition-transform group-hover:translate-x-1" />
                                                    </div>

                                                    <div className="flex items-center gap-2">
                                                        {isUnread && (
                                                            <button
                                                                onClick={(e) => handleMarkSingleRead(e, n)}
                                                                title="Mark as read"
                                                                className={`flex items-center gap-1 px-2.5 py-1 rounded-xl text-[10px] font-black border transition-all ${
                                                                    isDark 
                                                                      ? 'bg-white/10 hover:bg-orange-500 hover:text-white border-white/20 text-orange-400' 
                                                                      : 'bg-white hover:bg-orange-500 hover:text-white border-slate-300 text-orange-600'
                                                                }`}
                                                            >
                                                                <IconCheck sz={12} />
                                                                <span>Mark read</span>
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    }

                                    // ── STANDARD SYSTEM NOTIFICATION CARD LAYOUT ──
                                    return (
                                        <div
                                            key={n.id || idx}
                                            onClick={() => handleItemClick(n)}
                                            className={`group p-4 rounded-2xl border transition-all cursor-pointer flex items-start gap-3.5 hover:scale-[1.008] active:scale-[0.995] ${cardStyle}`}
                                        >
                                            {/* Category Icon */}
                                            <div className={`p-2.5 rounded-2xl border shrink-0 mt-0.5 shadow-sm transition-transform group-hover:scale-105 ${badgeBg}`}>
                                                {icon}
                                            </div>

                                            {/* Content Area */}
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center justify-between gap-2 mb-1">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <h4 className={`text-sm leading-snug truncate ${
                                                            isUnread 
                                                              ? (isDark ? 'text-white font-black' : 'text-slate-900 font-black') 
                                                              : (isDark ? 'text-slate-200 font-bold' : 'text-slate-800 font-bold')
                                                        }`}>
                                                            {displayTitle}
                                                        </h4>
                                                        {isUnread && (
                                                            <span className="shrink-0 px-2 py-0.2 rounded-full bg-orange-500 text-white font-black text-[9px] uppercase tracking-wider shadow-sm animate-pulse">
                                                                New
                                                            </span>
                                                        )}
                                                    </div>

                                                    <span className={`text-[11px] font-semibold shrink-0 whitespace-nowrap ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                                                        {displayTime}
                                                    </span>
                                                </div>

                                                <p className={`text-xs leading-relaxed break-words ${
                                                    isUnread
                                                      ? (isDark ? 'text-slate-200 font-semibold' : 'text-slate-800 font-semibold')
                                                      : (isDark ? 'text-slate-400 font-medium' : 'text-slate-600 font-medium')
                                                }`}>
                                                    {displayBody}
                                                </p>

                                                <div className="flex items-center justify-between mt-2.5 pt-1">
                                                    <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-lg border ${
                                                        isDark ? 'bg-white/5 border-white/10 text-slate-400' : 'bg-slate-200/60 border-slate-300 text-slate-600'
                                                    }`}>
                                                        {categoryTag}
                                                    </span>

                                                    <div className="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        {isUnread && (
                                                            <button
                                                                onClick={(e) => handleMarkSingleRead(e, n)}
                                                                title="Mark as read"
                                                                className={`flex items-center gap-1 px-2.5 py-1 rounded-xl text-[10px] font-black border transition-all ${
                                                                    isDark 
                                                                      ? 'bg-white/10 hover:bg-orange-500 hover:text-white border-white/20 text-orange-400' 
                                                                      : 'bg-white hover:bg-orange-500 hover:text-white border-slate-300 text-orange-600'
                                                                }`}
                                                            >
                                                                <IconCheck sz={12} />
                                                                <span>Mark read</span>
                                                            </button>
                                                        )}
                                                        <span className="text-[10px] font-bold text-orange-500 flex items-center gap-1">
                                                            <span>{actionBtnText}</span>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>

                        {/* ── FOOTER ───────────────────────────────────────────────────────── */}
                        <div className={`p-4 border-t flex items-center justify-between shrink-0 ${
                            isDark ? 'border-white/10 bg-white/[0.03]' : 'border-slate-200/80 bg-slate-50/70'
                        }`}>
                            <div className="flex items-center gap-2 text-xs font-semibold">
                                <span className={isDark ? 'text-slate-400' : 'text-slate-500'}>
                                    Total: <strong className={isDark ? 'text-white' : 'text-slate-900'}>{notifications.length}</strong> alerts
                                </span>
                                {unreadCount > 0 && (
                                    <span className="text-orange-500 font-bold">
                                        • {unreadCount} unread
                                    </span>
                                )}
                            </div>

                            {notifications.length > 0 && (
                                <button
                                    onClick={handleClearAll}
                                    className={`flex items-center gap-1.5 text-xs font-bold transition-colors py-1.5 px-4 rounded-xl border ${
                                        isDark 
                                          ? 'border-white/10 text-red-400 hover:bg-red-500/15 hover:border-red-500/30' 
                                          : 'border-slate-200 text-red-600 hover:bg-red-50 hover:border-red-200'
                                    }`}
                                >
                                    <IconTrash2 sz={14} />
                                    <span>Clear all</span>
                                </button>
                            )}
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NotificationsApp />);
    </script>
</body>
</html>
