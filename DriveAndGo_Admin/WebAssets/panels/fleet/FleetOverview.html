            }, []);

            // View State
            const [viewMode, setViewMode] = useState('grid'); // grid, table
            const [filterStatus, setFilterStatus] = useState('all'); // all, available, rented, maintenance
            const [searchTerm, setSearchTerm] = useState('');
            const [showWeatherBanner, setShowWeatherBanner] = useState(true);
            const [weatherData, setWeatherData] = useState(null);
            const [hourlyWeather, setHourlyWeather] = useState(null);
            const [riverDischarge, setRiverDischarge] = useState(null);

            useEffect(() => {
                let isMounted = true;
                async function fetchLiveWeather() {
                    let weatherLoaded = false;

                    // Primary: Backend Centralized Weather API
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 4000);
                        const res = await fetch(`${API}/api/weather/current`, { signal: controller.signal });
                        clearTimeout(timeoutId);
                        if (res.ok) {
                            const bData = await res.json();
                            if (isMounted && bData && bData.temperature !== undefined) {
                                setWeatherData({
                                    temperature_2m: bData.temperature,
                                    relative_humidity_2m: bData.humidity,
                                    precipitation: bData.precipitation_mm_hr || 0,
                                    weather_code: bData.weather_code || 0,
                                    wind_speed_10m: bData.wind_speed_kmh || 0
                                });
                                weatherLoaded = true;
                                const temp = Math.round(bData.temperature);
                                const rain = bData.precipitation_mm_hr || 0;
                                const wmo = getWmoWeatherInfo(bData.weather_code || 0);
                                if (rain > 15) {
                                    window.pushAdminNotification("CRITICAL WEATHER & FLOOD HAZARD", `Severe Weather Warning (${temp}°C, ${wmo.label}, ${rain}mm/h Rain). Flood corridors active!`);
                                } else if (rain > 5) {
                                    window.pushAdminNotification("Weather Advisory", `Active Rain Surge (${temp}°C, ${wmo.label}) across Metro Manila / SJDM routes.`);
                                }
                            }
                        }
                    } catch (err) {
                        console.warn("Backend weather API fetch error, attempting direct failover:", err);
                    }

                    // Hourly Forecast from Backend
                    try {
                        const hRes = await fetch(`${API}/api/weather/hourly`);
                        if (hRes.ok) {
                            const hData = await hRes.json();
                            if (isMounted && hData) setHourlyWeather(hData);
                        }
                    } catch (hErr) {
                        console.warn("Backend hourly forecast error:", hErr);
                    }

                    // Failover to direct Open-Meteo if backend was unreachable
                    if (!weatherLoaded) {
                        try {
                            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=14.5995&longitude=120.9842&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&hourly=precipitation,temperature_2m,weather_code&forecast_days=2&timezone=Asia%2FManila');

            // Modals & Drawers

                        window.fleetVehiclesCache = list;
                        setVehicles(list);
                        setSelectedVehicle(prev => {
                            if (!prev) return null;
                            const prevId = String(prev.vehicle_id || prev.id);
                            const fresh = list.find(item => String(item.vehicle_id || item.id) === prevId);
                            return fresh || prev;
                        });
                        return list;
                    }
                } catch (e) {
                    console.error("Fetch error:", e);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                const hideSplash = () => {
                    const splash = document.getElementById('boot-splash');
                    if (splash) {
                        splash.classList.add('hide');
                        setTimeout(() => { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
                    }
                };
                hideSplash();
                fetchFleet().finally(hideSplash);
                const splashTimer = setTimeout(hideSplash, 300);

                // Setup theme & bridge listeners if triggered from C# WinForms host
                window.setFleetTheme = (theme) => {
                    setIsDark(theme === 'dark');
                    document.documentElement.setAttribute('data-theme', theme);
                };
                window.refreshFleetData = fetchFleet;

                const calcBearing = (lat1, lng1, lat2, lng2) => {
                    const toRad = Math.PI / 180;
                    const dLng = (lng2 - lng1) * toRad;
                    const phi1 = lat1 * toRad;
                    const phi2 = lat2 * toRad;
                    const y = Math.sin(dLng) * Math.cos(phi2);
                    const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLng);
                    const brng = Math.atan2(y, x) * (180 / Math.PI);
                    return Math.round((brng + 360) % 360);
                };

                // Real API & Firebase Telematics GPS Live Update Listener
                // ONLY moves vehicle and rotates bearing when genuine coordinates arrive from API / GPS sensor
                window.liveUpdateGPS = (vid, lat, lng, speed, heading) => {
                    setVehicles(prev => prev.map(v => {
                        if (String(v.id) === String(vid) || String(v.vehicle_id) === String(vid)) {
                            const oldLat = v.coordinates ? v.coordinates[0] : lat;
                            const oldLng = v.coordinates ? v.coordinates[1] : lng;

                            // Calculate forward bearing angle only if location actually shifted
                            let newHeading = heading;
                            if (newHeading === undefined || newHeading === null) {
                                if (Math.abs(lat - oldLat) > 0.00001 || Math.abs(lng - oldLng) > 0.00001) {
                                    newHeading = calcBearing(oldLat, oldLng, lat, lng);
                                } else {
                                    newHeading = v.heading || 0;
                                }
                            }

                            const R = 6371; // Earth radius in km
                            const dLat = (lat - oldLat) * Math.PI / 180;
                            const dLng = (lng - oldLng) * Math.PI / 180;
                            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                                Math.cos(oldLat * Math.PI / 180) * Math.cos(lat * Math.PI / 180) *
                                Math.sin(dLng / 2) * Math.sin(dLng / 2);
                            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                            const distKm = R * c;

                            const addKm = (distKm > 0.005 && distKm < 10) ? distKm : 0;
                            const newOdo = Math.round(((v.odometerKm || 0) + addKm) * 10) / 10;

                            const updated = {
                                ...v,
                                coordinates: [lat, lng],
                                heading: newHeading,
                                bearing: newHeading,
                                currentSpeedKmh: speed !== undefined ? speed : (distKm > 0.001 ? 35 : 0),
                                odometerKm: newOdo,
                            };

                            setSelectedVehicle(curr => (curr && (String(curr.id) === String(vid) || String(curr.vehicle_id) === String(vid))) ? updated : curr);

                            return updated;
                        }
                        return v;
                    }));
                };

                // Auto-refresh fleet from API every 30s
                const int = setInterval(fetchFleet, 30000);

                return () => {
                    clearTimeout(splashTimer);
                    clearInterval(int);
                };
            }, [fetchFleet]);

            const handleAddUnit = () => {
                setEditingVehicle(null);
                setShowAddModal(true);
            };

            const handleEditUnit = async (vehicleOrId) => {
                let vObj = null;
                if (typeof vehicleOrId === 'object' && vehicleOrId !== null) {
                    vObj = vehicleOrId;
                } else if (vehicleOrId !== undefined && vehicleOrId !== null) {
                    vObj = vehicles.find(item => String(item.vehicle_id) === String(vehicleOrId) || String(item.vehicleId) === String(vehicleOrId) || String(item.VehicleId) === String(vehicleOrId) || String(item.id) === String(vehicleOrId));
                }

                let rawId = vObj?.vehicle_id || vObj?.vehicleId || vObj?.VehicleId || vObj?.id || vObj?.Id || vObj?.ID;
                if ((rawId === undefined || rawId === null || rawId === '' || isNaN(parseInt(rawId)) || parseInt(rawId) <= 0) && typeof vObj === 'object' && vObj !== null) {
                    for (const key of Object.keys(vObj)) {
                        if (key.toLowerCase().includes('id') && !key.toLowerCase().includes('url')) {
                            const val = parseInt(vObj[key]);
                            if (!isNaN(val) && val > 0) {
                                rawId = val;
                                break;
                            }
                        }
                    }
                }

                let parsedId = (rawId !== undefined && rawId !== null && !isNaN(parseInt(rawId))) ? parseInt(rawId) : null;
                let vId = (parsedId && parsedId > 0) ? parsedId : null;

                if (!vId && vObj && (vObj.plateNumber || vObj.plate_no || vObj.plateNo) && Array.isArray(vehicles)) {
                    const pNo = (vObj.plateNumber || vObj.plate_no || vObj.plateNo || '').trim().toLowerCase();
                    const found = vehicles.find(item => {
                        const itemPlate = (item.plateNumber || item.plate_no || item.plateNo || '').trim().toLowerCase();
                        return itemPlate === pNo && (item.vehicle_id > 0 || item.id > 0);
                    });
                    if (found) {
                        vId = found.vehicle_id || found.id;
                    }
                }

                if (vId) {
                    try {
                        const res = await fetch(`${API}/api/vehicles/${vId}?_t=${Date.now()}`, {
                            headers: {
                                ...HEADERS,
                                'Cache-Control': 'no-cache, no-store, must-revalidate',
                                'Pragma': 'no-cache'
                            },
                            cache: 'no-store'
                        });
                        if (res.ok) {
                            const fullData = await res.json();
                            vObj = { ...vObj, ...normVehicle(fullData, 0), vehicle_id: vId, vehicleId: vId, VehicleId: vId, id: vId };
                        }
                    } catch (e) {
                        console.warn('[DriveAndGo] Failed to fetch full vehicle details for edit, using cached data:', e);
                    }
                }

                if (vId && vObj) {
                    vObj.id = vId;
                    vObj.vehicle_id = vId;
                    vObj.vehicleId = vId;
                    vObj.VehicleId = vId;
                }

                setEditingVehicle(vObj || null);
                setShowAddModal(true);
            };

            const [decommissionVehicle, setDecommissionVehicle] = useState(null);

            const handleDeleteUnit = (vOrId) => {
                let targetVehicle = null;
                if (typeof vOrId === 'object' && vOrId !== null) {
                    targetVehicle = vOrId;
                } else {
                    const targetId = String(vOrId);
                    targetVehicle = vehicles.find(v => String(v.id || v.vehicle_id || v.vehicleId) === targetId);
                }

                if (!targetVehicle) {
                    showToast("Cannot decommission: Vehicle ID could not be resolved.", 'error');
                    return;

                setDecommissionVehicle(targetVehicle);
            };
            window.handleDeleteUnit = handleDeleteUnit;

            const handleConfirmDecommission = async (vId, reason, notes) => {
                try {
                    const url = `${API}/api/vehicles/${vId}?reason=${encodeURIComponent(reason)}&notes=${encodeURIComponent(notes)}`;
                    const res = await fetch(url, {
                        method: 'DELETE',
                        headers: {
                            ...HEADERS,
                            'X-Admin-Name': 'Raymart Quirante'
                        }
                    });

                    if (res.ok || res.status === 204) {
                        const data = await res.json().catch(() => ({}));
                        setSelectedVehicle(null);
                        setDecommissionVehicle(null);

                        const vBrand = data.Brand || decommissionVehicle?.brand || 'Vehicle';
                        const vModel = data.Model || decommissionVehicle?.model || '';
                        const vPlate = data.PlateNo || decommissionVehicle?.plateNumber || decommissionVehicle?.plate_no || '';

                        // Toast Notification
                        showToast(`VEHICLE DECOMMISSIONED: ${vBrand} ${vModel} (${vPlate}) removed. Reason: ${reason}`, 'success');

                        // Top Header Notification Dropdown push
                        window.pushAdminNotification("Fleet Decommission Audit", `Vehicle ${vBrand} ${vModel} (${vPlate}) removed from fleet. Reason: ${reason}`);

                        fetchFleet();
                    } else {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.message || errData.Message || "Failed to decommission vehicle.");
                    }
                } catch (e) {
                    console.error("Decommission Error:", e);
                    throw e;
                }
            };

            const toggleTheme = () => {
                const nu = !isDark;
                setIsDark(nu);
                document.documentElement.setAttribute('data-theme', nu ? 'dark' : 'light');

            // Derived Data (with Low RFID, Active Pass & Deep Field Filtering)
            const filteredVehicles = useMemo(() => {
                return vehicles.filter(v => {
                    const st = (v.status || '').toLowerCase();
                    const rfid = parseFloat(v.expressway_rfid_balance ?? v.expresswayRfidBalance ?? v.ExpresswayRfidBalance ?? v.rfid_balance_autosweep ?? v.rfidBalancePHP ?? 500);

                    const term = (searchTerm || '').toLowerCase().trim();
                    const rfidStr = String(Math.round(rfid));

                                    value={stats.total.toLocaleString()}
                                    tag="Live"
                                    tagClass="text-emerald-400 bg-emerald-500/10 border-emerald-500/20"
                                    glowColor="rgba(249, 115, 22, 0.28)"
                                    borderHoverColor="border-orange-500/50"
                                    valueColor="text-[var(--text-primary)]"
                                    onClick={() => setFilterStatus('all')}
                                />

                                {/* 2. Available */}
                                <FleetKpiCard3D
                                    icon={<IconCheck sz={18} />}
                                    title="Available"
                                    value={stats.avail.toLocaleString()}
                                    tag="Ready"
                                    tagClass="text-emerald-400 bg-emerald-500/10 border-emerald-500/20"
                                    glowColor="rgba(52, 211, 153, 0.28)"
                                    borderHoverColor="border-emerald-500/50"
                                    valueColor="text-emerald-400"
                                    onClick={() => setFilterStatus('available')}
                                />

                                {/* 3. Rented */}
                                <FleetKpiCard3D
                                    icon={<IconZap sz={18} />}
                                    title="On Rent"
                                    value={stats.rent.toLocaleString()}
                                    tag="Active"
                                    tagClass="text-amber-400 bg-amber-500/10 border-amber-500/20"
                                    glowColor="rgba(251, 191, 36, 0.28)"
                                    borderHoverColor="border-amber-500/50"
                                    valueColor="text-amber-400"
                                    onClick={() => setFilterStatus('rented')}
                                />

                                {/* 4. Maintenance */}
                                <FleetKpiCard3D
                                    icon={<IconSettings sz={18} />}
                                    title="Maintenance"
                                    value={stats.maint.toLocaleString()}
                                    tag="In Shop"
                                    tagClass="text-gray-400 bg-white/5 border-white/10"
                                    glowColor="rgba(192, 132, 252, 0.25)"
                                    borderHoverColor="border-purple-500/50"
                                    valueColor="text-[var(--text-primary)]"
                                    onClick={() => setFilterStatus('maintenance')}
                                />
                            </div>

                            {/* Fleet Health & RFID Status Bar */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="p-3 px-4 rounded-xl bg-[var(--bg-card)] border border-[var(--border-color)] flex items-center justify-between shadow-sm hover:border-emerald-500/30 transition-colors">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                                        <span className="text-xs text-[var(--text-muted)] font-bold uppercase tracking-wider">Avg Fleet Health</span>
                                    </div>
                                    <span className="text-sm font-black text-emerald-400">{stats.avgHealth}%</span>
                                </div>
                                <div 
                                    onClick={() => setFilterStatus(prev => prev === 'low_rfid' ? 'all' : 'low_rfid')}
                                    className={`p-3 px-4 rounded-xl border flex items-center justify-between shadow-sm transition-all cursor-pointer select-none ${
                                        filterStatus === 'low_rfid'
                                            ? 'bg-orange-500/30 border-orange-500 ring-2 ring-orange-500/40 shadow-orange-500/20'
                                            : 'bg-orange-500/15 border-orange-500/40 hover:bg-orange-500/25'
                                    }`}
                                    title="Click to filter vehicles with Low RFID Balance (< ₱200)"
                                >
                                    <div className="flex items-center gap-2 text-orange-400">
                                        <IconAlertTriangle sz={14} />
                                        <span className="text-xs font-bold uppercase tracking-wider">Low RFID Balance</span>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-sm font-black text-orange-500">{stats.lowRfid} Vehicles</span>
                                        {filterStatus === 'low_rfid' && (
                                            <span className="text-[9px] bg-orange-500 text-white px-1.5 py-0.5 rounded font-black tracking-wider uppercase">Filtered</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* CONTROL & FILTER BAR (Prominent Search + Status Combobox) */}
                        <div className="flex flex-col sm:flex-row justify-between items-center gap-3 bg-[var(--bg-card)] p-2.5 px-4 rounded-2xl border border-[var(--border-color)] shadow-[var(--shadow-card)]">
                            {/* PROMINENT EXPANDED SEARCH BAR */}
                            <div className="flex items-center gap-2.5 flex-1 w-full bg-[var(--bg-tertiary)] px-3.5 py-2 rounded-xl border border-[var(--border-color)] focus-within:border-orange-500/60 transition-colors">
                                <IconSearch sz={18} c="text-orange-500 shrink-0" />
                                <input
                                    type="text"
                                    placeholder="Search in fleet..."
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                    className="bg-transparent border-none outline-none text-sm w-full text-[var(--text-primary)] placeholder-[var(--text-muted)] font-medium"

                                {searchTerm && (
                                    <button onClick={() => setSearchTerm('')} className="p-0.5 text-[var(--text-muted)] hover:text-white rounded-full transition-colors flex items-center justify-center"><IconX sz={13} /></button>
                                )}
                            </div>

                            {/* RIGHT CONTROLS: STATUS COMBOBOX + VIEW TOGGLE + ADD UNIT */}

                                {/* Interactive Brand Orange Status Combobox */}
                                <StatusCombobox value={filterStatus} onChange={setFilterStatus} />

                                <div className="h-6 w-px bg-[var(--border-color)] hidden sm:block"></div>

                                {/* View Mode Icons */}
                                <div className="flex gap-1 shrink-0 bg-[var(--bg-tertiary)] p-1 rounded-xl border border-[var(--border-color)]">
                                    <button onClick={() => setViewMode('grid')} className={`p-1.5 rounded-lg transition-all ${viewMode === 'grid' ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30' : 'text-[var(--text-muted)] hover:text-[var(--text-primary)]'}`} title="Grid View"><IconGrid sz={16} /></button>

                                    <IconPlus sz={16} /> Add Unit

                        {/* VEHICLE GRID (GROUPED STACK CARDS & 3D FAN-OUT DECK) */}
                        {loading && vehicles.length === 0 ? (
                            <div className="flex justify-center items-center py-20 text-[var(--text-muted)]"><IconRefreshCw sz={32} c="animate-spin" /></div>

                        ) : (

                    </div>

                    {/* RIGHT COLUMN: FULL-HEIGHT DARK LEAFLET MAP (~42% width) */}
                    <div className="hidden lg:flex flex-col flex-1 h-full p-5 pl-0 relative">
                        <div className="w-full h-full rounded-3xl overflow-hidden border border-[var(--border-color)] shadow-2xl relative">
                            {/* Floating Weather Telematics Banner Overlay inside Map Container */}
                            {showWeatherBanner && (
                                <div
                                    onClick={() => setShowWeatherModal(true)}
                                    className={`absolute top-3 left-3 right-3 z-[500] p-2 px-3.5 rounded-2xl bg-slate-950/90 border border-white/15 backdrop-blur-2xl flex items-center justify-between text-xs shadow-2xl animate-fade-in transition-all duration-300 group cursor-pointer hover:border-orange-500/60 ${weatherAlert.accentBorder}`}
                                    title="Click to open Full Interactive Weather & PAGASA Radar Analytics"
                                >
                                    <div className="flex items-center gap-2.5 overflow-hidden flex-1 min-w-0">

                                            </span>

                                                <IconCloudRain sz={13} />
                                                <span>{weatherAlert.temp}</span>
                                            </span>
                                        </div>

                                        {/* Weather Text Ticker */}
                                        <div className="truncate font-semibold text-slate-200 text-xs flex items-center gap-2">

                                            <span>Radar Analytics &rarr;</span>
                                        </span>
                                        <button
                                            onClick={(e) => { e.stopPropagation(); setShowWeatherBanner(false); }}
                                            className="p-1 rounded-lg hover:bg-white/15 text-slate-400 hover:text-white transition-colors"

                            <LeafletMapComponent

                                selectedVehicleId={selectedVehicle?.id}

                        </div>

                    {/* VEHICLE DETAILS OVERLAY DRAWER */}
                    <VehicleDrawer v={selectedVehicle} onClose={() => setSelectedVehicle(null)} onRefresh={fetchFleet} onEdit={handleEditUnit} onDelete={handleDeleteUnit} onShowQr={setQrVehicle} onPreviewDoc={setPreviewDoc} />

                    {deckCluster && (
                        <DeckFanModal
                            cluster={deckCluster}
                            onClose={() => setDeckCluster(null)}
                            onSelectVehicle={setSelectedVehicle}

                            onDeleteUnit={handleDeleteUnit}

                        />
                    )}

                    {/* MODALS */}
                    {showAddModal && (
                        <AddVehicleModal
                            vehicleToEdit={editingVehicle}
                            vehicles={vehicles}
                            onClose={() => { setShowAddModal(false); setEditingVehicle(null); }}
                            onSave={async (successMsg, updatedVehicle) => {
                                setShowAddModal(false);
                                setEditingVehicle(null);
                                showToast(successMsg || "Vehicle updated successfully!", 'success');

                                // Instant Optimistic Local State Update (0ms immediate refresh!)
                                if (updatedVehicle) {
                                    const uId = String(updatedVehicle.id || updatedVehicle.vehicle_id || updatedVehicle.vehicleId || '');
                                    const uPlate = (updatedVehicle.plateNumber || updatedVehicle.plate_no || '').trim().toLowerCase();

                                    setVehicles(prev => {
                                        const isMatch = v => (uId && String(v.id || v.vehicle_id || v.vehicleId || '') === uId) ||
                                            (uPlate && (v.plateNumber || v.plate_no || '').trim().toLowerCase() === uPlate);
                                        const exists = prev.some(isMatch);
                                        if (exists) {
                                            return prev.map(v => isMatch(v) ? { ...v, ...updatedVehicle } : v);
                                        }
                                        return [updatedVehicle, ...prev];
                                    });

                                    setSelectedVehicle(prev => {
                                        if (!prev) return null;
                                        const isMatch = (uId && String(prev.id || prev.vehicle_id || prev.vehicleId || '') === uId) ||
                                            (uPlate && (prev.plateNumber || prev.plate_no || '').trim().toLowerCase() === uPlate);
                                        return isMatch ? { ...prev, ...updatedVehicle } : prev;
                                    });

                                    // CRUCIAL: Immediately update deckCluster so the open DeckFanModal card refreshes in 0ms without closing!
                                    setDeckCluster(prev => {
                                        if (!prev || !prev.units) return prev;
                                        const isMatch = v => (uId && String(v.id || v.vehicle_id || v.vehicleId || '') === uId) ||
                                            (uPlate && (v.plateNumber || v.plate_no || '').trim().toLowerCase() === uPlate);
                                        const updatedUnits = prev.units.map(v => isMatch(v) ? { ...v, ...updatedVehicle } : v);
                                        return {
                                            ...prev,
                                            units: updatedUnits,
                                            primaryUnit: (prev.primaryUnit && isMatch(prev.primaryUnit)) ? { ...prev.primaryUnit, ...updatedVehicle } : prev.primaryUnit
                                        };
                                    });
                                }

                                // Re-fetch fresh live data from database with no-cache
                                await fetchFleet();
                            }}
                        />
                    )}
                    {showWeatherModal && (
                        <WeatherIntelligenceModal
                            weatherData={weatherData}
                            hourlyWeather={hourlyWeather}
                            riverDischarge={riverDischarge}
                            vehicles={vehicles}
                            floodZones={floodZones}
                            roadClosures={roadClosures}
                            onRefreshClosures={fetchRoadClosures}
                            onClose={() => setShowWeatherModal(false)}
                            onExecuteEmergencyProtocol={handleExecuteEmergencyProtocol}
                        />
                    )}
                    {/* 100% REACT WEB2 NOTIFICATIONS DROPDOWN MODAL */}
                    {showNotifDropdown && (
                        <div className="fixed inset-0 z-[99999] bg-transparent" onClick={() => setShowNotifDropdown(false)}>
                            <div 
                                className={`fixed top-14 right-12 z-[100000] w-96 max-w-[90vw] backdrop-blur-2xl border rounded-3xl p-4 animate-fade-in overflow-hidden transition-colors duration-200 ${
                                    isDark 
                                      ? 'bg-[#0c0e1a]/95 border-white/15 text-white shadow-[0_25px_60px_rgba(0,0,0,0.85)]' 
                                      : 'bg-white/95 border-slate-200 text-slate-900 shadow-[0_25px_60px_rgba(0,0,0,0.15)]'
                                }`}
                                onClick={e => e.stopPropagation()}
                            >
                            <div className={`flex items-center justify-between pb-3 border-b mb-3 px-1 ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
                                <div className={`flex items-center gap-2 font-black text-sm ${isDark ? 'text-white' : 'text-slate-900'}`}>
                                    <IconBell sz={18} className={isDark ? "text-orange-400" : "text-orange-600"} />
                                    <span>Notifications</span>
                                    {notifications.filter(n => n.unread).length > 0 && (
                                        <span className="px-2 py-0.5 rounded-full bg-orange-500 text-white font-extrabold text-[10px]">
                                            {notifications.filter(n => n.unread).length}
                                        </span>
                                    )}
                                </div>
                                <button
                                    onClick={() => setShowNotifDropdown(false)}
                                    className={`p-1.5 rounded-full transition-colors ${
                                        isDark ? 'hover:bg-white/10 text-gray-400 hover:text-white' : 'hover:bg-slate-100 text-slate-400 hover:text-slate-700'
                                    }`}
                                >
                                    <IconX sz={16} />
                                </button>
                            </div>

                            {/* Notifications List */}
                            <div className="max-h-[360px] overflow-y-auto pr-1 flex flex-col gap-2.5 custom-scrollbar">
                                {notifications.length === 0 ? (
                                    <div className={`py-12 text-center text-xs italic ${isDark ? 'text-gray-400' : 'text-slate-400'}`}>
                                        No active notifications
                                    </div>
                                ) : (
                                    notifications.map(n => {
                                        let icon = <IconBell sz={16} className={isDark ? "text-blue-400" : "text-blue-600"} />;
                                        let badgeBg = isDark ? "bg-blue-500/20 text-blue-400 border-blue-500/30" : "bg-blue-500/15 text-blue-600 border-blue-500/25";

                                        const tLow = (n.title || '').toLowerCase();
                                        const bLow = (n.body || '').toLowerCase();

                                        if (n.type === 'weather' || tLow.includes('weather') || tLow.includes('pagasa') || tLow.includes('monsoon')) {
                                            icon = <IconCloudRain sz={16} className={isDark ? "text-amber-400" : "text-amber-600"} />;
                                            badgeBg = isDark ? "bg-amber-500/20 text-amber-400 border-amber-500/30" : "bg-amber-500/15 text-amber-600 border-amber-500/25";
                                        } else if (n.type === 'flood' || tLow.includes('flood') || tLow.includes('hazard')) {
                                            icon = <IconShieldAlert sz={16} className={isDark ? "text-cyan-400" : "text-cyan-600"} />;
                                            badgeBg = isDark ? "bg-cyan-500/20 text-cyan-400 border-cyan-500/30" : "bg-cyan-500/15 text-cyan-600 border-cyan-500/25";
                                        } else if (n.type === 'decommission' || tLow.includes('decommission') || tLow.includes('audit')) {
                                            icon = <IconTrash2 sz={16} className={isDark ? "text-red-400" : "text-red-600"} />;
                                            badgeBg = isDark ? "bg-red-500/20 text-red-400 border-red-500/30" : "bg-red-500/15 text-red-600 border-red-500/25";
                                        }

                                        const itemBg = isDark
                                            ? (n.unread ? 'bg-white/[0.08] border-white/25 shadow-md hover:bg-white/[0.14] hover:border-orange-500/50' : 'bg-white/[0.02] border-white/5 opacity-75 hover:bg-white/[0.14] hover:border-orange-500/50')
                                            : (n.unread ? 'bg-slate-50 border-slate-200 shadow-sm hover:bg-slate-100 hover:border-orange-500/50' : 'bg-slate-100/40 border-slate-100 opacity-80 hover:bg-slate-100 hover:border-orange-500/50');

                                        return (
                                            <div
                                                key={n.id}
                                                onClick={() => {
                                                    setShowNotifDropdown(false);
                                                    setNotifications(prev => prev.map(x => x.id === n.id ? { ...x, unread: false } : x));

                                                    if (tLow.includes('weather') || tLow.includes('pagasa') || tLow.includes('monsoon') || tLow.includes('flood') || bLow.includes('rain')) {
                                                        setShowWeatherModal(true);
                                                    }
                                                }}
                                                className={`p-3 rounded-2xl border transition-all cursor-pointer flex items-start gap-3 hover:scale-[1.01] ${itemBg}`}
                                            >
                                                <div className={`p-2 rounded-xl border shrink-0 ${badgeBg}`}>
                                                    {icon}
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center justify-between gap-2 mb-0.5">
                                                        <h4 className={`font-extrabold text-xs truncate ${isDark ? 'text-white' : 'text-slate-900'}`}>{n.title}</h4>
                                                        <span className={`text-[10px] font-semibold whitespace-nowrap ${isDark ? 'text-gray-400' : 'text-slate-400'}`}>{n.time}</span>
                                                    </div>
                                                    <p className={`text-[11px] leading-snug line-clamp-2 ${isDark ? 'text-gray-300' : 'text-slate-600'}`}>{n.body}</p>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>

                            {/* Clear All Footer */}
                            {notifications.length > 0 && (
                                <div className={`pt-3 mt-3 border-t flex justify-center ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
                                    <button
                                        onClick={() => setNotifications([])}
                                        className={`text-xs font-black transition-colors uppercase tracking-wider py-1 px-4 rounded-xl ${
                                            isDark 
                                              ? 'text-orange-400 hover:text-orange-300 hover:bg-orange-500/10' 
                                              : 'text-orange-600 hover:text-orange-700 hover:bg-orange-500/10'
                                        }`}
                                    >
                                        Clear all
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                    )}

                    {qrVehicle && <QrCodeModal vehicle={qrVehicle} onClose={() => setQrVehicle(null)} />}
                    {previewDoc && <DocumentPreviewModal title={previewDoc.title} url={previewDoc.url} onClose={() => setPreviewDoc(null)} />}

                    {/* FLOATING GLASS TOAST NOTIFICATION */}
                    {/* DECOMMISSION VEHICLE MODAL */}
                    {decommissionVehicle && (
                        <DecommissionVehicleModal
                            vehicle={decommissionVehicle}
                            onClose={() => setDecommissionVehicle(null)}
                            onConfirmDecommission={handleConfirmDecommission}
                        />
                    )}

                    {toast && (
                        <div className={`fixed top-6 right-6 z-[100000] px-5 py-3.5 rounded-2xl backdrop-blur-xl border shadow-2xl flex items-center gap-3 animate-slide-in text-xs font-bold ${toast.type === 'error'
                            ? 'bg-red-950/90 border-red-500/40 text-red-200 shadow-red-500/20'
                            : 'bg-emerald-950/90 border-emerald-500/40 text-emerald-200 shadow-emerald-500/20'
                            }`}>
                            {toast.type === 'error' ? <IconAlertTriangle sz={18} className="text-red-400 shrink-0" /> : <IconCheck sz={18} className="text-emerald-400 shrink-0" />}
                            <span>{toast.message}</span>
                            <button onClick={() => setToast(null)} className="ml-2 hover:opacity-75 text-gray-400 hover:text-white"><IconX sz={14} /></button>
                        </div>
                    )}

                </div>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("FleetOverview ErrorBoundary Caught:", error, errorInfo);
                window.__lastReactError = { error: String(error), info: errorInfo };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-[#07070e] text-white flex flex-col items-center justify-center p-8 text-center">
                            <div className="p-8 rounded-3xl bg-red-950/40 border border-red-500/30 backdrop-blur-2xl max-w-lg shadow-2xl flex flex-col items-center gap-4">
                                <div className="w-14 h-14 rounded-2xl bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-400 text-2xl font-black">!</div>
                                <h2 className="text-xl font-black text-white">Something went wrong</h2>
                                <p className="text-xs text-gray-400 font-mono bg-black/50 p-3 rounded-xl border border-white/10 text-left w-full overflow-auto max-h-40">
                                    {String(this.state.error?.message || this.state.error)}
                                </p>
                                <button onClick={() => { this.setState({ hasError: false, error: null }); window.location.reload(); }} className="px-6 py-3 rounded-xl bg-orange-500 hover:bg-orange-600 font-bold text-xs text-white shadow-lg shadow-orange-500/30 transition-all">
                                    Reload Operations Center
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Mount with fallback support for ReactDOM.createRoot and ReactDOM.render
        try {
            const rootEl = document.getElementById('root');
            if (ReactDOM.createRoot) {
                const root = ReactDOM.createRoot(rootEl);
                root.render(
                    <ErrorBoundary>
                        <FleetOverview />
                    </ErrorBoundary>
                );
            } else {
                ReactDOM.render(
                    <ErrorBoundary>
                        <FleetOverview />
                    </ErrorBoundary>,
                    rootEl
                );
            }
        } catch (mountErr) {
            console.error("ReactDOM Mount Error:", mountErr);
            document.getElementById('root').innerHTML = '<div style="color:#ef4444;padding:30px;font-family:Segoe UI,sans-serif;background:#0d0e17;border:1px solid rgba(239,68,68,0.3);border-radius:20px;margin:20px;"><h3 style="color:#f97316;">ReactDOM Mounting Failure</h3><pre style="background:rgba(0,0,0,0.5);padding:12px;border-radius:10px;font-size:11px;color:#cbd5e1;">' + (mountErr.stack || mountErr.message) + '</pre></div>';
        }

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const splash = document.getElementById('boot-splash');
                if (splash) {
                    splash.classList.add('hide');
                    setTimeout(() => { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
                }
            });
        });
    </script>
</body>

</html>
