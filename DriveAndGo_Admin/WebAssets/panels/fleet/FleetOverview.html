            --bg-primary: #f8fafc;

            --bg-tertiary: #f1f5f9;

            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }

            to {

    <script>
        window.API_BASE_URL = window.API_BASE_URL || '';
        window.AUTH_TOKEN = window.AUTH_TOKEN || '';

        // Catch global JS/Babel initialization errors and display diagnostic info instead of blank screen
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            console.error("Global JS Error:", msg, "at line", lineNo, "col", columnNo, error);
            var root = document.getElementById('root');
            if (root && (!root.innerHTML || root.innerHTML.trim() === '' || root.innerHTML.indexOf('boot-splash') !== -1)) {
                root.innerHTML = '<div style="color:#ef4444;padding:30px;font-family:Segoe UI,sans-serif;background:#0d0e17;border:1px solid rgba(239,68,68,0.3);border-radius:20px;margin:20px;box-shadow:0 10px 30px rgba(0,0,0,0.8);"><h3 style="color:#f97316;margin-top:0;">Fleet Center Initialization Error</h3><p style="color:#94a3b8;font-size:13px;">' + msg + '</p><pre style="background:rgba(0,0,0,0.5);padding:12px;border-radius:10px;font-size:11px;color:#cbd5e1;white-space:pre-wrap;">Line: ' + lineNo + ' | Column: ' + columnNo + '\n' + (error && error.stack ? error.stack : '') + '</pre></div>';
            }
            var splash = document.getElementById('boot-splash');
            if (splash) splash.remove();
            return false;
        };

        // Safety fallback: Auto-dismiss boot splash screen after 1.5s
        setTimeout(function () {
            var splash = document.getElementById('boot-splash');
            if (splash) {
                splash.classList.add('hide');
                setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
            }
        }, 1500);
    </script>

    <script type="text/babel">
        // DriveAndGo Fleet Management Overview - Advanced React Application (FleetOps Pro Architecture)
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const rawApi = (window.API_BASE_URL || (window.location.origin.startsWith('http') && !window.location.origin.includes('appassets') ? window.location.origin + '/api' : 'http://localhost:5233/api')).trim();
        const API = rawApi.replace(/\/$/, '').replace(/\/api$/, '');
        const HEADERS = {
            'Content-Type': 'application/json',
            ...(window.AUTH_TOKEN ? { 'Authorization': `Bearer ${window.AUTH_TOKEN}` } : {})
        };

        const formatPHP = (val) => new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(val || 0);

        const statusColorMap = {
            'available': { text: 'text-emerald-400', border: 'border-emerald-400/30', bg: 'bg-emerald-400/10', hex: '#34d399' },
            'rented': { text: 'text-amber-400', border: 'border-amber-400/30', bg: 'bg-amber-400/10', hex: '#fbbf24' },
            'in-use': { text: 'text-amber-400', border: 'border-amber-400/30', bg: 'bg-amber-400/10', hex: '#fbbf24' },
            'maintenance': { text: 'text-purple-400', border: 'border-purple-400/30', bg: 'bg-purple-400/10', hex: '#c084fc' },
            'retired': { text: 'text-red-400', border: 'border-red-400/30', bg: 'bg-red-400/10', hex: '#f87171' },
            'default': { text: 'text-blue-400', border: 'border-blue-400/30', bg: 'bg-blue-400/10', hex: '#60a5fa' }
        };

        const getStatusStyle = (s) => statusColorMap[(s || '').toLowerCase()] || statusColorMap.default;

        const resolveVehicleImgUrl = (url) => {
            if (!url || typeof url !== 'string') return '';
            const trimmed = url.trim();
            if (trimmed.startsWith('data:') || trimmed.startsWith('http://') || trimmed.startsWith('https://') || trimmed.startsWith('blob:')) {
                return trimmed;
            }
            if (trimmed.startsWith('/')) {
                return `${API}${trimmed}`;
            }
            if (trimmed.startsWith('uploads/')) {
                return `${API}/${trimmed}`;
            }
            return trimmed;
        };

        const getLogoBase64 = async () => {
            try {
                const lRes = await fetch("logo.png");
                if (lRes.ok) {
                    const blob = await lRes.blob();
                    return await new Promise((res) => {
                        const fr = new FileReader();
                        fr.onloadend = () => {
                            const s = fr.result;
                            res(typeof s === "string" && s.includes("base64,") ? s.split("base64,")[1] : null);
                        };
                        fr.onerror = () => res(null);
                        fr.readAsDataURL(blob);
                    });
                }
            } catch (e) {}

            try {
                const lRes = await fetch("https://raw.githubusercontent.com/martquirante/DriveAndGo_Project/main/DriveAndGo_Admin/WebAssets/logo.png");
                if (lRes.ok) {
                    const blob = await lRes.blob();
                    return await new Promise((res) => {
                        const fr = new FileReader();
                        fr.onloadend = () => {
                            const s = fr.result;
                            res(typeof s === "string" && s.includes("base64,") ? s.split("base64,")[1] : null);
                        };
                        fr.onerror = () => res(null);
                        fr.readAsDataURL(blob);
                    });
                }
            } catch (e) {}
            return null;
        };

        const getColorBoxHex = (colorName) => {
            const cLower = (colorName || '').toLowerCase();
            if (cLower.includes('white')) return { hex: '#F8F9FA', border: '#CBD5E1' };
            if (cLower.includes('agate') || cLower.includes('black') || cLower.includes('dark')) return { hex: '#1E293B', border: '#475569' };
            if (cLower.includes('red') || cLower.includes('crimson')) return { hex: '#DC2626', border: '#EF4444' };
            if (cLower.includes('grey') || cLower.includes('gray')) return { hex: '#64748B', border: '#94A3B8' };
            if (cLower.includes('silver')) return { hex: '#CBD5E1', border: '#94A3B8' };
            if (cLower.includes('blue')) return { hex: '#1E3A8A', border: '#3B82F6' };
            if (cLower.includes('gold') || cLower.includes('yellow')) return { hex: '#D97706', border: '#F59E0B' };
            if (cLower.includes('green')) return { hex: '#059669', border: '#10B981' };
            if (cLower.includes('orange')) return { hex: '#EA580C', border: '#F97316' };
            return { hex: '#94A3B8', border: '#64748B' };
        };

        const formatDateSafe = (val, fallback) => {
            if (!val) return fallback;
            if (typeof val === 'string') {
                return val.includes('T') ? val.split('T')[0] : val;
            }
            try {
                const d = new Date(val);
                return isNaN(d.getTime()) ? fallback : d.toISOString().split('T')[0];
            } catch (e) {
                return fallback;
            }
        };

        const detectVehicleCategory = (type = '', brand = '', model = '') => {
            const str = `${type || ''} ${brand || ''} ${model || ''}`.toLowerCase();
            if (str.includes('pickup') || str.includes('truck') || str.includes('hilux') || str.includes('navara') || str.includes('ranger') || str.includes('d-max') || str.includes('dmax') || str.includes('strada') || str.includes('triton')) {
                return 'pickup';
            }
            if (str.includes('suv') || str.includes('fortuner') || str.includes('montero') || str.includes('everest') || str.includes('cr-v') || str.includes('crv') || str.includes('rav4') || str.includes('terra') || str.includes('crossover') || str.includes('pajero') || str.includes('jimny') || str.includes('land cruiser')) {
                return 'suv';
            }
            if (str.includes('van') || str.includes('hiace') || str.includes('urvan') || str.includes('alphard') || str.includes('starex') || str.includes('staria') || str.includes('mpv') || str.includes('innova') || str.includes('ertiga') || str.includes('avanza') || str.includes('xpander') || str.includes('livina') || str.includes('carnival')) {
                return 'van';
            }
            if (str.includes('hatchback') || str.includes('wigo') || str.includes('yaris') || str.includes('mirage') || str.includes('swift') || str.includes('brio') || str.includes('compact') || str.includes('mini')) {
                return 'hatchback';
            }
            if (str.includes('motorcycle') || str.includes('scooter') || str.includes('bike') || str.includes('nmax') || str.includes('aerox') || str.includes('pcx') || str.includes('click') || str.includes('vespa') || str.includes('adv') || str.includes('sniper')) {
                return 'motorcycle';
            }
            if (str.includes('coupe') || str.includes('sports') || str.includes('mustang') || str.includes('supra') || str.includes('gt86') || str.includes('brz') || str.includes('miata') || str.includes('z4') || str.includes('porsche')) {
                return 'coupe';
            }
            return 'sedan';
        };

        const renderDefaultTopDownVehicleSvg = (v, hex = '#38bdf8') => {
            const category = detectVehicleCategory(v?.type, v?.brand, v?.model);
            const uid = (v?.id || v?.plateNumber || Math.random().toString(36).substring(2, 7)).toString().replace(/[^a-zA-Z0-9]/g, '_');

            if (category === 'pickup') {
                return `

                                <stop offset="0%" stop-color="#090d16"/>
                                <stop offset="100%" stop-color="#161e2e"/>
                            </linearGradient>
                        </defs>
                        <rect x="2" y="24" width="4" height="6" rx="2" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
                        <rect x="38" y="24" width="4" height="6" rx="2" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
                        <path d="M 8 16 Q 8 6 22 4 Q 36 6 36 16 L 36 70 Q 36 76 22 76 Q 8 76 8 70 Z" fill="url(#pBody_${uid})" stroke="${hex}" stroke-width="1.5"/>
                        <path d="M 12 10 L 14 20 M 32 10 L 30 20" stroke="#475569" stroke-width="1"/>
                        <path d="M 11 23 Q 22 20 33 23 L 31 32 Q 22 30 13 32 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" opacity="0.95"/>
                        <rect x="13" y="32" width="18" height="15" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
                        <rect x="14" y="47" width="16" height="3" rx="1" fill="#0f172a" stroke="#38bdf8" stroke-width="0.6"/>
                        <rect x="11" y="52" width="22" height="21" rx="2" fill="url(#pBed_${uid})" stroke="#334155" stroke-width="1"/>
                        <line x1="15" y1="55" x2="15" y2="70" stroke="#1e293b" stroke-width="1"/>
                        <line x1="22" y1="55" x2="22" y2="70" stroke="#1e293b" stroke-width="1"/>
                        <line x1="29" y1="55" x2="29" y2="70" stroke="#1e293b" stroke-width="1"/>
                        <rect x="18" y="74" width="8" height="1.5" rx="0.5" fill="#64748b"/>
                        <rect x="9" y="5" width="5" height="3" rx="1.5" fill="#38bdf8"/>

        // ─── BRAND LOGO ENGINE & RESOLVER ──────────────────────────────────────────

        const getBrandSlug = (brandName) => {
            if (!brandName) return '';
            const clean = String(brandName).trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            for (const [key, slug] of Object.entries(BRAND_LOGO_MAP)) {
                const kClean = key.replace(/[^a-z0-9]/g, '');
                if (clean === kClean || clean.includes(kClean) || kClean.includes(clean)) {
                    return slug;
                }
            }
            return String(brandName).trim().toLowerCase().replace(/\s+/g, '-');
        };

        const getBrandLogoUrl = (brandName) => {
            const slug = getBrandSlug(brandName);
            if (!slug) return '';
            return `${API}/api/vehicles/brand-logo/${encodeURIComponent(slug)}`;
        };

        const ADAPTIVE_BRAND_SLUGS = new Set([
            'toyota', 'nissan', 'mazda', 'lexus', 'jeep', 'kia', 'suzuki', 
            'isuzu', 'honda', 'volkswagen', 'volvo', 'subaru', 'mercedes-benz', 
            'mercedes', 'audi', 'infiniti', 'jaguar', 'chery', 'geely', 'byd', 'haval', 'peugeot', 'renault', 'dodge', 'ram', 'tesla',
            'hyundai', 'mitsubishi', 'chevrolet'
        ]);

        const BrandLogo = ({ brand, className = "w-7 h-7", imgClass = "w-full h-full" }) => {
            const [hasError, setHasError] = useState(false);
            const [fallbackToCdn, setFallbackToCdn] = useState(false);
            const b = (brand || 'Car').trim();
            const slug = getBrandSlug(b);
            const initials = b.length >= 2 ? b.substring(0, 2).toUpperCase() : b.toUpperCase();

            useEffect(() => {
                setHasError(false);
                setFallbackToCdn(false);
            }, [brand]);

            if (hasError || !slug) {
                return (
                    <div className={`inline-flex items-center justify-center shrink-0 select-none rounded-md bg-white p-0.5 shadow-xs border border-slate-200/90 overflow-hidden ${className}`}>
                        <span className="font-black text-slate-800 text-[10px] uppercase tracking-wider select-none" title={b}>
                            {initials}
                        </span>
                    </div>
                );
            }

            const srcUrl = fallbackToCdn 
                ? `https://cdn.jsdelivr.net/gh/filippofilip95/car-logos-dataset@master/logos/original/${slug}.png`
                : `${API}/api/vehicles/brand-logo/${encodeURIComponent(slug)}`;

            return (
                <div className={`inline-flex items-center justify-center shrink-0 select-none rounded-md bg-white p-0.5 shadow-xs border border-slate-200/90 overflow-hidden ${className}`}>
                    <img 
                        src={srcUrl}
                        alt={b} 
                        className={`w-full h-full object-contain ${imgClass}`}
                        loading="lazy"
                        onError={() => {
                            if (!fallbackToCdn) {
                                setFallbackToCdn(true);
                            } else {
                                setHasError(true);
                            }
                        }} 
                    />
                </div>
            );
        };

        const overlayLogoOnQr = (container, logoUrl, logoRatio = 0.24) => {
            if (!container || !logoUrl) return;
            setTimeout(() => {
                const canvas = container.querySelector('canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    try {
                        const cw = canvas.width;
                        const ch = canvas.height;
                        const logoW = Math.round(cw * logoRatio);
                        const logoH = Math.round(ch * logoRatio);
                        const x = Math.round((cw - logoW) / 2);
                        const y = Math.round((ch - logoH) / 2);
                        const pad = Math.max(3, Math.round(cw * 0.03));

                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        if (ctx.roundRect) {
                            ctx.roundRect(x - pad, y - pad, logoW + pad * 2, logoH + pad * 2, 6);
                        } else {
                            ctx.rect(x - pad, y - pad, logoW + pad * 2, logoH + pad * 2);
                        }
                        ctx.fill();
                        ctx.strokeStyle = '#E2E8F0';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.drawImage(img, x, y, logoW, logoH);

                        const existingImg = container.querySelector('img');
                        if (existingImg) {
                            existingImg.src = canvas.toDataURL('image/png');
                        }
                    } catch (err) {
                        console.warn('Could not stamp brand logo on QR canvas:', err);
                    }
                };
                img.src = logoUrl;
            }, 100);

                    const relX = e.clientX - rect.left;
                    const relY = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const normX = (relX - centerX) / centerX;
                    const normY = (relY - centerY) / centerY;
                    setTilt({ x: normY * -12, y: normX * 12 });
                    setGlare({
                        x: (relX / rect.width) * 100,
                        y: (relY / rect.height) * 100,

        const resolveDestinationInfo = (destStr) => {
            if (!destStr || typeof destStr !== 'string') return null;
            const clean = destStr.toLowerCase().trim();
            for (const key of Object.keys(DEST_COORDS_LOOKUP)) {
                if (clean.includes(key)) {
                    return { name: destStr.trim(), coords: DEST_COORDS_LOOKUP[key] };
                }
            }
            const coordMatch = destStr.match(/(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/);
            if (coordMatch) {
                return { name: destStr.trim(), coords: [parseFloat(coordMatch[1]), parseFloat(coordMatch[2])] };
            }
            return null;
        };

        const calcDirectDistanceMeters = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        };

        const fetchOsrmDrivingRoute = async (fromLat, fromLng, toLat, toLng) => {
            const key = `${fromLat.toFixed(4)},${fromLng.toFixed(4)};${toLat.toFixed(4)},${toLng.toFixed(4)}`;
            if (globalRouteCache[key]) return globalRouteCache[key];
            try {
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.routes && data.routes.length > 0) {
                        const r = data.routes[0];
                        const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
                        const result = { coords, distM: r.distance || 0, durS: r.duration || 0 };
                        globalRouteCache[key] = result;
                        return result;
                    }
                }
            } catch (e) {
                console.warn("OSRM fetch warning:", e);
            }
            return { coords: [[fromLat, fromLng], [toLat, toLng]], distM: calcDirectDistanceMeters(fromLat, fromLng, toLat, toLng), durS: 0 };

            useEffect(() => {

                async function fetchLatestRadarTile() {

                            // Dynamic Satellite Clouds Loader (NASA GIBS VIIRS TrueColor / Clouds with auto-date resolution)
                            const satDate = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                            const nasaUrl = `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${satDate}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`;

                            if (isMounted && mapInst.current && layersRef.current) {
                                const cloudOp = calculateWeatherOpacity(mapInst.current.getZoom()).clouds;

                const intervalId = setInterval(fetchLatestRadarTile, 180000); // Auto-refresh radar tiles every 3 mins

                async function fetchWorldwideWindGrid() {
                    if (!mapInst.current) return;
                    const bounds = mapInst.current.getBounds();
                    const s = Math.max(-85, bounds.getSouth());
                    const n = Math.min(85, bounds.getNorth());
                    let w = bounds.getWest();
                    let e = bounds.getEast();

                    // Create dynamic 8x8 geographic sampling grid (64 live API stations) over currently visible world viewport
                    const lats = [];
                    const lngs = [];
                    const steps = 7;

                    const latStep = (n - s) / steps;
                    const lngStep = (e - w) / steps;

                    for (let i = 0; i <= steps; i++) {
                        for (let j = 0; j <= steps; j++) {
                            let latVal = s + i * latStep;
                            let lngVal = w + j * lngStep;
                            latVal = Math.round(Math.max(-89, Math.min(89, latVal)) * 100) / 100;
                            lngVal = Math.round((((lngVal + 180) % 360) - 180) * 100) / 100;
                            lats.push(latVal);
                            lngs.push(lngVal);
                        }
                    }

                    const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lats.join(',')}&longitude=${lngs.join(',')}&current=wind_speed_10m,wind_direction_10m`;

                        const res = await fetch(apiUrl);
                        if (res.ok) {
                            const data = await res.json();
                            const results = Array.isArray(data) ? data : [data];

                                const dirDeg = item.current ? item.current.wind_direction_10m : 230;
                                const rad = (dirDeg * Math.PI) / 180;
                                const speedMs = speedKmh / 3.6;

                                // Scale velocity step delta dynamically between 0.0018 (calm) and 0.0035 (storm)
                                const normSpeed = Math.min(Math.max((speedKmh - 5) / 55, 0), 1);
                                const velocityScale = 0.0018 + normSpeed * 0.0017;

                                const u = -speedMs * Math.sin(rad) * velocityScale * 45;
                                const v = -speedMs * Math.cos(rad) * velocityScale * 45;
                                return { lat: lats[idx], lng: lngs[idx], u, v, speedKmh };
                            });
                            isWindApiLoaded = true;
                        }
                    } catch (err) {
                        console.warn("Worldwide wind grid fetch error:", err);
                    }
                }

                function debouncedFetchWind() {
                    if (fetchDebounceTimer) clearTimeout(fetchDebounceTimer);
                    fetchDebounceTimer = setTimeout(fetchWorldwideWindGrid, 350);
                }

                fetchWorldwideWindGrid();
                map.on('moveend', debouncedFetchWind);

                // Live API Wind Vector Field Interpolation (IDW)
                function getWindVector(px, py) {
                    const latLng = map.containerPointToLatLng([px, py]);
                    const lat = latLng.lat;
                    const lng = latLng.lng;

                    if (isWindApiLoaded && liveWindGrid.length > 0) {
                        let totalWeight = 0;
                        let sumU = 0;
                        let sumV = 0;

                        liveWindGrid.forEach(pt => {
                            const dLat = lat - pt.lat;
                            const dLng = lng - pt.lng;
                            const distSq = dLat * dLat + dLng * dLng + 0.01;
                            const weight = 1.0 / distSq;
                            sumU += pt.u * weight;
                            sumV += pt.v * weight;
                            totalWeight += weight;
                        });

                        if (totalWeight > 0) {
                            return { u: sumU / totalWeight, v: sumV / totalWeight };
                        }
                    }

                    // Fallback calm stream
                    return { u: 0.08, v: 0.04 };
                }

                let lastFrameTime = performance.now();
                const targetFps = 38;
                const frameInterval = 1000 / targetFps;

                    if (!windParticleCanvasRef.current) return;
                    windAnimFrameRef.current = requestAnimationFrame(drawFrame);

                    const delta = currentTime - lastFrameTime;

                        const nextX = p.x + vec.u;
                        const nextY = p.y - vec.v; // Canvas Y goes down

                        const stepMagnitude = Math.sqrt(vec.u * vec.u + vec.v * vec.v);
                        let color = 'rgba(52, 211, 153, 0.75)'; // Emerald calm
                        if (stepMagnitude > 0.15) color = 'rgba(251, 146, 60, 0.9)'; // Orange gust
                        else if (stepMagnitude > 0.09) color = 'rgba(56, 189, 248, 0.85)'; // Sky blue breeze

                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(nextX, nextY);
                        ctx.strokeStyle = color;
                        ctx.stroke();

                        p.x = nextX;
                        p.y = nextY;
                        p.age++;
                    });
                }

                        const isTrafficFeed = (rc.provider || '').toLowerCase().includes('traffic') || (rc.provider || '').toLowerCase().includes('openstreetmap');
                        if (isTrafficFeed) {
                            freshnessBadge = `<span class="px-1.5 py-0.5 rounded text-[8px] font-black bg-amber-500/20 text-amber-300 border border-amber-500/40 uppercase tracking-wide flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>Live Road Traffic Feed</span>`;
                        } else if (rc.reportedAt) {
                            try {
                                const diffMs = Date.now() - new Date(rc.reportedAt).getTime();
                                const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                                if (diffHours < 2) {
                                    freshnessBadge = `<span class="px-1.5 py-0.5 rounded text-[8px] font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 uppercase tracking-wide flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>Live Media (${diffHours <= 0 ? 'Just Now' : '1h ago'})</span>`;
                                } else if (diffHours < 24) {
                                    freshnessBadge = `<span class="px-1.5 py-0.5 rounded text-[8px] font-black bg-blue-500/20 text-blue-300 border border-blue-500/30 uppercase tracking-wide">Today (${diffHours}h ago)</span>`;
                                } else {
                                    const diffDays = Math.floor(diffHours / 24);
                                    freshnessBadge = `<span class="px-1.5 py-0.5 rounded text-[8px] font-black bg-slate-500/20 text-slate-300 border border-slate-500/30 uppercase tracking-wide">${diffDays}d ago</span>`;
                                }
                            } catch (e) {}
                        }

                        const popupHtml = `
                            <div class="p-3 font-sans min-w-[250px] text-left">
                                <div class="flex items-center justify-between gap-2 mb-1.5">
                                    <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded ${isClosed ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}">
                                        ${(rc.category || 'Road Closure').toUpperCase()} • ${(rc.severity || 'Closed').toUpperCase()}
                                    </span>
                                    ${freshnessBadge || `<span class="text-[9px] font-bold text-slate-400">${rc.provider || 'Fleet Advisory'}</span>`}
                                </div>
                                <div class="text-xs font-black text-white leading-tight mb-1">
                                    ${rc.roadName}
                                </div>
                                ${rc.sourceHeadline ? `
                                    <div class="text-[11px] text-slate-300 font-medium italic border-l-2 border-orange-500/70 pl-2 my-1.5">
                                        "${rc.sourceHeadline}"
                                    </div>
                                ` : ''}
                                <div class="text-[10px] text-emerald-400 font-semibold mt-1">
                                    <span class="text-white/60">Alternate Route:</span> ${rc.rerouteAdvice || 'Use alternative arterial roads or expressway bypass.'}
                                </div>
                                ${rc.sourceUrl ? `
                                    <div class="mt-2 pt-1.5 border-t border-white/10 flex justify-between items-center text-[10px]">
                                        <a href="${rc.sourceUrl}" target="_blank" rel="noreferrer" class="text-orange-400 hover:text-orange-300 font-bold underline flex items-center gap-1">
                                            <span>${isTrafficFeed ? 'View Traffic Corridor' : 'Read Verified Report'}</span>
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                        </a>
                                        <span class="text-[9px] text-slate-400 font-mono">${rc.provider || 'Media'}</span>
                                    </div>
                                ` : ''}
                            </div>
                        `;

                        marker.bindPopup(popupHtml);
                        marker._closureId = rc.closureId;
                        marker._latLng = [rc.latitude, rc.longitude];
                        roadClosureMarkersRef.current.push(marker);
                    });
                }

                // Global map pan-to road closure helper
                window.panToRoadClosure = (lat, lng, closureId) => {
                    if (!mapInst.current) return;
                    mapInst.current.flyTo([lat, lng], 16, { duration: 1.2 });
                    if (!roadClosuresOn) setRoadClosuresOn(true);
                    setTimeout(() => {
                        const targetMarker = roadClosureMarkersRef.current.find(mk => 
                            (closureId && mk._closureId === closureId) || 
                            (mk._latLng && Math.abs(mk._latLng[0] - lat) < 0.0001 && Math.abs(mk._latLng[1] - lng) < 0.0001)
                        );
                        if (targetMarker) {
                            targetMarker.openPopup();
                        }
                    }, 1300);
                };
            }, [roadClosuresOn, roadClosuresData]);

            // Handle Markers Update (Only show vehicles that left the garage on active trips!)
            useEffect(() => {
                if (!mapInst.current) return;
                const m = mapInst.current;

                const availVehicles = vehicles.filter(v => (v.status || '').toLowerCase() === 'available');
                const activeVehicles = vehicles.filter(v => (v.status || '').toLowerCase() !== 'available');

                // Update Garage Marker Popup & Badge with available count inside garage
                if (garageMarkerRef.current) {
                    garageMarkerRef.current.bindPopup(`
                <div class="p-3.5 bg-[var(--bg-secondary)] backdrop-blur-xl text-[var(--text-primary)] rounded-2xl font-sans border border-orange-500/40 shadow-2xl min-w-[210px]">
                    <div class="text-xs font-extrabold text-orange-500 uppercase tracking-wider flex items-center gap-1.5 mb-1">
                        <svg class="w-3.5 h-3.5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0V5"/></svg>
                        Drive&Go Garage Hub
                    </div>
                    <div class="text-base font-black text-[var(--text-primary)]">Central Rental Station</div>
                    <div class="mt-2.5 p-2 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-between text-xs font-bold text-emerald-500 dark:text-emerald-400">
                        <span>Vehicles Inside Garage:</span>
                        <span class="text-sm font-extrabold text-emerald-600 dark:text-emerald-300">${availVehicles.length} units</span>
                    </div>
                    <div class="text-[10px] text-[var(--text-muted)] mt-2 text-center font-medium flex items-center justify-center gap-1">
                        <svg class="w-3 h-3 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        Coords: 14.871116, 121.048088
                    </div>
                </div>
            `);
                }

                const activeIds = new Set(activeVehicles.map(v => String(v.id)));

                // Remove markers for vehicles parked inside garage or removed
                Object.keys(markersRef.current).forEach(id => {
                    if (!activeIds.has(String(id))) {
                        if (animFramesRef.current[id]) {
                            cancelAnimationFrame(animFramesRef.current[id]);
                            delete animFramesRef.current[id];
                        }
                        m.removeLayer(markersRef.current[id]);
                        delete markersRef.current[id];
                    }
                });

                // Add/Update markers only for active vehicles out on the road
                activeVehicles.forEach(v => {
                    const hex = statusColorMap[v.status.toLowerCase()]?.hex || '#60a5fa';
                    const isSelected = v.id === selectedVehicleId;
                    
                    // Strictly use 3D Map Marker Icon only (NEVER use media/card photo)
                    const rawIcon = (v.map3DIconUrl || v.mapIconUrl || v.map_icon_url || v.model_3d_url || v.model3dUrl || '').trim();
                    const isCardPhoto = Boolean(rawIcon && (rawIcon.includes('/uploads/vehicles/') || rawIcon === (v.image || '').trim()));
                    const hasCustomIcon = Boolean(
                        rawIcon && 
                        !isCardPhoto &&
                        rawIcon !== 'null' && 
                        rawIcon !== 'undefined' && 
                        rawIcon.length > 10 && 
                        (rawIcon.startsWith('data:image/') || rawIcon.startsWith('http://') || rawIcon.startsWith('https://') || rawIcon.startsWith('/uploads/3d/'))
                    );
                    const iconImage = hasCustomIcon ? rawIcon : '';
                    const headingDeg = v.heading || v.bearing || v.direction || 0;

                    const iconHtml = `
                <div class='relative flex flex-col items-center cursor-pointer group bg-transparent' style='perspective: 600px;'>
                    ${isSelected ? `<div class='absolute -inset-3 rounded-full border-2 animate-ping opacity-60 z-0' style='border-color: ${hex}'></div>` : ''}
                    
                    <!-- Forward Headlight Beam Cone (Google Maps Style Front Navigation Light) -->
                    <div class='absolute -top-6 left-1/2 -translate-x-1/2 pointer-events-none z-0' style='transform: rotate(${headingDeg}deg); transform-origin: center 36px; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);'>
                        <div style='width: 28px; height: 36px; background: radial-gradient(ellipse at bottom, rgba(56, 189, 248, 0.45) 0%, rgba(56, 189, 248, 0.12) 55%, transparent 85%); clip-path: polygon(25% 100%, 75% 100%, 100% 0%, 0% 0%);'></div>
                    </div>

                    <!-- Isometric 3D Floor Shadow -->
                    <div class='absolute bottom-3 w-10 h-4 rounded-[100%] bg-black/40 blur-[3px] transform rotateX(65deg) scale-110 z-0 shadow-2xl border border-black/20 pointer-events-none'></div>
                    
                    <!-- Isometric 3D Vehicle Icon Wrapper with Smooth Rotation -->
                    <div class='relative z-10 bg-transparent transform ${isSelected ? 'scale-125 -translate-y-1.5' : 'group-hover:scale-110 group-hover:-translate-y-1'}' style='transition: transform 0.3s ease;'>
                        ${hasCustomIcon ? `
                            <div class='bg-transparent flex items-center justify-center' style='transform-style: preserve-3d; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.6));'>
                                <img src='${iconImage}' class='w-9 h-14 object-contain bg-transparent filter drop-shadow-[0_6px_10px_rgba(0,0,0,0.7)]' style='transform: rotate(${headingDeg}deg); transform-origin: center center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);' onerror="this.onerror=null; this.parentElement.innerHTML=\`${renderDefaultTopDownVehicleSvg(v, hex).replace(/\n/g, '').replace(/"/g, "'")}\`;"/>
                            </div>
                        ` : `
                            <div class='bg-transparent flex items-center justify-center' style='transform-style: preserve-3d; transform: rotate(${headingDeg}deg); transform-origin: center center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);'>
                                ${renderDefaultTopDownVehicleSvg(v, hex)}
                            </div>
                        `}
                    </div>
                    
                    <!-- Plate Label -->
                    <div class='mt-0.5 bg-[#0d0e17]/90 backdrop-blur-md border border-white/20 text-white px-2 py-0.5 rounded-full text-[8.5px] font-extrabold shadow-lg whitespace-nowrap z-10 tracking-wider flex items-center gap-1 border-b-2' style='border-bottom-color: ${hex}'>
                        <span class='w-1.5 h-1.5 rounded-full' style='background-color: ${hex}'></span>
                        ${v.plateNumber || ''}
                    </div>
                </div>
            `;

                    const icon = L.divIcon({ className: '', html: iconHtml, iconSize: [44, 58], iconAnchor: [22, 29] });

                    if (markersRef.current[v.id]) {
                        const existingMarker = markersRef.current[v.id];
                        existingMarker.setIcon(icon);

                        // Smooth programmatic GPS coordinate interpolation over 1.5s
                        const curLatLng = existingMarker.getLatLng();
                        const targetLat = v.coordinates[0];
                        const targetLng = v.coordinates[1];
                        const dLat = Math.abs(curLatLng.lat - targetLat);
                        const dLng = Math.abs(curLatLng.lng - targetLng);

                        if (dLat > 0.000005 || dLng > 0.000005) {
                            if (animFramesRef.current[v.id]) {
                                cancelAnimationFrame(animFramesRef.current[v.id]);
                            }
                            const startLat = curLatLng.lat;
                            const startLng = curLatLng.lng;
                            const startTime = performance.now();
                            const duration = 1500;

                            const step = (now) => {
                                const elapsed = now - startTime;
                                const progress = Math.min(1, elapsed / duration);
                                const curL = startLat + (targetLat - startLat) * progress;
                                const curG = startLng + (targetLng - startLng) * progress;
                                existingMarker.setLatLng([curL, curG]);

                                if (progress < 1) {
                                    animFramesRef.current[v.id] = requestAnimationFrame(step);
                                } else {
                                    delete animFramesRef.current[v.id];
                                }
                            };
                            animFramesRef.current[v.id] = requestAnimationFrame(step);
                        }
                    } else {
                        const marker = L.marker(v.coordinates, { icon }).addTo(m);
                        marker.on('click', () => onSelectVehicle(v));
                        markersRef.current[v.id] = marker;
                    }
                });

                return () => {
                    Object.keys(animFramesRef.current).forEach(id => {
                        cancelAnimationFrame(animFramesRef.current[id]);
                    });
                    animFramesRef.current = {};
                };
            }, [vehicles, selectedVehicleId]);

            // Focus selected vehicle
            useEffect(() => {
                if (selectedVehicleId && mapInst.current && markersRef.current[selectedVehicleId]) {
                    const latLng = markersRef.current[selectedVehicleId].getLatLng();
                    mapInst.current.flyTo(latLng, 16, { duration: 1 });
                }
            }, [selectedVehicleId]);

            // Live Road-Snapped Trajectories & Distances (OSRM Driving Engine)
            useEffect(() => {
                if (!mapInst.current || !routesGroupRef.current) return;
                const rg = routesGroupRef.current;
                rg.clearLayers();

                if (!showRoutes) return;

                const HQ_LAT = 14.871116;
                const HQ_LNG = 121.048088;
                let isMounted = true;

                async function renderAllRoadRoutes() {
                    const activeVehicles = vehicles.filter(v => {
                        const vLat = v.coordinates ? v.coordinates[0] : 0;
                        const vLng = v.coordinates ? v.coordinates[1] : 0;
                        if (!vLat || !vLng) return false;
                        const isFocused = selectedVehicleId ? (String(v.id) === String(selectedVehicleId) || String(v.vehicle_id) === String(selectedVehicleId)) : true;
                        return isFocused;
                    });

                    await Promise.all(activeVehicles.map(async (v) => {
                        if (!isMounted || !showRoutes) return;
                        const vLat = v.coordinates[0];
                        const vLng = v.coordinates[1];

                        const distFromHqM = calcDirectDistanceMeters(HQ_LAT, HQ_LNG, vLat, vLng);

                        // 1. Current Location -> Destination (Navigation Blue Line - UNDERNEATH pane z-index 420)
                        const destInfo = resolveDestinationInfo(v.destination);
                        if (destInfo && destInfo.coords && distFromHqM > 250) {
                            const routeDest = await fetchOsrmDrivingRoute(vLat, vLng, destInfo.coords[0], destInfo.coords[1]);
                            if (!isMounted || !showRoutes) return;
                            if (routeDest && routeDest.coords && routeDest.coords.length > 1) {
                                const destDistText = routeDest.distM >= 1000 
                                    ? `${(routeDest.distM / 1000).toFixed(1)} km` 
                                    : `${Math.round(routeDest.distM)} m`;

                                // High Contrast Outer Glow (Underneath)
                                const destGlow = L.polyline(routeDest.coords, {
                                    pane: 'destRoutesPane',
                                    color: '#0284C7',
                                    weight: 8,
                                    opacity: 0.25,
                                    lineCap: 'round',
                                    lineJoin: 'round',
                                    className: 'cursor-pointer'
                                });
                                destGlow.on('click', (e) => { if (e && e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent); onSelectVehicle(v); });
                                rg.addLayer(destGlow);

                                // Inner Road Track (Vibrant Navigation Blue - Underneath)
                                const destTrack = L.polyline(routeDest.coords, {
                                    pane: 'destRoutesPane',
                                    color: '#0284C7',
                                    weight: 3.5,
                                    opacity: 0.85,
                                    dashArray: '6, 5',
                                    lineCap: 'round',
                                    lineJoin: 'round',
                                    className: 'cursor-pointer'
                                });
                                destTrack.on('click', (e) => { if (e && e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent); onSelectVehicle(v); });
                                rg.addLayer(destTrack);

                                // Midpoint Distance Pill
                                const destMidCoord = routeDest.coords[Math.floor(routeDest.coords.length / 2)];
                                if (destMidCoord) {
                                    const destLabelMarker = L.marker(destMidCoord, {
                                        pane: 'routeLabelsPane',
                                        icon: L.divIcon({
                                            className: '',
                                            html: `<div class='bg-[#0F172A]/95 dark:bg-[#07070E]/95 text-sky-400 border border-sky-500/80 px-2.5 py-0.5 rounded-full text-[9px] font-black shadow-2xl tracking-wider backdrop-blur-md whitespace-nowrap flex items-center gap-1.5 cursor-pointer hover:scale-105 transition-transform'><svg class='w-2.5 h-2.5 text-sky-400' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg><span>${destDistText} to ${destInfo.name}</span></div>`,
                                            iconSize: [140, 22],
                                            iconAnchor: [70, 11]
                                        }),
                                        interactive: true
                                    });
                                    destLabelMarker.on('click', (e) => { if (e && e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent); onSelectVehicle(v); });
                                    rg.addLayer(destLabelMarker);
                                }

                                // Destination Pin Marker (Google Maps Style Blue Pin)
                                const destPinMarker = L.marker(destInfo.coords, {
                                    pane: 'routeLabelsPane',
                                    icon: L.divIcon({
                                        className: '',
                                        html: `<div class='flex flex-col items-center cursor-pointer group hover:scale-110 transition-transform'><div class='bg-blue-600 text-white font-black text-[9px] px-2.5 py-1 rounded-xl shadow-2xl border border-white/60 uppercase whitespace-nowrap flex items-center gap-1'><svg class='w-2.5 h-2.5 text-white' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3'><path d='M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z'/><circle cx='12' cy='10' r='3'/></svg><span>${destInfo.name}</span></div><div class='w-2.5 h-2.5 rounded-full bg-sky-400 border-2 border-slate-900 shadow-md mt-1'></div></div>`,
                                        iconSize: [100, 30],
                                        iconAnchor: [50, 28]
                                    }),
                                    interactive: true
                                });
                                destPinMarker.on('click', (e) => { if (e && e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent); onSelectVehicle(v); });
                                rg.addLayer(destPinMarker);
                            }
                        }

                        // 2. Garage Hub -> Current Location (Vibrant Orange Line - ON TOP pane z-index 440)
                        if (distFromHqM > 250) {
                            const routeHq = await fetchOsrmDrivingRoute(HQ_LAT, HQ_LNG, vLat, vLng);
                            if (!isMounted || !showRoutes) return;
                            if (routeHq && routeHq.coords && routeHq.coords.length > 1) {
                                const distText = routeHq.distM >= 1000 
                                    ? `${(routeHq.distM / 1000).toFixed(1)} km` 
                                    : `${Math.round(routeHq.distM)} m`;

                                // High Contrast Outer Glow (On Top)
                                const glow = L.polyline(routeHq.coords, {
                                    pane: 'garageRoutesPane',
                                    color: '#FF6B00',
                                    weight: 10,
                                    opacity: 0.4,
                                    lineCap: 'round',
                                    lineJoin: 'round',
                                    className: 'cursor-pointer'
                                });
                                glow.on('click', (e) => { if (e && e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent); onSelectVehicle(v); });
                                rg.addLayer(glow);

                                // Inner Bold Road Track (Solid High-Visibility Neon Orange - On Top)
                                const track = L.polyline(routeHq.coords, {
                                    pane: 'garageRoutesPane',
                                    color: '#FF6B00',
                                    weight: 4.5,
                                    opacity: 1,
                                    dashArray: '8, 6',
                                    lineCap: 'round',
                                    lineJoin: 'round',
                                    className: 'cursor-pointer'
                                });
                                track.on('click', (e) => { if (e && e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent); onSelectVehicle(v); });
                                rg.addLayer(track);

                                // Midpoint Distance Pill Marker
                                const midCoord = routeHq.coords[Math.floor(routeHq.coords.length / 2)];
                                if (midCoord) {
                                    const labelMarker = L.marker(midCoord, {
                                        pane: 'routeLabelsPane',
                                        icon: L.divIcon({
                                            className: '',
                                            html: `<div class='bg-[#0F172A]/95 dark:bg-[#07070E]/95 text-[#FF6B00] border border-[#FF6B00]/80 px-2.5 py-0.5 rounded-full text-[9px] font-black shadow-2xl tracking-wider backdrop-blur-md whitespace-nowrap flex items-center gap-1.5 cursor-pointer hover:scale-105 transition-transform'><svg class='w-2.5 h-2.5 text-[#FF6B00]' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5'><path d='M3 12h18M13 5l7 7-7 7'/></svg><span>${distText} from Garage Hub</span></div>`,
                                            iconSize: [140, 22],
                                            iconAnchor: [70, 11]
                                        }),
                                        interactive: true
                                    });
                                    labelMarker.on('click', (e) => { if (e && e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent); onSelectVehicle(v); });
                                    rg.addLayer(labelMarker);
                                }
                            }
                        }
                    }));
                }

                renderAllRoadRoutes();

                return () => {
                    isMounted = false;
                };
            }, [vehicles, selectedVehicleId, showRoutes]);

            const temp = weatherData ? Math.round(weatherData.temperature_2m || 28) : 28;
            const rain = weatherData ? (weatherData.precipitation || 4.2) : 4.2;

            return (
                <div className="relative w-full h-full rounded-2xl overflow-hidden border border-[var(--border-color)] shadow-[var(--shadow-card)]">
                    {/* TOP MAP CONTROLS BAR (SINGLE UNIFIED SLEEK FLOATING CARD) */}
                    <div className={`absolute ${hasWeatherBanner ? 'top-[60px]' : 'top-3'} left-3 z-[600] pointer-events-none transition-all duration-300 max-w-[calc(100%-24px)]`}>
                        <div className="pointer-events-auto inline-flex items-center gap-1 p-1 px-1.5 rounded-2xl bg-slate-950/90 backdrop-blur-2xl border border-white/15 shadow-[0_12px_40px_rgba(0,0,0,0.65)] ring-1 ring-white/10 overflow-x-auto no-scrollbar">
                            {/* 1. Map View Mode Dropdown */}
                            <div className="relative shrink-0" ref={mapTypeDropdownRef}>
                                <button
                                    type="button"
                                    onClick={(e) => { e.stopPropagation(); setMapTypeDropdownOpen(prev => !prev); setWeatherDropdownOpen(false); }}
                                    className="h-8 px-2.5 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/15 text-white border border-white/15 hover:border-orange-500/50 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm active:scale-95 whitespace-nowrap shrink-0"
                                >
                                    <IconLayers sz={13} className="text-orange-400 shrink-0" />
                                    <span>{mapTypeOptions.find(o => o.id === mapType)?.name || 'Street View'}</span>
                                    <IconChevronDown sz={11} className={`text-white/60 transition-transform duration-200 ${mapTypeDropdownOpen ? 'rotate-180 text-orange-400' : ''}`} />
                                </button>

                                {mapTypeDropdownOpen && (
                                    <div className="absolute left-0 top-full mt-2 w-48 rounded-2xl bg-slate-900/95 backdrop-blur-2xl border border-white/15 shadow-[0_20px_60px_rgba(0,0,0,0.85)] p-1.5 z-[9999] flex flex-col gap-1 animate-scale-up ring-1 ring-white/10">
                                        <div className="px-2.5 py-1 text-[9px] font-black uppercase tracking-wider text-slate-400 border-b border-white/10 mb-0.5">
                                            Map View Styles
                                        </div>
                                        {mapTypeOptions.map(opt => {

        const PRESET_COLORS = [

            { name: 'Crimson Red', hex: '#DC2626', border: '#EF4444' },

        const formatHumanDepth = (depthRaw) => {
            if (!depthRaw) return 'Passable / Dry (0 - 5 cm)';
            const str = String(depthRaw).toLowerCase().trim();
            if (str.includes('passable') || str.includes('dry') || str === '0') return 'Passable / Dry (0 - 5 cm)';
            if (str.includes('25') || str.includes('tire') || str === 'tire_deep') return 'Tire-Deep Level (25 - 35 cm)';
            if (str.includes('60') || str.includes('waist') || str === 'waist_deep') return 'Waist-Deep Hazard (60 - 80 cm)';
            if (str.includes('chest') || str === 'chest_deep') return 'Chest-Deep Danger (90 - 120 cm)';
            if (str.includes('ankle') || str === 'ankle_deep') return 'Ankle-Deep Level (10 - 15 cm)';
            return str.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        };

        const formatHumanRisk = (riskRaw) => {
            if (!riskRaw) return { label: 'PASSABLE (NORMAL)', bg: 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30' };
            const str = String(riskRaw).toLowerCase().trim();
            if (str.includes('passable') || str.includes('normal') || str === 'safe' || str === 'low') {
                return { label: 'PASSABLE (NORMAL)', bg: 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30' };
            }
            if (str.includes('impassable')) return { label: 'IMPASSABLE (BAWAL DUMAAN)', bg: 'bg-red-500/15 text-red-700 dark:text-red-300 border border-red-500/30 animate-pulse' };
            if (str.includes('severe')) return { label: 'SEVERE HAZARD', bg: 'bg-orange-500/15 text-orange-700 dark:text-orange-300 border border-orange-500/30' };
            if (str.includes('moderate')) return { label: 'MODERATE RISK', bg: 'bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-500/30' };
            return { label: str.toUpperCase(), bg: 'bg-blue-500/15 text-blue-700 dark:text-blue-300 border border-blue-500/30' };
        };

        // Professional Weather Condition & Road Safety Advisory Interpretation
        const getWmoWeatherInfo = (code) => {
            switch (Number(code)) {
                case 0: return { label: 'Clear Sky', sub: 'Sunny & Fair Weather', codeStr: 'Optimal Driving Conditions', color: 'text-emerald-500', badge: 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 border-emerald-500/30' };

                case 2: return { label: 'Partly Cloudy', sub: 'Scattered Clouds', codeStr: 'Normal Conditions', color: 'text-blue-500', badge: 'bg-blue-500/15 text-blue-600 dark:text-blue-300 border-blue-500/30' };
                case 3: return { label: 'Overcast', sub: 'Overcast Skies', codeStr: 'Cloudy Conditions', color: 'text-slate-400', badge: 'bg-slate-500/15 text-slate-400 border-slate-500/30' };
                case 45:
                case 48: return { label: 'Fog & Mist', sub: 'Dense Fog / Reduced Visibility', codeStr: 'Caution: Low Visibility', color: 'text-amber-500', badge: 'bg-amber-500/15 text-amber-600 dark:text-amber-300 border-amber-500/30' };
                case 51: return { label: 'Light Drizzle', sub: 'Occasional Light Drizzle', codeStr: 'Caution: Wet Roads', color: 'text-blue-400', badge: 'bg-blue-500/15 text-blue-600 dark:text-blue-300 border-blue-500/30' };
                case 53: return { label: 'Moderate Drizzle', sub: 'Steady Light Drizzle', codeStr: 'Caution: Wet Roads', color: 'text-blue-400', badge: 'bg-blue-500/15 text-blue-600 dark:text-blue-300 border-blue-500/30' };
                case 55: return { label: 'Dense Drizzle', sub: 'Dense Continuous Drizzle', codeStr: 'Caution: Slippery Roads', color: 'text-amber-500', badge: 'bg-amber-500/15 text-amber-600 dark:text-amber-300 border-amber-500/30' };
                case 61: return { label: 'Light Rain', sub: 'Passing Rain Showers', codeStr: 'Caution: Wet Roads', color: 'text-blue-400', badge: 'bg-blue-500/15 text-blue-600 dark:text-blue-300 border-blue-500/30' };
                case 63: return { label: 'Moderate Rain', sub: 'Moderate Rainfall', codeStr: 'Caution: Wet Roads', color: 'text-amber-500', badge: 'bg-amber-500/15 text-amber-600 dark:text-amber-300 border-amber-500/30' };
                case 65: return { label: 'Heavy Rain', sub: 'Heavy Rainfall & Downpour', codeStr: 'Hazard: Water Accumulation', color: 'text-orange-500', badge: 'bg-orange-500/15 text-orange-600 dark:text-orange-300 border-orange-500/30' };
                case 80: return { label: 'Slight Showers', sub: 'Scattered Rain Showers', codeStr: 'Caution: Wet Roads', color: 'text-blue-400', badge: 'bg-blue-500/15 text-blue-600 dark:text-blue-300 border-blue-500/30' };
                case 81: return { label: 'Moderate Showers', sub: 'Moderate Rain Showers', codeStr: 'Caution: Wet Roads', color: 'text-amber-500', badge: 'bg-amber-500/15 text-amber-600 dark:text-amber-300 border-amber-500/30' };
                case 82: return { label: 'Violent Showers', sub: 'Severe Sudden Downpours', codeStr: 'Hazard: High Flood Risk', color: 'text-red-500', badge: 'bg-red-500/15 text-red-600 dark:text-red-300 border-red-500/30' };
                case 95: return { label: 'Thunderstorm', sub: 'Thunder & Lightning Storm', codeStr: 'Warning: Severe Weather', color: 'text-red-500', badge: 'bg-red-500/15 text-red-600 dark:text-red-300 border-red-500/30' };

        };

        // Real-Time Spatial Point-in-Polygon (Ray-Casting Algorithm)
        const isPointInsidePolygon = (lat, lng, polyCoords) => {
            if (!lat || !lng || !Array.isArray(polyCoords) || polyCoords.length < 3) return false;
            let inside = false;
            for (let i = 0, j = polyCoords.length - 1; i < polyCoords.length; j = i++) {
                const xi = polyCoords[i][0], yi = polyCoords[i][1];
                const xj = polyCoords[j][0], yj = polyCoords[j][1];
                const intersect = ((yi > lng) !== (yj > lng))
                    && (lat < (xj - xi) * (lng - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        };

        // ─── LIVE WEATHER INTELLIGENCE & FLOOD DRAWER MODAL ───────────────────────────
