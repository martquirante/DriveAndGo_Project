        // ─── ADD / EDIT VEHICLE GLASS UI MODAL ──────────────────────────────────────
        const AddVehicleModal = ({ onClose, onSave, vehicleToEdit, vehicles = [] }) => {
            let rawTargetId = vehicleToEdit?.vehicle_id || vehicleToEdit?.vehicleId || vehicleToEdit?.VehicleId || vehicleToEdit?.id || vehicleToEdit?.Id || vehicleToEdit?.ID;
            if ((rawTargetId === undefined || rawTargetId === null || rawTargetId === '' || isNaN(parseInt(rawTargetId)) || parseInt(rawTargetId) <= 0) && typeof vehicleToEdit === 'object' && vehicleToEdit !== null) {
                for (const key of Object.keys(vehicleToEdit)) {
                    if (key.toLowerCase().includes('id') && !key.toLowerCase().includes('url')) {
                        const val = parseInt(vehicleToEdit[key]);
                        if (!isNaN(val) && val > 0) {
                            rawTargetId = val;
                            break;
                        }
                    }
                }
            }
            let parsedInit = (rawTargetId !== undefined && rawTargetId !== null && !isNaN(parseInt(rawTargetId))) ? parseInt(rawTargetId) : null;
            let initialId = (parsedInit && parsedInit > 0) ? parsedInit : null;

            if (!initialId && vehicleToEdit && (vehicleToEdit.plateNumber || vehicleToEdit.plate_no || vehicleToEdit.plateNo) && Array.isArray(window.fleetVehiclesCache)) {
                const pNo = (vehicleToEdit.plateNumber || vehicleToEdit.plate_no || vehicleToEdit.plateNo || '').trim().toLowerCase();
                const found = window.fleetVehiclesCache.find(item => {
                    const itemPlate = (item.plateNumber || item.plate_no || item.plateNo || '').trim().toLowerCase();
                    return itemPlate === pNo && (item.vehicle_id > 0 || item.id > 0);
                });
                if (found) {
                    initialId = found.vehicle_id || found.id;
                }
            }

            const getInitialForm = (v) => {
                let rawPhotoUrls = v?.photo_urls || v?.photoUrls || v?.PhotoUrls || [];
                if (typeof rawPhotoUrls === 'string') {
                    try { rawPhotoUrls = JSON.parse(rawPhotoUrls); } catch(e) { rawPhotoUrls = []; }
                }
                if (!Array.isArray(rawPhotoUrls)) rawPhotoUrls = [];
                const primaryImg = v?.image || v?.photo_url || v?.photoUrl || v?.PhotoUrl || (rawPhotoUrls[0] || '');
                let initialImages = [...rawPhotoUrls];
                if (primaryImg && !initialImages.includes(primaryImg)) {
                    initialImages = [primaryImg, ...initialImages];
                }

                return {
                    vehicleId: v?.id || v?.vehicle_id || v?.vehicleId || v?.VehicleId || initialId,
                    brand: v?.brand || v?.Brand || '',
                    model: v?.model || v?.Model || '',
                    plateNumber: v?.plateNumber || v?.plate_no || v?.plateNo || v?.PlateNumber || '',
                    type: v?.type || v?.Type || 'Car',
                    engineCc: v?.engineCc || v?.cc || v?.EngineCc || 1500,
                    dailyRatePHP: v?.dailyRatePHP || v?.rate_per_day || v?.ratePerDay || v?.RatePerDay || 2500,
                    rateWithDriverPHP: v?.rateWithDriverPHP || v?.rate_with_driver || v?.rateWithDriver || v?.RateWithDriver || 3500,
                    seatCapacity: v?.seatCapacity || v?.seat_capacity || v?.SeatCapacity || 5,
                    transmission: v?.transmission || v?.Transmission || 'Automatic',
                    status: v?.status || v?.Status || 'available',
                    description: v?.description || v?.Description || '',
                    images: initialImages,
                    image: primaryImg || (initialImages[0] || ''),
                    mapIconUrl: v?.mapIconUrl || v?.map_icon_url || v?.map3DIconUrl || v?.map3dIconUrl || v?.model_3d_url || v?.model3dUrl || v?.Model3dUrl || v?.Model3DUrl || '',
                    ltoExpiryDate: formatDateSafe(v?.lto_expiry_date || v?.ltoExpiryDate || v?.documents?.ltoRegistrationExpiry, '2026-10-15'),
                    insuranceExpiryDate: formatDateSafe(v?.insurance_expiry_date || v?.insuranceExpiryDate || v?.documents?.insuranceExpiry, '2026-11-20'),
                    orCrUrl: v?.orCrUrl || v?.or_cr_url || v?.OrCrUrl || v?.documents?.orCrUrl || v?.documents?.or_cr_url || '',
                    insuranceUrl: v?.insuranceUrl || v?.insurance_url || v?.InsuranceUrl || v?.documents?.insuranceUrl || v?.documents?.insurance_url || '',
                    color: v?.color || v?.Color || 'Pearl White'
                };
            };

            const [form, setForm] = useState(() => getInitialForm(vehicleToEdit));

            useEffect(() => {
                if (vehicleToEdit) {
                    setForm(getInitialForm(vehicleToEdit));
                }
            }, [vehicleToEdit]);

            const descRef = useRef(null);
            useEffect(() => {
                if (descRef.current) {
                    descRef.current.style.height = 'auto';
                    const minH = 76;
                    const maxH = 220;
                    const newH = Math.max(minH, Math.min(descRef.current.scrollHeight, maxH));
                    descRef.current.style.height = `${newH}px`;
                    descRef.current.style.overflowY = descRef.current.scrollHeight > maxH ? 'auto' : 'hidden';
                }
            }, [form.description]);

            const [creationMode, setCreationMode] = useState('custom'); // 'custom' | 'preset'
            const [selectedBrandPreset, setSelectedBrandPreset] = useState('');
            const [selectedModelPreset, setSelectedModelPreset] = useState('');

            // Unique list of existing brands in fleet
            const existingBrands = useMemo(() => {
                if (!Array.isArray(window.fleetVehiclesCache)) return [];
                const set = new Set();
                window.fleetVehiclesCache.forEach(v => {
                    if (v.brand) set.add(v.brand.trim());
                });
                return Array.from(set).sort();
            }, []);

            // Unique list of existing models for selected brand
            const modelsForSelectedBrand = useMemo(() => {
                if (!selectedBrandPreset || !Array.isArray(window.fleetVehiclesCache)) return [];
                const map = new Map();
                window.fleetVehiclesCache.forEach(v => {
                    if ((v.brand || '').trim().toLowerCase() === selectedBrandPreset.trim().toLowerCase() && v.model) {
                        const mKey = v.model.trim();
                        if (!map.has(mKey)) {
                            map.set(mKey, v);
                        }
                    }
                });
                return Array.from(map.values());
            }, [selectedBrandPreset]);

            const handleBrandPresetChange = (brandVal) => {
                setSelectedBrandPreset(brandVal);
                setSelectedModelPreset('');
                setForm(f => ({ ...f, brand: brandVal, model: '' }));
            };

            const handleModelPresetChange = (modelVal) => {
                setSelectedModelPreset(modelVal);
                const p = modelsForSelectedBrand.find(v => (v.model || '').trim().toLowerCase() === modelVal.trim().toLowerCase());
                if (p) {
                    setForm(prev => ({
                        ...prev,
                        brand: p.brand || p.Brand || selectedBrandPreset,
                        model: p.model || p.Model || modelVal,
                        type: p.type || p.Type || 'Car',
                        engineCc: p.engineCc || p.cc || p.EngineCc || 1500,
                        dailyRatePHP: p.dailyRatePHP || p.rate_per_day || p.ratePerDay || 2500,
                        rateWithDriverPHP: p.rateWithDriverPHP || p.rate_with_driver || p.rateWithDriver || 3500,
                        seatCapacity: p.seatCapacity || p.seat_capacity || 5,
                        transmission: p.transmission || 'Automatic',
                        image: '',
                        mapIconUrl: p.mapIconUrl || p.map_icon_url || p.model_3d_url || '',
                        description: p.description || ''
                    }));
                }
            };

            const [isSaving, setIsSaving] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');
            const [suggestData, setSuggestData] = useState(null);
            const mediaInputRef = useRef(null);
            const iconInputRef = useRef(null);
            const orCrInputRef = useRef(null);
            const insuranceInputRef = useRef(null);

            const [uploadProgress, setUploadProgress] = useState({
                image: { active: false, percent: 0, error: '' },
                mapIconUrl: { active: false, percent: 0, error: '' },
                orCrUrl: { active: false, percent: 0, error: '' },
                insuranceUrl: { active: false, percent: 0, error: '' }
            });

            const handleOpenSuggest = async () => {
                const typeLower = (form.type || '').toLowerCase();
                const cc = parseInt(form.engineCc) || 1500;
                let baseRate = 2500;
                if (typeLower.includes('suv')) baseRate = cc > 2000 ? 4200 : 3500;
                else if (typeLower.includes('van')) baseRate = 4500;
                else if (typeLower.includes('pickup')) baseRate = 3400;
                else if (typeLower.includes('hatchback')) baseRate = 1800;
                else if (typeLower.includes('motorcycle')) baseRate = 800;
                else baseRate = 2200;

                try {
                    const vIdParam = vehicleToEdit ? `&vehicleId=${vehicleToEdit.id || vehicleToEdit.vehicle_id}` : '';
                    const res = await fetch(`${API}/api/vehicles/suggest-rate?baseRate=${baseRate}${vIdParam}`);
                    if (res.ok) {
                        const data = await res.json();
                        const calcRate = Math.round(data.suggestedRate || baseRate);
                        const calcRateWithDriver = calcRate + 1200;

                        setSuggestData({
                            baseRate: Math.round(data.baseRate || baseRate),
                            demandFactor: Math.round(data.breakdown?.seasonalityMarkup || Math.round(baseRate * 0.12)),
                            inflationFactor: Math.round(data.breakdown?.inflationMarkup || Math.round(baseRate * 0.05)),
                            calculatedRate: calcRate,
                            calculatedRateWithDriver: calcRateWithDriver,
                            reasoning: data.message || `Recommended pricing for ${form.brand || 'Vehicle'} ${form.model || ''} based on AI market demand, seasonality, and inflation index.`
                        });
                        return;
                    }
                } catch (e) {
                    console.warn("AI suggest rate fetch error, using local AI fallback:", e);
                }

                const demandFactor = Math.round(baseRate * 0.12);
                const inflationFactor = Math.round(baseRate * 0.05);
                const calculatedRate = baseRate + demandFactor + inflationFactor;
                const calculatedRateWithDriver = calculatedRate + 1200;

                setSuggestData({
                    baseRate,
                    demandFactor,
                    inflationFactor,
                    calculatedRate,
                    calculatedRateWithDriver,
                    reasoning: `Recommended pricing for ${form.brand || 'Vehicle'} ${form.model || ''} (${form.type || 'Car'}) with ${cc}cc engine based on AI market demand & inflation indices.`
                });
            };

            const applySuggest = () => {
                if (suggestData) {
                    setForm(f => ({
                        ...f,
                        dailyRatePHP: suggestData.calculatedRate,
                        rateWithDriverPHP: suggestData.calculatedRateWithDriver
                    }));
                    setSuggestData(null);
                }
            };

            const processTransparentImage = (fileOrUrl, onComplete) => {
                if (!fileOrUrl) return;
                const img = new Image();
                img.crossOrigin = "Anonymous";

                const onLoad = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        let width = img.width || 400;
                        let height = img.height || 400;
                        const MAX_DIM = 800;
                        if (width > MAX_DIM || height > MAX_DIM) {
                            if (width > height) {
                                height = Math.round((height * MAX_DIM) / width);
                                width = MAX_DIM;
                            } else {
                                width = Math.round((width * MAX_DIM) / height);
                                height = MAX_DIM;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imgData.data;

                        const bgR = data[0], bgG = data[1], bgB = data[2];

                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i], g = data[i + 1], b = data[i + 2];
                            const distBg = Math.sqrt((r - bgR) ** 2 + (g - bgG) ** 2 + (b - bgB) ** 2);
                            const isWhite = r > 235 && g > 235 && b > 235;

                            if (distBg < 45 || isWhite) {
                                data[i + 3] = 0; // Make background transparent
                            }
                        }

                        ctx.putImageData(imgData, 0, 0);
                        onComplete(canvas.toDataURL('image/png'), null);
                    } catch (e) {
                        console.error("Canvas transparent processing failed:", e);
                        if (typeof fileOrUrl === 'string') onComplete(fileOrUrl, null);
                        else onComplete(null, "Could not extract transparent marker background: " + (e?.message || e));
                    }
                };

                img.onerror = () => {
                    onComplete(null, "Failed to load image for transparent processing.");
                };

                if (typeof fileOrUrl === 'string') {
                    img.src = fileOrUrl;
                    if (img.complete) onLoad();
                    else img.onload = onLoad;
                } else if (fileOrUrl instanceof File) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        img.src = e.target.result;
                        img.onload = onLoad;
                    };
                    reader.onerror = () => onComplete(null, "Failed to read file.");
                    reader.readAsDataURL(fileOrUrl);
                }
            };

            const handleMediaUpload = (e) => {
                const files = e.target.files ? Array.from(e.target.files) : [];
                if (files.length === 0) return;

                const validFiles = files.filter(f => f.type.startsWith('image/'));
                if (validFiles.length === 0) {
                    setUploadProgress(p => ({ ...p, image: { active: false, percent: 0, error: 'Invalid file format. Please upload image files (JPG, PNG, WEBP).' } }));
                    return;
                }

                setUploadProgress(p => ({ ...p, image: { active: true, percent: 20, error: '' } }));

                const processSingleFile = (file) => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                try {
                                    const canvas = document.createElement('canvas');
                                    let width = img.width || 800;
                                    let height = img.height || 800;
                                    const MAX_DIM = 1400;
                                    if (width > MAX_DIM || height > MAX_DIM) {
                                        if (width > height) {
                                            height = Math.round((height * MAX_DIM) / width);
                                            width = MAX_DIM;
                                        } else {
                                            width = Math.round((width * MAX_DIM) / height);
                                            height = MAX_DIM;
                                        }
                                    }
                                    canvas.width = width;
                                    canvas.height = height;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0, width, height);
                                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                                    resolve(compressedDataUrl);
                                } catch (err) {
                                    reject(err);
                                }
                            };
                            img.onerror = () => reject(new Error('Corrupted image'));
                            img.src = ev.target.result;
                        };
                        reader.onerror = () => reject(new Error('Failed reading file'));
                        reader.readAsDataURL(file);
                    });
                };

                Promise.all(validFiles.map(processSingleFile))
                    .then(newImages => {
                        setUploadProgress(p => ({ ...p, image: { active: true, percent: 100, error: '' } }));
                        setTimeout(() => {
                            setForm(f => {
                                const currentImages = Array.isArray(f.images) ? [...f.images] : (f.image ? [f.image] : []);
                                const updatedImages = [...currentImages, ...newImages];
                                const currentPrimary = f.image && updatedImages.includes(f.image) ? f.image : (updatedImages[0] || '');
                                return {
                                    ...f,
                                    images: updatedImages,
                                    image: currentPrimary
                                };
                            });
                            setUploadProgress(p => ({ ...p, image: { active: false, percent: 0, error: '' } }));
                            if (mediaInputRef.current) mediaInputRef.current.value = '';
                        }, 350);
                    })
                    .catch(err => {
                        setUploadProgress(p => ({ ...p, image: { active: false, percent: 0, error: 'Upload error: ' + (err?.message || err) } }));
                    });
            };

            const setPrimaryImage = (imgSrc) => {
                setForm(f => {
                    const currentImages = Array.isArray(f.images) ? [...f.images] : (f.image ? [f.image] : []);
                    const filtered = currentImages.filter(x => x !== imgSrc);
                    const updated = [imgSrc, ...filtered];
                    return {
                        ...f,
                        images: updated,
                        image: imgSrc
                    };
                });
            };

            const removeImage = (imgSrc) => {
                setForm(f => {
                    const currentImages = Array.isArray(f.images) ? [...f.images] : (f.image ? [f.image] : []);
                    const updated = currentImages.filter(x => x !== imgSrc);
                    const newPrimary = f.image === imgSrc ? (updated[0] || '') : f.image;
                    return {
                        ...f,
                        images: updated,
                        image: newPrimary
                    };
                });
            };

            const handleIconUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: 'Invalid icon format. Please upload an image.' } }));
                    return;
                }
                if (file.size > 8 * 1024 * 1024) {
                    setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: 'Icon file is too large (max 8MB).' } }));
                    return;
                }

                setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 25, error: '' } }));
                setTimeout(() => setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 70, error: '' } })), 180);

                processTransparentImage(file, (transparentDataUrl, err) => {
                    if (err || !transparentDataUrl) {
                        setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: err || 'Failed to process 3D marker icon.' } }));
                    } else {
                        setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 100, error: '' } }));
                        setTimeout(() => {
                            setForm(f => ({ ...f, mapIconUrl: transparentDataUrl }));
                            setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: '' } }));
                        }, 450);
                    }
                });
            };

            const handleAuto3DTransparent = () => {
                const targetSrc = form.mapIconUrl || form.image;
                if (!targetSrc) {
                    setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: 'Upload a Vehicle Photo first or browse an image to convert.' } }));
                    return;
                }
                setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 30, error: '' } }));
                setTimeout(() => setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 75, error: '' } })), 220);

                processTransparentImage(targetSrc, (transparentDataUrl, err) => {
                    if (err || !transparentDataUrl) {
                        setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: err || 'Background removal failed.' } }));
                    } else {
                        setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 100, error: '' } }));
                        setTimeout(() => {
                            setForm(f => ({ ...f, mapIconUrl: transparentDataUrl }));
                            setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: '' } }));
                        }, 450);
                    }
                });
            };

            const [isRotating, setIsRotating] = useState(false);

            const rotateMarkerImage = (angleDeltaDeg) => {
                const src = form.mapIconUrl;
                if (!src || isRotating) return;
                setIsRotating(true);
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    try {
                        const rad = (angleDeltaDeg * Math.PI) / 180;
                        const sin = Math.abs(Math.sin(rad));
                        const cos = Math.abs(Math.cos(rad));
                        const origW = img.naturalWidth || img.width || 200;
                        const origH = img.naturalHeight || img.height || 200;
                        const newW = Math.round(origW * cos + origH * sin);
                        const newH = Math.round(origW * sin + origH * cos);

                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(newW, 32);
                        canvas.height = Math.max(newH, 32);
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';

                        ctx.translate(canvas.width / 2, canvas.height / 2);
                        ctx.rotate(rad);
                        ctx.drawImage(img, -origW / 2, -origH / 2);

                        const rotatedDataUrl = canvas.toDataURL('image/png');
                        setForm(f => ({ ...f, mapIconUrl: rotatedDataUrl }));
                    } catch (err) {
                        console.error('Marker rotation error:', err);
                    } finally {
                        setIsRotating(false);
                    }
                };
                img.onerror = () => setIsRotating(false);
                img.src = src;
            };

            const handleDocUpload = (e, fieldName) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                const isImg = file.type.startsWith('image/');
                if (!isPdf && !isImg) {
                    setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Invalid document format. Please upload a PDF or image file.' } }));
                    return;
                }

                if (file.size > 8 * 1024 * 1024) {
                    setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Document is too large. Max file size is 8MB.' } }));
                    return;
                }

                setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: 25, error: '' } }));

                if (isImg) {
                    const reader = new FileReader();
                    reader.onprogress = (pe) => {
                        if (pe.lengthComputable) {
                            const pct = Math.round((pe.loaded / pe.total) * 60) + 20;
                            setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: Math.min(85, pct), error: '' } }));
                        }
                    };
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            try {
                                const canvas = document.createElement('canvas');
                                let width = img.width || 800;
                                let height = img.height || 800;
                                const MAX_DIM = 1200;
                                if (width > MAX_DIM || height > MAX_DIM) {
                                    if (width > height) {
                                        height = Math.round((height * MAX_DIM) / width);
                                        width = MAX_DIM;
                                    } else {
                                        width = Math.round((width * MAX_DIM) / height);
                                        height = MAX_DIM;
                                    }
                                }
                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);
                                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

                                setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: 100, error: '' } }));
                                setTimeout(() => {
                                    setForm(f => ({ ...f, [fieldName]: compressedDataUrl }));
                                    setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: '' } }));
                                }, 450);
                            } catch (err) {
                                setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Image compression failed: ' + (err?.message || err) } }));
                            }
                        };
                        img.onerror = () => {
                            setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Failed to load document image file.' } }));
                        };
                        img.src = ev.target.result;
                    };
                    reader.onerror = () => {
                        setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Failed to read file from disk.' } }));
                    };
                    reader.readAsDataURL(file);
                } else {
                    const reader = new FileReader();
                    reader.onprogress = (pe) => {
                        if (pe.lengthComputable) {
                            const pct = Math.round((pe.loaded / pe.total) * 70) + 20;
                            setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: Math.min(90, pct), error: '' } }));
                        }
                    };
                    reader.onload = (ev) => {
                        setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: 100, error: '' } }));
                        setTimeout(() => {
                            setForm(f => ({ ...f, [fieldName]: ev.target.result }));
                            setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: '' } }));
                        }, 450);
                    };
                    reader.onerror = () => {
                        setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Failed to read PDF document.' } }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const submit = async (e) => {
                if (e) e.preventDefault();
                setErrorMessage('');
                if (!form.brand || !form.model || !form.plateNumber) {
                    setErrorMessage("Please fill in Brand, Model, and Plate Number.");
                    return;
                }

                const seatCap = parseInt(form.seatCapacity) || 0;
                if (seatCap > 60 || seatCap < 1) {
                    setErrorMessage("Seat Capacity must be between 1 and 60.");
                    return;
                }

                const ccVal = parseInt(form.engineCc) || 0;
                if (ccVal > 10000 || ccVal < 50) {
                    setErrorMessage("Engine CC must be between 50cc and 10,000cc.");
                    return;
                }

                try {
                    setIsSaving(true);
                    const pickId = (...sources) => {
                        for (const s of sources) {
                            if (s !== undefined && s !== null && s !== '' && !isNaN(parseInt(s))) {
                                const val = parseInt(s);
                                if (val > 0) return val;
                            }
                        }
                        return null;
                    };

                    const isEditMode = Boolean(vehicleToEdit);
                    const rawTargetId = vehicleToEdit?.vehicle_id || vehicleToEdit?.vehicleId || vehicleToEdit?.VehicleId || vehicleToEdit?.id || vehicleToEdit?.Id || vehicleToEdit?.ID || initialId;
                    let targetId = pickId(
                        initialId,
                        vehicleToEdit?.vehicle_id,
                        vehicleToEdit?.vehicleId,
                        vehicleToEdit?.VehicleId,
                        vehicleToEdit?.id,
                        vehicleToEdit?.Id,
                        vehicleToEdit?.ID
                    );

                    if (!targetId && typeof vehicleToEdit === 'object' && vehicleToEdit !== null) {
                        for (const key of Object.keys(vehicleToEdit)) {
                            if (key.toLowerCase().includes('id') && !key.toLowerCase().includes('url')) {
                                const val = parseInt(vehicleToEdit[key]);
                                if (!isNaN(val) && val > 0) {
                                    targetId = val;
                                    break;
                                }
                            }
                        }
                    }

                    const fleetList = Array.isArray(vehicles) && vehicles.length > 0 ? vehicles : (Array.isArray(window.fleetVehiclesCache) ? window.fleetVehiclesCache : []);
                    if (!targetId && form.plateNumber && fleetList.length > 0) {
                        const cleanPlate = (form.plateNumber || '').trim().toLowerCase().replace(/-/g, '');
                        const match = fleetList.find(v => (v.plateNumber || v.plate_no || v.plateNo || '').trim().toLowerCase().replace(/-/g, '') === cleanPlate);
                        if (match) {
                            targetId = pickId(match.vehicle_id, match.vehicleId, match.VehicleId, match.id);
                        }
                    }

                    const shouldUpdate = (isEditMode || Boolean(targetId)) && targetId !== null && targetId > 0;

                    const primaryPhoto = form.image || (Array.isArray(form.images) && form.images.length > 0 ? form.images[0] : '');
                    const allPhotoUrls = Array.isArray(form.images) && form.images.length > 0 
                        ? form.images 
                        : (primaryPhoto ? [primaryPhoto] : []);

                    const payload = {
                        vehicleId: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        vehicle_id: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        VehicleId: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        brand: form.brand,
                        model: form.model,
                        plateNo: form.plateNumber,
                        plate_no: form.plateNumber,
                        type: form.type,
                        cc: parseInt(form.engineCc) || 1500,
                        ratePerDay: parseFloat(form.dailyRatePHP) || 0,
                        rate_per_day: parseFloat(form.dailyRatePHP) || 0,
                        rateWithDriver: parseFloat(form.rateWithDriverPHP) || 0,
                        rate_with_driver: parseFloat(form.rateWithDriverPHP) || 0,
                        seatCapacity: parseInt(form.seatCapacity) || 5,
                        seat_capacity: parseInt(form.seatCapacity) || 5,
                        transmission: form.transmission,
                        status: form.status,
                        description: form.description,
                        photoUrl: primaryPhoto,
                        photo_url: primaryPhoto,
                        photoUrls: allPhotoUrls,
                        photo_urls: allPhotoUrls,
                        model3dUrl: form.mapIconUrl || '',
                        model_3d_url: form.mapIconUrl || '',
                        map_icon_url: form.mapIconUrl || '',
                        ltoExpiryDate: form.ltoExpiryDate ? new Date(form.ltoExpiryDate).toISOString() : null,
                        lto_expiry_date: form.ltoExpiryDate ? new Date(form.ltoExpiryDate).toISOString() : null,
                        insuranceExpiryDate: form.insuranceExpiryDate ? new Date(form.insuranceExpiryDate).toISOString() : null,
                        insurance_expiry_date: form.insuranceExpiryDate ? new Date(form.insuranceExpiryDate).toISOString() : null,
                        orCrUrl: form.orCrUrl || '',
                        or_cr_url: form.orCrUrl || '',
                        insuranceUrl: form.insuranceUrl || '',
                        insurance_url: form.insuranceUrl || '',
                        color: form.color || 'Pearl White'
                    };

                    const url = shouldUpdate ? `${API}/api/vehicles/${targetId}` : `${API}/api/vehicles`;
                    const method = shouldUpdate ? 'PUT' : 'POST';

                    const res = await fetch(url, {
                        method: method,
                        headers: HEADERS,
                        body: JSON.stringify(payload)
                    });

                    if (res.ok || res.status === 201 || res.status === 204) {
                        const resData = await res.json().catch(() => ({}));
                        const finalId = targetId || resData?.vehicleId || resData?.VehicleId || resData?.vehicle_id || form.vehicleId;
                        const updatedVehicleObj = normVehicle({
                            ...(vehicleToEdit || {}),
                            ...form,
                            vehicle_id: finalId,
                            vehicleId: finalId,
                            VehicleId: finalId,
                            id: finalId,
                            plate_no: form.plateNumber,
                            plateNumber: form.plateNumber,
                            brand: form.brand,
                            model: form.model,
                            type: form.type,
                            rate_per_day: form.dailyRatePHP,
                            dailyRatePHP: form.dailyRatePHP,
                            rate_with_driver: form.rateWithDriverPHP,
                            rateWithDriverPHP: form.rateWithDriverPHP,
                            cc: form.engineCc,
                            engineCc: form.engineCc,
                            seat_capacity: form.seatCapacity,
                            seatCapacity: form.seatCapacity,
                            transmission: form.transmission,
                            status: form.status,
                            description: form.description,
                            photo_url: primaryPhoto,
                            photoUrl: primaryPhoto,
                            image: primaryPhoto,
                            photo_urls: allPhotoUrls,
                            photoUrls: allPhotoUrls,
                            model_3d_url: form.mapIconUrl || '',
                            map_icon_url: form.mapIconUrl || '',
                            mapIconUrl: form.mapIconUrl || '',
                            lto_expiry_date: form.ltoExpiryDate,
                            insurance_expiry_date: form.insuranceExpiryDate,
                            or_cr_url: form.orCrUrl || '',
                            orCrUrl: form.orCrUrl || '',
                            insurance_url: form.insuranceUrl || '',
                            insuranceUrl: form.insuranceUrl || '',
                            documents: {
                                ltoRegistrationExpiry: formatDateSafe(form.ltoExpiryDate, '2026-10-15'),
                                insuranceExpiry: formatDateSafe(form.insuranceExpiryDate, '2026-11-20'),
                                orCrUrl: form.orCrUrl || '',
                                insuranceUrl: form.insuranceUrl || ''
                            }
                        });
                        onSave(resData?.message || (shouldUpdate ? "Vehicle updated successfully!" : "Vehicle added to fleet successfully!"), updatedVehicleObj);
                    } else {
                        const rawErrText = await res.text().catch(() => '');
                        let parsedMsg = '';
                        try {
                            const parsedJson = JSON.parse(rawErrText);
                            parsedMsg = parsedJson.message || parsedJson.Message || parsedJson.title || '';
                        } catch (_) { }
                        const displayMsg = parsedMsg || rawErrText || `Error saving vehicle data (HTTP ${res.status}).`;
                        setErrorMessage(displayMsg);
                    }
                } catch (err) {
                    console.error("Save Vehicle Exception:", err);
                    setErrorMessage(`Network or System Exception: ${err?.message || err}`);
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[99999] flex items-center justify-center p-4 sm:p-6 animate-fade-in" onClick={onClose}>
                    <div className="bg-[var(--bg-secondary)] backdrop-blur-2xl border border-[var(--border-color)] text-[var(--text-primary)] rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden relative animate-scale-up" onClick={e => e.stopPropagation()}>

                        {/* Visual Glass Saving Overlay Loading State */}
                        {isSaving && (
                            <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-md flex flex-col items-center justify-center gap-3 animate-fade-in">
                                <div className="w-16 h-16 rounded-2xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-500 shadow-2xl shadow-orange-500/30">
                                    <IconRefreshCw sz={32} c="animate-spin" />
                                </div>
                                <div className="text-base font-black text-white tracking-wide">Saving Changes...</div>
                                <div className="text-xs text-orange-300/80 font-medium">Updating vehicle specs & documents in database</div>
                            </div>
                        )}

                        {/* Header */}
                        <div className="p-5 border-b border-[var(--border-color)] flex justify-between items-center bg-[var(--bg-tertiary)] shrink-0">
                            <h2 className="text-lg font-black text-[var(--text-primary)] flex items-center gap-2">
                                <span className="text-orange-500">{vehicleToEdit ? <IconEdit sz={18} className="inline" /> : <IconPlus sz={18} className="inline" />}</span>
                                <span>{vehicleToEdit ? 'Edit Vehicle Specs' : 'Add New Vehicle'}</span>
                            </h2>
                            <button onClick={onClose} className="p-1.5 rounded-full hover:bg-[var(--bg-card-hover)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors"><IconX sz={18} /></button>
                        </div>

                        {/* Inline Error Alert */}
                        {errorMessage && (
                            <div className="mx-6 mt-4 p-3.5 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-start gap-3 text-red-500 text-xs shrink-0 animate-fade-in">
                                <IconAlertTriangle sz={18} className="shrink-0 mt-0.5" />
                                <div className="flex-1">
                                    <p className="font-bold">Failed to save vehicle specs</p>
                                    <p className="text-[11px] text-red-400 mt-0.5 leading-relaxed">{errorMessage}</p>
                                </div>
                                <button type="button" onClick={() => setErrorMessage('')} className="text-red-500 hover:text-red-700"><IconX sz={14} /></button>
                            </div>
                        )}

                        {/* Form Body - 2 Columns */}
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar grid grid-cols-1 lg:grid-cols-12 gap-6">

                            {/* LEFT COLUMN: Inputs (7 Cols) */}
                            <div className="lg:col-span-7 flex flex-col gap-4">

                                {/* 2-Option Segmented Selection Toggle: Custom Vehicle vs Existing Brand & Model Preset */}
                                {!vehicleToEdit && (
                                    <div className="bg-[var(--bg-tertiary)] p-1.5 rounded-2xl border border-[var(--border-color)] flex items-center gap-2 mb-1">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setCreationMode('custom');
                                                setSelectedBrandPreset('');
                                                setSelectedModelPreset('');
                                                setForm(f => ({ ...f, brand: '', model: '' }));
                                            }}
                                            className={`flex-1 py-2.5 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${creationMode === 'custom'
                                                ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/30'
                                                : 'text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-white/5'
                                                }`}
                                        >
                                            <IconPlus sz={14} /> Custom Vehicle
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setCreationMode('preset')}
                                            className={`flex-1 py-2.5 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${creationMode === 'preset'
                                                ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/30'
                                                : 'text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-white/5'
                                                }`}
                                        >
                                            <IconZap sz={14} /> Same Brand & Model
                                        </button>
                                    </div>
                                )}

                                {/* Brand & Model */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <div className="flex items-center justify-between mb-1">
                                            <label className="text-xs font-semibold text-[var(--text-secondary)]">Brand *</label>
                                            {form.brand && form.brand.trim().length > 0 && (
                                                <div className="flex items-center gap-1.5 animate-fade-in">
                                                    <BrandLogo brand={form.brand} className="w-5 h-5" imgClass="max-h-4.5 max-w-4.5" />
                                                    <span className="text-[10px] font-bold text-orange-400 uppercase truncate max-w-[80px]">{form.brand}</span>
                                                </div>
                                            )}
                                        </div>
                                        {creationMode === 'preset' && !vehicleToEdit ? (
                                            <select
                                                value={selectedBrandPreset}
                                                onChange={e => handleBrandPresetChange(e.target.value)}
                                                className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-orange-500/40 text-sm font-bold text-orange-400 focus:border-orange-500 outline-none transition-all cursor-pointer"
                                            >
                                                <option value="">-- Select Existing Brand --</option>
                                                {existingBrands.map(b => (
                                                    <option key={b} value={b}>{b}</option>
                                                ))}
                                            </select>
                                        ) : (
                                            <div className="relative flex items-center">
                                                <input type="text" value={form.brand} onChange={e => setForm({ ...form, brand: e.target.value })} className="w-full p-3 pr-10 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all placeholder-[var(--text-muted)]" placeholder="e.g. Honda, Ford, Toyota" />
                                                <div className="absolute right-2.5 pointer-events-none">
                                                    <BrandLogo brand={form.brand} className="w-6 h-6" imgClass="max-h-5 max-w-5" />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Model *</label>
                                        {creationMode === 'preset' && !vehicleToEdit ? (
                                            <select
                                                value={selectedModelPreset}
                                                onChange={e => handleModelPresetChange(e.target.value)}
                                                disabled={!selectedBrandPreset}
                                                className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-orange-500/40 text-sm font-bold text-orange-400 focus:border-orange-500 outline-none transition-all disabled:opacity-50 cursor-pointer"
                                            >
                                                <option value="">{selectedBrandPreset ? '-- Select Model --' : 'Select Brand First'}</option>
                                                {modelsForSelectedBrand.map(m => (
                                                    <option key={m.id || m.model} value={m.model}>
                                                        {m.model} ({m.type}, {m.transmission})
                                                    </option>
                                                ))}
                                            </select>
                                        ) : (
                                            <input type="text" value={form.model} onChange={e => setForm({ ...form, model: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all placeholder-[var(--text-muted)]" placeholder="e.g. Civic, Ranger, Vios" />
                                        )}
                                    </div>
                                </div>

                                {/* Plate No & Vehicle Type */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Plate No. *</label>
                                        <input type="text" value={form.plateNumber} onChange={e => setForm({ ...form, plateNumber: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-bold uppercase text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all placeholder-[var(--text-muted)]" placeholder="e.g. ABC-1234" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Vehicle Type</label>
                                        <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all">
                                            <option value="Car">Car</option>
                                            <option value="SUV">SUV</option>
                                            <option value="Van">Van</option>
                                            <option value="Pickup">Pickup</option>
                                            <option value="Hatchback">Hatchback</option>
                                            <option value="Motorcycle">Motorcycle</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Engine CC & Daily Rate with Suggest */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Engine CC (Max 10,000)</label>
                                        <input
                                            type="number"
                                            min="50"
                                            max="10000"
                                            value={form.engineCc}
                                            onChange={e => {
                                                let val = parseInt(e.target.value);
                                                if (isNaN(val)) setForm({ ...form, engineCc: '' });
                                                else setForm({ ...form, engineCc: Math.min(10000, Math.max(50, val)) });
                                            }}
                                            className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all"
                                            placeholder="e.g. 1500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Rate / Day (₱)</label>
                                        <div className="flex gap-2">
                                            <div className="relative flex items-center w-full">
                                                <span className="absolute left-3.5 text-sm font-black text-orange-500 select-none">₱</span>
                                                <input
                                                    type="number"
                                                    min="0"
                                                    max="500000"
                                                    value={form.dailyRatePHP}
                                                    onChange={e => {
                                                        let val = parseFloat(e.target.value);
                                                        if (isNaN(val)) setForm({ ...form, dailyRatePHP: '' });

        const VehicleDrawer = ({ v, onClose, onRefresh, onEdit, onDelete, onShowQr, onPreviewDoc }) => {

            const st = getStatusStyle(v.status);
            const [rfidBal, setRfidBal] = useState(parseFloat(v.expressway_rfid_balance ?? v.expresswayRfidBalance ?? v.rfid_balance_autosweep ?? v.rfidBalancePHP ?? 500));
            const [topupLoading, setTopupLoading] = useState(false);
            const [topupSuccess, setTopupSuccess] = useState('');
            const [reloadAmount, setReloadAmount] = useState('500');
            const [photoIdx, setPhotoIdx] = useState(0);
            const [isFullscreenImg, setIsFullscreenImg] = useState(false);

            // Extract all unique vehicle photos
            const allPhotos = useMemo(() => {
                let list = [];
                if (v.image) list.push(v.image);
                if (Array.isArray(v.photo_urls) && v.photo_urls.length > 0) list.push(...v.photo_urls);
                else if (Array.isArray(v.photoUrls) && v.photoUrls.length > 0) list.push(...v.photoUrls);
                else if (Array.isArray(v.photos) && v.photos.length > 0) list.push(...v.photos);
                else if (typeof v.photo_urls === 'string' && v.photo_urls.startsWith('[')) {
                    try { list.push(...JSON.parse(v.photo_urls)); } catch(e){}
                }
                const unique = Array.from(new Set(list.filter(Boolean).map(resolveVehicleImgUrl)));
                return unique.length > 0 ? unique : (v.image ? [resolveVehicleImgUrl(v.image)] : []);
            }, [v]);

            // Auto-switch photos every 5 seconds if multiple exist
            useEffect(() => {
                if (allPhotos.length <= 1) return;
                const timer = setInterval(() => {
                    setPhotoIdx(prev => (prev + 1) % allPhotos.length);
                }, 5000);
                return () => clearInterval(timer);
            }, [allPhotos.length]);

            useEffect(() => {
                const bal = parseFloat(v.expressway_rfid_balance ?? v.expresswayRfidBalance ?? v.ExpresswayRfidBalance ?? v.rfid_balance_autosweep ?? v.rfidBalanceAutosweep ?? v.rfidBalancePHP ?? 500);
                setRfidBal(bal);
            }, [v, v.expressway_rfid_balance, v.expresswayRfidBalance, v.rfidBalancePHP]);

            const handleRfidTopup = async (amountToAdd) => {
                const amt = parseFloat(String(amountToAdd).replace(/,/g, ''));
                if (isNaN(amt) || amt <= 0) return;
                setTopupLoading(true);
                setTopupSuccess('');
                try {
                    const vehicleId = v.vehicle_id || v.id || v.VehicleId;
                    const res = await fetch(`${API}/api/vehicles/${vehicleId}/rfid/topup`, {
                        method: 'POST',
                        headers: HEADERS,
                        body: JSON.stringify({ amount: amt })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const updated = parseFloat(data.expresswayRfidBalance ?? data.ExpresswayRfidBalance ?? (rfidBal + amt));
                        setRfidBal(updated);
                        v.expressway_rfid_balance = updated;
                        v.expresswayRfidBalance = updated;
                        v.rfidBalancePHP = updated;
                        setTopupSuccess(`+₱${amt.toLocaleString()} loaded!`);
                        setTimeout(() => setTopupSuccess(''), 3500);
                        if (onRefresh) onRefresh();
                    } else {
                        // Fallback local update
                        const updated = rfidBal + amt;
                        setRfidBal(updated);
                        v.expressway_rfid_balance = updated;
                        v.expresswayRfidBalance = updated;
                        v.rfidBalancePHP = updated;
                        setTopupSuccess(`+₱${amt.toLocaleString()} loaded!`);
                        setTimeout(() => setTopupSuccess(''), 3500);
                    }
                } catch (e) {
                    console.error('RFID topup error:', e);
                    const updated = rfidBal + amt;
                    setRfidBal(updated);
                    v.expressway_rfid_balance = updated;
                    v.expresswayRfidBalance = updated;
                    v.rfidBalancePHP = updated;
                    setTopupSuccess(`+₱${amt.toLocaleString()} loaded!`);
                    setTimeout(() => setTopupSuccess(''), 3500);
                } finally {
                    setTopupLoading(false);
                }
            };

            return (

                        {/* Header Image & Vehicle Details Banner (with Fullscreen Lightbox & 5s Auto Carousel) */}

                            className="h-52 relative shrink-0 overflow-hidden bg-slate-950 group cursor-pointer select-none"
                            onClick={() => setIsFullscreenImg(true)}
                            title="Click to view full screen gallery"
                        >

                                <img 
                                    key={allPhotos[photoIdx % allPhotos.length]} 
                                    src={allPhotos[photoIdx % allPhotos.length]} 
                                    alt={v.plateNumber} 
                                    className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" 
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                            ) : (
                                <VehicleImageComponent src={v.image} alt={v.plateNumber} className="w-full h-full object-cover" iconSize={64} />
                            )}
                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent pointer-events-none"></div>

                            {/* Fullscreen Hint Badge */}

                                <IconMaximize sz={11} /> Click for Fullscreen
                            </div>

                            {/* Carousel Switching Controls (if multiple images) */}
                            {allPhotos.length > 1 && (
                                <div className="absolute top-4 right-16 flex items-center gap-1.5 z-10" onClick={e => e.stopPropagation()}>
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); setPhotoIdx(prev => (prev - 1 + allPhotos.length) % allPhotos.length); }} 
                                        className="p-1 rounded-full bg-black/60 hover:bg-orange-500 text-white border border-white/20 backdrop-blur transition-all active:scale-95 cursor-pointer"
                                        title="Previous photo"
                                    >
                                        <IconChevronLeft sz={12} />
                                    </button>
                                    <span className="text-[10px] font-black text-white bg-black/60 px-2 py-0.5 rounded-full border border-white/20 backdrop-blur">
                                        {photoIdx + 1}/{allPhotos.length}
                                    </span>
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); setPhotoIdx(prev => (prev + 1) % allPhotos.length); }} 
                                        className="p-1 rounded-full bg-black/60 hover:bg-orange-500 text-white border border-white/20 backdrop-blur transition-all active:scale-95 cursor-pointer"
                                        title="Next photo"
                                    >
                                        <IconChevronRight sz={12} />
                                    </button>
                                </div>
                            )}

                            {/* Close Button */}

                            {/* Title Info with Brand Logo */}
                            <div className="absolute bottom-4 left-6 right-6 pointer-events-none">

        };


        // ─── HANDOVER QR CODE MODAL ────────────────────────────────────────────────
        const getFleetVerifyBase = () => {
            if (window.API_NETWORK_URL && !window.API_NETWORK_URL.includes('localhost') && !window.API_NETWORK_URL.includes('127.0.0.1')) {
                return window.API_NETWORK_URL.replace(/\/$/, '');
            }
            if (window.API_BASE_URL && !window.API_BASE_URL.includes('localhost') && !window.API_BASE_URL.includes('127.0.0.1')) {
                return window.API_BASE_URL.replace(/\/$/, '');
            }
            const host = window.location.hostname;
            if (host && host !== 'localhost' && host !== '127.0.0.1' && host !== 'appassets') {
                return `${window.location.protocol}//${host}:5233/api`;
            }
            return 'http://192.168.1.6:5233/api';
        };

        const QrCodeModal = ({ vehicle, onClose }) => {
            const qrRef = useRef(null);
            const [isExporting, setIsExporting] = useState(false);

            const verifyUrl = `${getFleetVerifyBase()}/vehicles/verify/${encodeURIComponent(vehicle ? (vehicle.plateNumber || vehicle.id) : '')}`;

            useEffect(() => {
                if (qrRef.current && vehicle && window.QRCode) {
                    qrRef.current.innerHTML = '';
                    new window.QRCode(qrRef.current, {
                        text: verifyUrl,
                        width: 200,
                        height: 200,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: window.QRCode.CorrectLevel.H
                    });

                    // Stamp Official Vehicle Brand Logo in center of QR
                    const brandLogoUrl = getBrandLogoUrl(vehicle.brand);
                    if (brandLogoUrl) {
                        overlayLogoOnQr(qrRef.current, brandLogoUrl, 0.24);
                    }
                }
            }, [vehicle, verifyUrl]);

            const handleDownloadPdfPass = async () => {
                if (!vehicle) return;
                setIsExporting(true);
                try {
                    if (typeof window.jspdf === 'undefined') {
                        window.print();
                        return;
                    }
                    const { jsPDF } = window.jspdf;
                    // EXACT compact physical card pass dimensions (100mm wide x 140mm high - NOT A4!)
                    const cardW = 100;
                    const cardH = 140;
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: [cardW, cardH]
                    });

                    // Margin: 7mm on all sides (clean ~1cm padding)
                    const m = 7;
                    const innerW = cardW - (m * 2); // 86mm
                    const innerH = cardH - (m * 2); // 126mm

                    // Document & Card background
                    pdf.setFillColor(255, 255, 255);
                    pdf.rect(0, 0, cardW, cardH, 'F');

                    // 3D Card Boundary with Crisp Border
                    pdf.setFillColor(255, 255, 255);
                    pdf.setDrawColor(249, 115, 22);
                    pdf.setLineWidth(0.6);
                    pdf.roundedRect(m, m, innerW, innerH, 4, 4, 'FD');

                    // Inner subtle hairline
                    pdf.setDrawColor(241, 245, 249);
                    pdf.setLineWidth(0.2);
                    pdf.roundedRect(m + 1, m + 1, innerW - 2, innerH - 2, 3.5, 3.5, 'S');

                    // Header: Drive&Go System Logo & Title
                    const logoB64 = await getLogoBase64();
                    if (logoB64) {
                        try {
                            pdf.addImage('data:image/png;base64,' + logoB64, 'PNG', m + 4, m + 4, 7.5, 7.5);
                        } catch (e) {}
                    }
                    pdf.setTextColor(234, 88, 12);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(8);
                    pdf.text('HANDOVER PASS', m + (logoB64 ? 14 : 4), m + 9);

                    pdf.setDrawColor(226, 232, 240);
                    pdf.setLineWidth(0.3);
                    pdf.line(m + 4, m + 14, m + innerW - 4, m + 14);

                    // Vehicle Identity: Brand & Model
                    pdf.setTextColor(15, 23, 42);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(11.5);
                    pdf.text(`${vehicle.brand} ${vehicle.model}`, cardW / 2, m + 21, { align: 'center' });

                    // Plate Badge
                    const plate = String(vehicle.plateNumber || vehicle.plate_no || '').toUpperCase();
                    const plateW = pdf.getStringUnitWidth(plate) * 7.5 * 0.352778 + 6;
                    pdf.setFillColor(255, 247, 237);
                    pdf.setDrawColor(254, 215, 170);
                    pdf.setLineWidth(0.25);
                    pdf.roundedRect((cardW - plateW) / 2, m + 24, plateW, 5.2, 1.2, 1.2, 'FD');

                    pdf.setTextColor(234, 88, 12);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(7.5);
                    pdf.text(plate, cardW / 2, m + 27.8, { align: 'center' });

                    // QR Code Image
                    if (qrRef.current) {
                        const qrCanvas = qrRef.current.querySelector('canvas');
                        const qrImg = qrRef.current.querySelector('img');
                        let qrDataUrl = '';
                        if (qrCanvas) {
                            qrDataUrl = qrCanvas.toDataURL('image/png');
                        } else if (qrImg && qrImg.src) {
                            qrDataUrl = qrImg.src;
                        }

                        if (qrDataUrl) {
                            const qrBoxSize = 52;
                            const qrBoxX = (cardW - qrBoxSize) / 2;
                            const qrBoxY = m + 32;

                            pdf.setFillColor(255, 255, 255);
                            pdf.setDrawColor(249, 115, 22);
                            pdf.setLineWidth(0.5);
                            pdf.roundedRect(qrBoxX, qrBoxY, qrBoxSize, qrBoxSize, 3, 3, 'FD');

                            pdf.addImage(qrDataUrl, 'PNG', qrBoxX + 2, qrBoxY + 2, qrBoxSize - 4, qrBoxSize - 4);
                        }
                    }

                    // Explanatory Text
                    pdf.setTextColor(100, 116, 139);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6.2);
                    const descText = 'Scan this QR code during vehicle turnover to verify specifications, odometer reading, and rental status.';
                    const splitDesc = pdf.splitTextToSize(descText, innerW - 10);
                    pdf.text(splitDesc, cardW / 2, m + 92, { align: 'center' });

                    // Authentic Security Badge
                    pdf.setFillColor(240, 253, 244);
                    pdf.setDrawColor(187, 247, 208);
                    pdf.setLineWidth(0.25);
                    pdf.roundedRect((cardW - 46) / 2, m + 104, 46, 5, 1.2, 1.2, 'FD');
                    pdf.setTextColor(22, 101, 52);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(5.8);
                    pdf.text('AUTHENTIC DIGITAL PASS', cardW / 2, m + 107.5, { align: 'center' });

                    const filename = `DriveAndGo_Pass_${(vehicle.plateNumber || 'Vehicle').replace(/\s+/g, '_')}.pdf`;
                    pdf.save(filename);
                } catch (e) {
                    console.error('Error generating PDF pass:', e);
                    window.print();
                } finally {
                    setIsExporting(false);
                }
            };

            if (!vehicle) return null;

            return (
                <div id="handover-qr-modal-overlay" className="fixed inset-0 bg-black/60 backdrop-blur-md z-[99999] flex items-center justify-center p-4 sm:p-6 animate-fade-in print:bg-transparent print:p-0 print:static print:flex print:items-center print:justify-center" onClick={onClose}>
                    <div id="handover-qr-print-card" className="bg-[var(--bg-secondary)] backdrop-blur-2xl border border-[var(--border-color)] rounded-3xl p-6 w-full max-w-sm flex flex-col items-center gap-3.5 text-center shadow-2xl animate-scale-up" onClick={e => e.stopPropagation()}>
                        
                        {/* Official Card Top Header with Small System Logo */}
                        <div className="w-full flex justify-between items-center border-b border-[var(--border-color)] pb-3">
                            <div className="flex items-center gap-2">
                                <img 
                                    src="logo.png" 
                                    alt="Drive&Go Logo" 
                                    className="h-6 object-contain" 
                                    onError={(e) => { e.target.src = "https://raw.githubusercontent.com/martquirante/DriveAndGo_Project/main/DriveAndGo_Admin/WebAssets/logo.png"; }} 
                                />
                                <div className="text-[10px] font-black text-orange-500 uppercase tracking-wider flex items-center gap-1">
                                    <IconQrCode sz={13} /> Handover Pass
                                </div>
                            </div>
                            <button onClick={onClose} className="p-1.5 rounded-full hover:bg-[var(--bg-tertiary)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors print:hidden no-print" title="Close"><IconX sz={16} /></button>
                        </div>

                        {/* Vehicle Identity */}
                        <div className="flex flex-col items-center gap-1 mt-0.5">
                            <BrandLogo brand={vehicle.brand} className="w-9 h-9 shadow-md mb-0.5" />
                            <div className="text-lg font-black text-[var(--text-primary)] tracking-tight">{vehicle.brand} {vehicle.model}</div>
                            <div className="mono text-xs font-black text-orange-500 bg-orange-500/10 px-2.5 py-0.5 rounded-full border border-orange-500/20">{vehicle.plateNumber}</div>
                        </div>
                        
                        {/* Interactive QR Code Canvas with Centered Brand Emblem Overlay */}
                        <div 
                            className="relative p-3.5 bg-white rounded-2xl border-2 border-orange-500 shadow-md my-0.5 flex items-center justify-center cursor-pointer transition-transform hover:scale-105" 
                            title="Click to open verification in new browser tab"
                            onClick={() => window.open(verifyUrl, '_blank')}
                        >
                            <div ref={qrRef}></div>
                            {/* Official Brand Emblem centered on QR Code */}
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div className="bg-white p-1 rounded-lg border border-slate-200 shadow-md flex items-center justify-center w-10 h-10">
                                    <BrandLogo brand={vehicle.brand} className="w-7 h-7" />

                window.chrome.webview.postMessage("push_notification:" + JSON.stringify({ title: title, body: body }));
            }

            const cleanTitle = String(title || '').trim();
            const cleanBody = String(body || '').trim();

            const type = cleanTitle.toLowerCase().includes('flood') ? 'flood' :
                cleanTitle.toLowerCase().includes('weather') || cleanTitle.toLowerCase().includes('pagasa') || cleanTitle.toLowerCase().includes('monsoon') ? 'weather' :
                    cleanTitle.toLowerCase().includes('decommission') || cleanTitle.toLowerCase().includes('audit') ? 'decommission' : 'general';

            if (window.__addNotificationReact) {
                window.__addNotificationReact({
                    id: Date.now() + Math.random(),
                    type,
                    title: cleanTitle || 'Fleet Advisory',
                    body: cleanBody || 'Notification details',
                    time: 'Just now',
                    unread: true
                });
            }
        };

        const FleetOverview = () => {

            // Register global handlers for push notification & dropdown toggle
            useEffect(() => {
                window.__addNotificationReact = (newNotif) => {
                    setNotifications(prev => [newNotif, ...prev]);
                };
                window.__toggleNotifDropdownReact = () => {
                    setShowNotifDropdown(prev => !prev);
                };
                window.toggleNotificationsDropdown = () => {
                    setShowNotifDropdown(prev => !prev);
                };
                window.showWeatherAdvisoryFromNotif = () => {
