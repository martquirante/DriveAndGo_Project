<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet 3D Analytics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #07070e;
    overflow: hidden;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    color: #E1E4F8;
  }
  #canvas-host { position: absolute; inset: 0; }
  /* Radial top glow */
  #top-glow {
    position: absolute; top: 0; left: 0; right: 0; height: 140px;
    background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(234,88,12,0.14) 0%, transparent 100%);
    pointer-events: none;
  }
  /* Bottom info bar */
  #info-bar {
    position: absolute; bottom: 16px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 16px;
    pointer-events: none; z-index: 10;
  }
  .chip {
    background: rgba(234,88,12,0.10);
    border: 1px solid rgba(234,88,12,0.30);
    border-radius: 20px;
    padding: 4px 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: rgba(251,146,60,0.95);
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: all 0.3s ease;
  }
  /* Loading fallback */
  #fallback {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: rgba(234,88,12,0.6);
    font-size: 13px; letter-spacing: 1px;
    background: #07070e;
  }
</style>
</head>
<body>

<canvas id="canvas-host"></canvas>
<div id="top-glow"></div>
<div id="info-bar">
  <div class="chip">⬡ Fleet Map — Live</div>
  <div class="chip">3D Analytics Active</div>
</div>
<div id="fallback" style="display:none;">
  ⬡ 3D Fleet Canvas — Loading…
</div>

<!-- Three.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
        onerror="document.getElementById('fallback').style.display='flex'"></script>
<script>
(function () {
  'use strict';

  if (typeof THREE === 'undefined') return;

  // ── Scene setup ──────────────────────────────────────────────────────────────
  const canvas   = document.getElementById('canvas-host');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x07070E, 1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
  camera.position.set(0, 4, 11);
  camera.lookAt(0, 0, 0);

  // ── Fog ──────────────────────────────────────────────────────────────────────
  scene.fog = new THREE.FogExp2(0x07070E, 0.055);

  // ── Accent color palette ─────────────────────────────────────────────────────
  const ORANGE     = new THREE.Color(0xEA580C);
  const ORANGE_DIM = new THREE.Color(0x542006);
  const BLUE       = new THREE.Color(0x3B82F6);

  // ── Ground grid ──────────────────────────────────────────────────────────────
  const gridGeo  = new THREE.PlaneGeometry(22, 22, 22, 22);
  const gridMat  = new THREE.MeshBasicMaterial({
    color: 0x181A32, wireframe: true, transparent: true, opacity: 0.35
  });
  const grid = new THREE.Mesh(gridGeo, gridMat);
  grid.rotation.x = -Math.PI / 2;
  grid.position.y = -2.0;
  scene.add(grid);

  // ── Hexagonal particle field ──────────────────────────────────────────────────
  const HEX_COUNT = 120;
  const hexPositions = [];
  const hexGeo = new THREE.BufferGeometry();
  const hexVerts = [];
  for (let i = 0; i < HEX_COUNT; i++) {
    const x = (Math.random() - 0.5) * 18;
    const y = (Math.random() - 0.5) * 6 - 0.5;
    const z = (Math.random() - 0.5) * 14;
    hexVerts.push(x, y, z);
    hexPositions.push({ x, y, z, speed: 0.002 + Math.random() * 0.004, phase: Math.random() * Math.PI * 2 });
  }
  hexGeo.setAttribute('position', new THREE.Float32BufferAttribute(hexVerts, 3));
  const hexMat  = new THREE.PointsMaterial({
    color: ORANGE, size: 0.09, transparent: true, opacity: 0.65, sizeAttenuation: true
  });
  const hexPoints = new THREE.Points(hexGeo, hexMat);
  scene.add(hexPoints);

  // ── Central 3D car silhouette (low-poly proxy) ───────────────────────────────
  // Body
  const bodyGeo = new THREE.BoxGeometry(2.6, 0.65, 1.35, 1, 1, 1);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x0C0D1B, metalness: 0.85, roughness: 0.15,
    wireframe: false
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = -0.2;
  body.castShadow = true;
  scene.add(body);

  // Cabin
  const cabinGeo = new THREE.BoxGeometry(1.35, 0.5, 1.15, 1, 1, 1);
  const cabinMat = new THREE.MeshStandardMaterial({
    color: 0x12142B, metalness: 0.6, roughness: 0.3, transparent: true, opacity: 0.88
  });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0.08, 0.35, 0);
  cabin.castShadow = true;
  scene.add(cabin);

  // Wireframe overlay on body
  const wireGeo = new THREE.EdgesGeometry(bodyGeo);
  const wireMat = new THREE.LineBasicMaterial({ color: ORANGE, transparent: true, opacity: 0.45 });
  const wire = new THREE.LineSegments(wireGeo, wireMat);
  wire.position.copy(body.position);
  scene.add(wire);

  // Cabin wireframe
  const cWireGeo = new THREE.EdgesGeometry(cabinGeo);
  const cWireMat = new THREE.LineBasicMaterial({ color: ORANGE, transparent: true, opacity: 0.30 });
  const cWire = new THREE.LineSegments(cWireGeo, cWireMat);
  cWire.position.copy(cabin.position);
  scene.add(cWire);

  // Wheels (4 cylinders)
  const wheelPositions = [
    [-0.88,  -0.52,  0.72],
    [ 0.88,  -0.52,  0.72],
    [-0.88,  -0.52, -0.72],
    [ 0.88,  -0.52, -0.72],
  ];
  wheelPositions.forEach(([wx, wy, wz]) => {
    const wGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.22, 16);
    const wMat = new THREE.MeshStandardMaterial({ color: 0x090A16, metalness: 0.9, roughness: 0.1 });
    const wheel = new THREE.Mesh(wGeo, wMat);
    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(wx, wy, wz);
    wheel.castShadow = true;
    scene.add(wheel);

    const rimGeo = new THREE.TorusGeometry(0.22, 0.035, 8, 16);
    const rimMat = new THREE.MeshStandardMaterial({ color: ORANGE, metalness: 1, roughness: 0.1 });
    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.rotation.x = Math.PI / 2;
    rim.position.set(wx, wy, wz);
    scene.add(rim);
  });

  // ── Headlights glow ──────────────────────────────────────────────────────────
  const headlightL = new THREE.PointLight(ORANGE, 1.2, 5);
  headlightL.position.set(-1.35, -0.1, 0.5);
  scene.add(headlightL);

  const headlightR = new THREE.PointLight(ORANGE, 1.2, 5);
  headlightR.position.set(-1.35, -0.1, -0.5);
  scene.add(headlightR);

  // ── Orbital data rings ───────────────────────────────────────────────────────
  function makeRing(radius, color, opacity) {
    const geo = new THREE.TorusGeometry(radius, 0.012, 4, 80);
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity });
    return new THREE.Mesh(geo, mat);
  }
  const ring1 = makeRing(3.0, ORANGE, 0.25);
  const ring2 = makeRing(4.2, BLUE,   0.15);
  const ring3 = makeRing(5.5, ORANGE, 0.09);
  ring1.rotation.x = Math.PI / 2;
  ring2.rotation.x = Math.PI / 3;
  ring3.rotation.x = Math.PI / 4;
  scene.add(ring1, ring2, ring3);

  // ── Orbiting satellite dots ───────────────────────────────────────────────────
  const satellites = [];
  [
    { r: 3.0, speed: 0.011, color: ORANGE, size: 0.09 },
    { r: 4.2, speed: 0.007, color: BLUE,   size: 0.07 },
  ].forEach(({ r, speed, color, size }) => {
    const geo = new THREE.SphereGeometry(size, 8, 8);
    const mat = new THREE.MeshBasicMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);

    // Trailing glow behind dot
    const glowGeo = new THREE.SphereGeometry(size * 2.5, 8, 8);
    const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.15 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    mesh.add(glow);

    satellites.push({ mesh, r, speed, angle: Math.random() * Math.PI * 2 });
    scene.add(mesh);
  });

  // ── Ambient + directional lighting ───────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0x181A32, 1.8));

  const dirLight = new THREE.DirectionalLight(0xFFFFFF, 1.4);
  dirLight.position.set(5, 8, 6);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const orangeLight = new THREE.PointLight(ORANGE, 1.8, 12);
  orangeLight.position.set(0, 2, 0);
  scene.add(orangeLight);

  // ── Ground reflection plane ───────────────────────────────────────────────────
  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x05050A, metalness: 0.4, roughness: 0.9
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2.05;
  ground.receiveShadow = true;
  scene.add(ground);

  // ── Resize handler ───────────────────────────────────────────────────────────
  function resize() {
    const W = window.innerWidth, H = window.innerHeight;
    renderer.setSize(W, H);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Animation loop (FPS counter removed) ──────────────────────────────────────
  let clock = 0;
  function animate() {
    requestAnimationFrame(animate);
    clock += 0.016;

    // Rotate car group gently
    body.rotation.y   = Math.sin(clock * 0.25) * 0.18;
    cabin.rotation.y  = body.rotation.y;
    wire.rotation.y   = body.rotation.y;
    cWire.rotation.y  = cabin.rotation.y;

    // Pulse headlights
    const p = 0.6 + 0.4 * Math.sin(clock * 2.2);
    headlightL.intensity = headlightR.intensity = p * 1.2;

    // Orbit data rings
    ring1.rotation.y += 0.006;
    ring2.rotation.z += 0.004;
    ring3.rotation.x += 0.003;

    // Orbit satellites
    satellites.forEach(s => {
      s.angle += s.speed;
      s.mesh.position.set(
        Math.cos(s.angle) * s.r,
        Math.sin(s.angle * 0.5) * 0.6,
        Math.sin(s.angle) * s.r
      );
    });

    // Float hexagonal particles
    const posArr = hexGeo.attributes.position.array;
    for (let i = 0; i < HEX_COUNT; i++) {
      const idx = i * 3;
      const hp  = hexPositions[i];
      posArr[idx + 1] = hp.y + Math.sin(clock * hp.speed * 60 + hp.phase) * 0.18;
    }
    hexGeo.attributes.position.needsUpdate = true;

    // Pulse orange center light
    orangeLight.intensity = 1.4 + 0.4 * Math.sin(clock * 1.8);

    // Slow camera drift
    camera.position.x = Math.sin(clock * 0.12) * 0.8;
    camera.position.y = 4 + Math.sin(clock * 0.08) * 0.3;
    camera.lookAt(0, -0.2, 0);

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
