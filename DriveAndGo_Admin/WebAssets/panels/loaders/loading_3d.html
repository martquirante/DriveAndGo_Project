<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drive &amp; Go — Loading</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #080810;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 74%;
  }
  #ui-overlay {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%;
    height: 26%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 20px 20px;
    background: linear-gradient(to top, #080810 60%, rgba(8,8,16,0.0));
    pointer-events: none;
  }
  #welcome-text {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1.5px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    text-align: center;
    text-shadow: 0 0 30px rgba(255,90,31,0.55), 0 2px 12px rgba(0,0,0,0.8);
  }
  #welcome-text.show { opacity: 1; transform: translateY(0); }
  #status-text {
    font-size: 11px;
    color: #6670a0;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.6s ease 0.5s;
  }
  #status-text.show { opacity: 1; }
  #progress-track {
    width: 340px;
    height: 2px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    margin-top: 20px;
    overflow: visible;
    position: relative;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #FF5A1F, #FF9F5B);
    border-radius: 2px;
    box-shadow: 0 0 14px 2px rgba(255,90,31,0.7);
    position: relative;
    transition: width 0.04s linear;
  }
  #progress-dot {
    position: absolute;
    right: -4px;
    top: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FF7A3F;
    box-shadow: 0 0 10px 3px rgba(255,90,31,0.9);
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui-overlay">
  <div id="welcome-text">Welcome back, Admin</div>
  <div id="status-text">Initializing Dashboard<span id="dots"></span></div>
  <div id="progress-track">
    <div id="progress-fill"><div id="progress-dot"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════
//  DRIVE & GO — 3D Loading Screen  |  Three.js procedural car animation
//  A stylized low-poly car drives from left to right into a neon-lit garage
// ════════════════════════════════════════════════════════════════════════════

const container = document.getElementById('canvas-container');
let W = container.clientWidth || window.innerWidth;
let H = container.clientHeight || Math.round(window.innerHeight * 0.74);

// ── Renderer ────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x080810, 1);
container.appendChild(renderer.domElement);

// ── Scene & Fog ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x080810, 35, 95);

// ── Camera ──────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(48, W / H, 0.1, 200);
camera.position.set(-5, 5.5, 15);
camera.lookAt(2, 1.2, 0);

// ── Lights ──────────────────────────────────────────────────────────────────
// Deep ambient (night atmosphere)
scene.add(new THREE.AmbientLight(0x141430, 1.2));

// Hemisphere: sky=deep purple, ground=dark
const hemi = new THREE.HemisphereLight(0x2a1a4a, 0x08080f, 0.6);
scene.add(hemi);

// Overhead fill — warm white
const fillLight = new THREE.PointLight(0xfff5e0, 0.8, 50);
fillLight.position.set(0, 15, 5);
scene.add(fillLight);

// ── ROAD ────────────────────────────────────────────────────────────────────
const roadMat = new THREE.MeshStandardMaterial({ color: 0x0c0c18, roughness: 0.95, metalness: 0.05 });
const road = new THREE.Mesh(new THREE.PlaneGeometry(9, 140), roadMat);
road.rotation.x = -Math.PI / 2;
road.receiveShadow = true;
scene.add(road);

// Road dashes
const dashMat = new THREE.MeshStandardMaterial({ color: 0x3a3a55, roughness: 1 });
for (let z = -65; z < 65; z += 7) {
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 3.5), dashMat);
  dash.rotation.x = -Math.PI / 2;
  dash.position.set(0, 0.01, z);
  scene.add(dash);
}

// Neon edge strips
const edgeMat = new THREE.MeshStandardMaterial({
  color: 0xff5a1f, emissive: 0xff5a1f, emissiveIntensity: 0.5, roughness: 0.3
});
[-4.1, 4.1].forEach(x => {
  const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 140), edgeMat);
  edge.rotation.x = -Math.PI / 2;
  edge.position.set(x, 0.01, 0);
  scene.add(edge);
});

// Sidewalk / kerb
const kerbMat = new THREE.MeshStandardMaterial({ color: 0x181828, roughness: 0.9 });
[-5.5, 5.5].forEach(x => {
  const kerb = new THREE.Mesh(new THREE.BoxGeometry(2, 0.12, 140), kerbMat);
  kerb.position.set(x, 0.06, 0);
  scene.add(kerb);
});

// ── BUILD CAR (procedural geometry) ─────────────────────────────────────────
function buildCar() {
  const car = new THREE.Group();

  // Materials
  const bodyMat   = new THREE.MeshStandardMaterial({ 
    color: 0xff5a1f, 
    emissive: 0xff3a00, 
    emissiveIntensity: 0.45, 
    roughness: 0.15, 
    metalness: 0.85, 
    transparent: true, 
    opacity: 0.92 
  });
  const darkMat   = new THREE.MeshStandardMaterial({ color: 0x0a0a16, roughness: 0.55, metalness: 0.1 });
  const glassMat  = new THREE.MeshStandardMaterial({ color: 0x4477bb, roughness: 0.05, metalness: 0.9, opacity: 0.55, transparent: true });
  const chromeMat = new THREE.MeshStandardMaterial({ color: 0xbbbbcc, roughness: 0.08, metalness: 0.98 });
  const hLightMat = new THREE.MeshStandardMaterial({ color: 0xffe888, emissive: 0xffe888, emissiveIntensity: 2.5 });
  const tLightMat = new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0xff3333, emissiveIntensity: 2.0 });
  const tireMat   = new THREE.MeshStandardMaterial({ color: 0x111114, roughness: 0.95 });
  const rimMat    = new THREE.MeshStandardMaterial({ color: 0x7788aa, roughness: 0.15, metalness: 0.95 });

  // ── Chassis / main body ──
  const body = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.55, 2.0), bodyMat);
  body.position.set(0, 0.55, 0);
  body.castShadow = true;
  car.add(body);

  // ── Roof cabin ──
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.72, 1.82), bodyMat);
  cabin.position.set(-0.15, 1.18, 0);
  cabin.castShadow = true;
  car.add(cabin);

  // ── Hood (raised front) ──
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.2, 1.9), bodyMat);
  hood.position.set(1.28, 0.88, 0);
  car.add(hood);

  // ── Windshield ──
  const ws = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.68, 1.65), glassMat);
  ws.position.set(0.88, 1.02, 0);
  car.add(ws);

  // ── Rear window ──
  const rw = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.58, 1.6), glassMat);
  rw.position.set(-1.28, 1.0, 0);
  car.add(rw);

  // ── Side windows ──
  [-0.92, 0.92].forEach(z => {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.48, 0.06), glassMat);
    sw.position.set(-0.1, 1.22, z);
    car.add(sw);
  });

  // ── Headlights ──
  [-0.6, 0.6].forEach(z => {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.2, 0.38), hLightMat);
    hl.position.set(1.9, 0.65, z);
    car.add(hl);
  });

  // ── Tail lights ──
  [-0.55, 0.55].forEach(z => {
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 0.38), tLightMat);
    tl.position.set(-1.9, 0.65, z);
    car.add(tl);
  });

  // ── Bumpers (chrome) ──
  const fb = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.28, 1.88), chromeMat);
  fb.position.set(1.92, 0.34, 0);
  car.add(fb);
  const rb = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.28, 1.88), chromeMat);
  rb.position.set(-1.92, 0.34, 0);
  car.add(rb);

  // ── Underbody ──
  const ub = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.14, 1.65), darkMat);
  ub.position.set(0, 0.26, 0);
  car.add(ub);

  // ── Side skirts ──
  [-1.01, 1.01].forEach(z => {
    const sk = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.12, 0.08), darkMat);
    sk.position.set(0, 0.38, z);
    car.add(sk);
  });

  // ── Wheels ──
  const wheelPositions = [
    [1.35, 0,  1.08],
    [1.35, 0, -1.08],
    [-1.35, 0,  1.08],
    [-1.35, 0, -1.08],
  ];
  const wheelGroups = [];
  wheelPositions.forEach(([wx, wy, wz]) => {
    const wg = new THREE.Group();

    // Tire
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.24, 20), tireMat);
    tire.rotation.z = Math.PI / 2;
    tire.castShadow = true;
    wg.add(tire);

    // Rim disc
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.26, 10), rimMat);
    rim.rotation.z = Math.PI / 2;
    wg.add(rim);

    // 5 spokes
    for (let s = 0; s < 5; s++) {
      const angle = (s / 5) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.05, 0.04), rimMat);
      spoke.rotation.x = angle;
      spoke.position.y = Math.sin(angle) * 0.13;
      spoke.position.z = Math.cos(angle) * 0.13;
      wg.add(spoke);
    }

    wg.position.set(wx, wy, wz);
    car.add(wg);
    wheelGroups.push(wg);
  });

  // ── Headlight SpotLights ──
  const sl1 = new THREE.SpotLight(0xffe8aa, 4, 30, Math.PI / 7, 0.45, 1);
  sl1.position.set(2.0, 0.65, 0.6);
  sl1.target.position.set(18, 0, 0.6);
  car.add(sl1); car.add(sl1.target);

  const sl2 = new THREE.SpotLight(0xffe8aa, 4, 30, Math.PI / 7, 0.45, 1);
  sl2.position.set(2.0, 0.65, -0.6);
  sl2.target.position.set(18, 0, -0.6);
  car.add(sl2); car.add(sl2.target);

  // ── Exhaust glow ──
  const exh = new THREE.PointLight(0xff6622, 1.2, 3);
  exh.position.set(-2.0, 0.35, 0);
  car.add(exh);

  return { car, wheelGroups };
}

const { car, wheelGroups } = buildCar();
car.position.set(-28, 0.4, 0);
scene.add(car);

// ── GARAGE ───────────────────────────────────────────────────────────────────
function buildGarage() {
  const g = new THREE.Group();
  const wallMat   = new THREE.MeshStandardMaterial({ color: 0x14142a, roughness: 0.85 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xff5a1f, emissive: 0xff5a1f, emissiveIntensity: 0.5 });
  const signMat   = new THREE.MeshStandardMaterial({ color: 0xff8c35, emissive: 0xff8c35, emissiveIntensity: 0.9 });

  // Main façade
  const facade = new THREE.Mesh(new THREE.BoxGeometry(13, 9, 1.2), wallMat);
  facade.position.set(0, 4.5, 0);
  facade.castShadow = true;
  g.add(facade);

  // Side walls
  [-6.2, 6.2].forEach(x => {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(1.2, 9, 9), wallMat);
    sw.position.set(x, 4.5, -4);
    g.add(sw);
  });

  // Roof
  const roof = new THREE.Mesh(new THREE.BoxGeometry(14.4, 0.6, 10), wallMat);
  roof.position.set(0, 9.3, -4);
  g.add(roof);

  // Back wall
  const back = new THREE.Mesh(new THREE.BoxGeometry(13, 9, 0.8), wallMat);
  back.position.set(0, 4.5, -8.6);
  g.add(back);

  // Door opening (black)
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(6, 5.5, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x020208 })
  );
  door.position.set(0, 2.75, 0.1);
  g.add(door);

  // Orange neon door frame
  [[6.3, 0.18, 0.2, 0, 5.59, 0.2],
   [0.18, 5.8, 0.2, -3.09, 2.9, 0.2],
   [0.18, 5.8, 0.2,  3.09, 2.9, 0.2]].forEach(([w, h, d, x, y, z]) => {
    const fr = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), accentMat);
    fr.position.set(x, y, z);
    g.add(fr);
  });

  // Interior warm light
  const intLight = new THREE.PointLight(0xff7700, 3.0, 18);
  intLight.position.set(0, 4, -4);
  g.add(intLight);

  // "DRIVE & GO" sign bar
  const sign = new THREE.Mesh(new THREE.BoxGeometry(8, 0.85, 0.25), signMat);
  sign.position.set(0, 7.8, 0.2);
  g.add(sign);

  // Accent stripe below sign
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 0.2), accentMat);
  stripe.position.set(0, 7.35, 0.2);
  g.add(stripe);

  // Rooftop neon bar
  const roofBar = new THREE.Mesh(new THREE.BoxGeometry(13, 0.15, 0.2), accentMat);
  roofBar.position.set(0, 9.0, 0.2);
  g.add(roofBar);

  // Ground contact glow
  const groundGlow = new THREE.PointLight(0xff6622, 1.5, 8);
  groundGlow.position.set(0, 0.2, 0.5);
  g.add(groundGlow);

  return g;
}

const garage = buildGarage();
garage.position.set(32, 0, 0);
scene.add(garage);

// ── STREET LAMPS ─────────────────────────────────────────────────────────────
function buildLamp(x, z) {
  const g = new THREE.Group();
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x252540, roughness: 0.7 });
  const bulbMat = new THREE.MeshStandardMaterial({ color: 0xfff4bb, emissive: 0xfff4bb, emissiveIntensity: 2.0 });

  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 5.5, 8), poleMat);
  pole.position.set(0, 2.75, 0);
  g.add(pole);

  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.08, 0.08), poleMat);
  arm.position.set(0.55, 5.55, 0);
  g.add(arm);

  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 10), bulbMat);
  bulb.position.set(1.1, 5.45, 0);
  g.add(bulb);

  const pl = new THREE.PointLight(0xfff0b0, 1.8, 14);
  pl.position.set(1.1, 5.2, 0);
  pl.castShadow = false;
  g.add(pl);

  g.position.set(x, 0, z);
  return g;
}

for (let z = -60; z < 60; z += 12) {
  scene.add(buildLamp(-5.5, z));
  scene.add(buildLamp(5.5, z));
}

// ── BACKGROUND CITY SILHOUETTE ───────────────────────────────────────────────
const bgMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1e, roughness: 1 });
[
  [-28, 0, -28, 7, 20, 4],
  [-18, 0, -28, 5, 14, 4],
  [-10, 0, -28, 6, 17, 4],
  [10,  0, -28, 7, 22, 4],
  [20,  0, -28, 5, 12, 4],
  [30,  0, -28, 8, 19, 4],
].forEach(([x, y, z, w, h, d]) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bgMat);
  b.position.set(x, h / 2, z);
  scene.add(b);
});

// Window lights on buildings
const winMat = new THREE.MeshStandardMaterial({ color: 0xffeebb, emissive: 0xffeebb, emissiveIntensity: 1 });
for (let i = 0; i < 60; i++) {
  const wx = (Math.random() - 0.5) * 55;
  const wy = Math.random() * 15 + 1;
  const w  = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.1), winMat);
  w.position.set(wx, wy, -26.5);
  scene.add(w);
}

// ── STARS ────────────────────────────────────────────────────────────────────
const starPositions = [];
for (let i = 0; i < 500; i++) {
  starPositions.push(
    (Math.random() - 0.5) * 250,
    Math.random() * 55 + 8,
    (Math.random() - 0.5) * 250
  );
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
const stars = new THREE.Points(starGeo,
  new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.65 }));
scene.add(stars);

// ── MOTION BLUR STREAKS (speed lines) ────────────────────────────────────────
const streakMat = new THREE.MeshStandardMaterial({
  color: 0xff6622, emissive: 0xff5a1f, emissiveIntensity: 0.6,
  transparent: true, opacity: 0.3
});
const streaks = [];
for (let i = 0; i < 8; i++) {
  const len = Math.random() * 3 + 1.5;
  const s = new THREE.Mesh(new THREE.BoxGeometry(len, 0.03, 0.03), streakMat.clone());
  s.position.set(-2 - i * 0.5, 0.5 + Math.random() * 1.2, (Math.random() - 0.5) * 1.5);
  car.add(s);
  streaks.push(s);
}

// ── ANIMATION STATE ──────────────────────────────────────────────────────────
let carX = -28;
const carTargetX = 24;
let started = false;
let wheelRot = 0;
let elapsed = 0;

// Easing
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// ── UI ANIMATIONS ────────────────────────────────────────────────────────────
setTimeout(() => {
  document.getElementById('welcome-text').classList.add('show');
  document.getElementById('status-text').classList.add('show');
  started = true;
}, 350);

// Animated dots
let dotCount = 0;
setInterval(() => {
  dotCount = (dotCount + 1) % 4;
  document.getElementById('dots').textContent = '.'.repeat(dotCount);
}, 420);

// Progress bar (fills over ~2.2 seconds)
let pct = 0;
const progressInterval = setInterval(() => {
  pct = Math.min(pct + 1.2, 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  if (pct >= 100) clearInterval(progressInterval);
}, 26);

// ── RENDER LOOP ──────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  elapsed += delta;

  if (started && carX < carTargetX) {
    const speed = 9.5 + (1 - (carTargetX - carX) / (carTargetX + 28)) * 4;
    carX = Math.min(carX + delta * speed, carTargetX);
    car.position.x = carX;

    // Wheel rotation
    wheelRot -= delta * 25;
    wheelGroups.forEach(wg => { wg.rotation.x = wheelRot; });

    // Micro-vibration (road bumps)
    car.position.y = 0.4 + Math.sin(elapsed * 22) * 0.013;
    car.rotation.z = Math.sin(elapsed * 14) * 0.007;

    // Streak opacity based on speed
    const speedFactor = Math.min(speed / 12, 1);
    streaks.forEach((s, i) => {
      s.material.opacity = speedFactor * 0.3 * (1 - i * 0.1);
      s.scale.x = 1 + speedFactor * 0.5;
    });
  } else {
    streaks.forEach(s => { s.material.opacity = 0; });
  }

  // Camera: cinematic follow pan
  const camFollowX = Math.min(carX * 0.18 + 1.5, 7);
  camera.position.x += (camFollowX - camera.position.x) * 0.025;
  camera.lookAt(carX * 0.25 + 1, 1.5, 0);

  // Garage interior glow pulse
  const garagePulse = 1 + Math.sin(elapsed * 2.5) * 0.15;
  // (access garage lights indirectly through scene traversal is expensive; skip)

  // Stars slow rotation
  stars.rotation.y = elapsed * 0.002;

  // Ambient light subtle pulse (atmospheric)
  fillLight.intensity = 0.7 + Math.sin(elapsed * 1.8) * 0.1;

  renderer.render(scene, camera);
}
animate();

// ── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  W = container.clientWidth;
  H = container.clientHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ── Public API: C# can call this to set admin name ───────────────────────────
window.setAdminName = function(name) {
  const el = document.getElementById('welcome-text');
  if (el) el.textContent = 'Welcome back, ' + name;
};
</script>
</body>
</html>
