<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveAndGo Dashboard</title>
  <meta name="description" content="DriveAndGo Admin Dashboard — Real-time fleet, revenue &amp; rental metrics." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════════════════════════════════
       CSS VARIABLE DUAL-THEME SYSTEM
       C# calls: window.setDashboardTheme('dark'|'light')
       ══════════════════════════════════════════════════════════════════ */
    :root,
    [data-theme="dark"] {
      --bg-main:      #07070e;
      --bg-card:      rgba(255, 255, 255, 0.030);
      --bg-card-h:    rgba(255, 255, 255, 0.048);
      --bg-input:     rgba(255, 255, 255, 0.06);
      --text-primary: #e2e8f0;
      --text-sub:     rgba(255, 255, 255, 0.30);
      --text-muted:   rgba(255, 255, 255, 0.18);
      --border:       rgba(255, 255, 255, 0.07);
      --border-h:     rgba(255, 255, 255, 0.16);
      --scrollbar:    rgba(255, 255, 255, 0.09);
      --accent:       #f97316;
      --accent-glow:  rgba(249, 115, 22, 0.28);
      --card-shine:   rgba(255, 255, 255, 0.04);
      --green:        #34d399;
      --red:          #f87171;
    }

    [data-theme="light"] {
      --bg-main:      #f1f5f9;
      --bg-card:      rgba(255, 255, 255, 0.80);
      --bg-card-h:    rgba(255, 255, 255, 0.95);
      --bg-input:     rgba(0, 0, 0, 0.04);
      --text-primary: #0f172a;
      --text-sub:     rgba(15, 23, 42, 0.48);
      --text-muted:   rgba(15, 23, 42, 0.28);
      --border:       rgba(15, 23, 42, 0.10);
      --border-h:     rgba(15, 23, 42, 0.22);
      --scrollbar:    rgba(15, 23, 42, 0.12);
      --accent:       #ea580c;
      --accent-glow:  rgba(234, 88, 12, 0.22);
      --card-shine:   rgba(0, 0, 0, 0.02);
      --green:        #16a34a;
      --red:          #dc2626;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg-main);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: var(--text-primary);
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }

    #root { width: 100%; height: 100%; min-height: 100vh; }

    /* ── Custom scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border-radius: 4px;
      transition: background 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-glow); }

    /* ── Boot splash ──────────────────────────────────────────────────── */
    #bootloader {
      position: fixed; inset: 0;
      background: var(--bg-main);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #bootloader.hidden { opacity: 0; pointer-events: none; }
    .boot-ring {
      width: 40px; height: 40px;
      border: 3px solid var(--accent-glow);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: boot-spin 0.75s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    .boot-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Shared component styles ─────────────────────────────────────── */
    .dash-action-btn {
      display: flex; align-items: center; gap: 7px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      padding: 8px 16px;
      font-size: 12px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      user-select: none;
    }
    .dash-action-btn:hover  { background: var(--bg-card-h); border-color: var(--border-h); }
    .dash-action-btn:active { transform: scale(0.97); }
    .dash-action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .dash-ai-btn {
      display: flex; align-items: center; gap: 7px;
      background: linear-gradient(135deg, #ea580c 0%, #d97706 100%);
      border: 1px solid rgba(249, 115, 22, 0.45);
      border-radius: 10px;
      color: #fff;
      padding: 8px 18px;
      font-size: 12px; font-weight: 700; font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      user-select: none;
    }
    .dash-ai-btn:hover  { box-shadow: 0 0 36px rgba(234, 88, 12, 0.55); transform: translateY(-1px); }
    .dash-ai-btn:active { transform: scale(0.97) translateY(0); }
    .dash-ai-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

    .tbl-row { transition: background 0.15s ease; }
    .tbl-row:hover { background: var(--bg-card-h) !important; }

    .progress-track {
      background: var(--border);
      border-radius: 999px; height: 5px; overflow: hidden;
    }
    .progress-fill  {
      height: 100%; border-radius: 999px;
      transition: width 1.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0   rgba(249, 115, 22, 0.7); }
      70%  { box-shadow: 0 0 0 8px rgba(249, 115, 22, 0);   }
      100% { box-shadow: 0 0 0 0   rgba(249, 115, 22, 0);   }
    }
    .live-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: pulse-ring 2s ease-out infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { animation: spin 0.8s linear infinite; display: inline-block; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Skeleton shimmer for null metric values during first load */
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.4; background-position: 200% 0; }
      50%       { opacity: 0.9; background-position: 0% 0; }
    }
  </style>
</head>
<body>
  <div id="bootloader">
    <div class="boot-ring"></div>
    <div class="boot-label">Initializing Dashboard</div>
  </div>
  <div id="root"></div>

  <!--
    C# WinForms injects window.API_BASE_URL & window.AUTH_TOKEN
    via CoreWebView2.ExecuteScriptAsync() BEFORE navigating here.
  -->
  <script>
    window.API_BASE_URL          = window.API_BASE_URL  || (window.location.origin.startsWith('http') && !window.location.origin.includes('appassets') ? window.location.origin : 'http://localhost:5233');
    window.AUTH_TOKEN            = window.AUTH_TOKEN    || '';
    window.forceDashboardRefresh = null;
    window.refreshDashboardData  = null;

    /* ── C# Theme Bridge ─────────────────────────────────────────────────
       Called by: await _webView.CoreWebView2.ExecuteScriptAsync(
         "if(window.setDashboardTheme) window.setDashboardTheme('dark');"
       );
    ─────────────────────────────────────────────────────────────────── */
    window.setDashboardTheme = function(theme) {
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    };
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- SignalR client — for real-time push from /hubs/admin -->
  <script src="https://unpkg.com/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
  <!-- Babel Standalone: JSX → JS at runtime -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    /* ══════════════════════════════════════════════════════════════════════
       AnimatedNumber — smart prev→new animation

       • On FIRST MOUNT (or after key-change remount): animates 0 → value
         This covers: login, tab-switch, manual Refresh.
       • On VALUE PROP CHANGE without remount: animates prevSettled → newValue
         This covers: auto-poll silent updates where data increases/decreases.

       Props:
         value      – target (number | numeric-string | ₱-prefixed string)
         duration   – ms (default 900)
         prefix     – prepended to non-currency output
         suffix     – appended to non-currency output
         isCurrency – true → Intl ₱ formatting with commas + 2 decimals
    ══════════════════════════════════════════════════════════════════════ */
    function AnimatedNumber({ value, duration = 900, prefix = '', suffix = '', isCurrency = false }) {
      const parseNumeric = (v) => {
        if (v == null || v === '—') return null;
        if (typeof v === 'number') return v;
        const cleaned = String(v).replace(/[^0-9.\-]/g, '');
        return cleaned === '' ? null : parseFloat(cleaned);
      };

      const toNum = parseNumeric(value);

      // settledRef: last value we fully animated TO.
      // null  = first mount → start from 0.
      // number = start from this value for smooth prev→new animation.
      const settledRef = useRef(null);
      const rafRef     = useRef(null);

      const fmt = (num) => {
        if (isCurrency)
          return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(num);
        return `${prefix}${new Intl.NumberFormat('en-US').format(Math.round(num))}${suffix}`;
      };

      const [displayVal, setDisplayVal] = React.useState(
        () => toNum != null ? fmt(toNum) : (value ?? '—')
      );

      const easeOut = (t) => 1 - Math.pow(1 - t, 4);

      useEffect(() => {
        if (toNum == null) { setDisplayVal(value ?? '—'); return; }

        // First mount: settledRef is null → start from 0 (full count-up).
        // Subsequent prop changes: start from last settled value (smooth diff).
        const startVal = settledRef.current !== null ? settledRef.current : 0;

        cancelAnimationFrame(rafRef.current);
        const startTime = performance.now();

        const tick = (now) => {
          const elapsed  = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const current  = startVal + (toNum - startVal) * easeOut(progress);
          setDisplayVal(fmt(current));
          if (progress < 1) {
            rafRef.current = requestAnimationFrame(tick);
          } else {
            settledRef.current = toNum;   // remember for next diff-animation
            setDisplayVal(fmt(toNum));
          }
        };

        rafRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafRef.current);
      }, [toNum, duration]);

      return <span>{displayVal}</span>;
    }

    /* ══════════════════════════════════════════════════════════════════════
       MetricCard3D
       • Dynamic 3D tilt: perspective(1000px) rotateX/Y ±12deg on mouseMove
       • Radial gradient glare tracking cursor position
       • Staggered fadeInUp entrance with cubic-bezier spring
       • AnimatedNumber on the value display
    ══════════════════════════════════════════════════════════════════════ */
    function MetricCard3D({ metric, delay, mounted, syncId }) {
      const cardRef = useRef(null);
      const rafRef  = useRef(null);

      const [tilt,    setTilt]    = useState({ x: 0, y: 0 });
      const [glare,   setGlare]   = useState({ x: 50, y: 50, opacity: 0 });
      const [hovered, setHovered] = useState(false);
      const [clicked, setClicked] = useState(false);

      // ── rAF-throttled 3D math ─────────────────────────────────────────
      const handleMouseMove = useCallback((e) => {
        if (!cardRef.current) return;
        cancelAnimationFrame(rafRef.current);
        rafRef.current = requestAnimationFrame(() => {
          if (!cardRef.current) return;
          const rect    = cardRef.current.getBoundingClientRect();
          const relX    = e.clientX - rect.left;
          const relY    = e.clientY - rect.top;
          const centerX = rect.width  / 2;
          const centerY = rect.height / 2;

          // Normalize to [-1, +1] → rotateX/Y ±12deg
          const normX   = (relX - centerX) / centerX;
          const normY   = (relY - centerY) / centerY;
          setTilt({ x: normY * -12, y: normX * 12 });

          // Glare follows raw cursor %, not normalized
          setGlare({
            x:       (relX / rect.width)  * 100,
            y:       (relY / rect.height) * 100,
            opacity: 0.26,
          });
        });
      }, []);

      const handleMouseEnter = useCallback(() => setHovered(true), []);

      const handleMouseLeave = useCallback(() => {
        cancelAnimationFrame(rafRef.current);
        setHovered(false);
        setTilt({ x: 0, y: 0 });
        setGlare(g => ({ ...g, opacity: 0 }));
      }, []);

      const handleClick = () => {
        setClicked(true);
        setTimeout(() => setClicked(false), 200);
      };

      useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

      // ── Staggered entrance: opacity + translateY ──────────────────────
      const staggerStyle = {
        opacity:    mounted ? 1 : 0,
        transform:  mounted ? 'translateY(0)' : 'translateY(24px)',
        transition: `opacity 0.5s cubic-bezier(0.16,1,0.3,1) ${delay}ms,
                     transform 0.5s cubic-bezier(0.16,1,0.3,1) ${delay}ms`,
        willChange: 'opacity, transform',
      };

      // ── 3D card surface ───────────────────────────────────────────────
      const cardStyle = {
        width: '100%', height: '100%',
        position: 'relative',
        background: hovered ? 'var(--bg-card-h)' : 'var(--bg-card)',
        border: `1px solid ${hovered ? 'var(--border-h)' : 'var(--border)'}`,
        borderRadius: 16,
        padding: '20px 20px 18px',
        cursor: 'pointer',
        overflow: 'hidden',
        boxSizing: 'border-box',
        transform: hovered
          ? `perspective(1000px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg) scale(1.02) translateZ(8px)`
          : `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(${clicked ? 0.97 : 1}) translateZ(0px)`,
        transition: hovered
          ? 'transform 0.1s ease-out, border-color 0.2s ease, box-shadow 0.25s ease, background 0.2s ease'
          : 'transform 0.5s cubic-bezier(0.16,1,0.3,1), border-color 0.3s ease, box-shadow 0.35s ease, background 0.3s ease',
        boxShadow: hovered
          ? `0 20px 40px ${metric.glow}, 0 0 0 1px rgba(255,255,255,0.05)`
          : '0 4px 16px rgba(0,0,0,0.25)',
        willChange: 'transform',
        transformStyle: 'preserve-3d',
      };

      // ── Radial glare overlay (tracks cursor) ─────────────────────────
      const glareStyle = {
        position: 'absolute', inset: 0,
        borderRadius: 16,
        pointerEvents: 'none',
        background: `radial-gradient(circle at ${glare.x}% ${glare.y}%, rgba(255,255,255,${glare.opacity}) 0%, rgba(255,255,255,0) 65%)`,
        transition: hovered ? 'none' : 'opacity 0.4s ease',
        zIndex: 2,
      };

      // Robust numeric parser — handles number, string, ₱-prefixed, or comma-formatted.
      // This covers every serialization format the C# API might return.
      const isCurrency = Boolean(metric.isCurrency);
      const numRaw = (metric.value != null && metric.value !== '—')
        ? Number(String(metric.value).replace(/[^0-9.-]+/g, ''))
        : null;
      // Guard NaN from empty strings
      const safeNum = (numRaw != null && !isNaN(numRaw)) ? numRaw : null;

      return (
        <div style={staggerStyle}>
          <div
            ref={cardRef}
            style={cardStyle}
            onMouseMove={handleMouseMove}
            onMouseEnter={handleMouseEnter}
            onMouseLeave={handleMouseLeave}
            onClick={handleClick}
          >
            {/* Radial glare overlay */}
            <div style={glareStyle} />

            {/* Top shine */}
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, height: '50%',
              borderRadius: '16px 16px 0 0',
              background: 'linear-gradient(180deg, var(--card-shine) 0%, transparent 100%)',
              pointerEvents: 'none', zIndex: 1,
            }} />

            {/* Content (above glare + shine) */}
            <div style={{ position: 'relative', zIndex: 3 }}>

              {/* Icon badge */}
              <div style={{
                width: 38, height: 38, borderRadius: 10,
                background: metric.glow,
                border: `1px solid ${metric.color}35`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 18, marginBottom: 16,
                transform: hovered ? 'translateZ(10px)' : 'translateZ(0)',
                transition: 'transform 0.2s ease',
              }}>
                {metric.icon}
              </div>

              {/* Animated value — skeleton on null (first load), AnimatedNumber otherwise */}
              <div style={{
                fontSize: 28, fontWeight: 800,
                color: 'var(--text-primary)',
                lineHeight: 1, marginBottom: 4, letterSpacing: '-0.025em',
                transform: hovered ? 'translateZ(8px)' : 'translateZ(0)',
                transition: 'transform 0.2s ease',
              }}>
                {metric.value == null
                  ? <span style={{
                      display: 'inline-block', width: 72, height: 28,
                      borderRadius: 6,
                      background: 'linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.06) 75%)',
                      backgroundSize: '200% 100%',
                      animation: 'skeletonPulse 1.4s ease-in-out infinite',
                    }} />
                  : safeNum != null
                    ? <AnimatedNumber
                        key={`mc-${metric.label}-${syncId}`}
                        value={safeNum}
                        isCurrency={isCurrency}
                        duration={1000}
                      />
                    : (metric.value ?? '—')
                }
              </div>

              {/* Label */}
              <div style={{
                fontSize: 10, fontWeight: 800, color: metric.color,
                letterSpacing: '0.07em', textTransform: 'uppercase', marginBottom: 5,
              }}>
                {metric.label}
              </div>

              {/* Sub-label */}
              <div style={{ fontSize: 10, color: 'var(--text-sub)', fontWeight: 500, marginBottom: 12 }}>
                {metric.sub}
              </div>

              <div style={{ height: 1, background: 'var(--border)', marginBottom: 10 }} />

              {/* Trend indicator */}
              <div style={{
                fontSize: 10, fontWeight: 700,
                color: metric.trendUp ? 'var(--green)' : 'var(--red)',
                display: 'flex', alignItems: 'center', gap: 4,
              }}>
                <span style={{ fontSize: 11 }}>{metric.trendUp ? '↑' : '↓'}</span>
                {metric.trend}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════════
       DashboardOverview — Main Component
       • Fetches live data from /api/admin/dashboard/summary on mount
       • Exposes window.forceDashboardRefresh for C# WinForms trigger
       • AnimatedNumber counters on all metric cards
       • Staggered fadeInUp entrance (0–350ms)
       • 3D tilt + glare on metric cards
       • Live recentBookings from API (fallback to empty state)
       • CSS variable dual-theme via window.setDashboardTheme()
    ══════════════════════════════════════════════════════════════════════ */
    function DashboardOverview() {
      const [isRefreshing,   setIsRefreshing]   = useState(false);
      const [isAiProcessing, setIsAiProcessing] = useState(false);
      const [mounted,        setMounted]        = useState(false);
      const [fetchedStats,   setFetchedStats]   = useState(null);
      const [lastSyncTime,   setLastSyncTime]   = useState(new Date());
      const [recentBookings, setRecentBookings] = useState([]);
      const [fetchStatus,    setFetchStatus]    = useState('idle');
      const [fetchError,     setFetchError]     = useState(null);
      const [syncId,         setSyncId]         = useState(() => Date.now());
      // latencyMs: actual round-trip time in ms from the last successful API fetch.
      // This is REAL latency — measured with performance.now() around the fetch() call.
      const [latencyMs,      setLatencyMs]      = useState(null);

      // ── DATA FETCHING ─────────────────────────────────────────────────
      // forceReset = true  → updates syncId, AnimatedNumbers remount and replay 0→value
      //                       Use for: first load, manual Refresh, tab-switch.
      // forceReset = false → does NOT update syncId, AnimatedNumbers animate prev→new value
      //                       Use for: silent 30s auto-poll (smooth diff animation).
      const fetchDashboardData = useCallback(async (forceReset = true) => {
        setIsRefreshing(true);
        if (forceReset) setFetchStatus('loading');
        setFetchError(null);
        try {
          let apiBase = (window.API_BASE_URL || 'http://localhost:5233').replace(/\/$/, '');
          if (apiBase.toLowerCase().endsWith('/api')) {
            apiBase = apiBase.substring(0, apiBase.length - 4);
          }

          const token   = window.AUTH_TOKEN || '';
          const headers = {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          };

          const endpoints = [
            `${apiBase}/api/admin/dashboard/summary`,
            `${apiBase}/api/dashboard/stats`,
            `${apiBase}/api/dashboard/summary`,
          ];

          let data = null;
          let lastStatusCode = null;
          let lastStatusText = null;

          for (const url of endpoints) {
            try {
              const fetchStart = performance.now();           // ⬅ start latency clock
              const res = await fetch(url, { headers });
              if (res.ok) {
                data = await res.json();
                setLatencyMs(Math.round(performance.now() - fetchStart)); // ⬅ real ms
                break;
              } else { lastStatusCode = res.status; lastStatusText = res.statusText; }
            } catch (e) { /* try next endpoint */ }
          }

          if (data) {
            setFetchedStats(data);

            const bookingsRaw = data.recentBookings || data.bookings;
            if (Array.isArray(bookingsRaw) && bookingsRaw.length > 0) {
              setRecentBookings(bookingsRaw.slice(0, 6));
            } else {
              setRecentBookings([]);
            }

            // Only update syncId on forced refresh — this remounts AnimatedNumber
            // and restarts from 0. Silent polls skip this so animation goes prev→new.
            if (forceReset) setSyncId(Date.now());

            setFetchStatus('success');
            setLastSyncTime(new Date());
            // NOTE: setLatencyMs is already called above inside the successful fetch loop.
          } else {
            let errorMsg = '';
            if (lastStatusCode === 401 || lastStatusCode === 403)
              errorMsg = '401 Unauthorized: Invalid or expired Auth Token.';
            else if (lastStatusCode === 404)
              errorMsg = '404 Not Found: The backend API endpoint is missing or unreachable.';
            else if (lastStatusCode === 500)
              errorMsg = '500 Internal Server Error: The C# backend encountered an exception.';
            else if (lastStatusCode === 504)
              errorMsg = '504 Gateway Timeout: The database is unresponsive.';
            else if (lastStatusCode)
              errorMsg = `${lastStatusCode} Server Error: ${lastStatusText || 'The backend server returned an error'}.`;
            else
              errorMsg = `Connection Failed: Unable to connect to backend API server at ${apiBase}.`;
            throw new Error(errorMsg);
          }
        } catch (err) {
          console.error('[Dashboard] Fetch failed:', err);
          setFetchStatus('error');
          setFetchError(err.message || 'Cannot connect to database');
        } finally {
          setTimeout(() => setIsRefreshing(false), 500);
        }
      }, []);

      // ── GLOBAL C# INTEROP TRIGGERS ────────────────────────────────────
      // tab-switch / C# VisibleChanged → forceReset=true (full 0→value animation)
      useEffect(() => {
        window.forceDashboardRefresh = () => fetchDashboardData(true);
        window.refreshDashboardData  = () => fetchDashboardData(true);
        return () => {
          delete window.forceDashboardRefresh;
          delete window.refreshDashboardData;
        };
      }, [fetchDashboardData]);

      // ── FIRST LOAD ───────────────────────────────────────────────────
      useEffect(() => { fetchDashboardData(true); }, [fetchDashboardData]);

      // ── AUTO-POLL: every 30 seconds — fallback if SignalR disconnects ─
      useEffect(() => {
        const id = setInterval(() => fetchDashboardData(false), 30000);
        return () => clearInterval(id);
      }, [fetchDashboardData]);

      // ── SIGNALR: real-time push from /hubs/admin ─────────────────────
      // When any DB-mutating operation fires Clients.All.SendAsync("ReceiveDashboardUpdate")
      // the hub pushes here instantly — no polling needed.
      useEffect(() => {
        let connection = null;
        let isMounted = true;

        const connect = async () => {
          try {
            let apiBase = (window.API_BASE_URL || 'http://localhost:5233').replace(/\/$/, '');
            if (apiBase.toLowerCase().endsWith('/api')) {
              apiBase = apiBase.substring(0, apiBase.length - 4);
            }
            const hubUrl = `${apiBase}/hubs/admin`;
            const token  = window.AUTH_TOKEN || '';

            connection = new signalR.HubConnectionBuilder()
              .withUrl(hubUrl, token ? { accessTokenFactory: () => token } : {})
              .withAutomaticReconnect([0, 1000, 3000, 5000, 10000])
              .configureLogging(signalR.LogLevel.Warning)
              .build();

            // ReceiveDashboardUpdate: server pushes after any booking/vehicle/payment change
            connection.on('ReceiveDashboardUpdate', () => {
              if (isMounted) fetchDashboardData(false); // animate prev→new
            });

            connection.onreconnected(() => {
              if (isMounted) fetchDashboardData(false);
            });

            await connection.start();
            console.log('[Dashboard] SignalR connected:', hubUrl);
          } catch (err) {
            console.warn('[Dashboard] SignalR unavailable, using 30s poll fallback:', err.message);
          }
        };

        connect();
        return () => {
          isMounted = false;
          if (connection) connection.stop();
        };
      }, [fetchDashboardData]);

      // ── DOUBLE-rAF STAGGER TRIGGER ─────────────────────────────────────
      // Ensures CSS transitions fire AFTER first paint (avoids invisible flash)
      useEffect(() => {
        const id = requestAnimationFrame(() =>
          requestAnimationFrame(() => setMounted(true))
        );
        return () => cancelAnimationFrame(id);
      }, []);

      const d = fetchedStats || {};

      // ── Currency formatter ─────────────────────────────────────────────
      const fmt = (n) => n != null ? Number(n).toLocaleString() : null;

      // ── Metric Cards Data Matrix ───────────────────────────────────────
      const metrics = useMemo(() => [
        {
          label: 'Total Fleet',
          value: d.totalVehicles != null ? Number(d.totalVehicles) : null,
          icon: <IconFleet color="#f97316" size={20} />, color: '#f97316', glow: 'rgba(249,115,22,0.22)',
          sub: 'Registered vehicles', trend: '+2 this month', trendUp: true,
        },
        {
          label: 'Active Rentals',
          value: d.activeRentals != null ? Number(d.activeRentals) : null,
          icon: <IconRentals color="#22d3ee" size={20} />, color: '#22d3ee', glow: 'rgba(34,211,238,0.18)',
          sub: 'Ongoing trips', trend: 'Live tracking', trendUp: true,
        },
        {
          label: 'Pending Bookings',
          value: (d.pendingBookings ?? d.pendingRentals) != null
            ? Number(d.pendingBookings ?? d.pendingRentals)
            : null,
          icon: <IconBookings color="#a78bfa" size={20} />, color: '#a78bfa', glow: 'rgba(167,139,250,0.18)',
          sub: 'Awaiting confirmation', trend: 'Action required', trendUp: false,
        },
        {
          // Pass raw numeric value + explicit isCurrency flag.
          // AnimatedNumber uses Intl.NumberFormat('en-PH', currency:'PHP') → ₱1,234,567.00
          label: 'Total Revenue',
          value: d.totalRevenue != null
            ? Number(d.totalRevenue)
            : d.revenueThisMonth != null
              ? Number(d.revenueThisMonth)
              : null,
          isCurrency: true,
          icon: <IconRevenue color="#34d399" size={20} />, color: '#34d399', glow: 'rgba(52,211,153,0.18)',
          sub: 'All-time earnings', trend: '+14% vs last mo.', trendUp: true,
        },
        {
          label: 'Total Drivers',
          value: d.totalDrivers != null ? Number(d.totalDrivers) : null,
          icon: <IconDrivers color="#fb923c" size={20} />, color: '#fb923c', glow: 'rgba(251,146,60,0.18)',
          sub: 'Registered drivers', trend: 'Active workforce', trendUp: true,
        },
        {
          label: 'Maintenance Due',
          value: (d.maintenanceDue ?? d.overdue) != null
            ? Number(d.maintenanceDue ?? d.overdue)
            : null,
          icon: <IconMaintenance color="#f43f5e" size={20} />, color: '#f43f5e', glow: 'rgba(244,63,94,0.18)',
          sub: 'Vehicles overdue', trend: 'Schedule service', trendUp: false,
        },
        {
          // Pass raw numeric value + explicit isCurrency flag.
          label: 'Monthly Revenue',
          value: d.revenueThisMonth != null
            ? Number(d.revenueThisMonth)
            : d.monthlyRevenue != null
              ? Number(d.monthlyRevenue)
              : null,
          isCurrency: true,
          icon: <IconChart color="#facc15" size={20} />, color: '#facc15', glow: 'rgba(250,204,21,0.18)',
          sub: 'This month', trend: 'On target', trendUp: true,
        },
        {
          label: 'Open Incidents',
          value: (d.openIssues ?? d.incidents) != null
            ? Number(d.openIssues ?? d.incidents)
            : null,
          icon: <IconIncident color="#fb7185" size={20} />, color: '#fb7185', glow: 'rgba(251,113,133,0.18)',
          sub: 'Pending reports', trend: 'All clear', trendUp: true,
        },
      ], [d]);

      // ── Quick Stats KPIs — 100% Dynamic DB Telemetry (0%/dash when offline) ─────
      const isOffline = fetchStatus === 'error' || Boolean(fetchError) || !fetchedStats;

      const quickStats = useMemo(() => [
        {
          label: 'Fleet Utilization',
          value: isOffline ? 0 : Number(fetchedStats?.fleetUtilization ?? fetchedStats?.occupancyRate ?? 0),
          displayVal: isOffline ? '—' : `${Math.round(fetchedStats?.fleetUtilization ?? fetchedStats?.occupancyRate ?? 0)}%`,
          color: '#f97316'
        },
        {
          label: 'On-Time Returns',
          value: isOffline ? 0 : Number(fetchedStats?.onTimeReturns ?? 0),
          displayVal: isOffline ? '—' : `${Math.round(fetchedStats?.onTimeReturns ?? 0)}%`,
          color: '#22d3ee'
        },
        {
          label: 'Driver Rating Avg',
          value: isOffline ? 0 : Number(fetchedStats?.driverRatingPercent ?? fetchedStats?.driverRatingAvg ?? 0),
          displayVal: isOffline ? '—' : `${Math.round(fetchedStats?.driverRatingPercent ?? fetchedStats?.driverRatingAvg ?? 0)}%`,
          color: '#a78bfa'
        },
        {
          label: 'Revenue Target',
          value: isOffline ? 0 : Number(fetchedStats?.revenueTargetPct ?? fetchedStats?.revenueTarget ?? 0),
          displayVal: isOffline ? '—' : `${Math.round(fetchedStats?.revenueTargetPct ?? fetchedStats?.revenueTarget ?? 0)}%`,
          color: '#34d399'
        },
        {
          label: 'Customer Satisfaction',
          value: isOffline ? 0 : Number(fetchedStats?.customerSatPct ?? fetchedStats?.customerSatisfaction ?? 0),
          displayVal: isOffline ? '—' : `${Math.round(fetchedStats?.customerSatPct ?? fetchedStats?.customerSatisfaction ?? 0)}%`,
          color: '#facc15'
        },
      ], [fetchedStats, isOffline]);

      // ── Status pill map ────────────────────────────────────────────────
      const statusMap = {
        Active:    { bg: 'rgba(34,197,94,0.12)',  color: '#4ade80', dot: '#22c55e' },
        Pending:   { bg: 'rgba(250,204,21,0.12)', color: '#fbbf24', dot: '#f59e0b' },
        Completed: { bg: 'rgba(34,211,238,0.12)', color: '#67e8f9', dot: '#22d3ee' },
        Cancelled: { bg: 'rgba(244,63,94,0.12)',  color: '#fb7185', dot: '#f43f5e' },
      };

      // ── Stagger fade-up helper ─────────────────────────────────────────
      const fadeUp = (delay) => ({
        opacity:    mounted ? 1 : 0,
        transform:  mounted ? 'translateY(0)' : 'translateY(24px)',
        transition: `opacity 0.5s cubic-bezier(0.16,1,0.3,1) ${delay}ms,
                     transform 0.5s cubic-bezier(0.16,1,0.3,1) ${delay}ms`,
        willChange: 'opacity, transform',
      });

      // ── Bookings display: live API → empty state ───────────────────────
      const hasLiveBookings = recentBookings.length > 0;

      return (
        <div style={{
          background: 'var(--bg-main)',
          minHeight: '100%',
          padding: '26px 28px 32px',
          fontFamily: "'Inter', 'Segoe UI', system-ui, sans-serif",
          color: 'var(--text-primary)',
          boxSizing: 'border-box',
          overflowY: 'auto',
          overflowX: 'hidden',
          transition: 'background 0.35s ease, color 0.35s ease',
        }}>

          {/* ── Header — Stagger Delay 0ms ─────────────────────────────── */}
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
            marginBottom: 28, flexWrap: 'wrap', gap: 14,
            ...fadeUp(0),
          }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 5 }}>
                <span className="live-dot" />
                <h1 style={{
                  margin: 0, fontSize: 20, fontWeight: 800,
                  color: 'var(--text-primary)', letterSpacing: '-0.025em',
                }}>
                  Dashboard Overview
                </h1>
              </div>
              <p style={{
                margin: 0, fontSize: 12, color: 'var(--text-sub)',
                fontWeight: 500, paddingLeft: 18,
              }}>
                Real-time fleet activity, operational metrics &amp; revenue tracking
              </p>
            </div>

            <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              {/* Live latency indicator — real round-trip ms from last API fetch */}
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 1, paddingRight: 4 }}>
                <span style={{ fontSize: 10, color: 'var(--text-muted)', fontWeight: 600 }}>
                  Synced {lastSyncTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                </span>
                <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: '0.04em',
                  color: fetchStatus === 'error' ? 'var(--red)'
                       : isRefreshing         ? 'var(--text-muted)'
                       : latencyMs !== null && latencyMs < 150  ? '#34d399'   /* green: fast    */
                       : latencyMs !== null && latencyMs < 500  ? '#facc15'   /* yellow: medium */
                       : latencyMs !== null                     ? '#fb7185'   /* red: slow      */
                       : 'var(--accent)',
                }}>
                  {fetchStatus === 'error'
                    ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><IconIncident color="var(--red)" size={12} /> DB unreachable</span>
                    : isRefreshing
                      ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><IconRefresh color="var(--text-muted)" size={12} className="spinning" /> syncing…</span>
                      : latencyMs !== null
                        ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><IconPulse color={latencyMs < 150 ? '#34d399' : latencyMs < 500 ? '#facc15' : '#fb7185'} size={11} /> {latencyMs}ms latency</span>
                        : 'connecting…'
                  }
                </span>
              </div>
              <button
                id="btn-refresh-dashboard"
                className="dash-action-btn"
                onClick={() => fetchDashboardData(true)}
                disabled={isRefreshing}
              >
                <IconRefresh color="currentColor" size={13} className={isRefreshing ? 'spinning' : ''} />
                Refresh Data
              </button>
              <button
                id="btn-ai-insights"
                className="dash-ai-btn"
                disabled={isAiProcessing}
                onClick={() => {
                  // Send a PLAIN STRING via postMessage — C# reads it with
                  // TryGetWebMessageAsString() which only works for strings, not objects.
                  if (window.chrome && window.chrome.webview) {
                    setIsAiProcessing(true);
                    window.chrome.webview.postMessage('open_ai_insights');
                    // Reset the processing flag after 500ms
                    // (C# takes over from here and opens the dialog)
                    setTimeout(() => setIsAiProcessing(false), 500);
                  } else {
                    console.warn('[Dashboard] window.chrome.webview not available — not in WebView2 context');
                  }
                }}
              >
                <IconSparkles color="currentColor" size={13} />
                AI Business Insights
              </button>
            </div>
          </div>

          {/* ── Error Banner ────────────────────────────────────────────── */}
          {fetchStatus === 'error' && (
            <div style={{
              background: 'rgba(239, 68, 68, 0.12)',
              border: '1px solid rgba(239, 68, 68, 0.35)',
              borderRadius: 12,
              padding: '14px 18px',
              marginBottom: 20,
              color: '#f87171',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              fontSize: 13,
              fontWeight: 600,
              ...fadeUp(0),
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <IconIncident color="#f87171" size={18} />
                <span>API Error: {fetchError}</span>
              </div>
              <button className="dash-action-btn" onClick={() => fetchDashboardData(true)} style={{ borderColor: 'rgba(239,68,68,0.4)', color: '#f87171' }}>
                Retry Connection
              </button>
            </div>
          )}

          {/* ── Metric Cards — 4×2 Grid, Stagger 0ms–350ms ──────────────── */}
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(4, 1fr)',
            gap: 13,
            marginBottom: 20,
          }}>
            {metrics.map((m, i) => (
              <MetricCard3D
                key={m.label}
                metric={m}
                delay={i * 45}
                mounted={mounted}
                syncId={syncId}
              />
            ))}
          </div>

          {/* ── Bottom Split: Bookings + Quick Stats ──────────────────── */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 320px', gap: 13 }}>

            {/* Recent Bookings Table */}
            <div style={{
              background: 'var(--bg-card)',
              border: '1px solid var(--border)',
              borderRadius: 16,
              overflow: 'hidden',
              ...fadeUp(200),
            }}>
              <div style={{
                padding: '16px 20px',
                borderBottom: '1px solid var(--border)',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 800, color: 'var(--text-primary)', marginBottom: 2 }}>
                    Recent Bookings
                  </div>
                  <div style={{ fontSize: 10, color: 'var(--text-sub)' }}>
                    {hasLiveBookings ? 'Live rental transactions' : 'Latest rental transactions'}
                  </div>
                </div>
                <span style={{
                  background: 'var(--accent-glow)', color: 'var(--accent)',
                  padding: '3px 10px', borderRadius: 999,
                  fontSize: 10, fontWeight: 700,
                }}>
                  {hasLiveBookings ? `${recentBookings.length} Live` : 'No Data'}
                </span>
              </div>

              {hasLiveBookings ? (
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
                  <thead>
                    <tr style={{ borderBottom: '1px solid var(--border)' }}>
                      {['Booking ID', 'Customer', 'Vehicle', 'Date', 'Status', 'Amount'].map(h => (
                        <th key={h} style={{
                          padding: '9px 18px', textAlign: 'left',
                          color: 'var(--text-muted)', fontWeight: 700,
                          fontSize: 9, letterSpacing: '0.08em', textTransform: 'uppercase',
                        }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {recentBookings.map((b, i) => {
                      const rawStatus = b.status || b.rentalStatus || 'Pending';
                      const status    = rawStatus.charAt(0).toUpperCase() + rawStatus.slice(1).toLowerCase();
                      const s         = statusMap[status] || statusMap.Pending;
                      const amount    = (b.amount != null || b.totalAmount != null)
                        ? new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(
                            Number(b.amount ?? b.totalAmount)
                          )
                        : '—';
                      // date: C# serializes DateTime as ISO string "2025-01-15T00:00:00"
                      const dateStr   = b.date || b.rentalDate || b.startDate || '';
                      const displayDate = dateStr
                        ? (() => {
                            try {
                              return new Date(dateStr).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
                            } catch { return String(dateStr).slice(0, 10); }
                          })()
                        : '—';
                      const bookingId = b.bookingId || b.id || b.rentalId;
                      const customer  = b.customerName || b.customer || b.fullName || 'Unknown';
                      // vehicleInfo: API returns Brand+Model. vehicleName is fallback.
                      const vehicle   = b.vehicleInfo || b.vehicleName || b.vehicle || b.plateNumber || '—';

                      return (
                        <tr
                          key={bookingId}
                          className="tbl-row"
                          style={{
                            borderBottom: '1px solid var(--border)',
                            ...fadeUp(220 + i * 25),
                          }}
                        >
                          <td style={{ padding: '11px 18px', color: 'var(--accent)', fontFamily: 'monospace', fontSize: 10, fontWeight: 700 }}>
                            {String(bookingId).startsWith('BK') ? bookingId : `BK-${bookingId}`}
                          </td>
                          <td style={{ padding: '11px 18px', color: 'var(--text-primary)', fontWeight: 600 }}>{customer}</td>
                          <td style={{ padding: '11px 18px', color: 'var(--text-sub)', fontWeight: 500 }}>{vehicle}</td>
                          <td style={{ padding: '11px 18px', color: 'var(--text-sub)', fontWeight: 500 }}>{displayDate}</td>
                          <td style={{ padding: '11px 18px' }}>
                            <span style={{
                              background: s.bg, color: s.color,
                              padding: '3px 9px', borderRadius: 999,
                              fontSize: 9, fontWeight: 700, letterSpacing: '0.05em',
                              display: 'inline-flex', alignItems: 'center', gap: 5,
                            }}>
                              <span style={{ width: 4, height: 4, borderRadius: '50%', background: s.dot }} />
                              {status}
                            </span>
                          </td>
                          <td style={{ padding: '11px 18px', color: 'var(--green)', fontWeight: 700 }}>{amount}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              ) : (
                /* ── Empty state while API data loads ─────────────────── */
                <div style={{
                  display: 'flex', flexDirection: 'column',
                  alignItems: 'center', justifyContent: 'center',
                  padding: '40px 20px', gap: 10,
                }}>
                  {isRefreshing ? (
                    <>
                      <IconRefresh color="var(--accent)" size={24} className="spinning" />
                      <span style={{ fontSize: 12, color: 'var(--text-sub)' }}>Loading bookings…</span>
                    </>
                  ) : (
                    <>
                      <IconBookings color="var(--text-sub)" size={28} />
                      <span style={{ fontSize: 12, color: 'var(--text-sub)' }}>No recent bookings yet</span>
                      <span style={{ fontSize: 10, color: 'var(--text-muted)' }}>Bookings will appear here once the API returns data</span>
                    </>
                  )}
                </div>
              )}
            </div>

            {/* Quick Stats Panel */}
            <div style={{
              background: 'var(--bg-card)',
              border: '1px solid var(--border)',
              borderRadius: 16,
              padding: '20px',
              ...fadeUp(200),
            }}>
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 13, fontWeight: 800, color: 'var(--text-primary)', marginBottom: 2 }}>
                  Quick Stats
                </div>
                <div style={{ fontSize: 10, color: 'var(--text-sub)' }}>
                  Operational KPIs at a glance
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                {quickStats.map((qs, i) => (
                  <div key={qs.label} style={fadeUp(220 + i * 35)}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 7 }}>
                      <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-sub)' }}>
                        {qs.label}
                      </span>
                      <span style={{ fontSize: 11, fontWeight: 800, color: qs.color }}>
                        {/* key={syncId} forces remount → animation replays on every refresh */}
                        <AnimatedNumber
                          key={`qs-${qs.label}-${syncId}`}
                          value={qs.value}
                          suffix="%"
                          duration={1100}
                        />
                      </span>
                    </div>
                    <div className="progress-track">
                      <div
                        className="progress-fill"
                        style={{
                          width: mounted ? `${qs.value}%` : '0%',
                          background: `linear-gradient(90deg, ${qs.color}66, ${qs.color})`,
                          transitionDelay: `${300 + i * 80}ms`,
                        }}
                      />
                    </div>
                  </div>
                ))}
              </div>

              {/* Fleet Health Summary Card */}
              <div style={{
                marginTop: 22, padding: '14px 15px',
                background: 'var(--accent-glow)',
                border: '1px solid rgba(249,115,22,0.2)',
                borderRadius: 12,
                ...fadeUp(440),
              }}>
                <div style={{
                  fontSize: 9, fontWeight: 800, color: 'var(--accent)',
                  letterSpacing: '0.07em', textTransform: 'uppercase', marginBottom: 6,
                }}>
                  Fleet Health Summary
                </div>
                <div style={{ fontSize: 11, color: 'var(--text-sub)', lineHeight: 1.65 }}>
                  Overall system is{' '}
                  <span style={{ color: 'var(--green)', fontWeight: 700 }}>operational</span>.
                  No critical alerts at this time.{' '}
                  {d.maintenanceDue > 0
                    ? <span style={{ color: '#fbbf24', fontWeight: 700 }}>
                        {d.maintenanceDue} vehicle{d.maintenanceDue > 1 ? 's' : ''} due for service.
                      </span>
                    : <span>Next maintenance check in <span style={{ color: '#fbbf24', fontWeight: 700 }}>3 days</span>.</span>
                  }
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Mount React ──────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DashboardOverview />);

    // Remove boot splash after React first paint (double-rAF guarantees DOM commit)
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const bl = document.getElementById('bootloader');
        if (bl) { bl.classList.add('hidden'); setTimeout(() => bl.remove(), 420); }
      });
    });
  </script>
</body>
</html>
