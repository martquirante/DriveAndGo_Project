<!DOCTYPE html>
<html lang="en" data-theme="dark" class="bg-transparent" style="background: transparent !important;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveAndGo Notifications</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Inter & JetBrains Mono Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        html, body, #root {
            margin: 0;
            padding: 0;
            background: transparent !important;
            background-color: transparent !important;
            overflow: hidden;
        }

        /* Custom Glassmorphic Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(128, 128, 128, 0.05);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.25);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(249, 115, 22, 0.6);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-pop-in {
            animation: fadeInScale 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body class="bg-transparent" style="background: transparent !important;">

    <div id="root" class="bg-transparent" style="background: transparent !important;"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ─── SVG VECTOR ICONS (NO TEXT EMOJIS) ──────────────────────────────────
        const IconBell = ({ sz = 16, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        );

        const IconCloudRain = ({ sz = 16, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg>
        );

        const IconShieldAlert = ({ sz = 16, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        );

        const IconTrash2 = ({ sz = 16, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );

        const IconCheckCheck = ({ sz = 16, className = "" }) => (
            <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg>
        );

        const formatTime = (tStr) => {
            if (!tStr) return 'Just now';
            const s = String(tStr);
            if (s === 'Just now' || s.endsWith('m ago') || s.endsWith('h ago')) return s;
            try {
                const d = new Date(s);
                if (isNaN(d.getTime())) return s;
                const mins = Math.floor((Date.now() - d.getTime()) / 60000);
                if (mins < 1) return 'Just now';
                if (mins < 60) return `${mins}m ago`;
                const hrs = Math.floor(mins / 60);
                if (hrs < 24) return `${hrs}h ago`;
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            } catch(e) {
                return 'Just now';
            }
        };

        const NotificationsApp = () => {
            const cardRef = React.useRef(null);
            const [theme, setTheme] = useState(() => {
                return document.documentElement.getAttribute('data-theme') || 'dark';
            });
            const [notifications, setNotifications] = useState([
                {
                    id: '1',
                    type: 'flood',
                    title: 'España Blvd Flood Hazard Alert',
                    body: '1 Active Vehicle in España Blvd Flood Zone (Tire-Deep: 25-35 cm).',
                    time: 'Just now',
                    unread: true
                },
                {
                    id: '2',
                    type: 'weather',
                    title: 'PAGASA Monsoon Weather Advisory',
                    body: 'PAGASA Yellow Advisory Target: Rental Garage Hub (SJDM / Metro Manila).',
                    time: '5m ago',
                    unread: true
                }
            ]);

            useEffect(() => {
                window.setFlyoutTheme = function(mode) {
                    if (mode === 'light' || mode === 'dark') {
                        document.documentElement.setAttribute('data-theme', mode);
                        setTheme(mode);
                    }
                };

                const obs = new MutationObserver(() => {
                    const currentMode = document.documentElement.getAttribute('data-theme') || 'dark';
                    setTheme(currentMode);
                });
                obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

                // Listen to window calls from C# WinForms host
                window.setNotifications = function(jsonList) {
                    try {
                        const parsed = typeof jsonList === 'string' ? JSON.parse(jsonList) : jsonList;
                        if (Array.isArray(parsed)) {
                            setNotifications(parsed);
                        }
                    } catch(e) {
                        console.warn("Failed to parse notifications list:", e);
                    }
                };

                window.addSingleNotification = function(notifObj) {
                    try {
                        const item = typeof notifObj === 'string' ? JSON.parse(notifObj) : notifObj;
                        setNotifications(prev => [item, ...prev]);
                    } catch(e) { }
                };

                return () => obs.disconnect();
            }, []);

            useEffect(() => {
                const notifyHeight = () => {
                    if (cardRef.current && window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                        const h = cardRef.current.offsetHeight;
                        window.chrome.webview.postMessage("resize_flyout:" + h);
                    }
                };

                notifyHeight();

                let ro;
                if (cardRef.current && typeof ResizeObserver !== 'undefined') {
                    ro = new ResizeObserver(() => notifyHeight());
                    ro.observe(cardRef.current);
                }

                return () => {
                    if (ro) ro.disconnect();
                };
            }, [notifications, theme]);

            const handleItemClick = (notif) => {
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage("notification_clicked:" + JSON.stringify(notif));
                }
            };

            const handleClearAll = () => {
                setNotifications([]);
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage("notifications_cleared");
                }
            };

            const unreadCount = notifications.filter(n => n.unread).length;
            const isDark = theme === 'dark';

            return (
                <div className="w-full h-auto p-1 flex justify-end bg-transparent" style={{ background: 'transparent' }}>
                    <div ref={cardRef} className={`w-full h-auto backdrop-blur-2xl border rounded-3xl p-4 flex flex-col gap-3 animate-pop-in overflow-hidden transition-all duration-200 ${
                        isDark 
                          ? 'bg-[#0c0e1a]/95 border-white/20 text-white shadow-[0_20px_50px_rgba(0,0,0,0.9)]' 
                          : 'bg-white/95 border-slate-200/90 text-slate-900 shadow-[0_20px_50px_rgba(0,0,0,0.15)]'
                    }`}>
                        
                        {/* HEADER */}
                        <div className={`flex items-center justify-between pb-3 border-b shrink-0 ${isDark ? 'border-white/10 text-white' : 'border-slate-200/90 text-slate-900'}`}>
                            <div className="flex items-center gap-2 font-black text-sm tracking-wide">
                                <div className={`p-1.5 rounded-xl border ${
                                    isDark ? 'bg-orange-500/20 text-orange-400 border-orange-500/30' : 'bg-orange-500/15 text-orange-600 border-orange-500/25'
                                }`}>
                                    <IconBell sz={16} />
                                </div>
                                <span>Notifications</span>
                                {unreadCount > 0 && (
                                    <span className="px-2 py-0.5 rounded-full bg-orange-500 text-white font-black text-[10px] animate-pulse">
                                        {unreadCount}
                                    </span>
                                )}
                            </div>
                        </div>

                        {/* LIST CONTAINER */}
                        <div className="max-h-[280px] overflow-y-auto pr-1 my-2.5 flex flex-col gap-2 custom-scrollbar">
                            {notifications.length === 0 ? (
                                <div className={`py-8 flex flex-col items-center justify-center text-center p-4 ${isDark ? 'text-gray-400' : 'text-slate-400'}`}>
                                    <div className={`w-10 h-10 rounded-2xl border flex items-center justify-center mb-2 ${
                                        isDark ? 'bg-white/5 border-white/10 text-gray-500' : 'bg-slate-100 border-slate-200 text-slate-400'
                                    }`}>
                                        <IconCheckCheck sz={20} />
                                    </div>
                                    <span className="text-xs font-semibold">No active notifications</span>
                                    <span className="text-[10px] opacity-75 mt-0.5">All fleet advisories are cleared</span>
                                </div>
                            ) : (
                                notifications.map((n, idx) => {
                                    let icon = <IconBell sz={16} className={isDark ? "text-blue-400" : "text-blue-600"} />;
                                    let badgeBg = isDark ? "bg-blue-500/20 text-blue-400 border-blue-500/30" : "bg-blue-500/15 text-blue-600 border-blue-500/25";

                                    const rawTitle = String(n.title || n.Title || n.titleText || 'Fleet Advisory');
                                    const rawBody = String(n.body || n.Body || n.bodyText || 'Action required for fleet unit.');

                                    const displayTitle = rawTitle.trim() || 'Fleet Advisory';
                                    const displayBody = rawBody.trim() || 'Notification Details';
                                    const tLow = displayTitle.toLowerCase();
                                    const displayTime = formatTime(n.time || n.Time);

                                    if (tLow.includes('weather') || tLow.includes('pagasa') || tLow.includes('monsoon')) {
                                        icon = <IconCloudRain sz={16} className={isDark ? "text-amber-400" : "text-amber-600"} />;
                                        badgeBg = isDark ? "bg-amber-500/20 text-amber-400 border-amber-500/30" : "bg-amber-500/15 text-amber-600 border-amber-500/25";
                                    } else if (tLow.includes('flood') || tLow.includes('hazard')) {
                                        icon = <IconShieldAlert sz={16} className={isDark ? "text-cyan-400" : "text-cyan-600"} />;
                                        badgeBg = isDark ? "bg-cyan-500/20 text-cyan-400 border-cyan-500/30" : "bg-cyan-500/15 text-cyan-600 border-cyan-500/25";
                                    } else if (tLow.includes('decommission') || tLow.includes('audit')) {
                                        icon = <IconTrash2 sz={16} className={isDark ? "text-red-400" : "text-red-600"} />;
                                        badgeBg = isDark ? "bg-red-500/20 text-red-400 border-red-500/30" : "bg-red-500/15 text-red-600 border-red-500/25";
                                    }

                                    const itemBg = isDark
                                        ? (n.unread ? 'bg-white/[0.08] border-white/20 shadow-md hover:bg-white/[0.15] hover:border-orange-500/60' : 'bg-white/[0.02] border-white/5 opacity-75 hover:bg-white/[0.12] hover:border-orange-500/60')
                                        : (n.unread ? 'bg-slate-50 border-slate-200/90 shadow-sm hover:bg-slate-100 hover:border-orange-500/60' : 'bg-slate-100/40 border-slate-100 opacity-80 hover:bg-slate-100 hover:border-orange-500/60');

                                    return (
                                        <div
                                            key={n.id || idx}
                                            onClick={() => handleItemClick(n)}
                                            className={`p-3 rounded-2xl border transition-all cursor-pointer flex items-start gap-3 hover:scale-[1.015] active:scale-[0.99] ${itemBg}`}
                                        >
                                            <div className={`p-2 rounded-xl border shrink-0 mt-0.5 ${badgeBg}`}>
                                                {icon}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center justify-between gap-2 mb-1">
                                                    <h4 className={`font-black text-xs leading-snug truncate ${isDark ? 'text-white' : 'text-slate-900'}`}>{displayTitle}</h4>
                                                    <span className={`text-[10px] font-semibold shrink-0 whitespace-nowrap ${isDark ? 'text-gray-400' : 'text-slate-500'}`}>{displayTime}</span>
                                                </div>
                                                <p className={`text-[11px] leading-relaxed break-words font-medium ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>{displayBody}</p>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>

                        {/* FOOTER */}
                        {notifications.length > 0 && (
                            <div className={`pt-2 border-t flex justify-center shrink-0 ${isDark ? 'border-white/10' : 'border-slate-200/90'}`}>
                                <button
                                    onClick={handleClearAll}
                                    className={`text-xs font-black transition-colors uppercase tracking-wider py-1 px-5 rounded-xl ${
                                        isDark 
                                          ? 'text-orange-400 hover:text-orange-300 hover:bg-orange-500/10' 
                                          : 'text-orange-600 hover:text-orange-700 hover:bg-orange-500/10'
                                    }`}
                                >
                                    Clear all
                                </button>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NotificationsApp />);
    </script>
</body>
</html>
