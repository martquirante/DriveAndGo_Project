<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveAndGo Chat Overlay</title>


  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN for Glassmorphism & Utilities -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #07070e;
      font-family: 'Inter', system-ui, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }
    #root { width: 100%; height: 100%; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-chat-bubble {
      animation: fadeInUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes aiDotBounce {
      0%, 80%, 100% {
        transform: translateY(0) scale(0.85);
        opacity: 0.35;
      }
      40% {
        transform: translateY(-9px) scale(1.3);
        opacity: 1;
        filter: drop-shadow(0 4px 12px rgba(234, 88, 12, 0.9));
      }
    }

    @keyframes aiSparklePulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
      50%      { transform: scale(1.15) rotate(15deg); opacity: 1; filter: drop-shadow(0 0 10px rgba(234, 88, 12, 0.8)); }
    }

    :root {
      color-scheme: dark !important;
    }

    html, body, #root, * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
    }

    ::-webkit-scrollbar {
      width: 5px !important;
      height: 5px !important;
      background-color: transparent !important;
    }
    ::-webkit-scrollbar-track {
      background: transparent !important;
      background-color: transparent !important;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16) !important;
      border-radius: 999px !important;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(234, 88, 12, 0.6) !important;
    }
    ::-webkit-scrollbar-corner {
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 & ReactDOM (Local Offline Fallback) -->
  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>

  <!-- Recharts (Local Offline Fallback) -->
  <script src="Recharts.js"></script>

  <!-- Babel Standalone (Local Offline Fallback) -->
  <script src="babel.min.js"></script>

  <!-- Explicit App Loader to avoid Babel async race conditions -->
  <script>
    async function initReactApp() {
      const rootDiv = document.getElementById('root');
      try {
        rootDiv.innerHTML = '<div class="flex flex-col h-screen items-center justify-center bg-[#07070e] text-slate-400 text-xs font-sans gap-2"><div class="w-5 h-5 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div><span>Loading Drive&amp;Go AI Interface...</span></div>';

        // 1. Wait for Babel to load (WebView2 can sometimes delay scripts)
        let babelAttempts = 0;
        while (typeof Babel === 'undefined' && babelAttempts < 50) {
          await new Promise(r => setTimeout(r, 100));
          babelAttempts++;
        }
        if (typeof Babel === 'undefined') {
          throw new Error("Babel compiler failed to load locally. Please rebuild the project to copy assets.");
        }

        // 2. Fetch all JSX files sequentially to maintain dependency order
        const files = ['GenUiBubble.jsx', 'CommandPalette.jsx', 'ChatOverlay.jsx'];
        let combinedJsx = '';
        
        for (const file of files) {
          const res = await fetch(file);
          if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${file}`);
          combinedJsx += await res.text() + '\n\n';
        }

        // 3. Append the root app component and mount logic
        combinedJsx += `
          class ErrorBoundary extends React.Component {
            constructor(props) {
              super(props);
              this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
              return { hasError: true, error };
            }
            componentDidCatch(error, info) {
              console.error("ChatOverlay crashed:", error, info);
            }
            render() {
              if (this.state.hasError) {
                return (
                  <div className="flex flex-col h-screen items-center justify-center bg-[#07070e] text-red-400 text-xs p-4 text-center">
                    <span className="font-bold mb-1">⚠️ Interface Runtime Error</span>
                    <span>{this.state.error?.message || "An unexpected error occurred."}</span>
                  </div>
                );
              }
              return this.props.children;
            }
          }

          function StandaloneChatApp() {
            const ChatComp = window.ChatOverlay || (typeof ChatOverlay !== 'undefined' ? ChatOverlay : null);
            if (!ChatComp) {
              return (
                <div className="flex flex-col h-screen items-center justify-center bg-[#07070e] text-red-400 text-xs p-4 text-center">
                  <span className="font-bold mb-1">⚠️ Component Resolution Error</span>
                  <span>ChatOverlay is not defined.</span>
                </div>
              );
            }
            return (
              <ErrorBoundary>
                <ChatComp />
              </ErrorBoundary>
            );
          }

          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(<StandaloneChatApp />);
        `;

        // 4. Transpile combined JSX to JS using Babel Standalone
        const transformedCode = Babel.transform(combinedJsx, { 
          presets: ['react'] 
        }).code;

        // 5. Inject and execute the transpiled code
        const script = document.createElement('script');
        script.text = transformedCode;
        document.body.appendChild(script);

      } catch (error) {
        console.error('Failed to initialize React App:', error);
        rootDiv.innerHTML = '<div class="flex flex-col h-screen items-center justify-center bg-[#07070e] text-red-400 text-xs p-4 text-center"><span class="font-bold mb-1">⚠️ Initialization Error</span><span>' + error.message + '</span></div>';
      }
    }

    // Start initialization when the DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initReactApp);
    } else {
      initReactApp();
    }
  </script>
</body>
</html>
