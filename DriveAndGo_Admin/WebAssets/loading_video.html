<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #0B101E; /* matches form card color */
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .video-container {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background-color: #000;
    border-radius: 8px; /* Sleek rectangular corners */
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.9;
  }
  /* Vignette filter overlay */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 30%, rgba(5, 11, 20, 0.5) 100%);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="video-container">
  <video autoplay loop muted playsinline>
    <source src="../Resources/loadingScreenVideo/loadingScreenVideo-enhanced.mp4" type="video/mp4">
  </video>
  <div class="vignette"></div>
</div>
</body>
</html>
