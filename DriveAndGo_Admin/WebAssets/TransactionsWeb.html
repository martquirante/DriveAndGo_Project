      var errBox = document.getElementById('fatal-error-banner');
      if (!errBox) {

        errBox.id = 'fatal-error-banner';
        errBox.style = 'position:fixed; top:16px; left:16px; right:16px; z-index:9999999; background:#7f1d1d; color:#fee2e2; padding:18px; border-radius:14px; font-family:monospace; border:2px solid #ef4444; box-shadow:0 20px 40px rgba(0,0,0,0.85);';
        document.body.appendChild(errBox);
      }
      errBox.innerHTML = '<h3 style="color:white; font-size:16px; font-weight:bold; margin-bottom:8px;">⚠️ JavaScript Runtime Error:</h3>' +
                         '<div style="font-size:13px; margin-bottom:6px;"><strong>Message:</strong> ' + msg + '</div>' +
                         '<div style="font-size:12px; color:#fca5a5;"><strong>Location:</strong> Line ' + line + ', Column ' + col + '</div>' +
                         '<pre style="margin-top:10px; background:#450a0a; padding:10px; border-radius:8px; font-size:11px; overflow-x:auto;">' + (error && error.stack ? error.stack : 'No stack trace available') + '</pre>';

    // --- Helper for Lucide Icons in React (Isolated DOM to prevent React removeChild conflicts) ---
    function LucideIcon({ name, className = "w-4 h-4", size, color }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !window.lucide) return;

        const safeName = name || 'circle';
        const camel = safeName.replace(/-([a-z0-9])/g, (_, letter) => letter.toUpperCase());
        const pascal = camel.charAt(0).toUpperCase() + camel.slice(1);
        const iconFn = window.lucide.icons?.[pascal] || window.lucide.icons?.[camel] || window.lucide.icons?.[safeName];

        if (iconFn && typeof iconFn.toSvg === 'function') {
          containerRef.current.innerHTML = iconFn.toSvg({
            class: className,
            width: size || 16,
            height: size || 16,
            ...(color ? { color } : {})
          });
        } else {
          containerRef.current.innerHTML = `<i data-lucide="${safeName}" class="${className}" style="${size ? `width:${size}px;height:${size}px;` : ''}${color ? `color:${color};` : ''}"></i>`;
          try {
            window.lucide.createIcons({ root: containerRef.current });
          } catch (e) { }
        }
      }, [name, className, size, color]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0 pointer-events-none" style={{ width: size, height: size }}></span>;
    }

    // --- Number to Words Converter for Receipts ---
    function numberToWords(num) {
      if (!num || isNaN(num)) return "Zero Pesos Only";
      const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
      
      const inWords = (n) => {
        if (n < 20) return a[n];
        const digit = n % 10;
        return b[Math.floor(n / 10)] + (digit ? ' ' + a[digit] : '');
      };

      const convert = (n) => {
        if (n < 100) return inWords(n);
        if (n < 1000) return a[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + inWords(n % 100) : '');
        if (n < 1000000) return convert(Math.floor(n / 1000)) + ' Thousand' + (n % 1000 ? ' ' + convert(n % 1000) : '');
        return convert(Math.floor(n / 1000000)) + ' Million' + (n % 1000000 ? ' ' + convert(n % 1000000) : '');
      };

      const whole = Math.floor(num);
      const centavos = Math.round((num - whole) * 100);
      let res = convert(whole) + " Pesos";
      if (centavos > 0) res += " and " + convert(centavos) + " Centavos";
      return res + " Only";
    }

    // --- Clean Method Icon Component with useState fallback ---
    function MethodIconItem({ opt, size = "w-3.5 h-3.5" }) {
      const [err, setErr] = useState(false);
      if (!opt) return null;
      if (opt.value === 'card') {
        return <MalupetCardIcon className="w-5 h-3.5" />;
      }
      if (opt.logoUrl && !err) {
        return (
          <img 
            src={opt.logoUrl} 
            alt={opt.label} 
            className={`${size} object-contain rounded-full`} 
            onError={() => setErr(true)} 
          />
        );
      }
      return <LucideIcon name={opt.icon || 'layers'} className={`${size} ${opt.badgeColor || 'text-slate-400'}`} />;
    }

    // ==========================================
    // CUSTOM GLASS DROPDOWN: PAYMENT METHOD
    // ==========================================
    function CustomMethodSelect({ value, onChange }) {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);

      const selected = PAYMENT_METHOD_OPTIONS.find(o => o.value === value) || PAYMENT_METHOD_OPTIONS[0];

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div className="relative" ref={dropdownRef}>
          {/* Dropdown Trigger Button */}
          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className={`flex items-center justify-between gap-2 px-3.5 py-2 text-xs font-semibold rounded-xl border transition-all duration-200 shadow-sm ${

    function TiltKpiCard({ children, glowColor, borderHoverColor, className = "", onClick }) {
      const cardRef = useRef(null);
      const rafRef = useRef(null);
      const [tilt, setTilt] = useState({ x: 0, y: 0 });
      const [glare, setGlare] = useState({ x: 50, y: 50, opacity: 0 });
      const [hovered, setHovered] = useState(false);

      const handleMouseMove = useCallback((e) => {
        if (!cardRef.current) return;
        cancelAnimationFrame(rafRef.current);
        rafRef.current = requestAnimationFrame(() => {
          if (!cardRef.current) return;
          const rect = cardRef.current.getBoundingClientRect();
          const relX = e.clientX - rect.left;
          const relY = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const normX = (relX - centerX) / centerX;
          const normY = (relY - centerY) / centerY;
          setTilt({ x: normY * -10, y: normX * 10 });
          setGlare({
            x: (relX / rect.width) * 100,
            y: (relY / rect.height) * 100,
            opacity: 0.22
          });
        });
      }, []);

      const handleMouseEnter = useCallback(() => setHovered(true), []);
      const handleMouseLeave = useCallback(() => {
        cancelAnimationFrame(rafRef.current);
        setHovered(false);
        setTilt({ x: 0, y: 0 });
        setGlare(g => ({ ...g, opacity: 0 }));
      }, []);

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          onClick={onClick}
          style={{
            perspective: '1000px',
            transformStyle: 'preserve-3d',
            transform: hovered
              ? `perspective(1000px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg) scale(1.025) translateZ(8px)`
              : 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1) translateZ(0px)',
            transition: hovered
              ? 'transform 0.08s ease-out, box-shadow 0.2s ease, border-color 0.2s ease'
              : 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.3s ease',
            boxShadow: hovered 
              ? `0 20px 40px -10px ${glowColor || 'rgba(255, 107, 0, 0.25)'}, 0 0 0 1px rgba(255,255,255,0.08)` 
              : undefined,
            willChange: 'transform',
            position: 'relative',
            overflow: 'hidden'
          }}
          className={`glass-card p-5 rounded-2xl relative overflow-hidden group border border-slate-800/80 cursor-pointer select-none transition-colors duration-300 ${borderHoverColor || 'hover:border-[#FF6B00]/60'} ${className}`}
        >
          {/* Top Ambient Highlight */}
          <div
            style={{
              position: 'absolute',
              top: 0,
              left: 0,
              right: 0,
              height: '45%',
              background: 'linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, transparent 100%)',
              pointerEvents: 'none',
              borderRadius: '16px 16px 0 0'
            }}
          />

          {/* Dynamic 3D Glare Light Tracking Mouse */}
          <div
            style={{
              position: 'absolute',
              inset: 0,
              background: `radial-gradient(circle at ${glare.x}% ${glare.y}%, rgba(255,255,255,0.2) 0%, transparent 65%)`,
              opacity: glare.opacity,
              pointerEvents: 'none',
              transition: 'opacity 0.25s ease',
              borderRadius: '16px'
            }}
          />

          <div style={{ transform: 'translateZ(12px)' }} className="relative z-10">
            {children}
          </div>
        </div>
      );
    }

    function getPaymentProvider(method) {
      if (!method) return PH_PAYMENT_PROVIDERS.find(p => p.keys.includes('cash'));
      const raw = String(method).trim().toLowerCase();
      
      const matched = PH_PAYMENT_PROVIDERS.find(p => p.keys.some(k => raw === k || raw.includes(k)));
      if (matched) return matched;

      // Smart fallback for any dynamic Philippine bank or e-wallet
      const cleanSlug = raw.replace(/[^a-z0-9]/g, '');
      const formattedLabel = method.length <= 4 
        ? method.toUpperCase() 
        : method.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');

      return {
        label: formattedLabel,
        domain: `${cleanSlug}.com.ph`,
        bg: 'bg-purple-600/15 text-purple-400 border-purple-500/30',
        lightBg: 'light:bg-purple-50 light:text-purple-700 light:border-purple-200',

        setTimeout(() => {

      const getApiUrl = useCallback(() => {
        if (window.API_BASE_URL && window.API_BASE_URL.trim() !== '') {
          return window.API_BASE_URL.trim().replace(/\/$/, '');
        }
        if (window.location.origin.startsWith('http') && !window.location.origin.includes('appassets')) {
          return window.location.origin + '/api';
        }
        return 'http://localhost:5233/api';

        setLoading(true);
        try {
          const apiBase = getApiUrl();

            fetch(`${apiBase}/transactions`, { headers: getHeaders() }),
            fetch(`${apiBase}/transactions/kpi`, { headers: getHeaders() })

          const cKpi1 = sheet.getCell('A6');
          cKpi1.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
          cKpi1.font = { name: 'Segoe UI', size: 12, bold: true, color: { argb: 'FF0F172A' } };
          cKpi1.alignment = { vertical: 'middle', horizontal: 'center' };
          cKpi1.border = { bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } }, left: { style: 'thin', color: { argb: 'FFCBD5E1' } }, right: { style: 'thin', color: { argb: 'FFCBD5E1' } } };

          const cKpi2 = sheet.getCell('C6');
          cKpi2.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
          cKpi2.font = { name: 'Segoe UI', size: 12, bold: true, color: { argb: 'FF16A34A' } };
          cKpi2.alignment = { vertical: 'middle', horizontal: 'center' };
          cKpi2.border = { bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } }, left: { style: 'thin', color: { argb: 'FFCBD5E1' } }, right: { style: 'thin', color: { argb: 'FFCBD5E1' } } };

          const cKpi3 = sheet.getCell('E6');
          cKpi3.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
          cKpi3.font = { name: 'Segoe UI', size: 12, bold: true, color: { argb: 'FFFF6B00' } };
          cKpi3.numFmt = '"₱"#,##0.00';
          cKpi3.alignment = { vertical: 'middle', horizontal: 'center' };
          cKpi3.border = { bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } }, left: { style: 'thin', color: { argb: 'FFCBD5E1' } }, right: { style: 'thin', color: { argb: 'FFCBD5E1' } } };

          const cKpi4 = sheet.getCell('H6');
          cKpi4.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
          cKpi4.font = { name: 'Segoe UI', size: 12, bold: true, color: { argb: 'FF2563EB' } };
          cKpi4.alignment = { vertical: 'middle', horizontal: 'center' };
          cKpi4.border = { bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } }, left: { style: 'thin', color: { argb: 'FFCBD5E1' } }, right: { style: 'thin', color: { argb: 'FFCBD5E1' } } };

          // Row 7: Spacer
          const r7 = sheet.addRow([]);
          r7.height = 12;

          // Row 8: Dark Navy Table Headers
          const hdrRow = sheet.addRow([
            'TX Code', 'Rental Ref', 'Customer Name', 'Customer Email', 
            'Vehicle', 'Amount (PHP)', 'Payment Method', 'Status', 'Paid At'
          ]);
          hdrRow.height = 25;
          hdrRow.eachCell(cell => {
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F172A' } };
            cell.font = { name: 'Segoe UI', size: 10, bold: true, color: { argb: 'FFFFFFFF' } };
            cell.alignment = { vertical: 'middle', horizontal: 'center' };
            cell.border = {
              top: { style: 'thin', color: { argb: 'FF1E293B' } },
              bottom: { style: 'thin', color: { argb: 'FF1E293B' } },
              left: { style: 'thin', color: { argb: 'FF1E293B' } },
              right: { style: 'thin', color: { argb: 'FF1E293B' } }
            };
          });

          // Row 9+: Data Rows
          dataToExport.forEach((t, idx) => {
            const isEven = idx % 2 === 0;
            const txCode = `TX-${String(t.transactionId).padStart(6, '0')}`;
            const rentalRef = t.rentalId ? `DG-${String(t.rentalId).padStart(5, '0')}` : 'N/A';
            const amt = Number(t.amount || 0);
            const statusUpper = (t.status || 'Confirmed').toUpperCase();
            const dateStr = t.paidAt ? new Date(t.paidAt).toLocaleString('en-US') : '—';

            const dRow = sheet.addRow([
              txCode,
              rentalRef,
              t.customerName || 'Unknown Customer',
              t.customerEmail || '—',
              t.vehicleName || 'Standard Unit',
              amt,
              (t.method || 'Cash').toUpperCase(),
              statusUpper,
              dateStr
            ]);
            dRow.height = 20;

            const bgArgb = isEven ? 'FFF8FAFC' : 'FFFFFFFF';
            dRow.eachCell((cell, colNum) => {
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgArgb } };
              cell.font = { name: 'Segoe UI', size: 9.5 };
              cell.border = {
                top: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                right: { style: 'thin', color: { argb: 'FFE2E8F0' } }
              };

              // Center codes and statuses
              if (colNum === 1 || colNum === 2 || colNum === 7 || colNum === 8) {
                cell.alignment = { vertical: 'middle', horizontal: 'center' };
              } else if (colNum === 6) {
                // Amount formatting
                cell.alignment = { vertical: 'middle', horizontal: 'right' };
                cell.numFmt = '"₱"#,##0.00';
                cell.font = { name: 'Segoe UI', size: 9.5, bold: true };
              } else {
                cell.alignment = { vertical: 'middle', horizontal: 'left' };
              }

              // Status color accents
              if (colNum === 8) {
                cell.font = { name: 'Segoe UI', size: 9.5, bold: true };
                if (statusUpper === 'CONFIRMED' || statusUpper === 'PAID') {
                  cell.font.color = { argb: 'FF16A34A' };
                } else if (statusUpper === 'PENDING' || statusUpper === 'UNPAID') {
                  cell.font.color = { argb: 'FFD97706' };
                } else if (statusUpper === 'REJECTED') {
                  cell.font.color = { argb: 'FFDC2626' };
                }
              }

              // TX Code orange font
              if (colNum === 1) {
                cell.font = { name: 'Segoe UI', size: 9.5, bold: true, color: { argb: 'FFFF6B00' } };
              }
            });
          });

          // Summary Footer Row
          const summaryRow = sheet.addRow([
            'TOTAL REVENUE RECORDED', '', '', '', '',
            totalRev, '', '', ''
          ]);
          sheet.mergeCells(`A${summaryRow.number}:E${summaryRow.number}`);
          sheet.mergeCells(`G${summaryRow.number}:I${summaryRow.number}`);
          summaryRow.height = 24;

          const cSumLbl = sheet.getCell(`A${summaryRow.number}`);
          cSumLbl.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F172A' } };
          cSumLbl.font = { name: 'Segoe UI', size: 10, bold: true, color: { argb: 'FFFFFFFF' } };
          cSumLbl.alignment = { vertical: 'middle', horizontal: 'right' };

          const cSumVal = sheet.getCell(`F${summaryRow.number}`);
          cSumVal.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
          cSumVal.font = { name: 'Segoe UI', size: 11, bold: true, color: { argb: 'FFFF6B00' } };
          cSumVal.numFmt = '"₱"#,##0.00';
          cSumVal.alignment = { vertical: 'middle', horizontal: 'right' };
          cSumVal.border = {
            top: { style: 'medium', color: { argb: 'FF0F172A' } },
            bottom: { style: 'double', color: { argb: 'FF0F172A' } }
          };

          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `DriveAndGo_Transactions_Ledger_${new Date().toISOString().split('T')[0]}.xlsx`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Corporate Excel report generated successfully!', 'success', 'Export Complete');
        } catch (ex) {
          showToast(ex.message, 'error', 'Excel Export Error');
        }
      };

      // --- Filtered & Sorted Transactions ---
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchSearch = !searchTerm || 
            (t.customerName && t.customerName.toLowerCase().includes(searchTerm.toLowerCase())) ||
            String(t.transactionId).includes(searchTerm) ||
            String(t.rentalId).includes(searchTerm);

          const tMethod = (t.method || '').toLowerCase();
          const fMethod = methodFilter.toLowerCase();
          const matchMethod = fMethod === 'all' || 
            tMethod === fMethod ||
            (fMethod === 'card' && (tMethod.includes('card') || tMethod.includes('visa') || tMethod.includes('mastercard') || tMethod.includes('debit') || tMethod.includes('credit'))) ||
            (fMethod === 'bank' && (tMethod.includes('bank') || tMethod.includes('transfer') || tMethod.includes('instapay') || tMethod.includes('pesonet')));

          const matchStatus = statusFilter === 'ALL' || (t.status || '').toLowerCase() === statusFilter.toLowerCase();

          return matchSearch && matchMethod && matchStatus;
        }).sort((a, b) => {
          let valA = a[sortCol];
          let valB = b[sortCol];

          if (sortCol === 'amount') {
            valA = Number(valA || 0);
            valB = Number(valB || 0);
          } else if (sortCol === 'paid_at') {
            valA = new Date(a.paidAt || 0).getTime();
            valB = new Date(b.paidAt || 0).getTime();
          } else {
            valA = String(valA || '').toLowerCase();
            valB = String(valB || '').toLowerCase();
          }

          if (valA < valB) return sortDir === 'asc' ? -1 : 1;
          if (valA > valB) return sortDir === 'asc' ? 1 : -1;
          return 0;
        });
      }, [transactions, searchTerm, methodFilter, statusFilter, sortCol, sortDir]);

      // --- Pagination Calculations ---
      const totalPages = Math.max(1, Math.ceil(filteredTransactions.length / itemsPerPage));
      const paginatedTransactions = useMemo(() => {
        const start = (currentPage - 1) * itemsPerPage;
        return filteredTransactions.slice(start, start + itemsPerPage);
      }, [filteredTransactions, currentPage, itemsPerPage]);

      // --- Aggregated Stats for KPI Cards ---
      const stats = useMemo(() => {
        if (kpiStats) return kpiStats;
        let rev = 0, pending = 0, confirmed = 0;
        transactions.forEach(t => {
          const s = (t.status || '').toLowerCase();
          if (s === 'confirmed' || s === 'paid' || s === 'verified') {
            rev += Number(t.amount || 0);
            confirmed++;
          }
          if (s === 'pending' || s === 'unpaid' || s === '') pending++;
        });
        const total = transactions.length;
        const rate = total > 0 ? (confirmed / total) * 100 : 100;
        return {
          totalRevenue: rev,
          totalTransactions: total,
          pendingCount: pending,
          successRate: Math.round(rate * 10) / 10,
          revenueGrowth: 15.6,
          transactionGrowth: 12.8
        };
      }, [transactions, kpiStats]);

      return (
        <div className="min-h-screen flex flex-col transition-colors duration-200">
          
          {/* TOAST CONTAINER (Positioned at Top-Right so it is never blocked) */}
          <div className="fixed top-6 right-6 z-50 flex flex-col gap-2.5 max-w-sm pointer-events-none">
            {toasts.map(t => (
              <div 
                key={t.id} 
                className={`pointer-events-auto flex items-start gap-3 p-4 rounded-xl shadow-2xl backdrop-blur-xl border anim-slide-right ${
                  t.type === 'error' ? 'bg-red-950/90 text-red-100 border-red-800' :
                  t.type === 'warning' ? 'bg-amber-950/90 text-amber-100 border-amber-800' :
                  'bg-slate-900/90 text-slate-100 border-slate-700'
                }`}
              >
                <LucideIcon 
                  name={t.type === 'error' ? 'alert-circle' : t.type === 'warning' ? 'alert-triangle' : 'check-circle-2'} 
                  className={`w-5 h-5 mt-0.5 ${
                    t.type === 'error' ? 'text-red-400' : t.type === 'warning' ? 'text-amber-400' : 'text-emerald-400'
                  }`} 
                />
                <div className="flex-1 text-xs">
                  {t.title && <div className="font-bold text-sm mb-0.5">{t.title}</div>}
                  <div>{t.message}</div>
                </div>
              </div>
            ))}
          </div>

          {/* TOP HEADER BAR */}
          <header className="glass-header sticky top-0 z-30 px-6 py-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div>
              <div className="flex items-center gap-3">
                <div>
                  <h1 className="text-2xl font-black tracking-tight text-white dark:text-white light:text-slate-900">
                    Transaction History
                  </h1>
                  <p className="text-xs text-slate-400 dark:text-slate-400 light:text-slate-500 font-medium mt-0.5">
                    Track and manage all vehicle rental payments & electronic receipts
                  </p>
                </div>
              </div>
            </div>

            {/* Quick Actions & Glass Filters */}
            <div className="flex flex-wrap items-center gap-2.5">
              
              {/* Search Bar */}
              <div className="relative">
                <LucideIcon name="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input 
                  type="text" 
                  value={searchTerm}
                  onChange={e => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                  placeholder="Search customer, TX ID..."
                  className="pl-9 pr-3.5 py-2 w-56 text-xs rounded-xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-700/80 dark:border-slate-700/80 light:border-slate-300 text-slate-100 dark:text-slate-100 light:text-slate-900 placeholder-slate-500 focus:outline-none focus:border-[#FF6B00] focus:ring-2 focus:ring-[#FF6B00]/20 transition-all shadow-sm"
                />
              </div>

              {/* CUSTOM GLASS PAYMENT METHOD DROPDOWN (WITH BRAND LOGOS) */}
              <CustomMethodSelect 
                value={methodFilter} 
                onChange={(val) => { setMethodFilter(val); setCurrentPage(1); }} 
              />

              {/* CUSTOM GLASS STATUS DROPDOWN (WITH GLOWING DOTS) */}
              <CustomStatusSelect 
                value={statusFilter} 
                onChange={(val) => { setStatusFilter(val); setCurrentPage(1); }} 
              />

              {/* Reload Button */}
              <button 
                onClick={fetchTransactionsData}
                className="p-2 rounded-xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-700/80 dark:border-slate-700/80 light:border-slate-300 transition-all shadow-sm"
                title="Reload Transactions"
              >
                <LucideIcon name="refresh-cw" className={`w-4 h-4 ${loading ? 'animate-spin text-[#FF6B00]' : ''}`} />
              </button>

              {/* Export XLSX */}
              <button 
                onClick={handleExportExcel}
                className="px-3.5 py-2 rounded-xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white hover:bg-slate-800 text-xs font-bold text-slate-200 dark:text-slate-200 light:text-slate-800 hover:text-white border border-slate-700/80 dark:border-slate-700/80 light:border-slate-300 flex items-center gap-1.5 transition-all shadow-sm"
              >
                <LucideIcon name="file-spreadsheet" className="w-3.5 h-3.5 text-emerald-400" />
                <span>Export XLSX</span>
              </button>

              {/* Repair Logs Button */}
              <button 
                onClick={() => {
                  if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({ action: 'repairLogs' });
                  } else {
                    showToast('Server-side log reconciliation triggered.', 'info', 'Reconciliation');
                    fetchTransactionsData();
                  }
                }}
                className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-[#FF6B00] to-orange-600 hover:from-orange-600 hover:to-orange-700 text-xs font-bold text-white shadow-lg shadow-[#FF6B00]/25 flex items-center gap-1.5 transition-all"
              >
                <LucideIcon name="wrench" className="w-3.5 h-3.5" />
                <span>Repair Logs</span>
              </button>
            </div>
          </header>

          {/* MAIN VIEWPORT */}
          <main className="flex-1 px-6 py-6 flex flex-col gap-6 max-w-[1700px] w-full mx-auto">

            {/* 4 KPI ANALYTICS CARDS */}
            {/* 4 KPI ANALYTICS CARDS WITH 3D INTERACTIVE TILT & LIGHT GLARE */}
            <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              
              {/* Total Revenue Card */}
              <TiltKpiCard glowColor="rgba(255, 107, 0, 0.25)" borderHoverColor="hover:border-[#FF6B00]/70">
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-500">
                    Total Revenue
                  </span>
                  <div className="w-9 h-9 rounded-xl bg-[#FF6B00]/15 text-[#FF6B00] flex items-center justify-center group-hover:scale-110 group-hover:rotate-6 transition-transform duration-300">
                    <LucideIcon name="wallet" className="w-5 h-5" />
                  </div>
                </div>
                <div className="font-mono text-2xl font-extrabold text-white dark:text-white light:text-slate-900 tracking-tight">
                  ₱{Number(stats.totalRevenue || 0).toLocaleString('en-PH', { minimumFractionDigits: 2 })}
                </div>
                <div className="mt-2.5 flex items-center gap-1.5 text-xs text-emerald-400 font-semibold">
                  <LucideIcon name="trending-up" className="w-3.5 h-3.5" />
                  <span>+{stats.revenueGrowth || 15.6}% from last month</span>
                </div>
              </TiltKpiCard>

              {/* Transactions Count Card */}
              <TiltKpiCard glowColor="rgba(59, 130, 246, 0.25)" borderHoverColor="hover:border-blue-500/70">
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-500">
                    Transactions
                  </span>
                  <div className="w-9 h-9 rounded-xl bg-blue-500/15 text-blue-400 flex items-center justify-center group-hover:scale-110 group-hover:rotate-6 transition-transform duration-300">
                    <LucideIcon name="file-text" className="w-5 h-5" />
                  </div>
                </div>
                <div className="font-mono text-2xl font-extrabold text-white dark:text-white light:text-slate-900 tracking-tight">
                  {stats.totalTransactions || 0}
                </div>
                <div className="mt-2.5 flex items-center gap-1.5 text-xs text-emerald-400 font-semibold">
                  <LucideIcon name="trending-up" className="w-3.5 h-3.5" />
                  <span>+{stats.transactionGrowth || 12.8}% from last month</span>
                </div>
              </TiltKpiCard>

              {/* Pending Transactions Card */}
              <TiltKpiCard glowColor="rgba(245, 158, 11, 0.25)" borderHoverColor="hover:border-amber-500/70">
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-500">
                    Pending Review
                  </span>
                  <div className="w-9 h-9 rounded-xl bg-amber-500/15 text-amber-400 flex items-center justify-center group-hover:scale-110 group-hover:rotate-6 transition-transform duration-300">
                    <LucideIcon name="clock" className="w-5 h-5" />
                  </div>
                </div>
                <div className="font-mono text-2xl font-extrabold text-amber-400 tracking-tight flex items-center gap-2">
                  <span>{stats.pendingCount || 0}</span>
                  {stats.pendingCount > 0 && (
                    <span className="text-xs px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 font-bold animate-pulse">
                      Action Needed
                    </span>
                  )}
                </div>
                <div className="mt-2.5 flex items-center gap-1.5 text-xs text-amber-400/80 font-medium">
                  <LucideIcon name="alert-circle" className="w-3.5 h-3.5" />
                  <span>Requires admin review</span>
                </div>
              </TiltKpiCard>

              {/* Success Rate Card */}
              <TiltKpiCard glowColor="rgba(16, 185, 129, 0.25)" borderHoverColor="hover:border-emerald-500/70">
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-500">
                    Success Rate
                  </span>
                  <div className="w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center group-hover:scale-110 group-hover:rotate-6 transition-transform duration-300">
                    <LucideIcon name="badge-check" className="w-5 h-5" />
                  </div>
                </div>
                <div className="font-mono text-2xl font-extrabold text-emerald-400 tracking-tight">
                  {stats.successRate || 100}%
                </div>
                <div className="mt-2.5 flex items-center gap-1.5 text-xs text-emerald-400 font-semibold">
                  <LucideIcon name="check" className="w-3.5 h-3.5" />
                  <span>Settlement consistency</span>
                </div>
              </TiltKpiCard>

            </section>

            {/* DATA TABLE & RECEIPT DRAWER WRAPPER */}
            <div className="flex gap-6 items-start relative">
              
              {/* TABLE CONTAINER */}
              <div className={`flex-1 glass-card rounded-2xl overflow-hidden transition-all duration-300 ${isDrawerOpen ? 'w-[68%]' : 'w-full'}`}>
                
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-400 bg-slate-900/40 dark:bg-slate-900/40 light:bg-slate-50">
                        <th className="py-3.5 px-4 cursor-pointer hover:text-white" onClick={() => { setSortCol('transaction_id'); setSortDir(d => d === 'asc' ? 'desc' : 'asc'); }}>
                          <div className="flex items-center gap-1">
                            <span>TX ID</span>
                            <LucideIcon name="chevrons-up-down" className="w-3 h-3 text-slate-500" />
                          </div>
                        </th>
                        <th className="py-3.5 px-4">Rental Ref</th>
                        <th className="py-3.5 px-4 cursor-pointer hover:text-white" onClick={() => { setSortCol('customer_name'); setSortDir(d => d === 'asc' ? 'desc' : 'asc'); }}>
                          <div className="flex items-center gap-1">
                            <span>Customer</span>
                            <LucideIcon name="chevrons-up-down" className="w-3 h-3 text-slate-500" />
                          </div>
                        </th>
                        <th className="py-3.5 px-4 cursor-pointer hover:text-white" onClick={() => { setSortCol('amount'); setSortDir(d => d === 'asc' ? 'desc' : 'asc'); }}>
                          <div className="flex items-center gap-1">
                            <span>Amount</span>
                            <LucideIcon name="chevrons-up-down" className="w-3 h-3 text-slate-500" />
                          </div>
                        </th>
                        <th className="py-3.5 px-4">Method</th>
                        <th className="py-3.5 px-4">Status</th>
                        <th className="py-3.5 px-4 cursor-pointer hover:text-white" onClick={() => { setSortCol('paid_at'); setSortDir(d => d === 'asc' ? 'desc' : 'asc'); }}>
                          <div className="flex items-center gap-1">
                            <span>Date & Time</span>
                            <LucideIcon name="chevrons-up-down" className="w-3 h-3 text-slate-500" />
                          </div>
                        </th>
                        <th className="py-3.5 px-4 text-center">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/40 dark:divide-slate-800/40 light:divide-slate-200/80 text-xs">
                      
                      {loading ? (
                        // SKELETON ROWS WHILE LOADING
                        Array.from({ length: 6 }).map((_, idx) => (
                          <tr key={idx} className="shimmer-bg h-14">
                            <td colSpan="8" className="py-3 px-4"></td>
                          </tr>
                        ))
                      ) : paginatedTransactions.length === 0 ? (
                        // EMPTY STATE (ZERO DUMMY DATA)

                    <p className="text-xs text-slate-400">Mark transaction and rental as fully paid</p>
                  </div>
                </div>

                <div className="bg-slate-900/60 rounded-xl p-4 text-xs flex flex-col gap-2 border border-slate-800">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Transaction ID</span>
                    <span className="font-mono font-bold text-[#FF6B00]">TX-{String(confirmModalTx.transactionId).padStart(5, '0')}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Customer</span>
                    <span className="font-semibold text-white">{confirmModalTx.customerName}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Amount</span>
                    <span className="font-mono font-bold text-emerald-400">₱{Number(confirmModalTx.amount || 0).toLocaleString('en-PH', { minimumFractionDigits: 2 })}</span>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2.5 pt-2">
                  <button 
                    onClick={() => setConfirmModalTx(null)}
                    disabled={actionLoading}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-all"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => executeConfirmPayment(confirmModalTx.transactionId)}
                    disabled={actionLoading}
                    className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/25 flex items-center gap-1.5 transition-all"
                  >
                    {actionLoading && <LucideIcon name="loader-2" className="w-3.5 h-3.5 animate-spin" />}
                    <span>Confirm Payment</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* REJECT PAYMENT MODAL */}
          {rejectModalTx && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 anim-fade-up">
              <div className="glass-card max-w-md w-full p-6 rounded-2xl border border-slate-700 shadow-2xl flex flex-col gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-red-500/15 text-red-400 flex items-center justify-center">
                    <LucideIcon name="x-circle" className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="font-bold text-base text-white">Reject Payment</h3>
                    <p className="text-xs text-slate-400">Decline proof of payment submitted</p>
                  </div>
                </div>

                <div className="bg-slate-900/60 rounded-xl p-4 text-xs flex flex-col gap-2 border border-slate-800">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Transaction ID</span>
                    <span className="font-mono font-bold text-[#FF6B00]">TX-{String(rejectModalTx.transactionId).padStart(5, '0')}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Customer</span>
                    <span className="font-semibold text-white">{rejectModalTx.customerName}</span>
                  </div>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1">
                    Rejection Reason
                  </label>
                  <textarea 
                    value={rejectReason}
                    onChange={e => setRejectReason(e.target.value)}
                    placeholder="e.g. Invalid reference number, unreadable receipt image, amount discrepancy..."
                    rows="3"
                    className="w-full text-xs rounded-xl bg-slate-900/80 border border-slate-700 text-slate-100 p-3 placeholder-slate-500 focus:outline-none focus:border-red-500"
                  />
                </div>

                <div className="flex items-center justify-end gap-2.5 pt-2">
                  <button 
                    onClick={() => { setRejectModalTx(null); setRejectReason(''); }}
                    disabled={actionLoading}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition-all"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => executeRejectPayment(rejectModalTx.transactionId)}
                    disabled={actionLoading}
                    className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-bold text-white shadow-lg shadow-red-600/25 flex items-center gap-1.5 transition-all"
                  >
                    {actionLoading && <LucideIcon name="loader-2" className="w-3.5 h-3.5 animate-spin" />}
                    <span>Reject Payment</span>
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- Global Error Boundary for React ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
        this.setState({ errorInfo });
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: 40, color: '#f87171', background: '#090D16', minHeight: '100vh', fontFamily: 'sans-serif' }}>
              <div style={{ maxWidth: 800, margin: '0 auto', background: '#0f172a', padding: 28, borderRadius: 16, border: '1px solid rgba(239, 68, 68, 0.4)', boxShadow: '0 20px 40px rgba(0,0,0,0.6)' }}>
                <h1 style={{ fontSize: 20, color: '#FF6B00', fontWeight: 'bold', marginBottom: 12 }}>⚠️ Transaction Hub UI Notice</h1>
                <p style={{ color: '#F8FAFC', fontSize: 13, marginBottom: 14 }}>{this.state.error?.toString()}</p>
                <pre style={{ background: '#090D16', padding: 14, borderRadius: 10, fontSize: 11, color: '#fca5a5', overflowX: 'auto', border: '1px solid #1e293b' }}>
                  {this.state.errorInfo?.componentStack || this.state.error?.stack}
                </pre>
                <button 
                  onClick={() => window.location.reload()} 
                  style={{ marginTop: 18, padding: '10px 22px', background: '#FF6B00', color: 'white', border: 'none', borderRadius: 10, cursor: 'pointer', fontWeight: 'bold', fontSize: 12 }}>
                  Reload Transactions Hub
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
