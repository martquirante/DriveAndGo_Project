                                            >
                                                <option value="">{selectedBrandPreset ? '-- Select Model --' : 'Select Brand First'}</option>
                                                {modelsForSelectedBrand.map(m => (
                                                    <option key={m.id || m.model} value={m.model}>
                                                        {m.model} ({m.type}, {m.transmission})
                                                    </option>
                                                ))}
                                            </select>
                                        ) : (
                                            <input type="text" value={form.model} onChange={e => setForm({ ...form, model: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all placeholder-[var(--text-muted)]" placeholder="e.g. Civic, Ranger, Vios" />
                                        )}
                                    </div>
                                </div>

                                {/* Plate No & Vehicle Type */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Plate No. *</label>
                                        <input type="text" value={form.plateNumber} onChange={e => setForm({ ...form, plateNumber: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-bold uppercase text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all placeholder-[var(--text-muted)]" placeholder="e.g. ABC-1234" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Vehicle Type</label>
                                        <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all">
                                            <option value="Car">Car</option>
                                            <option value="SUV">SUV</option>
                                            <option value="Van">Van</option>
                                            <option value="Pickup">Pickup</option>
                                            <option value="Hatchback">Hatchback</option>
                                            <option value="Motorcycle">Motorcycle</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Engine CC & Daily Rate with Suggest */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Engine CC (Max 10,000)</label>
                                        <input
                                            type="number"
                                            min="50"
                                            max="10000"
                                            value={form.engineCc}
                                            onChange={e => {
                                                let val = parseInt(e.target.value);
                                                if (isNaN(val)) setForm({ ...form, engineCc: '' });
                                                else setForm({ ...form, engineCc: Math.min(10000, Math.max(50, val)) });
                                            }}
                                            className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all"
                                            placeholder="e.g. 1500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Rate / Day (₱)</label>
                                        <div className="flex gap-2">
                                            <div className="relative flex items-center w-full">
                                                <span className="absolute left-3.5 text-sm font-black text-orange-500 select-none">₱</span>
                                                <input
                                                    type="number"
                                                    min="0"
                                                    max="500000"
                                                    value={form.dailyRatePHP}
                                                    onChange={e => {
                                                        let val = parseFloat(e.target.value);
                                                        if (isNaN(val)) setForm({ ...form, dailyRatePHP: '' });
                                                        else setForm({ ...form, dailyRatePHP: Math.min(500000, Math.max(0, val)) });
                                                    }}
                                                    className="w-full pl-8 pr-3 py-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all"
                                                    placeholder="2500"
                                                />
                                            </div>
                                            <button type="button" onClick={handleOpenSuggest} className="px-3 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs shadow-md transition-all shrink-0 flex items-center gap-1"><IconZap sz={14} /> Suggest</button>
                                        </div>
                                    </div>
                                </div>

                                {/* Rate + Driver & Seat Capacity */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Rate + Driver (₱)</label>
                                        <div className="relative flex items-center w-full">
                                            <span className="absolute left-3.5 text-sm font-black text-orange-500 select-none">₱</span>
                                            <input
                                                type="number"
                                                min="0"
                                                max="500000"
                                                value={form.rateWithDriverPHP}
                                                onChange={e => {
                                                    let val = parseFloat(e.target.value);
                                                    if (isNaN(val)) setForm({ ...form, rateWithDriverPHP: '' });
                                                    else setForm({ ...form, rateWithDriverPHP: Math.min(500000, Math.max(0, val)) });
                                                }}
                                                className="w-full pl-8 pr-3 py-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all"
                                                placeholder="3500"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Seat Capacity (Max 60)</label>
                                        <input
                                            type="number"
                                            min="1"
                                            max="60"
                                            value={form.seatCapacity}
                                            onChange={e => {
                                                let val = parseInt(e.target.value);
                                                if (isNaN(val)) setForm({ ...form, seatCapacity: '' });
                                                else setForm({ ...form, seatCapacity: Math.min(60, Math.max(1, val)) });
                                            }}
                                            onInput={e => {
                                                if (e.target.value.length > 2) {
                                                    e.target.value = e.target.value.slice(0, 2);
                                                }
                                            }}
                                            className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all"
                                            placeholder="e.g. 5 (Max 60)"
                                        />
                                    </div>
                                </div>

                                {/* Vehicle Color, Transmission & Status (3 Cols) */}
                                <div className="grid grid-cols-3 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Vehicle Color</label>
                                        <ColorSelector value={form.color} onChange={cVal => setForm({ ...form, color: cVal })} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Transmission</label>
                                        <select value={form.transmission} onChange={e => setForm({ ...form, transmission: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-xs font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all">
                                            <option value="Automatic">Automatic</option>
                                            <option value="Manual">Manual</option>
                                        </select>

                                                <span className="flex items-center gap-1 capitalize">
                                                    <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> rented
                                                </span>
                                            </div>
                                        ) : (
                                            <select value={form.status} onChange={e => setForm({ ...form, status: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-xs font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all capitalize">
                                                <option value="available">available</option>
                                                <option value="maintenance">maintenance</option>

                                {/* Description */}

                                    <label className="text-xs font-semibold text-[var(--text-secondary)] mb-1 block">Description</label>
                                    <textarea value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} rows="3" className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-medium text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all resize-none placeholder-[var(--text-muted)]" placeholder="Vehicle notes, specs, condition..."></textarea>
                                </div>

                            </div>

                            {/* RIGHT COLUMN: 3D Preview & Media Uploaders (5 Cols) */}

                                {/* Interactive 3D Digital Card Preview */}

                                    <div className="p-4 rounded-3xl bg-[var(--bg-card)] border border-[var(--border-color)] shadow-xl relative overflow-hidden group">
                                        <div className="h-32 w-full rounded-2xl overflow-hidden bg-[var(--bg-tertiary)] relative mb-3">
                                            {form.image ? (
                                                <img src={form.image} className="w-full h-full object-cover" />

                                            <span className="absolute top-2 right-2 px-2.5 py-1 rounded-full text-[10px] font-black uppercase bg-emerald-500/80 text-white backdrop-blur">
                                                {form.status}
                                            </span>
                                        </div>
                                        <div className="text-xs font-bold text-orange-500 uppercase tracking-wider">{form.brand || 'BRAND'} {form.model || 'MODEL'}</div>
                                        <div className="text-lg font-black text-[var(--text-primary)]">{form.plateNumber || 'PLATE-123'}</div>
                                        <div className="flex justify-between items-center mt-2 pt-2 border-t border-[var(--border-color)] text-xs">
                                            <span className="text-[var(--text-secondary)] font-medium">Daily Rate:</span>

                                </div>

                                {/* Map / 3D Icon Uploader */}

                                    <div className="flex justify-between items-center mb-1">

            const handleExecuteEmergencyProtocol = async (actionName) => {

            };
            const [editingVehicle, setEditingVehicle] = useState(null);
            const [qrVehicle, setQrVehicle] = useState(null);
            const [previewDoc, setPreviewDoc] = useState(null);
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Initial Fetch
            const fetchFleet = useCallback(async () => {
                try {
                    const res = await fetch(`${API}/api/vehicles?_t=${Date.now()}`, {
                        headers: {
                            ...HEADERS,
                            'Cache-Control': 'no-cache, no-store, must-revalidate',

                    if (res.ok) {

                                console.error("Error normalizing vehicle:", v, err);

                                    vehicle_id: v.vehicle_id || v.id || (i + 1),

                window.liveUpdateGPS = (vid, lat, lng, speed) => {
                    setVehicles(prev => prev.map(v => {
                        if (String(v.id) === String(vid) || String(v.vehicle_id) === String(vid)) {
                            const oldLat = v.coordinates ? v.coordinates[0] : lat;
                            const oldLng = v.coordinates ? v.coordinates[1] : lng;
                            const R = 6371; // Earth radius in km
                            const dLat = (lat - oldLat) * Math.PI / 180;
                            const dLng = (lng - oldLng) * Math.PI / 180;
                            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                                Math.cos(oldLat * Math.PI / 180) * Math.cos(lat * Math.PI / 180) *
                                Math.sin(dLng / 2) * Math.sin(dLng / 2);
                            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                            const distKm = R * c;

                            const addKm = (distKm > 0.005 && distKm < 10) ? distKm : 0;
                            const newOdo = Math.round(((v.odometerKm || 0) + addKm) * 10) / 10;

                            const updated = {
                                ...v,
                                coordinates: [lat, lng],
                                currentSpeedKmh: speed,

                                setSelectedVehicle(curr => (curr && (String(curr.id) === String(v.id) || String(curr.vehicle_id) === String(v.id))) ? updated : curr);

                if (!vId && vObj && (vObj.plateNumber || vObj.plate_no || vObj.plateNo) && Array.isArray(vehicles)) {

            const handleConfirmDecommission = async (vId, reason, notes) => {
                try {
                    const url = `${API}/api/vehicles/${vId}?reason=${encodeURIComponent(reason)}&notes=${encodeURIComponent(notes)}`;
                    const res = await fetch(url, {
                        method: 'DELETE',
                        headers: {
                            ...HEADERS,
                            'X-Admin-Name': 'Raymart Quirante'
                        }
                    });

                    if (res.ok || res.status === 204) {
                        const data = await res.json().catch(() => ({}));
                        setSelectedVehicle(null);
                        setDecommissionVehicle(null);

                        const vBrand = data.Brand || decommissionVehicle?.brand || 'Vehicle';
                        const vModel = data.Model || decommissionVehicle?.model || '';
                        const vPlate = data.PlateNo || decommissionVehicle?.plateNumber || decommissionVehicle?.plate_no || '';

                        // Toast Notification
                        showToast(`VEHICLE DECOMMISSIONED: ${vBrand} ${vModel} (${vPlate}) removed. Reason: ${reason}`, 'success');

                        // Top Header Notification Dropdown push
                        window.pushAdminNotification("Fleet Decommission Audit", `Vehicle ${vBrand} ${vModel} (${vPlate}) removed from fleet. Reason: ${reason}`);

                        fetchFleet();
                    } else {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.message || errData.Message || "Failed to decommission vehicle.");
                    }
                } catch (e) {
                    console.error("Decommission Error:", e);
                    throw e;
                }
            };

            const toggleTheme = () => {
                const nu = !isDark;
                setIsDark(nu);
                document.documentElement.setAttribute('data-theme', nu ? 'dark' : 'light');
            };

            // Derived Data
            const filteredVehicles = useMemo(() => {
                return vehicles.filter(v => {
                    const st = (v.status || '').toLowerCase();
                    const mStat = filterStatus === 'all' ||
                        (filterStatus === 'rented' ? (st === 'rented' || st === 'in-use') : st === filterStatus);
                    const term = (searchTerm || '').toLowerCase();
                    const mSearch = !term ||
                        (v.plateNumber || '').toLowerCase().includes(term) ||
                        (v.brand || '').toLowerCase().includes(term) ||
                        (v.model || '').toLowerCase().includes(term);
                    return mStat && mSearch;
                });
            }, [vehicles, filterStatus, searchTerm]);

            const groupedClusters = useMemo(() => {
                const map = new Map();
                filteredVehicles.forEach(v => {
                    const key = `${(v.brand || '').trim().toLowerCase()}|${(v.model || '').trim().toLowerCase()}`;
                    if (!map.has(key)) {
                        map.set(key, []);
                    }
                    map.get(key).push(v);
                });

                const clusters = [];
                map.forEach((units, key) => {
                    clusters.push({
                        key,
                        brand: units[0].brand,
                        model: units[0].model,
                        type: units[0].type,
                        image: units[0].image,
                        transmission: units[0].transmission,
                        engineCc: units[0].engineCc,
                        dailyRatePHP: units[0].dailyRatePHP,
                        units: units,
                        totalUnits: units.length,
                        availableUnits: units.filter(u => (u.status || '').toLowerCase() === 'available').length,
                        primaryUnit: units[0]
                    });
                });
                return clusters;
            }, [filteredVehicles]);

            const stats = useMemo(() => {
                let avail = 0, rent = 0, maint = 0, sumHealth = 0, lowRfid = 0;
                vehicles.forEach(v => {
                    const st = (v.status || '').toLowerCase();
                    if (st === 'available') avail++;
                    else if (st === 'rented' || st === 'in-use') rent++;
                    else if (st === 'maintenance') maint++;

                    sumHealth += (v.healthScore || 100);
                    if ((v.rfidBalancePHP || 0) < 200) lowRfid++;
                });
                const avgHealth = vehicles.length ? Math.round(sumHealth / vehicles.length) : 0;
                return { total: vehicles.length, avail, rent, maint, avgHealth, lowRfid };
            }, [vehicles]);


            return (
                <div className="flex h-screen w-screen overflow-hidden bg-[var(--bg-primary)] text-[var(--text-primary)]">

                    {/* LEFT COLUMN: KPI Stats, Search & Filters, 3-Col Vehicle Cards (~58% width) */}
                    <div className="flex-1 lg:max-w-[58%] h-full overflow-y-auto p-5 flex flex-col gap-5 custom-scrollbar">

                        {/* KPI STAT CARDS BENTO GRID (Clean 4-Col Layout + Status Bar) */}

                                            <IconCar sz={18} />
                                        </div>
                                        <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">Live</span>
                                    </div>
                                    <div>
                                        <div className="text-2xl font-black tracking-tight text-[var(--text-primary)]">{stats.total.toLocaleString()}</div>
                                        <div className="text-[10px] text-[var(--text-muted)] font-bold uppercase tracking-wider">Total Fleet</div>
                                    </div>
                                </div>

                                {/* 2. Available */}
                                <div className="p-4 rounded-2xl bg-[var(--bg-card)] border border-[var(--border-color)] shadow-[var(--shadow-card)] hover:-translate-y-1 hover:border-emerald-500/40 transition-all duration-300 flex flex-col justify-between h-28 cursor-pointer group">
                                    <div className="flex justify-between items-center">
                                        <div className="w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                                            <IconCheck sz={18} />
                                        </div>
                                        <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">Ready</span>
                                    </div>
                                    <div>
                                        <div className="text-2xl font-black tracking-tight text-emerald-400">{stats.avail.toLocaleString()}</div>
                                        <div className="text-[10px] text-[var(--text-muted)] font-bold uppercase tracking-wider">Available</div>
                                    </div>
                                </div>

                                {/* 3. Rented */}
                                <div className="p-4 rounded-2xl bg-[var(--bg-card)] border border-[var(--border-color)] shadow-[var(--shadow-card)] hover:-translate-y-1 hover:border-amber-500/40 transition-all duration-300 flex flex-col justify-between h-28 cursor-pointer group">
                                    <div className="flex justify-between items-center">
                                        <div className="w-9 h-9 rounded-xl bg-amber-500/15 text-amber-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                                            <IconZap sz={18} />
                                        </div>
                                        <span className="text-[10px] font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20">Active</span>
                                    </div>
                                    <div>
                                        <div className="text-2xl font-black tracking-tight text-amber-400">{stats.rent.toLocaleString()}</div>
                                        <div className="text-[10px] text-[var(--text-muted)] font-bold uppercase tracking-wider">On Rent</div>
                                    </div>
                                </div>

                                {/* 4. Maintenance */}
                                <div className="p-4 rounded-2xl bg-[var(--bg-card)] border border-[var(--border-color)] shadow-[var(--shadow-card)] hover:-translate-y-1 hover:border-orange-500/40 transition-all duration-300 flex flex-col justify-between h-28 cursor-pointer group">
                                    <div className="flex justify-between items-center">
                                        <div className="w-9 h-9 rounded-xl bg-orange-500/15 text-orange-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                                            <IconSettings sz={18} />
                                        </div>
                                        <span className="text-[10px] font-bold text-gray-400 bg-white/5 px-2 py-0.5 rounded-full border border-white/10">In Shop</span>
                                    </div>
                                    <div>
                                        <div className="text-2xl font-black tracking-tight text-[var(--text-primary)]">{stats.maint.toLocaleString()}</div>
                                        <div className="text-[10px] text-[var(--text-muted)] font-bold uppercase tracking-wider">Maintenance</div>
                                    </div>
                                </div>
                            </div>

                            {/* Fleet Health & RFID Status Bar */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="p-3 px-4 rounded-xl bg-[var(--bg-card)] border border-[var(--border-color)] flex items-center justify-between shadow-sm hover:border-emerald-500/30 transition-colors">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                                        <span className="text-xs text-[var(--text-muted)] font-bold uppercase tracking-wider">Avg Fleet Health</span>
                                    </div>
                                    <span className="text-sm font-black text-emerald-400">{stats.avgHealth}%</span>
                                </div>
                                <div className="p-3 px-4 rounded-xl bg-orange-500/15 border border-orange-500/40 flex items-center justify-between shadow-sm hover:bg-orange-500/25 transition-colors">
                                    <div className="flex items-center gap-2 text-orange-400">
                                        <IconAlertTriangle sz={14} />
                                        <span className="text-xs font-bold uppercase tracking-wider">Low RFID Balance</span>
                                    </div>
                                    <span className="text-sm font-black text-orange-500">{stats.lowRfid} Vehicles</span>
                                </div>
                            </div>
                        </div>

                        {/* CONTROL & FILTER BAR (Prominent Search + Status Combobox) */}
                        <div className="flex flex-col sm:flex-row justify-between items-center gap-3 bg-[var(--bg-card)] p-2.5 px-4 rounded-2xl border border-[var(--border-color)] shadow-[var(--shadow-card)]">

                                </div>

                                    <IconPlus sz={16} /> Add Unit
                                </button>
                            </div>

                        {/* VEHICLE GRID (GROUPED STACK CARDS & 3D FAN-OUT DECK) */}

                                {groupedClusters.map(cluster => (
                                    <GroupedVehicleCard
                                        key={cluster.key}
                                        cluster={cluster}
                                        onClickCluster={() => {
                                            if (cluster.totalUnits > 1) {
                                                setDeckCluster(cluster);
                                            } else {
                                                setSelectedVehicle(cluster.primaryUnit);
                                            }
                                        }}
                                    />
                                ))}
                                {groupedClusters.length === 0 && <div className="col-span-full py-16 text-center text-[var(--text-muted)]">No vehicles match filters.</div>}
                            </div>
                        ) : (
                            <VehicleTable vehicles={filteredVehicles} onSelect={setSelectedVehicle} />
                        )}

                    </div>

                    {/* RIGHT COLUMN: FULL-HEIGHT DARK LEAFLET MAP (~42% width) */}
                    <div className="hidden lg:flex flex-col flex-1 h-full p-5 pl-0 relative">
                        <div className="w-full h-full rounded-3xl overflow-hidden border border-[var(--border-color)] shadow-2xl relative">
                            {/* Floating Weather Telematics Banner Overlay inside Map Container */}
                            {showWeatherBanner && (
                                <div
                                    onClick={() => setShowWeatherModal(true)}
                                    className={`absolute top-3 left-3 right-3 z-[500] p-2.5 px-4 rounded-2xl bg-[var(--bg-card)] border backdrop-blur-xl flex items-center justify-between text-xs shadow-2xl animate-fade-in transition-all duration-300 group cursor-pointer hover:scale-[1.005] ${weatherAlert.accentBorder}`}
                                    title="Click to open Full Interactive Weather & PAGASA Radar Analytics"
                                >
                                    <div className="flex items-center gap-3 overflow-hidden flex-1 min-w-0">
                                        {/* Live Pulsing Beacon Dot & Temperature Pill */}
                                        <div className="flex items-center gap-2 shrink-0">
                                            <span className="relative flex h-2.5 w-2.5">
                                                <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${weatherAlert.beaconColor}`}></span>
                                                <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${weatherAlert.beaconColor}`}></span>
                                            </span>
                                            <span className={`px-2.5 py-0.5 rounded-lg text-xs font-black border backdrop-blur flex items-center gap-1.5 ${weatherAlert.badgeBg}`}>
                                                <IconCloudRain sz={14} />
                                                <span>{weatherAlert.temp}</span>
                                            </span>
                                        </div>

                                        {/* Weather Text Ticker */}
                                        <div className="truncate font-semibold text-[var(--text-primary)] text-xs flex items-center gap-2">
                                            <span className="truncate">{weatherAlert.text}</span>
                                        </div>
                                    </div>

                                    {/* Action Affordance Badge & Close Button */}
                                    <div className="flex items-center gap-2 shrink-0 ml-3">
                                        <span className="px-2.5 py-1 rounded-xl bg-orange-500/15 group-hover:bg-orange-500 text-orange-400 group-hover:text-white border border-orange-500/30 font-black text-[11px] transition-all flex items-center gap-1 shadow-sm">
                                            <span>Radar Analytics &rarr;</span>
                                        </span>
                                        <button
                                            onClick={(e) => { e.stopPropagation(); setShowWeatherBanner(false); }}
                                            className="p-1 rounded-lg hover:bg-white/10 text-[var(--text-muted)] hover:text-white transition-colors"
                                            title="Dismiss Weather Bar"
                                        >
                                            <IconX sz={14} />
                                        </button>
                                    </div>
                                </div>
                            )}

                            <LeafletMapComponent
                                vehicles={vehicles}
                                selectedVehicleId={selectedVehicle?.id}
                                onSelectVehicle={setSelectedVehicle}
                                isDark={isDark}
                                weatherData={weatherData}
                                onOpenWeatherModal={() => setShowWeatherModal(true)}
                                hasWeatherBanner={showWeatherBanner}
                            />
                        </div>
                    </div>

                    {/* VEHICLE DETAILS OVERLAY DRAWER */}
                    <VehicleDrawer v={selectedVehicle} onClose={() => setSelectedVehicle(null)} onRefresh={fetchFleet} onEdit={handleEditUnit} onDelete={handleDeleteUnit} onShowQr={setQrVehicle} onPreviewDoc={setPreviewDoc} />

                    {/* 3D FAN-OUT DECK CAROUSEL MODAL */}
                    {deckCluster && (
                        <DeckFanModal
                            cluster={deckCluster}
                            onClose={() => setDeckCluster(null)}
                            onSelectVehicle={setSelectedVehicle}
                            onEditUnit={handleEditUnit}
                            onDeleteUnit={handleDeleteUnit}
                            onShowQr={setQrVehicle}
                        />
                    )}

                    {/* MODALS */}
                    {showAddModal && (
                        <AddVehicleModal
                            vehicleToEdit={editingVehicle}
                            vehicles={vehicles}
                            onClose={() => { setShowAddModal(false); setEditingVehicle(null); }}
                            onSave={async (successMsg, updatedVehicle) => {
                                setShowAddModal(false);
                                setEditingVehicle(null);
                                showToast(successMsg || "Vehicle updated successfully!", 'success');

                                // Instant Optimistic Local State Update (0ms immediate refresh!)
                                if (updatedVehicle) {
                                    const uId = String(updatedVehicle.id || updatedVehicle.vehicle_id || updatedVehicle.vehicleId || '');
                                    const uPlate = (updatedVehicle.plateNumber || updatedVehicle.plate_no || '').trim().toLowerCase();

                                    setVehicles(prev => {
                                        const isMatch = v => (uId && String(v.id || v.vehicle_id || v.vehicleId || '') === uId) ||
                                            (uPlate && (v.plateNumber || v.plate_no || '').trim().toLowerCase() === uPlate);
                                        const exists = prev.some(isMatch);
                                        if (exists) {
                                            return prev.map(v => isMatch(v) ? { ...v, ...updatedVehicle } : v);
                                        }
                                        return [updatedVehicle, ...prev];
                                    });

                                    setSelectedVehicle(prev => {
                                        if (!prev) return null;
                                        const isMatch = (uId && String(prev.id || prev.vehicle_id || prev.vehicleId || '') === uId) ||
                                            (uPlate && (prev.plateNumber || prev.plate_no || '').trim().toLowerCase() === uPlate);
                                        return isMatch ? { ...prev, ...updatedVehicle } : prev;
                                    });
                                }

                                // Re-fetch fresh live data from database with no-cache
                                await fetchFleet();
                            }}
                        />
                    )}
                    {showWeatherModal && (
                        <WeatherIntelligenceModal
                            weatherData={weatherData}
                            floodZones={floodZones}
                            onClose={() => setShowWeatherModal(false)}
                            onExecuteEmergencyProtocol={handleExecuteEmergencyProtocol}
                        />
                    )}
                    {/* 100% REACT WEB2 NOTIFICATIONS DROPDOWN MODAL */}
                    {showNotifDropdown && (
                        <div className="fixed top-14 right-12 z-[100000] w-96 max-w-[90vw] bg-[#0c0e1a]/95 backdrop-blur-2xl border border-white/15 rounded-3xl p-4 shadow-[0_25px_60px_rgba(0,0,0,0.85)] animate-fade-in text-white">
                            <div className="flex items-center justify-between pb-3 border-b border-white/10 mb-3 px-1">
                                <div className="flex items-center gap-2 font-black text-sm text-white">
                                    <IconBell sz={18} className="text-orange-400" />
                                    <span>Notifications</span>
                                    {notifications.filter(n => n.unread).length > 0 && (
                                        <span className="px-2 py-0.5 rounded-full bg-orange-500 text-white font-extrabold text-[10px]">
                                            {notifications.filter(n => n.unread).length}
                                        </span>
                                    )}
                                </div>
                                <button
                                    onClick={() => setShowNotifDropdown(false)}
                                    className="p-1.5 rounded-full hover:bg-white/10 text-gray-400 hover:text-white transition-colors"
                                >
                                    <IconX sz={16} />
                                </button>
                            </div>

                            {/* Notifications List */}
                            <div className="max-h-[360px] overflow-y-auto pr-1 flex flex-col gap-2.5 custom-scrollbar">

                                        const tLow = (n.title || '').toLowerCase();
                                        const bLow = (n.body || '').toLowerCase();

                                            icon = <IconCloudRain sz={16} className="text-amber-400" />;
                                            badgeBg = "bg-amber-500/20 text-amber-400 border-amber-500/30";
                                        } else if (n.type === 'flood' || tLow.includes('flood') || tLow.includes('hazard')) {
                                            icon = <IconShieldAlert sz={16} className="text-cyan-400" />;
                                            badgeBg = "bg-cyan-500/20 text-cyan-400 border-cyan-500/30";

                                            badgeBg = "bg-red-500/20 text-red-400 border-red-500/30";

                                            <div
                                                key={n.id}
                                                onClick={() => {
                                                    setShowNotifDropdown(false);

                        <div className={`fixed top-6 right-6 z-[100000] px-5 py-3.5 rounded-2xl backdrop-blur-xl border shadow-2xl flex items-center gap-3 animate-slide-in text-xs font-bold ${toast.type === 'error'
                            ? 'bg-red-950/90 border-red-500/40 text-red-200 shadow-red-500/20'
                            : 'bg-emerald-950/90 border-emerald-500/40 text-emerald-200 shadow-emerald-500/20'
                            }`}>
                            {toast.type === 'error' ? <IconAlertTriangle sz={18} className="text-red-400 shrink-0" /> : <IconCheck sz={18} className="text-emerald-400 shrink-0" />}
                            <span>{toast.message}</span>
                            <button onClick={() => setToast(null)} className="ml-2 hover:opacity-75 text-gray-400 hover:text-white"><IconX sz={14} /></button>
                        </div>
                    )}

                </div>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("FleetOverview ErrorBoundary Caught:", error, errorInfo);
                window.__lastReactError = { error: String(error), info: errorInfo };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-[#07070e] text-white flex flex-col items-center justify-center p-8 text-center">
                            <div className="p-8 rounded-3xl bg-red-950/40 border border-red-500/30 backdrop-blur-2xl max-w-lg shadow-2xl flex flex-col items-center gap-4">
                                <div className="w-14 h-14 rounded-2xl bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-400 text-2xl font-black">!</div>
                                <h2 className="text-xl font-black text-white">Something went wrong</h2>
                                <p className="text-xs text-gray-400 font-mono bg-black/50 p-3 rounded-xl border border-white/10 text-left w-full overflow-auto max-h-40">
                                    {String(this.state.error?.message || this.state.error)}
                                </p>
                                <button onClick={() => { this.setState({ hasError: false, error: null }); window.location.reload(); }} className="px-6 py-3 rounded-xl bg-orange-500 hover:bg-orange-600 font-bold text-xs text-white shadow-lg shadow-orange-500/30 transition-all">
                                    Reload Operations Center
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Mount
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <FleetOverview />
            </ErrorBoundary>
        );


        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const splash = document.getElementById('boot-splash');
                if (splash) {
                    splash.classList.add('hide');
                    setTimeout(() => splash.remove(), 400);
                }
            });
        });
    </script>
</body>

</html>
