                                <div className="w-10 h-10 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-500 shadow-lg shadow-amber-500/10">
                                    <IconCloudRain sz={22} />
                                </div>
                                <div>
                                    <h2 className="text-base font-black text-[var(--text-primary)] flex items-center gap-2">
                                        <span>Weather Radar & Flood Hazard Telematics</span>
                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-black uppercase border ${drillMode ? 'bg-purple-500/20 text-purple-400 border-purple-500/40 animate-pulse' : isPassable ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border-amber-500/30 animate-pulse'}`}>

                    insuranceUrl: v?.insuranceUrl || v?.insurance_url || v?.InsuranceUrl || v?.documents?.insuranceUrl || v?.documents?.insurance_url || '',

                    }));

            const processTransparentImage = (fileOrUrl, onComplete) => {
                if (!fileOrUrl) return;
                const img = new Image();
                img.crossOrigin = "Anonymous";

                const onLoad = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        let width = img.width || 400;
                        let height = img.height || 400;
                        const MAX_DIM = 800;
                        if (width > MAX_DIM || height > MAX_DIM) {
                            if (width > height) {
                                height = Math.round((height * MAX_DIM) / width);
                                width = MAX_DIM;
                            } else {
                                width = Math.round((width * MAX_DIM) / height);
                                height = MAX_DIM;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imgData.data;

                        const bgR = data[0], bgG = data[1], bgB = data[2];

                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i], g = data[i + 1], b = data[i + 2];
                            const distBg = Math.sqrt((r - bgR) ** 2 + (g - bgG) ** 2 + (b - bgB) ** 2);
                            const isWhite = r > 235 && g > 235 && b > 235;

                            if (distBg < 45 || isWhite) {
                                data[i + 3] = 0; // Make background transparent
                            }
                        }

                        ctx.putImageData(imgData, 0, 0);
                        onComplete(canvas.toDataURL('image/png'), null);
                    } catch (e) {
                        console.error("Canvas transparent processing failed:", e);
                        if (typeof fileOrUrl === 'string') onComplete(fileOrUrl, null);
                        else onComplete(null, "Could not extract transparent marker background: " + (e?.message || e));
                    }
                };

                img.onerror = () => {
                    onComplete(null, "Failed to load image for transparent processing.");
                };

                if (typeof fileOrUrl === 'string') {
                    img.src = fileOrUrl;
                    if (img.complete) onLoad();
                    else img.onload = onLoad;
                } else if (fileOrUrl instanceof File) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        img.src = e.target.result;
                        img.onload = onLoad;
                    };
                    reader.onerror = () => onComplete(null, "Failed to read file.");
                    reader.readAsDataURL(fileOrUrl);
                }
            };

            const handleMediaUpload = (e) => {
                const files = e.target.files ? Array.from(e.target.files) : [];
                if (files.length === 0) return;

                const validFiles = files.filter(f => f.type.startsWith('image/'));
                if (validFiles.length === 0) {
                    setUploadProgress(p => ({ ...p, image: { active: false, percent: 0, error: 'Invalid file format. Please upload image files (JPG, PNG, WEBP).' } }));
                    return;
                }

                setUploadProgress(p => ({ ...p, image: { active: true, percent: 20, error: '' } }));

                const processSingleFile = (file) => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                try {
                                    const canvas = document.createElement('canvas');
                                    let width = img.width || 800;
                                    let height = img.height || 800;
                                    const MAX_DIM = 1400;
                                    if (width > MAX_DIM || height > MAX_DIM) {
                                        if (width > height) {
                                            height = Math.round((height * MAX_DIM) / width);
                                            width = MAX_DIM;
                                        } else {
                                            width = Math.round((width * MAX_DIM) / height);
                                            height = MAX_DIM;
                                        }
                                    }
                                    canvas.width = width;
                                    canvas.height = height;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0, width, height);
                                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                                    resolve(compressedDataUrl);
                                } catch (err) {
                                    reject(err);
                                }
                            };
                            img.onerror = () => reject(new Error('Corrupted image'));
                            img.src = ev.target.result;
                        };
                        reader.onerror = () => reject(new Error('Failed reading file'));
                        reader.readAsDataURL(file);
                    });
                };

                Promise.all(validFiles.map(processSingleFile))
                    .then(newImages => {
                        setUploadProgress(p => ({ ...p, image: { active: true, percent: 100, error: '' } }));
                        setTimeout(() => {
                            setForm(f => {
                                const currentImages = Array.isArray(f.images) ? [...f.images] : (f.image ? [f.image] : []);
                                const updatedImages = [...currentImages, ...newImages];
                                const currentPrimary = f.image && updatedImages.includes(f.image) ? f.image : (updatedImages[0] || '');
                                return {
                                    ...f,
                                    images: updatedImages,
                                    image: currentPrimary
                                };
                            });
                            setUploadProgress(p => ({ ...p, image: { active: false, percent: 0, error: '' } }));
                            if (mediaInputRef.current) mediaInputRef.current.value = '';
                        }, 350);
                    })
                    .catch(err => {
                        setUploadProgress(p => ({ ...p, image: { active: false, percent: 0, error: 'Upload error: ' + (err?.message || err) } }));
                    });
            };

            const setPrimaryImage = (imgSrc) => {
                setForm(f => {
                    const currentImages = Array.isArray(f.images) ? [...f.images] : (f.image ? [f.image] : []);
                    const filtered = currentImages.filter(x => x !== imgSrc);
                    const updated = [imgSrc, ...filtered];
                    return {
                        ...f,
                        images: updated,
                        image: imgSrc
                    };
                });
            };

            const removeImage = (imgSrc) => {
                setForm(f => {
                    const currentImages = Array.isArray(f.images) ? [...f.images] : (f.image ? [f.image] : []);
                    const updated = currentImages.filter(x => x !== imgSrc);
                    const newPrimary = f.image === imgSrc ? (updated[0] || '') : f.image;
                    return {
                        ...f,
                        images: updated,
                        image: newPrimary
                    };
                });
            };

            const handleIconUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: 'Invalid icon format. Please upload an image.' } }));
                    return;
                }
                if (file.size > 8 * 1024 * 1024) {
                    setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: 'Icon file is too large (max 8MB).' } }));
                    return;
                }

                setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 25, error: '' } }));
                setTimeout(() => setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 70, error: '' } })), 180);

                processTransparentImage(file, (transparentDataUrl, err) => {
                    if (err || !transparentDataUrl) {
                        setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: err || 'Failed to process 3D marker icon.' } }));
                    } else {
                        setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 100, error: '' } }));
                        setTimeout(() => {
                            setForm(f => ({ ...f, mapIconUrl: transparentDataUrl }));
                            setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: '' } }));
                        }, 450);
                    }
                });
            };

            const handleAuto3DTransparent = () => {
                const targetSrc = form.mapIconUrl || form.image;
                if (!targetSrc) {
                    setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: 'Upload a Vehicle Photo first or browse an image to convert.' } }));
                    return;
                }
                setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 30, error: '' } }));
                setTimeout(() => setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 75, error: '' } })), 220);

                processTransparentImage(targetSrc, (transparentDataUrl, err) => {
                    if (err || !transparentDataUrl) {
                        setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: err || 'Background removal failed.' } }));
                    } else {
                        setUploadProgress(p => ({ ...p, mapIconUrl: { active: true, percent: 100, error: '' } }));
                        setTimeout(() => {
                            setForm(f => ({ ...f, mapIconUrl: transparentDataUrl }));
                            setUploadProgress(p => ({ ...p, mapIconUrl: { active: false, percent: 0, error: '' } }));
                        }, 450);
                    }
                });
            };

            const [isRotating, setIsRotating] = useState(false);

            const rotateMarkerImage = (angleDeltaDeg) => {
                const src = form.mapIconUrl;
                if (!src || isRotating) return;
                setIsRotating(true);
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    try {
                        const rad = (angleDeltaDeg * Math.PI) / 180;
                        const sin = Math.abs(Math.sin(rad));
                        const cos = Math.abs(Math.cos(rad));
                        const origW = img.naturalWidth || img.width || 200;
                        const origH = img.naturalHeight || img.height || 200;
                        const newW = Math.round(origW * cos + origH * sin);
                        const newH = Math.round(origW * sin + origH * cos);

                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(newW, 32);
                        canvas.height = Math.max(newH, 32);
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';

                        ctx.translate(canvas.width / 2, canvas.height / 2);
                        ctx.rotate(rad);
                        ctx.drawImage(img, -origW / 2, -origH / 2);

                        const rotatedDataUrl = canvas.toDataURL('image/png');
                        setForm(f => ({ ...f, mapIconUrl: rotatedDataUrl }));
                    } catch (err) {
                        console.error('Marker rotation error:', err);
                    } finally {
                        setIsRotating(false);
                    }
                };
                img.onerror = () => setIsRotating(false);
                img.src = src;
            };

            const handleDocUpload = (e, fieldName) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                const isImg = file.type.startsWith('image/');
                if (!isPdf && !isImg) {
                    setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Invalid document format. Please upload a PDF or image file.' } }));
                    return;
                }

                if (file.size > 8 * 1024 * 1024) {
                    setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Document is too large. Max file size is 8MB.' } }));
                    return;
                }

                setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: 25, error: '' } }));

                if (isImg) {
                    const reader = new FileReader();
                    reader.onprogress = (pe) => {
                        if (pe.lengthComputable) {
                            const pct = Math.round((pe.loaded / pe.total) * 60) + 20;
                            setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: Math.min(85, pct), error: '' } }));
                        }
                    };
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            try {
                                const canvas = document.createElement('canvas');
                                let width = img.width || 800;
                                let height = img.height || 800;
                                const MAX_DIM = 1200;
                                if (width > MAX_DIM || height > MAX_DIM) {
                                    if (width > height) {
                                        height = Math.round((height * MAX_DIM) / width);
                                        width = MAX_DIM;
                                    } else {
                                        width = Math.round((width * MAX_DIM) / height);
                                        height = MAX_DIM;
                                    }
                                }
                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);
                                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

                                setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: 100, error: '' } }));
                                setTimeout(() => {
                                    setForm(f => ({ ...f, [fieldName]: compressedDataUrl }));
                                    setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: '' } }));
                                }, 450);
                            } catch (err) {
                                setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Image compression failed: ' + (err?.message || err) } }));
                            }
                        };
                        img.onerror = () => {
                            setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Failed to load document image file.' } }));
                        };
                        img.src = ev.target.result;
                    };
                    reader.onerror = () => {
                        setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Failed to read file from disk.' } }));
                    };
                    reader.readAsDataURL(file);
                } else {
                    const reader = new FileReader();
                    reader.onprogress = (pe) => {
                        if (pe.lengthComputable) {
                            const pct = Math.round((pe.loaded / pe.total) * 70) + 20;
                            setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: Math.min(90, pct), error: '' } }));
                        }
                    };
                    reader.onload = (ev) => {
                        setUploadProgress(p => ({ ...p, [fieldName]: { active: true, percent: 100, error: '' } }));
                        setTimeout(() => {
                            setForm(f => ({ ...f, [fieldName]: ev.target.result }));
                            setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: '' } }));
                        }, 450);
                    };
                    reader.onerror = () => {
                        setUploadProgress(p => ({ ...p, [fieldName]: { active: false, percent: 0, error: 'Failed to read PDF document.' } }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const submit = async (e) => {
                if (e) e.preventDefault();
                setErrorMessage('');
                if (!form.brand || !form.model || !form.plateNumber) {
                    setErrorMessage("Please fill in Brand, Model, and Plate Number.");
                    return;
                }

                const seatCap = parseInt(form.seatCapacity) || 0;
                if (seatCap > 60 || seatCap < 1) {
                    setErrorMessage("Seat Capacity must be between 1 and 60.");
                    return;
                }

                const ccVal = parseInt(form.engineCc) || 0;
                if (ccVal > 10000 || ccVal < 50) {
                    setErrorMessage("Engine CC must be between 50cc and 10,000cc.");
                    return;
                }

                try {
                    setIsSaving(true);
                    const pickId = (...sources) => {
                        for (const s of sources) {
                            if (s !== undefined && s !== null && s !== '' && !isNaN(parseInt(s))) {
                                const val = parseInt(s);
                                if (val > 0) return val;
                            }
                        }
                        return null;
                    };

                    const isEditMode = Boolean(vehicleToEdit);
                    const rawTargetId = vehicleToEdit?.vehicle_id || vehicleToEdit?.vehicleId || vehicleToEdit?.VehicleId || vehicleToEdit?.id || vehicleToEdit?.Id || vehicleToEdit?.ID || initialId;
                    let targetId = pickId(
                        initialId,
                        vehicleToEdit?.vehicle_id,
                        vehicleToEdit?.vehicleId,
                        vehicleToEdit?.VehicleId,
                        vehicleToEdit?.id,
                        vehicleToEdit?.Id,
                        vehicleToEdit?.ID
                    );

                    if (!targetId && typeof vehicleToEdit === 'object' && vehicleToEdit !== null) {
                        for (const key of Object.keys(vehicleToEdit)) {
                            if (key.toLowerCase().includes('id') && !key.toLowerCase().includes('url')) {
                                const val = parseInt(vehicleToEdit[key]);
                                if (!isNaN(val) && val > 0) {
                                    targetId = val;
                                    break;
                                }
                            }
                        }
                    }

                    const fleetList = Array.isArray(vehicles) && vehicles.length > 0 ? vehicles : (Array.isArray(window.fleetVehiclesCache) ? window.fleetVehiclesCache : []);
                    if (!targetId && form.plateNumber && fleetList.length > 0) {
                        const cleanPlate = (form.plateNumber || '').trim().toLowerCase().replace(/-/g, '');
                        const match = fleetList.find(v => (v.plateNumber || v.plate_no || v.plateNo || '').trim().toLowerCase().replace(/-/g, '') === cleanPlate);
                        if (match) {
                            targetId = pickId(match.vehicle_id, match.vehicleId, match.VehicleId, match.id);
                        }
                    }

                    const shouldUpdate = (isEditMode || Boolean(targetId)) && targetId !== null && targetId > 0;

                    const primaryPhoto = form.image || (Array.isArray(form.images) && form.images.length > 0 ? form.images[0] : '');
                    const allPhotoUrls = Array.isArray(form.images) && form.images.length > 0 
                        ? form.images 
                        : (primaryPhoto ? [primaryPhoto] : []);

                    const payload = {
                        vehicleId: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        vehicle_id: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        VehicleId: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        brand: form.brand,
                        model: form.model,
                        plateNo: form.plateNumber,
                        plate_no: form.plateNumber,
                        type: form.type,
                        cc: parseInt(form.engineCc) || 1500,
                        ratePerDay: parseFloat(form.dailyRatePHP) || 0,
                        rate_per_day: parseFloat(form.dailyRatePHP) || 0,
                        rateWithDriver: parseFloat(form.rateWithDriverPHP) || 0,
                        rate_with_driver: parseFloat(form.rateWithDriverPHP) || 0,
                        seatCapacity: parseInt(form.seatCapacity) || 5,
                        seat_capacity: parseInt(form.seatCapacity) || 5,
                        transmission: form.transmission,
                        status: form.status,
                        description: form.description,
                        photoUrl: primaryPhoto,
                        photo_url: primaryPhoto,
                        photoUrls: allPhotoUrls,
                        photo_urls: allPhotoUrls,
                        model3dUrl: form.mapIconUrl || '',
                        model_3d_url: form.mapIconUrl || '',
                        map_icon_url: form.mapIconUrl || '',
                        ltoExpiryDate: form.ltoExpiryDate ? new Date(form.ltoExpiryDate).toISOString() : null,
                        lto_expiry_date: form.ltoExpiryDate ? new Date(form.ltoExpiryDate).toISOString() : null,
                        insuranceExpiryDate: form.insuranceExpiryDate ? new Date(form.insuranceExpiryDate).toISOString() : null,
                        insurance_expiry_date: form.insuranceExpiryDate ? new Date(form.insuranceExpiryDate).toISOString() : null,
                        orCrUrl: form.orCrUrl || '',
                        or_cr_url: form.orCrUrl || '',
                        insuranceUrl: form.insuranceUrl || '',
                        insurance_url: form.insuranceUrl || '',
                        color: form.color || 'Pearl White'
                    };

                    const url = shouldUpdate ? `${API}/api/vehicles/${targetId}` : `${API}/api/vehicles`;
                    const method = shouldUpdate ? 'PUT' : 'POST';

                    const res = await fetch(url, {
                        method: method,
                        headers: HEADERS,
                        body: JSON.stringify(payload)
                    });

                    if (res.ok || res.status === 201 || res.status === 204) {
                        const resData = await res.json().catch(() => ({}));
                        const finalId = targetId || resData?.vehicleId || resData?.VehicleId || resData?.vehicle_id || form.vehicleId;
                        const updatedVehicleObj = normVehicle({
                            ...(vehicleToEdit || {}),
                            ...form,
                            vehicle_id: finalId,
                            vehicleId: finalId,
                            VehicleId: finalId,
                            id: finalId,
                            plate_no: form.plateNumber,
                            plateNumber: form.plateNumber,
                            brand: form.brand,
                            model: form.model,
                            type: form.type,
                            rate_per_day: form.dailyRatePHP,
                            dailyRatePHP: form.dailyRatePHP,
                            rate_with_driver: form.rateWithDriverPHP,
                            rateWithDriverPHP: form.rateWithDriverPHP,
                            cc: form.engineCc,
                            engineCc: form.engineCc,
                            seat_capacity: form.seatCapacity,
                            seatCapacity: form.seatCapacity,
                            transmission: form.transmission,
                            status: form.status,
                            description: form.description,
                            photo_url: primaryPhoto,
                            photoUrl: primaryPhoto,
                            image: primaryPhoto,
                            photo_urls: allPhotoUrls,
                            photoUrls: allPhotoUrls,
                            model_3d_url: form.mapIconUrl || '',
                            map_icon_url: form.mapIconUrl || '',
                            mapIconUrl: form.mapIconUrl || '',
                            lto_expiry_date: form.ltoExpiryDate,
                            insurance_expiry_date: form.insuranceExpiryDate,
                            or_cr_url: form.orCrUrl || '',
                            orCrUrl: form.orCrUrl || '',
                            insurance_url: form.insuranceUrl || '',
                            insuranceUrl: form.insuranceUrl || '',
                            documents: {
                                ltoRegistrationExpiry: formatDateSafe(form.ltoExpiryDate, '2026-10-15'),
                                insuranceExpiry: formatDateSafe(form.insuranceExpiryDate, '2026-11-20'),
                                orCrUrl: form.orCrUrl || '',
                                insuranceUrl: form.insuranceUrl || ''
                            }
                        });
                        onSave(resData?.message || (shouldUpdate ? "Vehicle updated successfully!" : "Vehicle added to fleet successfully!"), updatedVehicleObj);
                    } else {
                        const rawErrText = await res.text().catch(() => '');
                        let parsedMsg = '';
                        try {
                            const parsedJson = JSON.parse(rawErrText);
                            parsedMsg = parsedJson.message || parsedJson.Message || parsedJson.title || '';
                        } catch (_) { }
                        const displayMsg = parsedMsg || rawErrText || `Error saving vehicle data (HTTP ${res.status}).`;
                        setErrorMessage(displayMsg);
                    }
                } catch (err) {
                    console.error("Save Vehicle Exception:", err);
                    setErrorMessage(`Network or System Exception: ${err?.message || err}`);
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[99999] flex items-center justify-center p-4 sm:p-6 animate-fade-in" onClick={onClose}>
                    <div className="bg-[var(--bg-secondary)] backdrop-blur-2xl border border-[var(--border-color)] text-[var(--text-primary)] rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden relative animate-scale-up" onClick={e => e.stopPropagation()}>

                        {/* Visual Glass Saving Overlay Loading State */}
                        {isSaving && (
                            <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-md flex flex-col items-center justify-center gap-3 animate-fade-in">
                                <div className="w-16 h-16 rounded-2xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-500 shadow-2xl shadow-orange-500/30">
                                    <IconRefreshCw sz={32} c="animate-spin" />
                                </div>
                                <div className="text-base font-black text-white tracking-wide">Saving Changes...</div>
                                <div className="text-xs text-orange-300/80 font-medium">Updating vehicle specs & documents in database</div>
                            </div>
                        )}

                        {/* Header */}
                        <div className="p-5 border-b border-[var(--border-color)] flex justify-between items-center bg-[var(--bg-tertiary)] shrink-0">
                            <h2 className="text-lg font-black text-[var(--text-primary)] flex items-center gap-2">
                                <span className="text-orange-500">{vehicleToEdit ? <IconEdit sz={18} className="inline" /> : <IconPlus sz={18} className="inline" />}</span>
                                <span>{vehicleToEdit ? 'Edit Vehicle Specs' : 'Add New Vehicle'}</span>
                            </h2>
                            <button onClick={onClose} className="p-1.5 rounded-full hover:bg-[var(--bg-card-hover)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors"><IconX sz={18} /></button>
                        </div>

                        {/* Inline Error Alert */}
                        {errorMessage && (
                            <div className="mx-6 mt-4 p-3.5 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-start gap-3 text-red-500 text-xs shrink-0 animate-fade-in">
                                <IconAlertTriangle sz={18} className="shrink-0 mt-0.5" />
                                <div className="flex-1">
                                    <p className="font-bold">Failed to save vehicle specs</p>
                                    <p className="text-[11px] text-red-400 mt-0.5 leading-relaxed">{errorMessage}</p>
                                </div>
                                <button type="button" onClick={() => setErrorMessage('')} className="text-red-500 hover:text-red-700"><IconX sz={14} /></button>
                            </div>
                        )}

                        {/* Form Body - 2 Columns */}
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar grid grid-cols-1 lg:grid-cols-12 gap-6">

                            {/* LEFT COLUMN: Inputs (7 Cols) */}
                            <div className="lg:col-span-7 flex flex-col gap-4">

                                {/* 2-Option Segmented Selection Toggle: Custom Vehicle vs Existing Brand & Model Preset */}
                                {!vehicleToEdit && (
                                    <div className="bg-[var(--bg-tertiary)] p-1.5 rounded-2xl border border-[var(--border-color)] flex items-center gap-2 mb-1">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setCreationMode('custom');
                                                setSelectedBrandPreset('');
                                                setSelectedModelPreset('');
                                                setForm(f => ({ ...f, brand: '', model: '' }));
                                            }}
                                            className={`flex-1 py-2.5 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${creationMode === 'custom'
                                                ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/30'
                                                : 'text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-white/5'
                                                }`}
                                        >
                                            <IconPlus sz={14} /> Custom Vehicle
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setCreationMode('preset')}
                                            className={`flex-1 py-2.5 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${creationMode === 'preset'
                                                ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/30'
                                                : 'text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-white/5'
                                                }`}
                                        >
                                            <IconZap sz={14} /> Same Brand & Model
                                        </button>
                                    </div>
                                )}

                                {/* Brand & Model */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <div className="flex items-center justify-between mb-1">
                                            <label className="text-xs font-semibold text-[var(--text-secondary)]">Brand *</label>
                                            {form.brand && form.brand.trim().length > 0 && (

            const cleanTitle = String(title || '').trim();

            const type = cleanTitle.toLowerCase().includes('flood') ? 'flood' :

                window.__addNotificationReact({
                    id: Date.now() + Math.random(),
                    type,
                    title: cleanTitle || 'Fleet Advisory',
                    body: cleanBody || 'Notification details',
                    time: 'Just now',
                    unread: true

            const [riverDischarge, setRiverDischarge] = useState(null);

                    try {

                        if (res.ok) {
                            const data = await res.json();

                window.refreshFleetData = fetchFleet;

                const calcBearing = (lat1, lng1, lat2, lng2) => {
                    const toRad = Math.PI / 180;
                    const dLng = (lng2 - lng1) * toRad;
                    const phi1 = lat1 * toRad;
                    const phi2 = lat2 * toRad;
                    const y = Math.sin(dLng) * Math.cos(phi2);
                    const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLng);
                    const brng = Math.atan2(y, x) * (180 / Math.PI);
                    return Math.round((brng + 360) % 360);
                };

                // Real API & Firebase Telematics GPS Live Update Listener
                // ONLY moves vehicle and rotates bearing when genuine coordinates arrive from API / GPS sensor
                window.liveUpdateGPS = (vid, lat, lng, speed, heading) => {
                    setVehicles(prev => prev.map(v => {
                        if (String(v.id) === String(vid) || String(v.vehicle_id) === String(vid)) {
                            const oldLat = v.coordinates ? v.coordinates[0] : lat;
                            const oldLng = v.coordinates ? v.coordinates[1] : lng;

                            // Calculate forward bearing angle only if location actually shifted
                            let newHeading = heading;
                            if (newHeading === undefined || newHeading === null) {
                                if (Math.abs(lat - oldLat) > 0.00001 || Math.abs(lng - oldLng) > 0.00001) {
                                    newHeading = calcBearing(oldLat, oldLng, lat, lng);
                                } else {
                                    newHeading = v.heading || 0;
                                }
                            }

                            const R = 6371; // Earth radius in km
                            const dLat = (lat - oldLat) * Math.PI / 180;
                            const dLng = (lng - oldLng) * Math.PI / 180;
                            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                                Math.cos(oldLat * Math.PI / 180) * Math.cos(lat * Math.PI / 180) *
                                Math.sin(dLng / 2) * Math.sin(dLng / 2);
                            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                            const distKm = R * c;

                            const addKm = (distKm > 0.005 && distKm < 10) ? distKm : 0;
                            const newOdo = Math.round(((v.odometerKm || 0) + addKm) * 10) / 10;

                            const updated = {
                                ...v,
                                coordinates: [lat, lng],
                                heading: newHeading,
                                bearing: newHeading,
                                currentSpeedKmh: speed !== undefined ? speed : (distKm > 0.001 ? 35 : 0),
                                odometerKm: newOdo,
                            };

                            setSelectedVehicle(curr => (curr && (String(curr.id) === String(vid) || String(curr.vehicle_id) === String(vid))) ? updated : curr);

                            return updated;
                        }
                        return v;
                    }));

                let rawId = vObj?.vehicle_id || vObj?.vehicleId || vObj?.VehicleId || vObj?.id || vObj?.Id || vObj?.ID;

                                {/* Interactive Brand Orange Status Combobox */}
                                <StatusCombobox value={filterStatus} onChange={setFilterStatus} />

                                <div className="h-6 w-px bg-[var(--border-color)] hidden sm:block"></div>

                                {/* View Mode Icons */}
                                <div className="flex gap-1 shrink-0 bg-[var(--bg-tertiary)] p-1 rounded-xl border border-[var(--border-color)]">
                                    <button onClick={() => setViewMode('grid')} className={`p-1.5 rounded-lg transition-all ${viewMode === 'grid' ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30' : 'text-[var(--text-muted)] hover:text-[var(--text-primary)]'}`} title="Grid View"><IconGrid sz={16} /></button>
                                    <button onClick={() => setViewMode('table')} className={`p-1.5 rounded-lg transition-all ${viewMode === 'table' ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30' : 'text-[var(--text-muted)] hover:text-[var(--text-primary)]'}`} title="List View"><IconList sz={16} /></button>
                                </div>

                                {/* Add Unit Button */}
                                <button onClick={handleAddUnit} className="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-orange-500/20 flex items-center gap-2 shrink-0 transition-colors">
                                    <IconPlus sz={16} /> Add Unit
                                </button>
                            </div>
                        </div>

                        {/* VEHICLE GRID (GROUPED STACK CARDS & 3D FAN-OUT DECK) */}
                        {loading && vehicles.length === 0 ? (
                            <div className="flex justify-center items-center py-20 text-[var(--text-muted)]"><IconRefreshCw sz={32} c="animate-spin" /></div>
                        ) : viewMode === 'grid' ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-6 items-stretch">
                                {groupedClusters.map(cluster => (
                                    <GroupedVehicleCard
                                        key={cluster.key}
                                        cluster={cluster}
                                        onClickCluster={() => {
                                            if (cluster.totalUnits > 1) {
                                                setDeckCluster(cluster);
                                            } else {
                                                setSelectedVehicle(cluster.primaryUnit);
                                            }
                                        }}
                                    />
                                ))}
                                {groupedClusters.length === 0 && <div className="col-span-full py-16 text-center text-[var(--text-muted)]">No vehicles match filters.</div>}
                            </div>
                        ) : (
                            <VehicleTable vehicles={filteredVehicles} onSelect={setSelectedVehicle} />
                        )}

                    </div>

                    {/* RIGHT COLUMN: FULL-HEIGHT DARK LEAFLET MAP (~42% width) */}
                    <div className="hidden lg:flex flex-col flex-1 h-full p-5 pl-0 relative">
                        <div className="w-full h-full rounded-3xl overflow-hidden border border-[var(--border-color)] shadow-2xl relative">
                            {/* Floating Weather Telematics Banner Overlay inside Map Container */}
                            {showWeatherBanner && (
                                <div
                                    onClick={() => setShowWeatherModal(true)}
                                    className={`absolute top-3 left-3 right-3 z-[500] p-2.5 px-4 rounded-2xl bg-[var(--bg-card)] border backdrop-blur-xl flex items-center justify-between text-xs shadow-2xl animate-fade-in transition-all duration-300 group cursor-pointer hover:scale-[1.005] ${weatherAlert.accentBorder}`}
                                    title="Click to open Full Interactive Weather & PAGASA Radar Analytics"
                                >
                                    <div className="flex items-center gap-3 overflow-hidden flex-1 min-w-0">
                                        {/* Live Pulsing Beacon Dot & Temperature Pill */}
                                        <div className="flex items-center gap-2 shrink-0">
                                            <span className="relative flex h-2.5 w-2.5">
                                                <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${weatherAlert.beaconColor}`}></span>
                                                <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${weatherAlert.beaconColor}`}></span>
                                            </span>
                                            <span className={`px-2.5 py-0.5 rounded-lg text-xs font-black border backdrop-blur flex items-center gap-1.5 ${weatherAlert.badgeBg}`}>
                                                <IconCloudRain sz={14} />
                                                <span>{weatherAlert.temp}</span>
                                            </span>
                                        </div>

                                        {/* Weather Text Ticker */}
                                        <div className="truncate font-semibold text-[var(--text-primary)] text-xs flex items-center gap-2">
                                            <span className="truncate">{weatherAlert.text}</span>
                                        </div>
                                    </div>

                                    {/* Action Affordance Badge & Close Button */}
                                    <div className="flex items-center gap-2 shrink-0 ml-3">
                                        <span className="px-2.5 py-1 rounded-xl bg-orange-500/15 group-hover:bg-orange-500 text-orange-400 group-hover:text-white border border-orange-500/30 font-black text-[11px] transition-all flex items-center gap-1 shadow-sm">
                                            <span>Radar Analytics &rarr;</span>
                                        </span>
                                        <button
                                            onClick={(e) => { e.stopPropagation(); setShowWeatherBanner(false); }}
                                            className="p-1 rounded-lg hover:bg-white/10 text-[var(--text-muted)] hover:text-white transition-colors"
                                            title="Dismiss Weather Bar"
                                        >
                                            <IconX sz={14} />
                                        </button>
                                    </div>
                                </div>
                            )}

                            <LeafletMapComponent
                                vehicles={vehicles}
                                selectedVehicleId={selectedVehicle?.id}
                                onSelectVehicle={setSelectedVehicle}
                                isDark={isDark}
                                weatherData={weatherData}
                                onOpenWeatherModal={() => setShowWeatherModal(true)}
                                hasWeatherBanner={showWeatherBanner}
                            />
                        </div>
                    </div>

                    {/* VEHICLE DETAILS OVERLAY DRAWER */}
                    <VehicleDrawer v={selectedVehicle} onClose={() => setSelectedVehicle(null)} onRefresh={fetchFleet} onEdit={handleEditUnit} onDelete={handleDeleteUnit} onShowQr={setQrVehicle} onPreviewDoc={setPreviewDoc} />

                    {/* 3D FAN-OUT DECK CAROUSEL MODAL */}
                    {deckCluster && (
                        <DeckFanModal
                            cluster={deckCluster}
                            onClose={() => setDeckCluster(null)}
                            onSelectVehicle={setSelectedVehicle}
                            onEditUnit={handleEditUnit}
                            onDeleteUnit={handleDeleteUnit}
                            onShowQr={setQrVehicle}
                        />
                    )}

                    {/* MODALS */}
                    {showAddModal && (
                        <AddVehicleModal
                            vehicleToEdit={editingVehicle}
                            vehicles={vehicles}
                            onClose={() => { setShowAddModal(false); setEditingVehicle(null); }}
                            onSave={async (successMsg, updatedVehicle) => {
                                setShowAddModal(false);
                                setEditingVehicle(null);
                                showToast(successMsg || "Vehicle updated successfully!", 'success');

                                // Instant Optimistic Local State Update (0ms immediate refresh!)
                                if (updatedVehicle) {
                                    const uId = String(updatedVehicle.id || updatedVehicle.vehicle_id || updatedVehicle.vehicleId || '');
                                    const uPlate = (updatedVehicle.plateNumber || updatedVehicle.plate_no || '').trim().toLowerCase();

                                    setVehicles(prev => {
                                        const isMatch = v => (uId && String(v.id || v.vehicle_id || v.vehicleId || '') === uId) ||
                                            (uPlate && (v.plateNumber || v.plate_no || '').trim().toLowerCase() === uPlate);
                                        const exists = prev.some(isMatch);
                                        if (exists) {
                                            return prev.map(v => isMatch(v) ? { ...v, ...updatedVehicle } : v);
                                        }
                                        return [updatedVehicle, ...prev];
                                    });

                                    setSelectedVehicle(prev => {
                                        if (!prev) return null;
                                        const isMatch = (uId && String(prev.id || prev.vehicle_id || prev.vehicleId || '') === uId) ||
                                            (uPlate && (prev.plateNumber || prev.plate_no || '').trim().toLowerCase() === uPlate);
                                        return isMatch ? { ...prev, ...updatedVehicle } : prev;
                                    });
                                }

                                // Re-fetch fresh live data from database with no-cache
                                await fetchFleet();
                            }}
                        />
                    )}
                    {showWeatherModal && (
                        <WeatherIntelligenceModal
                            weatherData={weatherData}
                            hourlyWeather={hourlyWeather}
                            riverDischarge={riverDischarge}
                            vehicles={vehicles}
                            floodZones={floodZones}
                            onClose={() => setShowWeatherModal(false)}
                            onExecuteEmergencyProtocol={handleExecuteEmergencyProtocol}
                        />
                    )}
                    {/* 100% REACT WEB2 NOTIFICATIONS DROPDOWN MODAL */}
                    {showNotifDropdown && (
                        <div className="fixed inset-0 z-[99999] bg-transparent" onClick={() => setShowNotifDropdown(false)}>
                            <div 
                                className={`fixed top-14 right-12 z-[100000] w-96 max-w-[90vw] backdrop-blur-2xl border rounded-3xl p-4 animate-fade-in overflow-hidden transition-colors duration-200 ${
                                    isDark 
                                      ? 'bg-[#0c0e1a]/95 border-white/15 text-white shadow-[0_25px_60px_rgba(0,0,0,0.85)]' 
                                      : 'bg-white/95 border-slate-200 text-slate-900 shadow-[0_25px_60px_rgba(0,0,0,0.15)]'
                                }`}
                                onClick={e => e.stopPropagation()}
                            >
                            <div className={`flex items-center justify-between pb-3 border-b mb-3 px-1 ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
                                <div className={`flex items-center gap-2 font-black text-sm ${isDark ? 'text-white' : 'text-slate-900'}`}>
                                    <IconBell sz={18} className={isDark ? "text-orange-400" : "text-orange-600"} />
                                    <span>Notifications</span>
                                    {notifications.filter(n => n.unread).length > 0 && (
                                        <span className="px-2 py-0.5 rounded-full bg-orange-500 text-white font-extrabold text-[10px]">
                                            {notifications.filter(n => n.unread).length}
                                        </span>
                                    )}
                                </div>
                                <button
                                    onClick={() => setShowNotifDropdown(false)}
                                    className={`p-1.5 rounded-full transition-colors ${
                                        isDark ? 'hover:bg-white/10 text-gray-400 hover:text-white' : 'hover:bg-slate-100 text-slate-400 hover:text-slate-700'
                                    }`}
                                >
                                    <IconX sz={16} />
                                </button>
                            </div>

                            {/* Notifications List */}
                            <div className="max-h-[360px] overflow-y-auto pr-1 flex flex-col gap-2.5 custom-scrollbar">
                                {notifications.length === 0 ? (
                                    <div className={`py-12 text-center text-xs italic ${isDark ? 'text-gray-400' : 'text-slate-400'}`}>
                                        No active notifications
                                    </div>
                                ) : (
                                    notifications.map(n => {
                                        let icon = <IconBell sz={16} className={isDark ? "text-blue-400" : "text-blue-600"} />;
                                        let badgeBg = isDark ? "bg-blue-500/20 text-blue-400 border-blue-500/30" : "bg-blue-500/15 text-blue-600 border-blue-500/25";

                                        const tLow = (n.title || '').toLowerCase();
                                        const bLow = (n.body || '').toLowerCase();

                                        if (n.type === 'weather' || tLow.includes('weather') || tLow.includes('pagasa') || tLow.includes('monsoon')) {
                                            icon = <IconCloudRain sz={16} className={isDark ? "text-amber-400" : "text-amber-600"} />;
                                            badgeBg = isDark ? "bg-amber-500/20 text-amber-400 border-amber-500/30" : "bg-amber-500/15 text-amber-600 border-amber-500/25";
                                        } else if (n.type === 'flood' || tLow.includes('flood') || tLow.includes('hazard')) {
                                            icon = <IconShieldAlert sz={16} className={isDark ? "text-cyan-400" : "text-cyan-600"} />;
                                            badgeBg = isDark ? "bg-cyan-500/20 text-cyan-400 border-cyan-500/30" : "bg-cyan-500/15 text-cyan-600 border-cyan-500/25";
                                        } else if (n.type === 'decommission' || tLow.includes('decommission') || tLow.includes('audit')) {
                                            icon = <IconTrash2 sz={16} className={isDark ? "text-red-400" : "text-red-600"} />;
                                            badgeBg = isDark ? "bg-red-500/20 text-red-400 border-red-500/30" : "bg-red-500/15 text-red-600 border-red-500/25";
                                        }

                                        const itemBg = isDark
                                            ? (n.unread ? 'bg-white/[0.08] border-white/25 shadow-md hover:bg-white/[0.14] hover:border-orange-500/50' : 'bg-white/[0.02] border-white/5 opacity-75 hover:bg-white/[0.14] hover:border-orange-500/50')
                                            : (n.unread ? 'bg-slate-50 border-slate-200 shadow-sm hover:bg-slate-100 hover:border-orange-500/50' : 'bg-slate-100/40 border-slate-100 opacity-80 hover:bg-slate-100 hover:border-orange-500/50');

                                        return (
                                            <div
                                                key={n.id}
                                                onClick={() => {
                                                    setShowNotifDropdown(false);
                                                    setNotifications(prev => prev.map(x => x.id === n.id ? { ...x, unread: false } : x));

                                                    if (tLow.includes('weather') || tLow.includes('pagasa') || tLow.includes('monsoon') || tLow.includes('flood') || bLow.includes('rain')) {
                                                        setShowWeatherModal(true);
                                                    }
                                                }}
                                                className={`p-3 rounded-2xl border transition-all cursor-pointer flex items-start gap-3 hover:scale-[1.01] ${itemBg}`}
                                            >
                                                <div className={`p-2 rounded-xl border shrink-0 ${badgeBg}`}>
                                                    {icon}
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center justify-between gap-2 mb-0.5">
                                                        <h4 className={`font-extrabold text-xs truncate ${isDark ? 'text-white' : 'text-slate-900'}`}>{n.title}</h4>
                                                        <span className={`text-[10px] font-semibold whitespace-nowrap ${isDark ? 'text-gray-400' : 'text-slate-400'}`}>{n.time}</span>
                                                    </div>
                                                    <p className={`text-[11px] leading-snug line-clamp-2 ${isDark ? 'text-gray-300' : 'text-slate-600'}`}>{n.body}</p>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>

                            {/* Clear All Footer */}
                            {notifications.length > 0 && (
                                <div className={`pt-3 mt-3 border-t flex justify-center ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
                                    <button
                                        onClick={() => setNotifications([])}
                                        className={`text-xs font-black transition-colors uppercase tracking-wider py-1 px-4 rounded-xl ${
                                            isDark 
                                              ? 'text-orange-400 hover:text-orange-300 hover:bg-orange-500/10' 
                                              : 'text-orange-600 hover:text-orange-700 hover:bg-orange-500/10'
                                        }`}
                                    >
                                        Clear all
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                    )}

                    {qrVehicle && <QrCodeModal vehicle={qrVehicle} onClose={() => setQrVehicle(null)} />}
                    {previewDoc && <DocumentPreviewModal title={previewDoc.title} url={previewDoc.url} onClose={() => setPreviewDoc(null)} />}

                    {/* FLOATING GLASS TOAST NOTIFICATION */}
                    {/* DECOMMISSION VEHICLE MODAL */}
                    {decommissionVehicle && (
                        <DecommissionVehicleModal
                            vehicle={decommissionVehicle}
                            onClose={() => setDecommissionVehicle(null)}
                            onConfirmDecommission={handleConfirmDecommission}
                        />
                    )}

                    {toast && (
                        <div className={`fixed top-6 right-6 z-[100000] px-5 py-3.5 rounded-2xl backdrop-blur-xl border shadow-2xl flex items-center gap-3 animate-slide-in text-xs font-bold ${toast.type === 'error'
                            ? 'bg-red-950/90 border-red-500/40 text-red-200 shadow-red-500/20'
                            : 'bg-emerald-950/90 border-emerald-500/40 text-emerald-200 shadow-emerald-500/20'
                            }`}>
                            {toast.type === 'error' ? <IconAlertTriangle sz={18} className="text-red-400 shrink-0" /> : <IconCheck sz={18} className="text-emerald-400 shrink-0" />}
                            <span>{toast.message}</span>
                            <button onClick={() => setToast(null)} className="ml-2 hover:opacity-75 text-gray-400 hover:text-white"><IconX sz={14} /></button>
                        </div>
                    )}

                </div>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("FleetOverview ErrorBoundary Caught:", error, errorInfo);
                window.__lastReactError = { error: String(error), info: errorInfo };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-[#07070e] text-white flex flex-col items-center justify-center p-8 text-center">
                            <div className="p-8 rounded-3xl bg-red-950/40 border border-red-500/30 backdrop-blur-2xl max-w-lg shadow-2xl flex flex-col items-center gap-4">
                                <div className="w-14 h-14 rounded-2xl bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-400 text-2xl font-black">!</div>
                                <h2 className="text-xl font-black text-white">Something went wrong</h2>
                                <p className="text-xs text-gray-400 font-mono bg-black/50 p-3 rounded-xl border border-white/10 text-left w-full overflow-auto max-h-40">
                                    {String(this.state.error?.message || this.state.error)}
                                </p>
                                <button onClick={() => { this.setState({ hasError: false, error: null }); window.location.reload(); }} className="px-6 py-3 rounded-xl bg-orange-500 hover:bg-orange-600 font-bold text-xs text-white shadow-lg shadow-orange-500/30 transition-all">
                                    Reload Operations Center
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Mount with fallback support for ReactDOM.createRoot and ReactDOM.render
        try {
            const rootEl = document.getElementById('root');
            if (ReactDOM.createRoot) {
                const root = ReactDOM.createRoot(rootEl);
                root.render(
                    <ErrorBoundary>
                        <FleetOverview />
                    </ErrorBoundary>
                );
            } else {
                ReactDOM.render(
                    <ErrorBoundary>
                        <FleetOverview />
                    </ErrorBoundary>,
                    rootEl
                );
            }
        } catch (mountErr) {
            console.error("ReactDOM Mount Error:", mountErr);
            document.getElementById('root').innerHTML = '<div style="color:#ef4444;padding:30px;font-family:Segoe UI,sans-serif;background:#0d0e17;border:1px solid rgba(239,68,68,0.3);border-radius:20px;margin:20px;"><h3 style="color:#f97316;">ReactDOM Mounting Failure</h3><pre style="background:rgba(0,0,0,0.5);padding:12px;border-radius:10px;font-size:11px;color:#cbd5e1;">' + (mountErr.stack || mountErr.message) + '</pre></div>';
        }

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const splash = document.getElementById('boot-splash');
                if (splash) {
                    splash.classList.add('hide');
                    setTimeout(() => { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
                }
            });
        });
    </script>
</body>

</html>
