<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Overview</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet 1.9.4 CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root,
        [data-theme="dark"] {
            --bg-primary: #07070e;
            --bg-secondary: #0d0e17;
            --bg-tertiary: #141625;
            --bg-card: rgba(13, 14, 23, 0.75);
            --bg-card-hover: rgba(20, 22, 37, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.12);
            --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --shadow-glow-orange: 0 0 25px rgba(249, 115, 22, 0.35);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: rgba(226, 232, 240, 0.8);
            --border-highlight: rgba(203, 213, 225, 0.9);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow-soft: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --shadow-glow-orange: 0 0 20px rgba(249, 115, 22, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        [data-theme="dark"] .leaflet-popup-content-wrapper {
            background: rgba(13, 14, 23, 0.95) !important;
            color: #f8fafc !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
        }

        [data-theme="dark"] .leaflet-popup-tip {
            background: rgba(13, 14, 23, 0.95) !important;
        }

        [data-theme="dark"] .leaflet-control-zoom a {
            background: rgba(13, 14, 23, 0.9) !important;
            color: #f8fafc !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(249, 115, 22, 0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out both;
        }

        .animate-slide-up {
            animation: slideUp 0.5s ease-out both;
        }

        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #07070e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #boot-splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #boot-splash .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #boot-splash .text {
            margin-top: 16px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <div id="boot-splash">
        <div class="loader"></div>
        <div class="text">Initializing Fleet Operations Center</div>
    </div>
    <div id="root"></div>

    <script>
        window.API_BASE_URL = window.API_BASE_URL || '';
        window.AUTH_TOKEN = window.AUTH_TOKEN || '';

        // Safety fallback: Auto-dismiss boot splash screen after 1s to prevent hanging
        setTimeout(function () {
            var splash = document.getElementById('boot-splash');
            if (splash) {
                splash.classList.add('hide');
                setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
            }
        }, 1000);
    </script>
    <script src="react.production.min.js"></script>
    <script src="react-dom.production.min.js"></script>
    <script src="babel.min.js"></script>

    <script type="text/babel">
        // DriveAndGo Fleet Management Overview - Advanced React Application (FleetOps Pro Architecture)
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ─── UTILS ──────────────────────────────────────────────────────────────────
        const rawApi = (window.API_BASE_URL || 'http://localhost:5233/api').trim();
        const API = rawApi.replace(/\/$/, '').replace(/\/api$/, '');
        const HEADERS = {
            'Content-Type': 'application/json',
            ...(window.AUTH_TOKEN ? { 'Authorization': `Bearer ${window.AUTH_TOKEN}` } : {})
        };

        const formatPHP = (val) => new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(val || 0);

        const statusColorMap = {
            'available': { text: 'text-emerald-400', border: 'border-emerald-400/30', bg: 'bg-emerald-400/10', hex: '#34d399' },
            'rented': { text: 'text-amber-400', border: 'border-amber-400/30', bg: 'bg-amber-400/10', hex: '#fbbf24' },
            'in-use': { text: 'text-amber-400', border: 'border-amber-400/30', bg: 'bg-amber-400/10', hex: '#fbbf24' },
            'maintenance': { text: 'text-purple-400', border: 'border-purple-400/30', bg: 'bg-purple-400/10', hex: '#c084fc' },
            'retired': { text: 'text-red-400', border: 'border-red-400/30', bg: 'bg-red-400/10', hex: '#f87171' },
            'default': { text: 'text-blue-400', border: 'border-blue-400/30', bg: 'bg-blue-400/10', hex: '#60a5fa' }
        };

        const getStatusStyle = (s) => statusColorMap[(s || '').toLowerCase()] || statusColorMap.default;

        const getColorBoxHex = (colorName) => {
            const cLower = (colorName || '').toLowerCase();
            if (cLower.includes('white')) return { hex: '#F8F9FA', border: '#CBD5E1' };
            if (cLower.includes('agate') || cLower.includes('black') || cLower.includes('dark')) return { hex: '#1E293B', border: '#475569' };
            if (cLower.includes('red') || cLower.includes('crimson')) return { hex: '#DC2626', border: '#EF4444' };
            if (cLower.includes('grey') || cLower.includes('gray')) return { hex: '#64748B', border: '#94A3B8' };
            if (cLower.includes('silver')) return { hex: '#CBD5E1', border: '#94A3B8' };
            if (cLower.includes('blue')) return { hex: '#1E3A8A', border: '#3B82F6' };
            if (cLower.includes('gold') || cLower.includes('yellow')) return { hex: '#D97706', border: '#F59E0B' };
            if (cLower.includes('green')) return { hex: '#059669', border: '#10B981' };
            if (cLower.includes('orange')) return { hex: '#EA580C', border: '#F97316' };
            return { hex: '#94A3B8', border: '#64748B' };
        };

        const formatDateSafe = (val, fallback) => {
            if (!val) return fallback;
            if (typeof val === 'string') {
                return val.includes('T') ? val.split('T')[0] : val;
            }
            try {
                const d = new Date(val);
                return isNaN(d.getTime()) ? fallback : d.toISOString().split('T')[0];
            } catch (e) {
                return fallback;
            }
        };

        // Normalizes camelCase, PascalCase, and snake_case API responses
        const normVehicle = (v, idx = 0) => {
            let mainPhoto = v.photo_url || v.photoUrl || v.PhotoUrl || v.image || v.Image || '';
            if (typeof mainPhoto === 'string' && mainPhoto.trim().startsWith('[')) {
                try {
                    const arr = JSON.parse(mainPhoto);
                    if (Array.isArray(arr) && arr.length > 0) mainPhoto = arr[0];
                } catch (e) { }
            }

            const rawLat = parseFloat(v.latitude || v.Latitude || v.lat || 0);
            const rawLng = parseFloat(v.longitude || v.Longitude || v.lng || 0);
            const st = (v.status || v.Status || 'available').toLowerCase();

            const HQ_LAT = 14.871116;
            const HQ_LNG = 121.048088;

            let finalLat = rawLat;
            let finalLng = rawLng;

            // Realtime Location Logic:
            // If available OR if GPS coordinates are missing/empty/default, place at HQ Rental Station parking lot grid
            if (st === 'available' || !rawLat || !rawLng || (Math.abs(rawLat - 14.8169) < 0.001 && Math.abs(rawLng - 121.0453) < 0.001)) {
                const row = Math.floor(idx / 5);
                const col = idx % 5;
                finalLat = HQ_LAT + (row * 0.00015 - 0.0003);
                finalLng = HQ_LNG + (col * 0.00018 - 0.00036);
            }

            let rawId = v.vehicle_id || v.vehicleId || v.VehicleId || v.id || v.Id || v.ID || v.Vehicle_Id || v._id;
            if ((rawId === undefined || rawId === null || rawId === '' || isNaN(parseInt(rawId)) || parseInt(rawId) <= 0) && typeof v === 'object' && v !== null) {
                for (const key of Object.keys(v)) {
                    if (key.toLowerCase().includes('id') && !key.toLowerCase().includes('url') && !key.toLowerCase().includes('guid')) {
                        const val = parseInt(v[key]);
                        if (!isNaN(val) && val > 0) {
                            rawId = val;
                            break;
                        }
                    }
                }
            }
            const parsedId = (rawId !== undefined && rawId !== null && !isNaN(parseInt(rawId))) ? parseInt(rawId) : null;
            const dbId = (parsedId && parsedId > 0) ? parsedId : null;
            return {
                id: dbId || Math.random(),
                vehicle_id: dbId,
                vehicleId: dbId,
                VehicleId: dbId,
                plateNumber: v.plate_no || v.plateNo || v.plateNumber || v.PlateNumber || '',
                brand: v.brand || v.Brand || '',
                model: v.model || v.Model || '',
                type: v.type || v.Type || 'Car',
                year: v.year || v.Year || new Date().getFullYear(),
                status: st,
                dailyRatePHP: parseFloat(v.rate_per_day || v.ratePerDay || v.dailyRatePHP || v.DailyRatePHP || v.dailyRate || 0),
                rateWithDriverPHP: parseFloat(v.rate_with_driver || v.rateWithDriver || v.rateWithDriverPHP || 0),
                engineCc: v.cc || v.EngineCc || v.engineCc || 1500,
                transmission: v.transmission || v.Transmission || 'Automatic',
                fuelType: v.fuelType || v.FuelType || 'Gasoline',
                fuelPercentage: v.fuel_level_pct || v.fuelPercentage || v.FuelLevelPct || 85,
                odometerKm: v.odometer_km || v.odometerKm || v.OdometerKm || 0,
                currentSpeedKmh: v.current_speed || v.currentSpeed || v.speed || v.Speed || 0,
                healthScore: v.health_score || v.healthScore || v.HealthScore || 95,
                rfidBalancePHP: v.rfid_balance_autosweep || v.rfidBalancePHP || 500,
                autosweepTag: v.autosweepTag || 'AUTOSWEEP-' + (v.vehicle_id || v.id || 1),
                easytripTag: v.easytripTag || 'EASYTRIP-' + (v.vehicle_id || v.id || 1),
                image: mainPhoto,
                mapIconUrl: v.map_icon_url || v.mapIconUrl || v.model_3d_url || v.model3dUrl || '',
                orCrUrl: v.or_cr_url || v.orCrUrl || v.OrCrUrl || '',
                insuranceUrl: v.insurance_url || v.insuranceUrl || v.InsuranceUrl || '',
                coordinates: [finalLat, finalLng],
                driverName: v.driverName || v.DriverName || '',
                driverPhone: v.driverPhone || v.DriverPhone || '',
                engineStatus: (v.current_speed || 0) > 0 ? 'RUNNING' : (v.engineStatus || 'OFF').toUpperCase(),
                maintenanceDueKm: v.maintenance_due_km || v.maintenanceDueKm || 5000,
                documents: {
                    ltoRegistrationExpiry: formatDateSafe(v.lto_expiry_date || v.ltoExpiryDate || v.documents?.ltoRegistrationExpiry, '2026-10-15'),
                    insuranceExpiry: formatDateSafe(v.insurance_expiry_date || v.insuranceExpiryDate || v.documents?.insuranceExpiry, '2026-11-20'),
                    orCrUrl: v.or_cr_url || v.orCrUrl || v.OrCrUrl || '',
                    insuranceUrl: v.insurance_url || v.insuranceUrl || v.InsuranceUrl || ''
                },
                hardwareOverride: {
                    immobilizerActive: v.telematics_locked || v.hardwareOverride?.immobilizerActive || false,
                    doorLocked: true,
                },
                color: v.color || v.Color || 'Pearl White'
            };
        };


        // ─── ICONS (Lucide SVG, No Emojis) ──────────────────────────────────────────
        const S = ({ sz = 16, c = "", ch }) => <svg xmlns="http://www.w3.org/2000/svg" width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}>{ch}</svg>;
        const IconCar = ({ sz, c }) => <S sz={sz} c={c} ch={<><path d="M19 17H5a2 2 0 0 1-2-2V9l2.7-5.4A2 2 0 0 1 7.5 3h9a2 2 0 0 1 1.8 1.1L21 9v6a2 2 0 0 1-2 2Z" /><circle cx="7" cy="17" r="2" /><circle cx="17" cy="17" r="2" /></>} />;
        const IconTruck = ({ sz, c }) => <S sz={sz} c={c} ch={<><path d="M10 17h4V5H2v12h3" /><path d="M20 17h2v-9h-4V5h-4v12h3" /><circle cx="8.5" cy="17" r="1.5" /><circle cx="17.5" cy="17" r="1.5" /></>} />;
        const IconVan = ({ sz, c }) => <S sz={sz} c={c} ch={<><rect x="1" y="6" width="16" height="11" rx="2" /><path d="M17 8.5l4 2.5v6h-4" /><circle cx="5.5" cy="17.5" r="2.5" /><circle cx="15.5" cy="17.5" r="2.5" /></>} />;
        const IconMotorcycle = ({ sz, c }) => <S sz={sz} c={c} ch={<><circle cx="5.5" cy="17.5" r="3.5" /><circle cx="18.5" cy="17.5" r="3.5" /><path d="M15 6h2.5l2 3.5-3 5.5H9.5L7 9.5 9 6h6z" /></>} />;
        const IconSearch = ({ sz, c }) => <S sz={sz} c={c} ch={<><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></>} />;
        const IconFilter = ({ sz, c }) => <S sz={sz} c={c} ch={<><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" /></>} />;
        const IconGrid = ({ sz, c }) => <S sz={sz} c={c} ch={<><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></>} />;

        const IconRefreshCw = ({ sz, c }) => <S sz={sz} c={c} ch={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></>} />;
        const IconLock = ({ sz, c }) => <S sz={sz} c={c} ch={<><rect width="18" height="11" x="3" y="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>} />;

        const IconMapPin = ({ sz, c }) => <S sz={sz} c={c} ch={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></>} />;
        const IconDroplets = ({ sz, c }) => <S sz={sz} c={c} ch={<><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.9 7 2.9s-2.15 5.16-2.29 6.16C3.57 10 3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z" /><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97" /></>} />;
        const IconGauge = ({ sz, c }) => <S sz={sz} c={c} ch={<><path d="m12 14 4-4" /><path d="M3.34 16A10 10 0 1 1 20.66 16" /></>} />;
        const IconShield = ({ sz, c }) => <S sz={sz} c={c} ch={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></>} />;
        const IconActivity = ({ sz, c }) => <S sz={sz} c={c} ch={<polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />} />;
        const IconClock = ({ sz, c }) => <S sz={sz} c={c} ch={<><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>} />;
        const IconX = ({ sz, c }) => <S sz={sz} c={c} ch={<><line x1="18" x2="6" y1="6" y2="18" /><line x1="6" x2="18" y1="6" y2="18" /></>} />;
        const IconCheck = ({ sz, c }) => <S sz={sz} c={c} ch={<polyline points="20 6 9 17 4 12" />} />;
        const IconEdit2 = ({ sz, c }) => <S sz={sz} c={c} ch={<><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" /></>} />;
        const IconTrash2 = ({ sz, c }) => <S sz={sz} c={c} ch={<><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></>} />;

        const IconCreditCard = ({ sz, c }) => <S sz={sz} c={c} ch={<><rect width="20" height="14" x="2" y="5" rx="2" /><line x1="2" x2="22" y1="10" y2="10" /></>} />;

                         <svg class='w-3 h-3 text-white' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2.5' d='M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0V5'/></svg>
                         RENTAL GARAGE HUB
                     </div>
                   </div>`,
                    iconSize: [96, 110],
                    iconAnchor: [48, 95]
                });
                const hqMarker = L.marker([14.871116, 121.048088], { icon: garageIcon, zIndexOffset: 1000 }).addTo(map);
                garageMarkerRef.current = hqMarker;

                m.removeLayer(l.sat);

                if (mapType === 'sat') {
                    l.sat.addTo(m);

                    (isDark ? l.dark : l.light).addTo(m);
                }

                if (trafficOn) {
                    l.traffic.addTo(m);
                    l.traffic.bringToFront();
                } else {
                    m.removeLayer(l.traffic);
                }

                if (cloudsOn && l.clouds) {
                    l.clouds.addTo(m);
                    l.clouds.bringToFront();
                } else if (l.clouds) {
                    m.removeLayer(l.clouds);
                }

                if (windOn && l.wind) {
                    l.wind.addTo(m);
                    l.wind.bringToFront();
                } else if (l.wind) {
                    m.removeLayer(l.wind);
                }

                async function fetchLatestRadarTile() {
                    try {
                        const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.radar && data.radar.past && data.radar.past.length > 0) {
                                const latestFrame = data.radar.past[data.radar.past.length - 1];
                                const tileUrl = `${data.host}${latestFrame.path}/256/{z}/{x}/{y}/2/1_1.png`;

                                        layersRef.current.radar.bringToFront();

                            }

                    } catch (err) {
                        console.warn("RainViewer tile fetch error:", err);

                fetchLatestRadarTile();
                return () => { isMounted = false; };

                        {
                            name: "Araneta Avenue Underpass",
                            risk: "impassable",
                            depth: "Waist Deep (60-80 cm)",
                            color: "#ef4444",
                            coords: [[14.6200, 121.0100], [14.6250, 121.0150], [14.6220, 121.0200], [14.6170, 121.0140]],
                            reroute: "Reroute via E. Rodriguez Sr. Ave"
                        },
                        {
                            name: "R-10 Navotas Coastal Slipway",
                            risk: "severe",
                            depth: "Waist Deep (50-70 cm)",
                            color: "#f97316",
                            coords: [[14.6500, 120.9400], [14.6550, 120.9480], [14.6510, 120.9530], [14.6460, 120.9450]],
                            reroute: "Reroute via C-4 Road"
                        },
                        {
                            name: "Marikina Riverbank Parkway",
                            risk: "severe",
                            depth: "Waist Deep (55-75 cm)",
                            color: "#f97316",
                            coords: [[14.6300, 121.0900], [14.6350, 121.0980], [14.6310, 121.1030], [14.6260, 121.0950]],
                            reroute: "Reroute via Marcos Highway"
                        }
                    ];

                    floodZonesData.forEach(fz => {
                        const poly = L.polygon(fz.coords, {
                            color: fz.color,
                            fillColor: fz.color,
                            fillOpacity: 0.35,
                            weight: 2.5,
                            dashArray: fz.risk === 'impassable' ? '6, 6' : '0'
                        }).addTo(m);

                        poly.bindTooltip(`
                    <div class="p-2 text-xs font-sans">
                        <div class="font-black text-orange-400 uppercase">${fz.name}</div>
                        <div class="text-[11px] text-white font-bold">Risk: ${fz.risk.toUpperCase()} | ${fz.depth}</div>
                        <div class="text-[10px] text-emerald-400 font-medium">Recommended: ${fz.reroute}</div>

            useEffect(() => {

                const availVehicles = vehicles.filter(v => (v.status || '').toLowerCase() === 'available');

                        <svg class="w-3.5 h-3.5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0V5"/></svg>

                    </div>

                    <div class="mt-2.5 p-2 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-between text-xs font-bold text-emerald-500 dark:text-emerald-400">
                        <span>Vehicles Inside Garage:</span>
                        <span class="text-sm font-extrabold text-emerald-600 dark:text-emerald-300">${availVehicles.length} units</span>

                        <svg class="w-3 h-3 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        Coords: 14.871116, 121.048088
                    </div>
                </div>
            `);
                }

                const activeIds = new Set(activeVehicles.map(v => String(v.id)));

                // Remove markers for vehicles parked inside garage or removed
                Object.keys(markersRef.current).forEach(id => {
                    if (!activeIds.has(String(id))) {
                        m.removeLayer(markersRef.current[id]);
                        delete markersRef.current[id];
                    }
                });

                // Add/Update markers only for active vehicles out on the road
                activeVehicles.forEach(v => {
                    const hex = statusColorMap[v.status.toLowerCase()]?.hex || '#60a5fa';
                    const isSelected = v.id === selectedVehicleId;
                    const iconUrl = v.mapIconUrl || v.image;
                    const hasCustomIcon = iconUrl && iconUrl.trim() && iconUrl !== 'null';

                    const iconHtml = `
                <div class='relative flex flex-col items-center cursor-pointer group' style='perspective: 500px;'>
                    ${isSelected ? `<div class='absolute -inset-3 rounded-full border-2 animate-ping opacity-60 z-0' style='border-color: ${hex}'></div>` : ''}
                    
                    <!-- Isometric 3D Floor Shadow -->
                    <div class='absolute bottom-3 w-12 h-5 rounded-[100%] bg-black/80 blur-[3px] transform rotateX(65deg) scale-110 z-0 shadow-2xl border border-black/40'></div>
                    
                    <!-- Isometric 3D Vehicle Icon -->
                    <div class='relative z-10 transition-all duration-300 transform ${isSelected ? 'scale-125 -translate-y-2' : 'group-hover:scale-110 group-hover:-translate-y-1'}'>
                        ${hasCustomIcon ? `
                            <div style='transform-style: preserve-3d; transform: rotateX(42deg) rotateZ(-22deg); filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.75));'>
                                <img src='${iconUrl}' class='w-14 h-14 object-contain filter drop-shadow-[0_8px_12px_rgba(0,0,0,0.8)] transition-all'/>
                            </div>
                        ` : `
                            <div class='w-11 h-11 rounded-full border-[2.5px] shadow-[0_8px_16px_rgba(0,0,0,0.4)] flex items-center justify-center overflow-hidden z-10 transition-transform' style='border-color: ${hex}; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px);'>
                                <svg class='w-6 h-6' style='color:${hex}' fill='none' stroke='currentColor' viewBox='0 0 24 24'>
                                    <path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 17a2 2 0 100 4 2 2 0 000-4zm10 0a2 2 0 100 4 2 2 0 000-4zM4 9h16l-1.5 5h-13L4 9z'/>
                                </svg>
                            </div>
                        `}
                    </div>
                    
                    <!-- Plate Label -->
                    <div class='mt-1 bg-[#0d0e17]/90 backdrop-blur-md border border-white/20 text-white px-2.5 py-0.5 rounded-full text-[9px] font-extrabold shadow-lg whitespace-nowrap z-10 tracking-wider flex items-center gap-1 border-b-2' style='border-bottom-color: ${hex}'>
                        <span class='w-1.5 h-1.5 rounded-full' style='background-color: ${hex}'></span>
                        ${v.plateNumber}
                    </div>
                </div>
            `;

                    const icon = L.divIcon({ className: '', html: iconHtml, iconSize: [50, 70], iconAnchor: [25, 35] });

                    if (markersRef.current[v.id]) {
                        markersRef.current[v.id].setLatLng(v.coordinates);
                        markersRef.current[v.id].setIcon(icon);
                    } else {
                        const marker = L.marker(v.coordinates, { icon }).addTo(m);
                        marker.on('click', () => onSelectVehicle(v));
                        markersRef.current[v.id] = marker;
                    }
                });
            }, [vehicles, selectedVehicleId]);

            // Focus selected vehicle
            useEffect(() => {
                if (selectedVehicleId && mapInst.current && markersRef.current[selectedVehicleId]) {
                    const latLng = markersRef.current[selectedVehicleId].getLatLng();
                    mapInst.current.flyTo(latLng, 16, { duration: 1 });

            }, [selectedVehicleId]);

            const temp = weatherData ? Math.round(weatherData.temperature_2m || 28) : 28;
            const rain = weatherData ? (weatherData.precipitation || 4.2) : 4.2;

            return (

                                <button onClick={() => setMapType('sat')} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer ${mapType === 'sat' ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30' : 'text-[var(--text-muted)] hover:text-white'}`}>Satellite</button>

                            <div className="w-px h-4 bg-[var(--border-color)] mx-0.5"></div>
                            {/* Map Overlay Toggles */}

                            <button onClick={() => setRadarOn(!radarOn)} className={`px-2.5 py-1 rounded-xl text-[11px] font-bold transition-all flex items-center gap-1 cursor-pointer ${radarOn ? 'bg-blue-600/90 text-white shadow-md shadow-blue-500/30' : 'text-[var(--text-secondary)] hover:bg-[var(--border-highlight)]'}`}><IconCloudRain sz={13} /> Radar</button>
                            <button onClick={() => setCloudsOn(!cloudsOn)} className={`px-2.5 py-1 rounded-xl text-[11px] font-bold transition-all flex items-center gap-1 cursor-pointer ${cloudsOn ? 'bg-cyan-600/90 text-white shadow-md shadow-cyan-500/30' : 'text-[var(--text-secondary)] hover:bg-[var(--border-highlight)]'}`}><IconCloud sz={13} /> Clouds</button>
                            <button onClick={() => setWindOn(!windOn)} className={`px-2.5 py-1 rounded-xl text-[11px] font-bold transition-all flex items-center gap-1 cursor-pointer ${windOn ? 'bg-teal-600/90 text-white shadow-md shadow-teal-500/30' : 'text-[var(--text-secondary)] hover:bg-[var(--border-highlight)]'}`}><IconWind sz={13} /> Wind</button>
                            <button onClick={() => setFloodZonesOn(!floodZonesOn)} className={`px-2.5 py-1 rounded-xl text-[11px] font-bold transition-all flex items-center gap-1 cursor-pointer ${floodZonesOn ? 'bg-amber-600/90 text-white shadow-md shadow-amber-500/30' : 'text-[var(--text-secondary)] hover:bg-[var(--border-highlight)]'}`}><IconAlertTriangle sz={13} /> Floods</button>
                            <button onClick={() => { if (mapInst.current && Object.keys(markersRef.current).length) mapInst.current.fitBounds(L.featureGroup(Object.values(markersRef.current)).getBounds().pad(0.2)); }} className="px-2 py-1 rounded-xl text-[11px] font-bold text-[var(--text-muted)] hover:text-white transition-all cursor-pointer">Fit All</button>
                        </div>

                        {/* RIGHT WEATHER PILL WIDGET (GLASSMORPHIC) */}
                        <div
                            onClick={onOpenWeatherModal}
                            className="bg-[var(--bg-card)] backdrop-blur-xl border border-[var(--glass-border)] p-1.5 px-3 rounded-2xl shadow-2xl flex items-center gap-2.5 cursor-pointer hover:border-orange-500/60 hover:scale-105 transition-all pointer-events-auto group shrink-0"

                            <div className="w-7 h-7 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 shrink-0 group-hover:bg-orange-500 group-hover:text-white transition-colors">
                                <IconCloudRain sz={15} />
                            </div>
                            <div className="flex flex-col">
                                <div className="flex items-center gap-1.5">
                                    <IconMapPin sz={10} className="text-orange-400 shrink-0" />
                                    <span className="text-[10px] font-black text-white tracking-tight">Garage Hub (SJDM)</span>
                                    <span className="text-xs font-black text-amber-400">{temp}°C</span>
                                    <span className="text-[8px] font-black uppercase bg-amber-500/20 text-amber-300 px-1.5 py-0.2 rounded border border-amber-500/30">MONSOON</span>
                                </div>
                                <div className="text-[9px] text-[var(--text-muted)] font-medium flex items-center gap-1.5">
                                    <span>Precip: <strong className="text-blue-400">{rain} mm/h</strong></span>
                                    <span className="text-orange-400 font-bold group-hover:underline">Details &rarr;</span>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div ref={mapRef} className="w-full h-full bg-[var(--bg-tertiary)]" style={{ zIndex: 1 }}></div>
                </div>
            );
        };

        // ─── DOCUMENT PREVIEW GLASS MODAL ───────────────────────────────────────────
        const DocumentPreviewModal = ({ title, url, onClose }) => {
            if (!url) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[999999] flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-[var(--bg-secondary)] border border-[var(--border-color)] rounded-3xl p-6 w-full max-w-2xl flex flex-col gap-4 shadow-2xl animate-scale-up" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-[var(--border-color)] pb-3">
                            <div className="text-sm font-black text-orange-500 uppercase tracking-wider flex items-center gap-2">
                                <IconFileText sz={18} /> {title}

                            <button onClick={onClose} className="p-1.5 rounded-full hover:bg-[var(--bg-tertiary)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors"><IconX sz={18} /></button>

                        <div className="w-full max-h-[70vh] overflow-auto rounded-2xl border border-[var(--border-color)] bg-[var(--bg-tertiary)] flex items-center justify-center p-2">

                                <iframe src={url} className="w-full h-[500px] rounded-xl" />

                                <img src={url} className="max-w-full max-h-[65vh] object-contain rounded-xl shadow-2xl" />
                            )}
                        </div>
                        <div className="flex justify-between items-center pt-2">
                            <a href={url} download={`${title.replace(/\s+/g, '_')}_Document`} target="_blank" rel="noreferrer" className="px-4 py-2 bg-orange-500 hover:bg-orange-600 font-bold text-xs text-white rounded-xl flex items-center gap-2 shadow-lg shadow-orange-500/30 transition-all">
                                <IconDownload sz={14} /> Download Document
                            </a>
                            <button onClick={onClose} className="px-4 py-2 bg-[var(--bg-tertiary)] hover:bg-[var(--border-color)] text-[var(--text-primary)] text-xs font-bold rounded-xl transition-all border border-[var(--border-color)]">Close</button>
                        </div>
                    </div>
                </div>
            );
        };

        const PRESET_COLORS = [
            { name: 'Pearl White', hex: '#F8F9FA', border: '#CBD5E1' },
            { name: 'Absolute Black', hex: '#0F172A', border: '#475569' },
            { name: 'Crimson Red', hex: '#DC2626', border: '#EF4444' },
            { name: 'Agate Black', hex: '#1E293B', border: '#475569' },
            { name: 'Metropolitan Grey', hex: '#64748B', border: '#94A3B8' },
            { name: 'Silver Metallic', hex: '#CBD5E1', border: '#94A3B8' },
            { name: 'Navy Blue', hex: '#1E3A8A', border: '#3B82F6' },
            { name: 'Champagne Gold', hex: '#D97706', border: '#F59E0B' }
        ];

        const formatHumanDepth = (depthRaw) => {
            if (!depthRaw) return 'Tire-Deep Level (25 - 35 cm)';
            const str = String(depthRaw).toLowerCase().trim();
            if (str.includes('25') || str.includes('tire') || str === 'tire_deep') return 'Tire-Deep Level (25 - 35 cm)';
            if (str.includes('60') || str.includes('waist') || str === 'waist_deep') return 'Waist-Deep Hazard (60 - 80 cm)';
            if (str.includes('chest') || str === 'chest_deep') return 'Chest-Deep Danger (90 - 120 cm)';
            if (str.includes('ankle') || str === 'ankle_deep') return 'Ankle-Deep Level (10 - 15 cm)';
            return str.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        };

        const formatHumanRisk = (riskRaw) => {
            if (!riskRaw) return { label: 'MODERATE FLOOD', bg: 'bg-amber-500/20 text-amber-400 border border-amber-500/30' };
            const str = String(riskRaw).toLowerCase().trim();
            if (str.includes('impassable')) return { label: 'IMPASSABLE (BAWAL DUMAAN)', bg: 'bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse' };
            if (str.includes('severe')) return { label: 'SEVERE HAZARD', bg: 'bg-orange-500/20 text-orange-400 border border-orange-500/30' };
            if (str.includes('moderate')) return { label: 'MODERATE FLOOD', bg: 'bg-amber-500/20 text-amber-400 border border-amber-500/30' };
            return { label: str.toUpperCase(), bg: 'bg-blue-500/20 text-blue-400 border border-blue-500/30' };
        };

        // ─── LIVE WEATHER INTELLIGENCE & FLOOD DRAWER MODAL ───────────────────────────
        const WeatherIntelligenceModal = ({ weatherData, floodZones, onClose, onExecuteEmergencyProtocol }) => {
            const temp = weatherData ? Math.round(weatherData.temperature_2m || 28.5) : 28.5;
            const rain = weatherData ? (weatherData.precipitation || 4.2) : 4.2;
            const humidity = weatherData ? (weatherData.relative_humidity_2m || 82) : 82;

            const defaultZones = [
                { id: 1, name: "España Blvd - UST Corridor", risk: "moderate", depth: "Tire-Deep Level (25 - 35 cm)", reroute: "Reroute via Lacson Ave or Boulevard Bypass" },
                { id: 2, name: "Araneta Avenue Underpass", risk: "impassable", depth: "Waist-Deep Hazard (60 - 80 cm)", reroute: "Reroute via E. Rodriguez Sr. Ave or A. Bonifacio" },
                { id: 3, name: "R-10 Navotas Coastal Slipway", risk: "severe", depth: "Waist-Deep Hazard (60 - 80 cm)", reroute: "Reroute via Circumferential Road 4 (C4)" },
                { id: 4, name: "Marikina Riverbank Inundation Area", risk: "severe", depth: "Waist-Deep Hazard (60 - 80 cm)", reroute: "Reroute via Marcos Highway or Sumulong Highway" }
            ];

            const zonesList = (floodZones && floodZones.length > 0) ? floodZones : defaultZones;

            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-lg z-[99995] flex items-center justify-center p-4 sm:p-6 animate-fade-in" onClick={onClose}>
                    <div className="bg-[var(--bg-secondary)] border border-[var(--border-color)] text-[var(--text-primary)] rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden relative animate-scale-up" onClick={e => e.stopPropagation()}>

                        {/* Header */}
                        <div className="p-5 border-b border-[var(--border-color)] flex justify-between items-center bg-gradient-to-r from-blue-950/40 via-amber-950/30 to-orange-950/40 shrink-0">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 shadow-lg shadow-amber-500/20">
                                    <IconCloudRain sz={22} />
                                </div>
                                <div>
                                    <h2 className="text-base font-black text-white flex items-center gap-2">
                                        <span>Weather Radar & Flood Hazard Telematics</span>
                                        <span className="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-amber-500/20 text-amber-300 border border-amber-500/30 animate-pulse">PAGASA LIVE</span>
                                    </h2>
                                    <p className="text-xs text-[var(--text-muted)] font-medium flex items-center gap-1 mt-0.5">
                                        <IconMapPin sz={12} className="text-orange-400 shrink-0" />
                                        <span>Station Target: <strong>Rental Garage Hub (San Jose del Monte / Metro Manila)</strong></span>
                                    </p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 rounded-full hover:bg-white/10 text-gray-300 hover:text-white transition-colors"><IconX sz={18} /></button>
                        </div>

                        {/* Body Content */}
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar flex flex-col gap-6">

                            {/* Live Weather Metrics Dashboard Grid */}
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                <div className="bg-[var(--bg-tertiary)] p-3.5 rounded-2xl border border-[var(--border-color)] flex flex-col justify-between">
                                    <span className="text-[10px] font-bold uppercase text-[var(--text-muted)] tracking-wider flex items-center gap-1"><IconMapPin sz={10} className="text-orange-400" /> Garage Hub Temp</span>
                                    <div className="text-2xl font-black text-amber-400 mt-1">{temp}°C</div>
                                    <span className="text-[10px] text-gray-400 font-semibold mt-1">SJDM, MM (Humidity: {humidity}%)</span>
                                </div>
                                <div className="bg-[var(--bg-tertiary)] p-3.5 rounded-2xl border border-[var(--border-color)] flex flex-col justify-between">
                                    <span className="text-[10px] font-bold uppercase text-[var(--text-muted)] tracking-wider">Precipitation</span>
                                    <div className="text-2xl font-black text-blue-400 mt-1">{rain} <span className="text-xs font-normal">mm/h</span></div>
                                    <span className="text-[10px] text-blue-300 font-semibold mt-1">Monsoon Rain Surge</span>
                                </div>
                                <div className="bg-[var(--bg-tertiary)] p-3.5 rounded-2xl border border-[var(--border-color)] flex flex-col justify-between">
                                    <span className="text-[10px] font-bold uppercase text-[var(--text-muted)] tracking-wider">PAGASA Alert</span>
                                    <div className="text-xs font-black text-orange-400 mt-1">Yellow Advisory</div>
                                    <span className="text-[10px] text-orange-300 font-semibold mt-1">High Flood Hazard</span>
                                </div>
                                <div className="bg-[var(--bg-tertiary)] p-3.5 rounded-2xl border border-[var(--border-color)] flex flex-col justify-between">
                                    <span className="text-[10px] font-bold uppercase text-[var(--text-muted)] tracking-wider">Flood Zones</span>
                                    <div className="text-2xl font-black text-red-400 mt-1">{zonesList.length} <span className="text-xs font-normal">Active</span></div>
                                    <span className="text-[10px] text-red-300 font-semibold mt-1">Impassable Areas</span>
                                </div>
                            </div>

                            {/* Active Emergency Submersion Alert Banner if vehicles in flood risk */}
                            <div className="p-4 rounded-2xl bg-red-950/40 border border-red-500/40 flex flex-col gap-3 shadow-xl">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-2 text-xs font-bold text-red-400">
                                        <IconAlertTriangle sz={18} className="text-red-400 animate-bounce shrink-0" />
                                        <span>CRITICAL SUBMERSION TELEMATICS: 1 Active Vehicle in España Blvd Flood Polygon (Tire Deep)</span>
                                    </div>
                                    <span className="text-[10px] font-extrabold bg-red-500/20 text-red-300 px-2 py-0.5 rounded border border-red-500/30">Ingress Risk: HIGH</span>
                                </div>

                                {/* 1-Click Emergency Protocol Action Buttons */}
                                <div className="flex flex-wrap gap-2 pt-1 border-t border-red-500/20">
                                    <button
                                        onClick={() => onExecuteEmergencyProtocol("Send Evac / Reroute SMS to Driver")}
                                        className="px-3 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold shadow-md transition-all flex items-center gap-1.5 cursor-pointer"
                                    >
                                        <IconPhoneCall sz={14} /> Send Evac / Reroute SMS
                                    </button>
                                    <button
                                        onClick={() => onExecuteEmergencyProtocol("Trigger Hazard Lights & Horn")}
                                        className="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold shadow-md transition-all flex items-center gap-1.5 cursor-pointer"
                                    >
                                        <IconAlertTriangle sz={14} /> Trigger Hazard Lights & Horn
                                    </button>
                                    <button
                                        onClick={() => onExecuteEmergencyProtocol("Dispatch Emergency Towing Service")}
                                        className="px-3 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-md transition-all flex items-center gap-1.5 cursor-pointer"
                                    >
                                        <IconTruck sz={14} /> Dispatch Emergency Towing
                                    </button>
                                </div>
                            </div>

                            {/* Active Flood Hazard Zones List */}
                            <div className="flex flex-col gap-3">
                                <h3 className="text-xs font-extrabold text-[var(--text-secondary)] uppercase tracking-wider flex items-center gap-2">
                                    <IconMapPin sz={14} className="text-orange-400" />
                                    <span>Active Metro Manila Flood Hazard Zones</span>
                                </h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {zonesList.map(z => {
                                        const depthText = formatHumanDepth(z.water_depth_level || z.depth);
                                        const riskObj = formatHumanRisk(z.risk_level || z.risk);
                                        return (
                                            <div key={z.id || z.name} className="p-3.5 rounded-2xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] flex flex-col justify-between gap-2">
                                                <div className="flex items-center justify-between">
                                                    <span className="text-xs font-black text-white">{z.zone_name || z.name}</span>
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-black uppercase ${riskObj.bg}`}>
                                                        {riskObj.label}
                                                    </span>
                                                </div>
                                                <div className="text-xs text-gray-300 font-semibold flex items-center gap-1.5">
                                                    <span className="text-amber-400 font-bold">Water Depth:</span> {depthText}

                                                <div className="text-[11px] text-[var(--text-muted)] font-medium">
                                                    <span className="text-emerald-400 font-bold">Reroute:</span> {z.recommended_reroute || z.reroute}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                ltoExpiryDate: formatDateSafe(vehicleToEdit?.lto_expiry_date || vehicleToEdit?.ltoExpiryDate || vehicleToEdit?.documents?.ltoRegistrationExpiry, '2026-10-15'),

                insuranceUrl: vehicleToEdit?.insuranceUrl || vehicleToEdit?.insurance_url || vehicleToEdit?.InsuranceUrl || vehicleToEdit?.documents?.insuranceUrl || vehicleToEdit?.documents?.insurance_url || '',
                color: vehicleToEdit?.color || vehicleToEdit?.Color || 'Pearl White'

            const [creationMode, setCreationMode] = useState('custom'); // 'custom' | 'preset'

            const processTransparentImage = (fileOrUrl, onComplete) => {
                if (!fileOrUrl) return;
                const img = new Image();
                img.crossOrigin = "Anonymous";

                const onLoad = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        let width = img.width || 400;
                        let height = img.height || 400;
                        const MAX_DIM = 800;
                        if (width > MAX_DIM || height > MAX_DIM) {
                            if (width > height) {
                                height = Math.round((height * MAX_DIM) / width);
                                width = MAX_DIM;
                            } else {
                                width = Math.round((width * MAX_DIM) / height);
                                height = MAX_DIM;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imgData.data;

                        const bgR = data[0], bgG = data[1], bgB = data[2];

                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i], g = data[i + 1], b = data[i + 2];
                            const distBg = Math.sqrt((r - bgR) ** 2 + (g - bgG) ** 2 + (b - bgB) ** 2);
                            const isWhite = r > 235 && g > 235 && b > 235;

                            if (distBg < 45 || isWhite) {
                                data[i + 3] = 0; // Make background transparent
                            }
                        }

                        ctx.putImageData(imgData, 0, 0);
                        onComplete(canvas.toDataURL('image/png'));
                    } catch (e) {
                        console.error("Canvas transparent processing failed:", e);
                        if (typeof fileOrUrl === 'string') onComplete(fileOrUrl);
                    }
                };

                if (typeof fileOrUrl === 'string') {
                    img.src = fileOrUrl;
                    if (img.complete) onLoad();
                    else img.onload = onLoad;
                } else if (fileOrUrl instanceof File) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        img.src = e.target.result;
                        img.onload = onLoad;
                    };
                    reader.readAsDataURL(fileOrUrl);
                }
            };

            const handleMediaUpload = (e) => {

            const handleDocUpload = (e, fieldName) => {

                    const reader = new FileReader();
                    reader.onload = (ev) => {

                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width || 800;
                            let height = img.height || 800;
                            const MAX_DIM = 1200;

                            if (width > MAX_DIM || height > MAX_DIM) {
                                if (width > height) {
                                    height = Math.round((height * MAX_DIM) / width);
                                    width = MAX_DIM;
                                } else {
                                    width = Math.round((width * MAX_DIM) / height);
                                    height = MAX_DIM;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
                            setForm(f => ({ ...f, [fieldName]: compressedDataUrl }));
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                } else {
                    if (file.size > 4 * 1024 * 1024) {

            const submit = async (e) => {

                const ccVal = parseInt(form.engineCc) || 0;
                if (ccVal > 10000 || ccVal < 50) {
                    setErrorMessage("Engine CC must be between 50cc and 10,000cc.");
                    return;
                }

                try {
                    setIsSaving(true);
                    const pickId = (...sources) => {
                        for (const s of sources) {
                            if (s !== undefined && s !== null && s !== '' && !isNaN(parseInt(s))) {
                                const val = parseInt(s);
                                if (val > 0) return val;
                            }
                        }
                        return null;
                    };

                    const isEditMode = Boolean(vehicleToEdit);
                    const rawTargetId = vehicleToEdit?.vehicle_id || vehicleToEdit?.vehicleId || vehicleToEdit?.VehicleId || vehicleToEdit?.id || vehicleToEdit?.Id || vehicleToEdit?.ID || initialId;
                    let targetId = pickId(
                        initialId,
                        vehicleToEdit?.vehicle_id,
                        vehicleToEdit?.vehicleId,
                        vehicleToEdit?.VehicleId,
                        vehicleToEdit?.id,
                        vehicleToEdit?.Id,
                        vehicleToEdit?.ID
                    );

                    if (!targetId && typeof vehicleToEdit === 'object' && vehicleToEdit !== null) {
                        for (const key of Object.keys(vehicleToEdit)) {
                            if (key.toLowerCase().includes('id') && !key.toLowerCase().includes('url')) {
                                const val = parseInt(vehicleToEdit[key]);
                                if (!isNaN(val) && val > 0) {
                                    targetId = val;
                                    break;
                                }
                            }
                        }
                    }

                    const fleetList = Array.isArray(vehicles) && vehicles.length > 0 ? vehicles : (Array.isArray(window.fleetVehiclesCache) ? window.fleetVehiclesCache : []);
                    if (!targetId && form.plateNumber && fleetList.length > 0) {
                        const cleanPlate = (form.plateNumber || '').trim().toLowerCase().replace(/-/g, '');
                        const match = fleetList.find(v => (v.plateNumber || v.plate_no || v.plateNo || '').trim().toLowerCase().replace(/-/g, '') === cleanPlate);
                        if (match) {
                            targetId = pickId(match.vehicle_id, match.vehicleId, match.VehicleId, match.id);
                        }
                    }

                    const shouldUpdate = (isEditMode || Boolean(targetId)) && targetId !== null && targetId > 0;

                    const payload = {
                        vehicleId: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        vehicle_id: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        VehicleId: targetId || (form.vehicleId ? parseInt(form.vehicleId) : undefined),
                        brand: form.brand,
                        model: form.model,
                        plateNo: form.plateNumber,
                        plate_no: form.plateNumber,
                        type: form.type,
                        cc: parseInt(form.engineCc) || 1500,
                        ratePerDay: parseFloat(form.dailyRatePHP) || 0,
                        rate_per_day: parseFloat(form.dailyRatePHP) || 0,
                        rateWithDriver: parseFloat(form.rateWithDriverPHP) || 0,
                        rate_with_driver: parseFloat(form.rateWithDriverPHP) || 0,
                        seatCapacity: parseInt(form.seatCapacity) || 5,
                        seat_capacity: parseInt(form.seatCapacity) || 5,
                        transmission: form.transmission,
                        status: form.status,
                        description: form.description,
                        photoUrl: form.image || '',
                        photo_url: form.image || '',
                        model3dUrl: form.mapIconUrl || '',
                        model_3d_url: form.mapIconUrl || '',
                        map_icon_url: form.mapIconUrl || '',
                        ltoExpiryDate: form.ltoExpiryDate ? new Date(form.ltoExpiryDate).toISOString() : null,
                        lto_expiry_date: form.ltoExpiryDate ? new Date(form.ltoExpiryDate).toISOString() : null,
                        insuranceExpiryDate: form.insuranceExpiryDate ? new Date(form.insuranceExpiryDate).toISOString() : null,
                        insurance_expiry_date: form.insuranceExpiryDate ? new Date(form.insuranceExpiryDate).toISOString() : null,
                        orCrUrl: form.orCrUrl || '',
                        or_cr_url: form.orCrUrl || '',
                        insuranceUrl: form.insuranceUrl || '',
                        insurance_url: form.insuranceUrl || '',
                        color: form.color || 'Pearl White'
                    };

                    const url = shouldUpdate ? `${API}/api/vehicles/${targetId}` : `${API}/api/vehicles`;
                    const method = shouldUpdate ? 'PUT' : 'POST';

                    const res = await fetch(url, {
                        method: method,
                        headers: HEADERS,
                        body: JSON.stringify(payload)
                    });

                    if (res.ok || res.status === 201 || res.status === 204) {
                        const resData = await res.json().catch(() => ({}));
                        const finalId = targetId || resData?.vehicleId || resData?.VehicleId || resData?.vehicle_id || form.vehicleId;
                        const updatedVehicleObj = normVehicle({
                            ...(vehicleToEdit || {}),
                            ...form,
                            vehicle_id: finalId,
                            vehicleId: finalId,
                            VehicleId: finalId,
                            id: finalId,
                            plate_no: form.plateNumber,
                            plateNumber: form.plateNumber,
                            brand: form.brand,
                            model: form.model,
                            type: form.type,
                            rate_per_day: form.dailyRatePHP,
                            dailyRatePHP: form.dailyRatePHP,
                            rate_with_driver: form.rateWithDriverPHP,
                            rateWithDriverPHP: form.rateWithDriverPHP,
                            cc: form.engineCc,
                            engineCc: form.engineCc,
                            seat_capacity: form.seatCapacity,
                            seatCapacity: form.seatCapacity,
                            transmission: form.transmission,
                            status: form.status,
                            description: form.description,
                            photo_url: form.image || '',
                            image: form.image || '',
                            model_3d_url: form.mapIconUrl || '',
                            map_icon_url: form.mapIconUrl || '',
                            mapIconUrl: form.mapIconUrl || '',
                            lto_expiry_date: form.ltoExpiryDate,
                            insurance_expiry_date: form.insuranceExpiryDate,
                            or_cr_url: form.orCrUrl || '',
                            orCrUrl: form.orCrUrl || '',
                            insurance_url: form.insuranceUrl || '',
                            insuranceUrl: form.insuranceUrl || '',
                            documents: {
                                ltoRegistrationExpiry: formatDateSafe(form.ltoExpiryDate, '2026-10-15'),
                                insuranceExpiry: formatDateSafe(form.insuranceExpiryDate, '2026-11-20'),
                                orCrUrl: form.orCrUrl || '',
                                insuranceUrl: form.insuranceUrl || ''
                            }
                        });
                        onSave(resData?.message || (shouldUpdate ? "Vehicle updated successfully!" : "Vehicle added to fleet successfully!"), updatedVehicleObj);
                    } else {
                        const rawErrText = await res.text().catch(() => '');
                        let parsedMsg = '';
                        try {
                            const parsedJson = JSON.parse(rawErrText);
                            parsedMsg = parsedJson.message || parsedJson.Message || parsedJson.title || '';
                        } catch (_) { }
                        const displayMsg = parsedMsg || rawErrText || `Error saving vehicle data (HTTP ${res.status}).`;
                        setErrorMessage(displayMsg);
                    }
                } catch (err) {
                    console.error("Save Vehicle Exception:", err);
                    setErrorMessage(`Network or System Exception: ${err?.message || err}`);
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[99999] flex items-center justify-center p-4 sm:p-6 animate-fade-in" onClick={onClose}>
                    <div className="bg-[var(--bg-secondary)] backdrop-blur-2xl border border-[var(--border-color)] text-[var(--text-primary)] rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden relative animate-scale-up" onClick={e => e.stopPropagation()}>

                        {/* Visual Glass Saving Overlay Loading State */}
                        {isSaving && (
                            <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-md flex flex-col items-center justify-center gap-3 animate-fade-in">
                                <div className="w-16 h-16 rounded-2xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-500 shadow-2xl shadow-orange-500/30">
                                    <IconRefreshCw sz={32} c="animate-spin" />
                                </div>
                                <div className="text-base font-black text-white tracking-wide">Saving Changes...</div>
                                <div className="text-xs text-orange-300/80 font-medium">Updating vehicle specs & documents in database</div>
                            </div>
                        )}

                        {/* Header */}
                        <div className="p-5 border-b border-[var(--border-color)] flex justify-between items-center bg-[var(--bg-tertiary)] shrink-0">
                            <h2 className="text-lg font-black text-[var(--text-primary)] flex items-center gap-2">
                                <span className="text-orange-500">{vehicleToEdit ? <IconEdit sz={18} className="inline" /> : <IconPlus sz={18} className="inline" />}</span>
                                <span>{vehicleToEdit ? 'Edit Vehicle Specs' : 'Add New Vehicle'}</span>
                            </h2>
                            <button onClick={onClose} className="p-1.5 rounded-full hover:bg-[var(--bg-card-hover)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors"><IconX sz={18} /></button>

                                <button type="button" onClick={() => setErrorMessage('')} className="text-red-500 hover:text-red-700"><IconX sz={14} /></button>
                            </div>
                        )}

                        {/* Form Body - 2 Columns */}
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar grid grid-cols-1 lg:grid-cols-12 gap-6">

                            {/* LEFT COLUMN: Inputs (7 Cols) */}

                                {/* 2-Option Segmented Selection Toggle: Custom Vehicle vs Existing Brand & Model Preset */}

                                                ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/30'
                                                : 'text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-white/5'
                                                }`}
                                        >
                                            <IconPlus sz={14} /> Custom Vehicle
                                        </button>
                                        <button

                                            <input type="text" value={form.brand} onChange={e => setForm({ ...form, brand: e.target.value })} className="w-full p-3 rounded-xl bg-[var(--bg-tertiary)] border border-[var(--border-color)] text-sm font-semibold text-[var(--text-primary)] focus:border-orange-500 outline-none transition-all placeholder-[var(--text-muted)]" placeholder="e.g. Honda, Ford, Toyota" />
